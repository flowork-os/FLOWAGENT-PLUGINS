<style>
  :root { color-scheme: dark; --ground: #05102e; }
  html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; }
  body { font-family: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif; color: #fff; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; outline: none; cursor: pointer; }
  #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; background: rgba(3, 10, 30, 0.92); font-size: 20px; line-height: 1.4; }
  @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  @media (prefers-reduced-motion: reduce) { #game { cursor: default; } }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Crab Dash game. Click, tap or press Space to jump."></canvas>
<div id="rotate" role="status">Turn your phone sideways to play Crab Dash</div>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#070A1C;--brass:#D9AE55;--ink:#FFF3D1;--btn:rgba(20,26,70,.55)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#070A1C}}
:root[data-theme="dark"]{--bg:#070A1C}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center;font-family:"Josefin Sans",Futura,"Trebuchet MS",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{display:block;touch-action:none;outline:none}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#touch{position:absolute;inset:0;display:none;pointer-events:none;z-index:2}
body.touch.playing #touch{display:block}
#touch .pad{position:absolute;left:calc(14px + var(--il,0px));bottom:calc(14px + var(--ib,0px));width:164px;height:72px;border-radius:36px;opacity:.6;
  border:2px solid rgba(217,174,85,.8);background:var(--btn);display:flex;align-items:center;justify-content:space-around;color:var(--ink);font-size:1.6rem}
#touch .pad span{opacity:.75;transition:opacity .08s,transform .08s}#touch .pad span.on{opacity:1;transform:scale(1.25)}
#touch .pad .u,#touch .pad .d{display:none}
body.dpad #touch .pad{width:136px;height:136px;border-radius:50%;opacity:.5;display:grid;grid-template:1fr 1fr 1fr/1fr 1fr 1fr;place-items:center;font-size:1.4rem}
body.dpad #touch .pad .u,body.dpad #touch .pad .d{display:block}
body.dpad #touch .pad .u{grid-area:1/2}body.dpad #touch .pad .d{grid-area:3/2}body.dpad #touch .pad .l{grid-area:2/1}body.dpad #touch .pad .r{grid-area:2/3}
#touch .jump,#touch .net{position:absolute;border-radius:50%;border:2px solid rgba(217,174,85,.85);display:flex;align-items:center;justify-content:center;color:var(--ink);font:700 1rem/1 "Josefin Sans",sans-serif}
#touch .jump{right:calc(14px + var(--ir,0px));bottom:calc(14px + var(--ib,0px));width:90px;height:90px;background:rgba(217,174,85,.38);opacity:.7}
#touch .net{right:calc(118px + var(--ir,0px));bottom:calc(18px + var(--ib,0px));width:70px;height:70px;background:var(--btn);opacity:.7}
#touch .on{filter:brightness(1.5);opacity:1}
#pauseBtn{position:absolute;top:calc(8px + var(--it,0px));right:calc(8px + var(--ir,0px));display:none;z-index:3;width:42px;height:42px;border-radius:50%;opacity:.8;
  border:2px solid rgba(217,174,85,.8);background:var(--btn);color:var(--ink);font:700 1rem/1 "Josefin Sans",sans-serif}
body.touch.ingame #pauseBtn{display:block}
#touch .chance{position:absolute;right:calc(40px + var(--ir,0px));bottom:calc(126px + var(--ib,0px));width:130px;height:56px;border-radius:28px;display:none;align-items:center;justify-content:center;font:800 1.05rem 'Josefin Sans',sans-serif;color:#231A05;background:#FFE36A;box-shadow:0 0 26px #FFE36A;animation:pulseg .45s infinite alternate}
body.chance #touch .chance{display:flex}
body.hintlob #touch .jump,body.hintsmash #touch .net{opacity:1;box-shadow:0 0 22px #FFE36A,inset 0 0 12px rgba(255,227,106,.6);animation:pulseg .5s infinite alternate}
@keyframes pulseg{to{transform:scale(1.1);box-shadow:0 0 40px #FFF3A0}}
#rotate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:5;pointer-events:none}
#rotate .card{background:rgba(7,10,28,.9);border:2px solid var(--brass);border-radius:18px;padding:22px 26px;max-width:78vw;text-align:center;color:var(--ink);font:600 1.05rem/1.35 "Josefin Sans",sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#rotate .ph{width:34px;height:58px;border:3px solid var(--brass);border-radius:8px;margin:0 auto 14px;position:relative;animation:tilt 1.8s ease-in-out infinite}
#rotate .ph::after{content:"";position:absolute;left:50%;bottom:4px;width:8px;height:3px;margin-left:-4px;border-radius:2px;background:var(--brass)}
#rotate small{display:block;margin-top:8px;opacity:.7;font-size:.85rem}
@keyframes tilt{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
body.rot.hint #rotate{display:flex}
</style>

/* ================= physics ================= */
const tileAt=(tx,ty)=>(tx<0||tx>=L.w||ty<0||ty>=ROWS)?0:L.t[ty*L.w+tx];
const solid=(tx,ty)=>tx<0||tx>=L.w?true:(ty<0||ty>=ROWS)?false:SOLID[L.t[ty*L.w+tx]]===1;
function move(b,dt){
  b.on=false;b.wall=0;b.head=null;
  b.x+=b.vx*dt;let y0=Math.floor(b.y/T),y1=Math.floor((b.y+b.h-.01)/T);
  if(b.vx>0){const tx=Math.floor((b.x+b.w-.01)/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=tx*T-b.w;b.wall=1;break}}
  else if(b.vx<0){const tx=Math.floor(b.x/T);for(let ty=y0;ty<=y1;ty++)if(solid(tx,ty)){b.x=(tx+1)*T;b.wall=-1;break}}
  const pb=b.y+b.h;b.y+=b.vy*dt;const x0=Math.floor(b.x/T),x1=Math.floor((b.x+b.w-.01)/T);
  if(b.vy>0){const ty=Math.floor((b.y+b.h)/T);for(let tx=x0;tx<=x1;tx++){const v=tileAt(tx,ty);if(solid(tx,ty)||(v===13&&pb<=ty*T+2)){b.y=ty*T-b.h;b.vy=0;b.on=true;break}}}
  else if(b.vy<0){const ty=Math.floor(b.y/T);let best=null,bd=1e9;for(let tx=x0;tx<=x1;tx++)if(solid(tx,ty)||(b===P&&tileAt(tx,ty)===12)){const d=Math.abs(tx*T+16-(b.x+b.w/2));if(d<bd){bd=d;best={tx,ty}}}
    if(best){b.y=(ty+1)*T;b.vy=0;b.head=best}}
}

function debris(x,y,c){for(let i=0;i<4;i++)P_({k:'deb',x:x+(i%2)*16+8,y:y+(i>1?16:0)+8,vx:(i%2?1:-1)*(90+Math.random()*60),vy:-420+(i>1?120:0),max:1.4,s:12,c,g:1500,vr:(Math.random()-.5)*14})}

function firework(x,y){const c=['#FFE7A0','#5AD7EE','#FF8FB0','#B8FF9E'][Math.random()*4|0];for(let i=0;i<(REDUCE?14:46);i++){const a=i/46*6.283,v=150+Math.random()*120;P_({k:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,max:1+Math.random()*.5,s:3+Math.random()*3,c,g:120,r:0})}P_({k:'ring',x,y,vx:0,vy:0,max:.5,s:1.4,c})}

function addQaly(n){if(n<=0)return;G.qaly+=n;G.ls.qaly+=n;G.life+=n;if(G.life>=100){G.life-=100;G.lives++;AU.sfx('oneup');if(P&&G.state==='play')popText(P.x+11,P.y-20,'100 QALYs = 1 UP','#8CFFB0',17)}
  if(G.qaly>=250&&!G.goodhart){G.goodhart=true;toast("Goodhart's law","When a measure becomes a target... you know the rest.",'#CFF6FF')}}
function heal(n,label){const m=maxHp();if(P.hp>=m){addQaly(3);popText(P.x+11,P.y-18,'+3 QALY','#FFE7A0');return}P.hp=Math.min(m,P.hp+n);AU.sfx('heal');heartsUp(P.x+11,P.y+10,6);popText(P.x+11,P.y-18,label||'+1 heart','#FF9AB0',16)}
function bumpTile(tx,ty){
  const v=tileAt(tx,ty);bumps.push({tx,ty,t:0});
  for(const e of ents)if(e.alive&&ENEMY.has(e.k)&&!e.fly&&Math.abs(e.y+e.h-ty*T)<6&&e.x+e.w>tx*T&&e.x<tx*T+T)killEnemy(e,'flip');

  const item=k=>ents.push({k,x:tx*T+4,y:ty*T,w:24,h:24,vx:0,vy:0,alive:true,rise:ty*T-26,t:0});

    if(q.n===1)say(pick(QL.etg),1);popText(tx*T+16,ty*T-30,'+'+q.n+' QALY','#8CFFB0');if(q.n>=10||G.t-q.t>6){L.set(tx,ty,6);confetti(tx*T+16,ty*T,20);banner('EARNED TO GIVE!','#8CFFB0');badge('etg')}}
  else if(v===12){L.set(tx,ty,6);G.lives++;AU.sfx('oneup');heartsUp(tx*T+16,ty*T,10);popText(tx*T+16,ty*T-30,'1 UP','#8CFFB0',18);say('A future person thanks you!',1);banner('LONGTERMISM PAYS!','#CFF6FF');badge('future')}
  else if(v===15){L.set(tx,ty,6);const r=Math.random(),n=r<.08?50:r<.35?6:1;addQaly(n);popText(tx*T+16,ty*T-30,'+'+n+' QALY',n>=50?'#FFB3E6':'#E0C8FF',n>=50?22:16);

  else if(v===10){const k=tx+','+ty;if(!(switches[k]>0)&&boss&&!boss.aligned&&boss.st!=='wait'&&boss.type==='clip'){switches[k]=5;AU.sfx('zap');zapBoss(tx*T+16,ty*T+16)}else AU.sfx('bump')}
  else AU.sfx('bump');
}
function killEnemy(e,how){if(!e.alive)return;e.alive=false;e.dead=how;e.dt=0;G.hs=Math.max(G.hs,.05);buzz(12);

      else if(e.mode==='swoop'){const k=e.mt/1.4;e.x=lerp(e.x,e.tx+(k-.5)*160,dt*3);e.y=lerp(e.y,k<.5?e.ty:e.y0,dt*3.2);if(e.mt>1.4){e.mode='hover';e.mt=0}}

     case'take':{e.vy+=600*dt;e.y+=e.vy*dt;if(e.t>4||e.y+e.h>=14*T-2||solid(Math.floor((e.x+11)/T),Math.floor((e.y+e.h)/T))){e.alive=false;sparks(e.x+11,e.y+14,10,'#FFA040');popText(e.x+11,e.y,'take cooled','#FFC890',11)}break}

      e.vy=Math.min(900,e.vy+1800*gr*dt);if(e.on&&e.mt>.55){e.mt=0;e.vy=-300;e.vx=Math.sign(P.x-e.x)*95}const pv=e.vx;move(e,dt);if(e.on)e.vx*=.9;if(e.wall)e.vx=-pv;if(e.y>ROWS*T+50)e.alive=false;break}
     case'coin':if(G.perks.has('magnet')){const dx=P.x+11-e.x-8,dy=P.y+26-e.y-10,d=Math.hypot(dx,dy);if(d<130){e.x+=dx/d*260*dt;e.y+=dy/d*260*dt}}break;

     case'clip':{e.vy+=900*dt;e.x+=e.vx*dt;e.y+=e.vy*dt;e.r=(e.r||0)+dt*12;if(e.y+e.h>=14*T&&e.vy>0){if(e.b){e.alive=false;sparks(e.x,e.y,4,'#CFE3FF')}else{e.b=1;e.vy=-e.vy*.45}}if(e.t>4)e.alive=false;break}

     case'tent':{if(e.st==='warn'){if(e.t>.85){e.st='up';e.t=0;AU.sfx('tentacle');shake(.15)}}else if(e.st==='up'){e.h=Math.min(150,e.h+dt*900);e.y=14*T-e.h;if(e.t>.75){e.st='down';e.t=0}}
      else{e.h=Math.max(0,e.h-dt*500);e.y=14*T-e.h;if(e.h<=0)e.alive=false}break}
     case'syco':{const dx=P.x+11-e.x-13,dy=P.y+20-e.y-11,d=Math.hypot(dx,dy)||1;e.vx+=dx/d*70*dt;e.vy+=dy/d*70*dt;const sp=Math.hypot(e.vx,e.vy);if(sp>105){e.vx*=105/sp;e.vy*=105/sp}

    }
  }
  if(G.state!=='play'){ents=ents.filter(e=>e.alive||e.dead);return}
  for(const e of ents){if(!e.alive)continue;

        if(P.combo>1)popText(P.x+11,P.y-26,'Combo x'+P.combo,'#FFE7A0',17);if(P.combo===3){banner('SCOPE SENSITIVE!');say(pick(QL.combo),1)}

      if(e.k==='r'){if(e.flee<=0&&P.inv<=0){const n=Math.min(5,G.qaly);G.qaly-=n;e.stash+=n;e.flee=2;P.inv=.8;AU.sfx('steal');popText(P.x+11,P.y-14,'Reward hacked! -'+n,'#FFB0B0',15);say(pick(QL.hacker),1)}continue}

    switch(e.k){

     case'gog':e.alive=false;G.goggles=true;AU.sfx('power');banner('SCOUT MINDSET!','#E8D05A');badge('scout');say(pick(QL.goggles),1);toast('Scout goggles','You can now see hidden blocks and deceptive coins.','#E8D05A');break;
     case'net':e.alive=false;AU.sfx('power');G.flash=.25;heal(1,'Fresh net! +1 heart');say(pick(QL.net),1);G.hs=.1;sparks(P.x+11,P.y+26,24,'#CFF6FF');break;
     case'circle':e.alive=false;P.star=10;P.starKills=0;AU.play('star');AU.sfx('power');G.flash=.5;shake(.25);G.hs=.12;say(pick(QL.star),1);popText(P.x+11,P.y-18,'Moral circle expanded!','#FFB3E6',17);confetti(P.x+11,P.y+10,40);break;
     case'cage':freeCage(e);break;
     case'check':if(!e.on){e.on=true;G.check=e.tx;AU.sfx('check');say(pick(QL.check),1);sparks(e.x+14,e.y+10,24);popText(e.x+14,e.y-14,'Pledge signed! Checkpoint','#FFE7A0',16);P.hp=Math.max(P.hp,Math.min(maxHp(),P.hp+1))}break;
     case'booth':if(!e.used)openBooth(e);break;
     case'kiosk':if(!e.used)openKiosk(e);break;
     case'spring':if(P.vy>0&&P.y+P.h-e.y<14){P.vy=L.grav<1?-820:-1050;e.sq=1;AU.sfx('spring');P.vsy+=.5;P.vsx-=.3;if(!G.sprung){G.sprung=true;say(pick(QL.spring),1)}}break;
     case'clip':case'wave':case'take':case'syco':hurt(e);break;
     case'tent':if(e.st==='up'&&e.h>24)hurt(e);break;
     case'boss':{if(e.st==='wait'||e.aligned||e.st==='dead')break;

      const vul=e.type==='clip'?e.st==='grounded':e.st==='slump';
      if(vul&&P.vy>40&&P.y+P.h-e.y<44){damageBoss(1);P.vy=-640;AU.sfx('stomp');dust(P.x+11,P.y+P.h,8);if(e.type==='shog'&&e.hp>0){e.st='rise';e.t=0}break}

    }
  }
  for(const e of ents)if(e.k==='freed'&&e.alive){e.vy+=1100*dt;const pv=e.vx;move(e,dt);if(e.on)e.vy=-360-Math.random()*120;if(e.wall)e.vx=-pv;
    const done=boss&&(boss.aligned||boss.st==='dead');if(e.t>(done?3.5:.7)||e.x<cam.x-60||e.x>cam.x+VW+60){e.alive=false;if(!done)sparks(e.x+10,e.y+7,6,'#FFB3C0')}}
  const w=ents.filter(e=>e.alive&&e.act&&(e.k==='m'||e.k==='p'));for(let i=0;i<w.length;i++)for(let j=i+1;j<w.length;j++)if(overlap(w[i],w[j])&&(w[i].x-w[j].x)*(w[i].vx-w[j].vx)<0){w[i].vx=-w[i].vx;w[j].vx=-w[j].vx}

function stepClip(b,dt){
  b.hurt=Math.max(0,b.hurt-dt);const A=L.arena;const left=(A.x+2)*T,right=(A.x+27)*T-b.w;
  const px=P.x+P.w/2;b.face=px<b.x+b.w/2?-1:1;const rage=(1+(b.max-b.hp)/b.max*.6)*(b.phase===2?1.25:1);
  switch(b.st){
   case'wait':break;
   case'intro':b.y=lerp(b.y,110,dt*2.2);if(b.t>2.6){b.st='hover';b.t=0}break;
   case'hover':{if(b.t<dt*1.5){b.tgt=px<(A.x+15)*T?right:left;if(!b.say&&Math.random()<.6)b.say={s:pick(BOSSL.hover),t:0}}b.x=lerp(b.x,b.tgt,dt*.9);b.y=110+Math.sin(G.t*2.2)*18;b.shootT-=dt*rage;
     if(b.shootT<=0){b.shootT=1.5;b.volley++;AU.sfx('shoot');const cx=b.x+b.w/2,cy=b.y+b.h*.7;const n=b.phase===2?2:1;
       for(let i=-n;i<=n;i++){const dx=px-cx;ents.push({k:'clip',x:cx,y:cy,w:16,h:16,vx:dx*.72+i*80,vy:-260+Math.abs(i)*50,alive:true,t:0})}
       if(b.volley>=3){b.volley=0;b.st='prep';b.t=0}}break}
   case'prep':b.y=lerp(b.y,70,dt*3)+(Math.random()-.5)*4;if(b.t>.8){b.st='slam';b.t=0;b.x=clamp(px-b.w/2,left,right);b.vy=0}break;
   case'slam':b.vy+=2400*dt;b.y+=b.vy*dt;if(b.y+b.h>=14*T){b.y=14*T-b.h;b.st='grounded';b.t=0;shake(.7);AU.sfx('shock');dust(b.x+10,14*T,10);dust(b.x+b.w-10,14*T,10);
     ents.push({k:'wave',x:b.x-20,y:14*T-22,w:22,h:22,vx:-280*rage,alive:true,t:0},{k:'wave',x:b.x+b.w,y:14*T-22,w:22,h:22,vx:280*rage,alive:true,t:0})}break;
   case'grounded':if(b.t>2){b.st='rise';b.t=0}break;
   case'rise':b.y=lerp(b.y,110,dt*2.5);if(b.t>1){b.st='hover';b.t=0}break;
   case'aligned':b.y=lerp(b.y,120,dt*1.5);b.x=lerp(b.x,(A.x+15)*T-b.w/2,dt*1.5);
     if(Math.random()<dt*18)ents.push({k:'freed',x:b.x+Math.random()*b.w,y:b.y+b.h*.6,w:20,h:14,vx:(Math.random()-.5)*260,vy:-300,alive:true,t:0});
     if(Math.random()<dt*4)firework(cam.x+100+Math.random()*(VW-200),80+Math.random()*200);
     if(b.t>6&&G.state==='play'){resolveMarket();finishTotals();SAVE.unlocked=4;persist();G.state='win';G.t=0;AU.play('win');saveBest()}break;
  }
}
function stepShog(b,dt){
  b.hurt=Math.max(0,b.hurt-dt);const A=L.arena,floor=14*T,px=P.x+P.w/2;
  switch(b.st){
   case'wait':break;
   case'intro':b.y=lerp(b.y,floor-b.h,dt*1.4);if(b.t>2.8){b.st='idle';b.t=0}break;
   case'idle':b.y=lerp(b.y,floor-b.h,dt*4);b.mask=lerp(b.mask,1,dt*4);if(b.t>1.1){b.t=0;b.cycle++;b.st=b.cycle%2?'tent':'spit';b.shots=0;if(Math.random()<.7)b.say={s:pick(SHOGL.atk),t:0}}break;
   case'tent':if(b.t<dt*1.5){const xs=[px-120,px,px+120].map(x=>clamp(x,(A.x+2)*T,(A.x+20)*T));xs.forEach((x,i)=>ents.push({k:'tent',x:x-14,y:floor,w:28,h:0,st:'warn',t:-i*.18,alive:true}));AU.sfx('reveal')}
     if(b.t>2.4){b.st='slump';b.t=0}break;
   case'spit':if(b.shots<3&&b.t>b.shots*.5){b.shots++;AU.sfx('shoot');ents.push({k:'syco',x:b.x+20,y:b.y+40,w:26,h:22,vx:-130+Math.random()*50,vy:-60,alive:true,t:0,s:pick(SYCO)})}
     if(b.t>2.4){b.st='slump';b.t=0}break;
   case'slump':b.y=lerp(b.y,floor-96,dt*5);b.mask=lerp(b.mask,0,dt*4);if(b.t>2.6){b.st='rise';b.t=0}break;
   case'rise':b.y=lerp(b.y,floor-b.h,dt*4);b.mask=lerp(b.mask,1,dt*4);if(b.t>.8){b.st='idle';b.t=0}break;
   case'dead':b.mask=0;b.y=lerp(b.y,floor-60,dt*.8);if(Math.random()<dt*4)firework(cam.x+100+Math.random()*(VW-200),80+Math.random()*200);
     if(b.t>4.5&&G.state==='play')startClear();break;
  }
}

  P.vy=Math.min(900,P.vy+1900*L.grav*dt);move(P,dt);P.walk+=Math.abs(P.vx)*dt;if(P.say){P.say.t+=dt;if(P.say.t>P.say.d)P.say=null}

function stepParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>p.max){parts.splice(i,1);continue}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.k==='spark'||p.k==='dust'){p.vx*=.96;p.vy*=p.k==='dust'?.95:1}}}

<!DOCTYPE html>
<html lang="en-AU">
<head>
  <base href="https://underwritten.netlify.app/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Underwritten: an insurance strategy game</title>
<meta name="description" content="Run an insurance company for three years. Price the risk, pay the claims, survive the storms. A free, plain-English training game with no sign-up.">
<meta name="theme-color" content="#07121B">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://underwritten.netlify.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Underwritten">
<meta property="og:title" content="Underwritten: an insurance strategy game">
<meta property="og:description" content="Run an insurance company for three years. Price the risk, pay the claims, survive the storms. Free, plain-English, no sign-up.">
<meta property="og:url" content="https://underwritten.netlify.app/">
<meta property="og:image" content="https://underwritten.netlify.app/og-image.png">
<meta property="og:image:width" content="1200">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6F0F7;--card:#FFFFFF;--card2:#F2F7FB;--ink:#10202C;--muted:#4F6373;--line:#CCDBE6;
  --signal:#1CA6E0;--go:#3A9B35;--beacon:#F7C81C;--beacon-t:#9A7600;--ember:#F29122;--ember-t:#B35F00;--pulse:#E62950;--slate:#8A9BA8;
  --glow:rgba(28,166,224,.14);--sh:0 1px 0 rgba(16,32,44,.06),0 10px 28px rgba(16,32,44,.08);
  --serif:"Fraunces",Georgia,serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07121B;--card:#112230;--card2:#172C3C;--ink:#E7EFF4;--muted:#93A8B7;--line:#223A4B;
  --go:#4FB848;--beacon-t:#F7C81C;--ember-t:#F6A54A;--slate:#5D7384;--glow:rgba(28,166,224,.22);--sh:0 1px 0 rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#07121B;--card:#112230;--card2:#172C3C;--ink:#E7EFF4;--muted:#93A8B7;--line:#223A4B;
  --go:#4FB848;--beacon-t:#F7C81C;--ember-t:#F6A54A;--slate:#5D7384;--glow:rgba(28,166,224,.22);--sh:0 1px 0 rgba(0,0,0,.3),0 12px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:radial-gradient(900px 420px at 50% -120px,var(--glow),transparent 70%),var(--bg);background-color:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.15}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.14em}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hud-in{max-width:760px;margin:0 auto;padding:10px 14px 12px}
.hud-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--serif);font-weight:800;font-size:1.2rem}
.logo .mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--signal);color:#fff;font-size:17px}
.qchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.85rem}
.pips{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:9px 0 10px}
.pips i{height:5px;border-radius:3px;background:var(--line)}
.pips i.done{background:var(--signal)}
.pips i.now{background:var(--beacon);box-shadow:0 0 0 2px color-mix(in srgb,var(--beacon) 35%,transparent)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-width:0}
.chip .ri{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font-size:15px;flex:none}
.chip small{display:block;font-size:.68rem;color:var(--muted);line-height:1.2;white-space:nowrap}
.chip b{display:block;font-family:var(--mono);font-size:.92rem;font-weight:600;white-space:nowrap}
.t-cap{background:color-mix(in srgb,var(--beacon) 25%,transparent);color:var(--beacon-t)}
.t-trust{background:color-mix(in srgb,var(--pulse) 16%,transparent);color:var(--pulse)}
.t-pol{background:color-mix(in srgb,var(--signal) 18%,transparent);color:var(--signal)}
.health{display:block;width:100%;margin-top:8px;background:none;border:0;padding:0;text-align:left}
.health-top{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);font-weight:600}
.health-top b{font-family:var(--mono);color:var(--ink);font-size:.9rem}
.health-top .lbl{display:flex;align-items:center;gap:6px}
.bar{position:relative;height:14px;margin-top:4px;border-radius:8px;background:var(--card2);border:1px solid var(--line);overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;border-radius:7px;transition:width .7s cubic-bezier(.2,.8,.2,1),background .3s}
.bar .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%);border-radius:7px}
.bar .lim{position:absolute;top:0;bottom:0;left:25%;width:2px;background:var(--pulse)}
.bar-scale{position:relative;display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:2px}
.bar-scale .lim-l{position:absolute;left:25%;transform:translateX(-50%)}

main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.sec-h h2{font-family:var(--serif);font-size:1.3rem;font-weight:800}
.sub{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.qbtn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--card2);color:var(--muted);font-size:14px;flex:none;padding:0}
.qbtn:hover{color:var(--signal);border-color:var(--signal)}

/* Advisor */
.advisor{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.avatar{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(160deg,var(--go),#2E7F2A);color:#fff;font-size:22px;flex:none;box-shadow:0 0 0 3px var(--card),0 0 0 5px color-mix(in srgb,var(--go) 40%,transparent)}
.bubble{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;box-shadow:var(--sh);font-size:.95rem}
.bubble b{display:block;font-size:.78rem;color:var(--go);margin-bottom:2px}

/* Event */
.ev{position:relative;overflow:hidden;padding-top:20px}
.ev::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--tone)}
.ev-top{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.ev-art{display:grid;place-items:center;width:62px;height:62px;border-radius:18px;font-size:32px;flex:none;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent);border:1px solid color-mix(in srgb,var(--tone) 35%,transparent)}
.ev-k{font-size:.78rem;font-weight:700;color:var(--muted)}
.ev h2{font-family:var(--serif);font-size:1.4rem;font-weight:800}
.deal{animation:deal .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes deal{from{opacity:0;transform:translateY(16px) rotate(-1.5deg) scale(.97)}to{opacity:1;transform:none}}
.moves{display:grid;gap:10px;margin-top:12px}
.move{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;transition:transform .12s,border-color .12s}
.move:hover{border-color:var(--signal);transform:translateY(-1px)}
.move:active{transform:translateY(2px);border-bottom-width:2px}
.move-l{display:block;font-weight:700}
.move-d{display:block;font-size:.88rem;color:var(--muted);margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:999px}
.tag.cost{background:color-mix(in srgb,var(--ember) 18%,transparent);color:var(--ember-t)}
.tag.good{background:color-mix(in srgb,var(--go) 16%,transparent);color:var(--go)}
.tag.risk{background:color-mix(in srgb,var(--pulse) 14%,transparent);color:var(--pulse)}
.tag.neutral{background:var(--card);color:var(--muted);border:1px solid var(--line)}
.legend-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.78rem;color:var(--muted);align-items:center}
.chosen{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--go) 12%,transparent);border-radius:14px;padding:12px 14px;margin-top:12px}
.chosen .ic{color:var(--go);font-size:20px;margin-top:2px}

/* Levers */
.lever{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.lv-h{display:flex;align-items:center;gap:10px}
.lv-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;font-size:18px;flex:none;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent)}
.lv-t{font-weight:700;flex:1}
.lv-v{font-family:var(--mono);font-weight:600;font-size:1rem;padding:2px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);min-width:64px;text-align:center}
.lv-hint{font-size:.86rem;color:var(--muted);margin:8px 0 0;min-height:2.6em}
input[type=range]{width:100%;margin:12px 0 0;height:26px;accent-color:var(--signal)}
.scale{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 0;border:0;padding:0}
.seg legend{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.seg span{display:block;text-align:center;padding:9px 4px;border:1px solid var(--line);border-bottom-width:3px;border-radius:10px;font-size:.88rem;font-weight:600;background:var(--card)}
.seg input:checked+span{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 14%,var(--card));color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--signal);outline-offset:2px}
.pill-note{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;color:var(--muted);margin-top:8px}

.go-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:16px;border:0;border-radius:16px;background:linear-gradient(180deg,#1A9BD4,#0F7FB2);color:#fff;font-weight:800;font-size:1.08rem;letter-spacing:.01em;box-shadow:0 5px 0 #0A5F86,0 10px 22px rgba(15,127,178,.3);transition:transform .1s,box-shadow .1s}
.go-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0A5F86}
.go-btn:disabled{filter:grayscale(1);opacity:.45;cursor:not-allowed;transform:none}
.need{display:flex;align-items:center;justify-content:center;gap:6px;font-size:.85rem;color:var(--ember-t);margin:12px 0 0;font-weight:600}

/* Results */
.hero-res{text-align:center;padding:22px 18px}
.hero-res .ev-k{margin-bottom:6px}
.big{font-family:var(--serif);font-weight:800;font-size:3rem;line-height:1}
.big.pos{color:var(--go)}.big.neg{color:var(--pulse)}
.hero-res p{color:var(--muted);margin:8px 0 0}
.flow-row{margin-top:12px}
.flow-lab{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700}
.flow-lab span:last-child{font-family:var(--mono)}
.flow{display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--card2);margin-top:4px}
.flow i{display:block;height:100%}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:12px;font-size:.84rem}
.key{display:flex;align-items:center;gap:7px;min-width:0}
.key i{width:10px;height:10px;border-radius:3px;flex:none}
.key span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.key b{font-family:var(--mono);font-weight:600;font-size:.8rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile-h{display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:700;color:var(--muted)}
.tile .v{font-family:var(--mono);font-weight:600;font-size:1.4rem;margin-top:2px}
.tile .plain{font-size:.8rem;color:var(--muted);margin-top:2px;line-height:1.35}
.bad{color:var(--pulse)}.ok{color:var(--go)}
.cust{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cust div{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.cust .ic{font-size:22px;color:var(--signal)}
.cust b{display:block;font-family:var(--mono);font-weight:600}
.cust small{color:var(--muted);font-size:.78rem}
.news{list-style:none;margin:0;padding:0}
.news li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:0}
.news .ni{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;font-size:17px;flex:none;color:var(--tone);background:color-mix(in srgb,var(--tone) 15%,transparent)}
.newcard{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--signal) 16%,var(--card2)),var(--card2));border:1px solid color-mix(in srgb,var(--signal) 45%,var(--line));border-radius:14px;padding:12px;margin-top:10px;text-align:left;width:100%}
.newcard .ci{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--signal);color:#fff;font-size:20px;flex:none}
.newcard small{display:block;font-size:.74rem;font-weight:700;color:var(--signal)}
.newcard span{font-size:.86rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart-key{display:flex;gap:16px;font-size:.8rem;color:var(--muted);margin-top:6px}
.chart-key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}

/* Playbook */
.deck{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (min-width:560px){.deck{grid-template-columns:repeat(5,1fr)}}
.pc{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card2);font-size:.74rem;font-weight:700;line-height:1.2;min-height:92px}
.pc .ic{font-size:22px;color:var(--signal)}
.pc.locked{color:var(--muted);opacity:.6;cursor:default;border-style:dashed}
.pc.locked .ic{color:var(--muted)}
.prog{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--signal)}

/* Intro and end */
.title-card{text-align:center;padding:28px 20px 22px}
.big-mark{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:24px;background:linear-gradient(160deg,#27B6F0,#0F7FB2);color:#fff;font-size:44px;box-shadow:0 8px 0 #0A5F86,0 18px 30px rgba(15,127,178,.3);margin-bottom:18px}
.title-card h1{font-family:var(--serif);font-weight:800;font-size:2.4rem;letter-spacing:-.02em}
.title-card p{color:var(--muted);font-size:1.05rem;margin-top:6px}
.goals{display:grid;gap:10px}
.goal{display:flex;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}
.goal .gi{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;font-size:20px;flex:none;color:var(--tone);background:color-mix(in srgb,var(--tone) 16%,transparent)}
.goal b{display:block}
.goal span{font-size:.86rem;color:var(--muted)}
.steps{display:grid;gap:10px;counter-reset:st}
.step{display:flex;gap:12px;align-items:center}
.step .sn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--card);font-weight:800;font-size:.9rem;flex:none}
.badge{display:grid;place-items:center;width:132px;height:132px;margin:6px auto 12px;border-radius:50%;font-family:var(--serif);font-weight:800;font-size:2.8rem;color:#fff;box-shadow:0 0 0 6px var(--card),0 0 0 10px color-mix(in srgb,var(--tone) 40%,transparent),0 16px 30px rgba(0,0,0,.2);background:var(--tone)}

/* Sheet */
dialog.sheet{border:0;padding:0;background:var(--card);color:var(--ink);width:100%;max-width:560px;border-radius:22px 22px 0 0;margin:auto auto 0;box-shadow:0 -10px 40px rgba(0,0,0,.3);max-height:85vh}
@media (min-width:640px){dialog.sheet{border-radius:22px;margin:auto}}
dialog.sheet::backdrop{background:rgba(4,12,20,.55)}
.sheet-in{padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-top{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.sheet-top .x{margin-left:auto;background:var(--card2);border:1px solid var(--line);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:16px}
.sheet h3{font-family:var(--serif);font-size:1.35rem;font-weight:800}
.sheet .k{font-size:.76rem;font-weight:700;color:var(--muted)}
.sheet-sec{background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:10px}
.sheet-sec b{display:block;font-size:.78rem;color:var(--signal);margin-bottom:2px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;display:flex;gap:8px;align-items:center;transition:transform .35s cubic-bezier(.2,.9,.3,1.2);z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.deal{animation:none}.bar .fill,.toast,.move{transition:none}}

/* ---------- Visuals v3 ---------- */
.bleed{position:relative;overflow:hidden;line-height:0}
.card>.bleed:first-child{margin:-18px -18px 14px;border-radius:20px 20px 0 0}
.title-card>.bleed:first-child{margin:-28px -20px 0}
.hero-res>.bleed:first-child{margin:-22px -18px 18px}
.town{display:block;width:100%;height:auto}
.town .car{animation:drive 20s linear infinite}
@keyframes drive{from{transform:translateX(-50px)}to{transform:translateX(410px)}}
.town .cloud{animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-90px)}to{transform:translateX(420px)}}
.town .hs{animation:fall 1.1s linear infinite}
.town .rn{animation:fall .7s linear infinite}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(160px)}}
.town .flash{animation:flash 5s infinite}
@keyframes flash{0%,90%,100%{opacity:0}91%,94%{opacity:1}92%{opacity:.2}}
.town .flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(.85,.8)}to{transform:scale(1.05,1.15)}}
.town .smoke{animation:rise 6s linear infinite}
@keyframes rise{from{transform:translate(0,0);opacity:.6}to{transform:translate(-20px,-70px);opacity:0}}
.town .wave{animation:wave 3s linear infinite}
@keyframes wave{to{transform:translateX(-40px)}}
.town .bu{transform-box:fill-box;transform-origin:center;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-2.5px)}}

<body>
<header class="hud" id="hud"></header>
<main id="app"></main>
<footer>A RETSA Group training demo. All companies, events and figures are fictional and simplified for learning.</footer>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
/* ===== GAME LOGIC: balance-tested, do not edit without re-running /tmp/sim.js style checks ===== */
const BASE={home:{prem:450,claim:270,inflow:3000,label:'Home'},motor:{prem:300,claim:192,inflow:4500,label:'Motor'}};
const APP={tight:{nb:.7,q:.9,label:'Tight'},balanced:{nb:1,q:1,label:'Balanced'},broad:{nb:1.3,q:1.12,label:'Broad'}};
const CLAIMS={tight:{cost:.93,lapse:1.25,trust:-2.5,cat:-8,label:'Tight'},fair:{cost:1,lapse:1,trust:.5,cat:1,label:'Fair'},fast:{cost:1.05,lapse:.9,trust:1.5,cat:4,label:'Fast'}};
const REINS={none:{ret:Infinity,lim:0,rate:0,charge:16,label:'None'},standard:{ret:6,lim:60,rate:.04,charge:8,label:'Standard'},heavy:{ret:2.5,lim:80,rate:.065,charge:4,label:'Heavy'}};
const START_CAP=65;

const CONCEPTS={
  lossRatio:{t:'Loss ratio',d:'Claims divided by premium. Around 60 to 65% is typical for home and motor. Higher than that and pricing is not keeping up with risk.'},
  combined:{t:'Combined ratio',d:'Claims plus all expenses divided by premium. Under 100% means underwriting makes money on its own. Over 100% means you rely on investment income.'},
  retention:{t:'Retention and lapse',d:'Keeping a customer costs far less than finding a new one. Price rises and poor claims experiences both push customers out at renewal.'},
  adverse:{t:'Adverse selection',d:'When your price is below the risk, the customers most attracted to you are the ones most likely to claim. Growth looks great until the claims arrive.'},
  catastrophe:{t:'Catastrophe risk',d:'Hail, bushfire and flood hit thousands of policies at once. One event can wipe out a year of profit.'},
  reinsurance:{t:'Reinsurance',d:'Insurance for insurers. You give up a share of premium so losses above your retention are carried by someone else. It must be in place before the event.'},
  solvency:{t:'Capital and solvency',d:'APRA requires insurers to hold capital above a prescribed amount. That amount rises with premium, so growth consumes capital.'},
  underwriting:{t:'Underwriting',d:'Deciding which risks to accept and on what terms. A cheap book of business is only a bargain if you know what is in it.'},
  pricing:{t:'Pricing discipline',d:'Matching a competitor only works if your costs allow it. Price below expected claims and every new policy loses money.'},
  expense:{t:'Expense ratio',d:'Running costs as a share of premium. Systems, staff and distribution all sit here. Small efficiency gains compound across every policy.'},
  leakage:{t:'Claims leakage',d:'Money paid on claims that should not have been paid, or paid at the wrong amount. Fraud is one source. Weak processes are another.'},
  inflation:{t:'Claims inflation',d:'Repair, parts and labour costs rise over time. If prices do not keep pace, the loss ratio drifts up quietly.'},
  conduct:{t:'Conduct risk',d:'Regulators judge how customers are treated, not only whether you stay solvent. Poor claims handling leads to remediation, fines and lost trust.'},
  investment:{t:'Investment income',d:'Insurers hold premium before claims are paid and invest it. Chasing extra yield adds a second kind of risk to the balance sheet.'},
  trust:{t:'Customer trust',d:'Trust drives new business and renewals. It is slow to build and quick to lose, and claims time is when customers judge you.'}
};

const EVENTS=[
 {id:'broker',title:'A broker offers you a motor book',body:`Coastline Brokers wants to move 6,000 motor policies to you at your current price. They won't share the claims history.`,lesson:'underwriting',opts:[
   {l:'Take the whole book',d:'Fast growth. Unknown risk.',a:s=>{s.pend.add.motor={n:6000,q:1.22}}},
   {l:'Review the files first ($0.4m)',d:'Accept the 3,000 that pass underwriting.',a:s=>{s.pend.add.motor={n:3000,q:1.0};s.pend.oneOff.push(['Broker book review',.4])}},
   {l:'Decline',d:'No growth, no surprises.',a:s=>{}}]},
 {id:'competitor',title:'A competitor slashes home prices',body:`Bluegum Direct has cut home premiums 12% in a national campaign. Your renewals are exposed for the next two quarters.`,lesson:'pricing',opts:[
   {l:'Hold your price',d:'Accept some lapses and protect margin.',a:s=>{s.lines.home.shock=.12}},
   {l:'Offer renewal loyalty discounts ($1.2m)',d:'Halves home lapses this quarter.',a:s=>{s.lines.home.shock=.12;s.pend.loyalty.home=true;s.pend.oneOff.push(['Loyalty discounts',1.2])}},
   {l:'Match their price',d:'Cuts your home price by 12 points.',a:s=>{s.lines.home.price=Math.max(.85,+(s.lines.home.price-.12).toFixed(2))}}]},
 {id:'pas',title:'Your policy system is showing its age',body:`Your policy admin system is 14 years old. New products take months to configure and staff key the same data twice. A modern platform costs $3m up front.`,lesson:'expense',opts:[
   {l:'Fund the upgrade ($3m)',d:'Lower running costs and faster quoting from next quarter.',a:s=>{s.pend.oneOff.push(['Platform upgrade',3]);s.fixed-=.6;s.nbBoost=1.1}},
   {l:'Defer it',d:'Keep the cash. Legacy maintenance keeps creeping up.',a:s=>{s.fixed+=.2}}]},
 {id:'fraud',title:'A pattern in motor claims',body:`Claims staff have linked 40 motor claims to the same tow operator and smash repairer. It looks organised.`,lesson:'leakage',opts:[
   {l:'Fund fraud analytics ($1.2m)',d:'Motor claims cost 4% less from now on.',a:s=>{s.pend.oneOff.push(['Fraud analytics',1.2]);s.lines.motor.claimMult*=.96}},
   {l:'Handle it case by case',d:'No spend now. The ring keeps operating.',a:s=>{s.lines.motor.claimMult*=1.05}}]},
 {id:'inflation',title:'Motor repair costs jump',body:`Parts shortages and higher labour rates have pushed average motor repair costs up 8%. This applies to every claim from now on.`,lesson:'inflation',opts:[
   {l:'Reprice motor by 8 points',d:'Protects margin. Some customers notice.',a:s=>{s.lines.motor.infl*=1.08;s.lines.motor.price=Math.min(1.25,+(s.lines.motor.price+.08).toFixed(2));s.trust-=2}},
   {l:'Absorb it for now',d:'Customers are happy. Margin shrinks.',a:s=>{s.lines.motor.infl*=1.08}}]},
 {id:'regulator',title:'ASIC reviews claims handling',body:`ASIC is reviewing claims handling across the industry and has asked for your complaint data and decline rates.`,lesson:'conduct',opts:[
   {l:'Remediate proactively ($1.5m)',d:'Review past declines and pay what was missed.',a:s=>{s.pend.oneOff.push(['Customer remediation',1.5]);s.trust+=6}},
   {l:`Respond to what's asked`,d:'Outcome depends on how you have treated customers.',a:s=>{s.pend.regCheck=true}}]},
 {id:'reins',title:'Reinsurance prices harden',body:`After a heavy global catastrophe year, reinsurers are raising prices about 35% at renewal.`,lesson:'reinsurance',opts:[
   {l:'Accept the new pricing',d:'Reinsurance costs 35% more from now on.',a:s=>{s.reinsHarden=1.35}},
   {l:'Lock in a two-year deal ($1m fee)',d:'Limits the increase to 5%.',a:s=>{s.pend.oneOff.push(['Reinsurance deal fee',1]);s.reinsHarden=1.05}}]},
 {id:'rates',title:'The Reserve Bank lifts rates',body:`The cash rate is up. Your bond portfolio will earn more from here.`,lesson:'investment',opts:[
   {l:'Stay in high-grade bonds',d:'Investment yield rises to 1.3% a quarter.',a:s=>{s.yield=.013}},
   {l:'Chase yield in riskier assets',d:'1.8% a quarter, with a chance of markdowns.',a:s=>{s.yield=.013;s.riskyYield=true}}]},
 {id:'viral',title:'A declined claim goes viral',body:`A customer's post about a declined storm claim has 2 million views. The decline was within the policy wording.`,lesson:'trust',opts:[
   {l:'Overturn and pay ($0.2m)',d:'Small cost, public goodwill.',a:s=>{s.pend.oneOff.push(['Goodwill payment',.2]);s.trust+=4}},
   {l:'Stand by the decision',d:'The wording supports you. The public may not.',a:s=>{s.trust-=6}}]}
];

const CATS=[
 {name:'A hailstorm across western Sydney',g:s=>(s.lines.home.pol*rnd(450,700)+s.lines.motor.pol*rnd(40,80))/1e6},
 {name:'A bushfire in the Blue Mountains',g:s=>s.lines.home.pol*rnd(300,550)/1e6},
 {name:'An east coast low with flash flooding',g:s=>(s.lines.home.pol*rnd(250,420)+s.lines.motor.pol*rnd(60,110))/1e6}
];

function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function m(v){return (v<0?'\u2212':'')+'$'+Math.abs(v).toFixed(1)+'m'}
function pct(v,d=0){return (v*100).toFixed(d)+'%'}
function num(v){return Math.round(v).toLocaleString('en-AU')}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

let s;
function newGame(){
  const sched={};const deck=shuffle(EVENTS.concat([null,null]));
  for(let q=2;q<=12;q++)sched[q]=deck[q-2];
  const cats={};const early=2+Math.ceil(Math.random()*3);const later=shuffle([6,7,8,9,10,11,12]).slice(0,2);
  shuffle(CATS).forEach((c,i)=>{cats[[early].concat(later)[i]]=c});
  s={phase:'intro',q:1,capital:START_CAP,trust:55,req:0,
    lines:{home:{pol:40000,q:1,price:1,infl:1,claimMult:1,shock:0},motor:{pol:50000,q:1,price:1,infl:1,claimMult:1,shock:0}},
    appetite:'balanced',claims:'fair',marketing:1,reins:'standard',reinsNext:'standard',
    fixed:4,nbBoost:1,reinsHarden:1,yield:.01,riskyYield:false,

function resetPend(){s.pend={oneOff:[],add:{home:null,motor:null},regCheck:false,loyalty:{home:false,motor:false}}}

function closeQuarter(){
  const r={lines:{},notes:[],unlocked:[]};let gwp=0,claims=0;
  const mk=0.6+0.4*Math.sqrt(s.marketing),tf=0.6+0.8*s.trust/100;
  for(const k of ['home','motor']){
    const L=s.lines[k],b=BASE[k];
    const eff=L.price*(1+L.shock);
    const nb=Math.round(b.inflow*Math.pow(eff,-4)*APP[s.appetite].nb*mk*tf*s.nbBoost);
    const lapseRate=clamp(0.045*Math.pow(eff,3)*CLAIMS[s.claims].lapse*(1.5-s.trust/100)*(s.pend.loyalty[k]?.5:1),.01,.3);
    const lapsed=Math.round(L.pol*lapseRate),retained=L.pol-lapsed;
    const priceQ=L.price<1?1+(1-L.price)*1.5:1+(L.price-1)*.25;
    const newQ=APP[s.appetite].q*priceQ;
    const retQ=L.q*(eff>1?1+(eff-1)*.04:1);
    const add=s.pend.add[k],addN=add?add.n:0,addQ=add?add.q:1;
    const total=retained+nb+addN,start=L.pol;
    L.q=(retained*retQ+nb*newQ+addN*addQ)/total;L.pol=total;
    const prem=total*b.prem*L.price/1e6;
    const cl=total*b.claim*L.q*L.infl*L.claimMult*CLAIMS[s.claims].cost*(0.95+Math.random()*.1)/1e6;
    gwp+=prem;claims+=cl;
    r.lines[k]={start,end:total,nb,lapsed,lapseRate,prem,cl,q:L.q,eff};
    L.shock=L.shock>.02?L.shock/2:0;
  }
  let cat=null;const cd=s.cats[s.q];
  if(cd){const P=REINS[s.reins];const gross=cd.g(s);const rec=P.ret===Infinity?0:Math.max(0,Math.min(gross-P.ret,P.lim));
    cat={name:cd.name,gross,rec,net:gross-rec};s.trust+=CLAIMS[s.claims].cat;unlock('catastrophe',r.unlocked);unlock('reinsurance',r.unlocked)}
  const reinsCost=gwp*REINS[s.reins].rate*s.reinsHarden;
  const expenses=s.fixed+.12*gwp;
  let inv=s.capital*s.yield,markdown=0;
  if(s.riskyYield){inv=s.capital*.018;if(Math.random()<.25)markdown=5}
  const oneOff=s.pend.oneOff.reduce((a,x)=>a+x[1],0);
  let fine=0;
  if(s.pend.regCheck){
    if(s.claims==='tight'||s.trust<45){fine=4;s.trust-=8;r.notes.push(`ASIC found customers were treated unfairly. You were fined ${m(4)} and trust took a hit.`)}
    else r.notes.push('ASIC closed its review with no findings. Your claims approach held up.');
  }
  const catNet=cat?cat.net:0;
  const profit=gwp-claims-catNet-reinsCost-expenses-s.marketing+inv-markdown-oneOff-fine;
  const prevSol=s.capital/s.req;
  s.capital+=profit;
  s.trust=clamp(s.trust+CLAIMS[s.claims].trust,0,100);
  s.reins=s.reinsNext;
  s.req=0.25*gwp*4+REINS[s.reins].charge;
  const sol=s.capital/s.req;
  const lr=(claims+catNet)/gwp,cr=(claims+catNet+reinsCost+expenses+s.marketing)/gwp;
  Object.assign(r,{gwp,claims,cat,reinsCost,expenses,marketing:s.marketing,inv,markdown,oneOff,oneOffItems:s.pend.oneOff.slice(),fine,profit,lr,cr,sol});
  s.history.push({cap:s.capital,req:s.req});

  if(cat)r.notes.unshift(`${cat.name} hit your customers. Gross claims were ${m(cat.gross)}. `+(cat.rec>0?`Reinsurance recovered ${m(cat.rec)}, so you carried ${m(cat.net)}.`:`With no reinsurance you carried all of it.`));
  if(lr>.72)r.notes.push(`Loss ratio was ${pct(lr)}. Claims are eating most of your premium.`);
  for(const k of ['home','motor']){const x=r.lines[k];
    if(x.q>1.07){r.notes.push(`Your ${k} book now has a risk index of ${x.q.toFixed(2)} (market average is 1.00). Low prices or a broad appetite are pulling in customers who claim more.`);unlock('adverse',r.unlocked)}
    if(x.lapseRate>.06){r.notes.push(`${BASE[k].label} lost ${pct(x.lapseRate,1)} of customers at renewal. Your effective price is ${pct(x.eff-1)} above the market.`);unlock('retention',r.unlocked)}
  }
  if(cr>1)r.notes.push('Combined ratio went over 100%. Underwriting lost money this quarter.');
  if(gwp>s.gwpPrev*1.05&&sol<prevSol){r.notes.push(`Premium grew ${pct(gwp/s.gwpPrev-1)}. Required capital grows with it, so growth used up some solvency.`);unlock('solvency',r.unlocked)}
  if(sol<1.2&&sol>=1){r.notes.push('Solvency is below 1.2x. Under 1.0x the regulator steps in.');unlock('solvency',r.unlocked)}
  if(markdown)r.notes.push(`Riskier assets were marked down ${m(markdown)} this quarter.`);
  if(!r.notes.length)r.notes.push('A quiet quarter. Steady underwriting profit is how insurers build capital.');
  if(s.q===1){unlock('lossRatio',r.unlocked);unlock('combined',r.unlocked)}
  if(s.q===3)unlock('retention',r.unlocked);
  if(s.q===4)unlock('solvency',r.unlocked);
  s.gwpPrev=gwp;s.last=r;
  if(sol<1)s.failed=true;
  s.phase='results';
}

function nextQuarter(){

  s.q++;resetPend();s.event=s.sched[s.q]||null;s.choice=null;s.phase='decide';
}

/* ---------- Plain-English explainers ---------- */
const EXPLAIN={
 quarter:{i:'clock',k:'How the game works',t:'Quarters',p:`A quarter is three months. You play 12 quarters, which is three years. Each quarter: respond to one event, set your strategy, then end the quarter to see what happened.`,r:`Real insurers report results every quarter too. Boards and regulators watch the same numbers you see here.`},
 capital:{i:'coins',k:'Your resources',t:'Capital',p:`Think of it as the company's savings account. It's the money set aside to pay claims when things go wrong. Profit adds to it. Losses take from it.`,r:`Real insurers hold hundreds of millions of dollars in capital so they can still pay everyone after a major storm.`},
 trust:{i:'heart',k:'Your resources',t:'Reputation',p:`How much customers believe you'll look after them. High reputation brings in new customers and keeps existing ones. It builds slowly and drops fast, especially after a bad claims experience.`,r:`Insurers track complaint numbers and customer satisfaction closely. A viral story about a declined claim can cost thousands of customers.`},
 policies:{i:'users',k:'Your resources',t:'Customers',p:`Each policy is one customer's insurance for their home or car. More customers means more money coming in, but also more claims to pay and more capital you must hold.`,r:`A mid-sized Australian insurer might have a few hundred thousand policies.`},
 solvency:{i:'shield',k:'Your resources',t:'Safety buffer (solvency)',p:`The regulator says you must hold a minimum amount of capital, based on how much you insure. 1.0x means you hold exactly the minimum. Drop below 1.0x and the regulator takes over. That's game over.`,r:`In Australia the regulator is APRA. Most real insurers aim to keep their buffer between about 1.4x and 1.8x.`},
 price:{i:'tag',k:'Strategy lever',t:'Price',p:`What you charge compared with other insurers. Cheaper wins more customers, but people who switch for the lowest price are often the ones who claim most. Dearer earns more per customer, but more of them shop elsewhere at renewal.`,r:`Pricing teams use data on age, location, car type and claims history to set prices for each customer.`},
 appetite:{i:'filter',k:'Strategy lever',t:'Underwriting appetite',p:`Underwriting means deciding who you'll insure. Tight turns away risky customers, like a house in a flood zone or a driver with past crashes. Broad takes almost anyone. Tight gives fewer, safer customers. Broad gives more customers and more claims.`,r:`Underwriters follow rules called "underwriting guidelines" and refer unusual cases to senior staff.`},
 claims:{i:'clipboard',k:'Strategy lever',t:'Claims approach',p:`How you treat customers when they claim. Tight checks everything and pays less. It saves money but annoys customers and attracts the regulator. Fast pays quickly and generously. It costs a little more and builds reputation.`,r:`Claims time is the moment customers find out if their insurance was worth it. It's the biggest driver of reputation.`},
 marketing:{i:'megaphone',k:'Strategy lever',t:'Marketing',p:`Advertising to bring in new customers. The first dollars work hard. Above about $2m a quarter, each extra dollar brings in fewer new customers.`,r:`Big insurers spend tens of millions a year on TV, online ads and sponsorships.`},
 reins:{i:'umbrella',k:'Strategy lever',t:'Reinsurance',p:`Insurance for insurance companies. You pay another company a slice of your premium. If a big disaster hits, they pay most of the cost above a set amount. It must be in place before the disaster, so changes only apply from next quarter. More cover also lowers the capital the regulator makes you hold.`,r:`Global reinsurers like Munich Re and Swiss Re carry much of the cost of Australian hail, flood and bushfire losses.`},
 lossRatio:{i:'chart',k:'Scoreboard',t:'Loss ratio',p:`Of every $1 customers pay you, how many cents go on claims. 62% means 62c. Lower is better, but very low can mean you're overcharging or being too harsh on claims.`,r:`For home and motor insurance, 60% to 70% is common.`},
 combined:{i:'chart',k:'Scoreboard',t:'Combined ratio',p:`Everything you spend (claims plus the cost of running the business) for every $1 customers pay you. Under 100% means insurance itself made a profit. Over 100% means you lost money on insurance.`,r:`This is the single number insurance executives watch most closely.`},
 flow:{i:'coins',k:'Scoreboard',t:'Money in and out',p:`Money in is mostly premium (what customers pay) plus interest earned on your savings. Money out is claims, disasters, reinsurance, running costs and marketing. If in beats out, your capital grows.`,r:`Insurers are paid first and pay claims later. That gap is why they can earn investment income.`}
};

/* ---------- Lever hints ---------- */
function priceHint(v){
 if(v<=-8)return 'Very cheap. Lots of new customers, and many of them will be risky.';
 if(v<0)return 'A bit cheaper than rivals. Faster growth, slightly riskier customers.';
 if(v===0)return 'Same as the market. Steady growth and normal risk.';
 if(v<=8)return 'A bit dearer. More profit per customer, and a few more leave.';
 return 'Expensive. Good margins, but many customers will shop elsewhere.';
}
const HINTS={
 appetite:{tight:'Fewer new customers, but they claim less. Your book gets safer over time.',balanced:'A normal mix of customers. The market average.',broad:'Lots of new customers, including risky ones you would normally turn away.'},
 claims:{tight:'Pays less on claims, but customers leave and reputation falls. Risky if the regulator looks.',fair:'Pays what the policy says, promptly. Slow, steady reputation gains.',fast:'Pays quickly and generously. Claims cost about 5% more, reputation grows.'},
 reins:{none:'No protection. Saves money, but one storm could cost more than a year of profit.',standard:'You pay the first $6m of a disaster. Reinsurers pay most of the rest.',heavy:'You pay only the first $2.5m of a disaster. Costs more, lowers required capital.'}
};
function mktHint(v){if(v===0)return 'No advertising. Growth relies on reputation and word of mouth.';if(v<=1)return 'Modest spend. Good value per dollar.';if(v<=2)return 'Solid spend. Still decent value.';return 'Heavy spend. Each extra dollar brings fewer new customers.'}

function advisorTip(){
 const sol=s.capital/s.req,lo=Math.min(s.lines.home.price,s.lines.motor.price);
 if(s.q===1)return `Welcome aboard, ${ui.name||'boss'}. Everything starts at market settings, which is a safe place to begin. Tap any ? to learn what something means. When you're ready, end the quarter.`;
 if(s.event&&s.choice==null&&s.q===2)return `Every quarter brings an event. Read the tags on each option: orange is the cost, green is the upside and red is the risk.`;
 if(sol<1.25)return `Our safety buffer is getting thin. Higher prices, less marketing or more reinsurance will all help it recover.`;
 if(s.reinsNext==='none')return `No reinsurance is a big gamble. One storm could cost more than a year of profit, and it has to be bought before the storm.`;
 if(lo<.95&&s.appetite==='broad')return `Cheap prices plus a broad appetite is how insurers attract risky customers. Keep an eye on the loss ratio.`;
 if(s.trust<40)return `Customers are losing faith in us. A fairer claims approach will rebuild reputation over time.`;
 if(s.claims==='tight')return `Tight claims handling saves money now. Customers and the regulator notice, though.`;
 const t=['Quiet quarters are where profit is made. Small, steady margins add up.','Growth feels good, but every new customer needs more capital behind them.','Storm season comes every year. The question is only how bad it will be.','Watch the combined ratio. Under 100% means insurance itself is making money.','Reputation takes years to build. Claims time is when customers judge us.'];
 return t[s.q%t.length];
}

function tone(f,dur,type,vol,when,to){const a=ac();if(!a)return;const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,(vol||.1)*SET.sfxVol),t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function noise(dur,vol,freq,when,type){const a=ac();if(!a)return;const t=a.currentTime+(when||0),n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;const src=a.createBufferSource();src.buffer=b;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq;const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*SET.sfxVol),t+Math.min(.08,dur/4));g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f).connect(g).connect(a.destination);src.start(t);src.stop(t+dur+.05)}

<div class="namerow"><input id="gname" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" value="${esc(cur)}"><button type="button" class="dice" data-act="dice" aria-label="Pick a random name">${ic('dice')}</button></div>
<button class="go-btn pulse" type="submit">${ic('play')} Start briefing</button></form>`);
 const inp=document.getElementById('gname');if(inp&&matchMedia('(pointer:fine)').matches){inp.focus();inp.select()}
}

document.addEventListener('submit',e=>{
 if(e.target.id!=='nameForm')return;e.preventDefault();
 ui.name=cleanName(document.getElementById('gname').value)||randomName();lsSet(NAME_KEY,ui.name);
 closeSheet();resetRun();s.phase='brief';ui.slide=0;sfx('select');render();window.scrollTo(0,0);

/* ---------- v6: settings and background music ---------- */
I.gear='<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>';
I.music='<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>';
I.eye='<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>';
const SET_KEY='underwritten.settings.v1';
const SET=(()=>{const d={sfx:true,sfxVol:.8,music:false,musicVol:.5,theme:'auto',motion:'full'};try{const v=JSON.parse(lsGet(SET_KEY)||'{}');
 if(typeof v.sfx==='boolean')d.sfx=v.sfx;if(typeof v.music==='boolean')d.music=v.music;
 if(typeof v.sfxVol==='number')d.sfxVol=clamp(v.sfxVol,0,1);if(typeof v.musicVol==='number')d.musicVol=clamp(v.musicVol,0,1);
 if(['auto','light','dark'].includes(v.theme))d.theme=v.theme;if(['full','reduce'].includes(v.motion))d.motion=v.motion}catch(e){}return d})();
function saveSet(){lsSet(SET_KEY,JSON.stringify(SET))}
function applyDisplay(){const r=document.documentElement;if(SET.theme==='auto')delete r.dataset.theme;else r.dataset.theme=SET.theme;if(SET.motion==='reduce')r.dataset.motion='reduce';else delete r.dataset.motion}

/* Generative ambient music: calm loop, shifts to a minor loop when the safety buffer is low */
const MU={timer:null,next:0,step:0,gain:null,delay:null,filt:null};
const mf=n=>440*Math.pow(2,(n-69)/12);
const CALM=[{b:48,n:[60,64,67,71]},{b:45,n:[57,60,64,67]},{b:41,n:[57,60,64,65]},{b:43,n:[55,59,62,64]}];
const TENSE=[{b:45,n:[57,60,64,69]},{b:41,n:[53,57,60,65]},{b:38,n:[50,53,57,62]},{b:40,n:[52,56,59,64]}];
const STEP=.375;
function musicTarget(){return .0001+SET.musicVol*.3}
function tenseNow(){return s&&s.phase!=='intro'&&s.phase!=='brief'&&s.req&&s.capital/s.req<1.25}
function musicPlaying(){return !!MU.timer}
function musicStart(){
 if(MU.timer||!sndOn||!SET.music)return;const a=ac();if(!a)return;
 MU.gain=a.createGain();MU.gain.gain.setValueAtTime(.0001,a.currentTime);MU.gain.gain.exponentialRampToValueAtTime(musicTarget(),a.currentTime+2);MU.gain.connect(a.destination);
 MU.filt=a.createBiquadFilter();MU.filt.type='lowpass';MU.filt.frequency.value=1100;MU.filt.connect(MU.gain);
 MU.delay=a.createDelay();MU.delay.delayTime.value=STEP;const fb=a.createGain();fb.gain.value=.32;MU.delay.connect(fb).connect(MU.delay);MU.delay.connect(MU.gain);
 MU.next=a.currentTime+.1;MU.step=0;MU.timer=setInterval(musicSched,150);
}
function musicStop(){
 if(!MU.timer)return;clearInterval(MU.timer);MU.timer=null;const a=AC,g=MU.gain;
 if(a&&g){g.gain.cancelScheduledValues(a.currentTime);g.gain.setValueAtTime(Math.max(.0001,g.gain.value),a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.6);setTimeout(()=>{try{g.disconnect()}catch(e){}},900)}
}
function musicVol(){if(MU.gain&&AC){MU.gain.gain.cancelScheduledValues(AC.currentTime);MU.gain.gain.setTargetAtTime(musicTarget(),AC.currentTime,.1)}}
function musicSync(){if(sndOn&&SET.music)musicStart();else musicStop()}
function musicSched(){
 const a=AC;if(!a||a.state!=='running')return;
 if(MU.next<a.currentTime)MU.next=a.currentTime+.05;
 while(MU.next<a.currentTime+1.2){musicStep(MU.step,MU.next);MU.next+=STEP;MU.step=(MU.step+1)%32}
}
function musicStep(step,t){
 const a=AC,prog=tenseNow()?TENSE:CALM,ch=prog[Math.floor(step/8)%4];
 if(step%8===0){
  ch.n.forEach((n,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=mf(n);o.detune.value=(i%2?5:-5);
   g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+1);g.gain.setValueAtTime(.05,t+2.3);g.gain.exponentialRampToValueAtTime(.0001,t+3.4);
   o.connect(g).connect(MU.filt);o.start(t);o.stop(t+3.5)});
  const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=mf(ch.b);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+2.8);o.connect(g).connect(MU.gain);o.start(t);o.stop(t+2.9);
 }
 if(step%8!==0&&Math.random()<.5){
  const n=ch.n[Math.floor(Math.random()*ch.n.length)]+12,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=mf(n);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.06,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
  o.connect(g);g.connect(MU.gain);g.connect(MU.delay);o.start(t);o.stop(t+.65);
 }
}
document.addEventListener('visibilitychange',()=>{if(!AC)return;if(document.hidden){if(MU.timer)AC.suspend()}else if(MU.timer)AC.resume()});

/* Settings sheet */
function sw(key,on,label){return `<button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-set="${key}"><i></i></button>`}
function segSet(name,val,opts){return `<fieldset class="seg" style="margin-top:8px"><legend>${name}</legend>${opts.map(([v,l])=>`<label><input type="radio" name="set-${name}" value="${v}" ${v===val?'checked':''}><span>${l}</span></label>`).join('')}</fieldset>`}
function openSettings(){
 const inGame=s.phase!=='intro';
 openSheet('gear','Game options','Settings',`
<div class="set-sec"><h4>Sound</h4>
<div class="set-row ${SET.sfx?'':'off'}" id="row-sfx"><div class="set-top"><span class="lv-ic" style="--tone:var(--signal)">${ic('volume')}</span><span class="nm2">Sound effects<small>Clicks, coins, storms and fanfares</small></span>${sw('sfx',SET.sfx,'Sound effects')}</div>
<div class="vol"><span>Volume</span><input type="range" min="0" max="1" step="0.05" value="${SET.sfxVol}" data-setv="sfxVol" aria-label="Sound effects volume"></div></div>
<div class="set-row ${SET.music?'':'off'}" id="row-music"><div class="set-top"><span class="lv-ic" style="--tone:var(--go)">${ic('music')}</span><span class="nm2">Background music<small>Calm ambient loop. Turns tense when your safety buffer runs low.</small></span>${sw('music',SET.music,'Background music')}</div>
<div class="vol"><span>Volume</span><input type="range" min="0" max="1" step="0.05" value="${SET.musicVol}" data-setv="musicVol" aria-label="Music volume"></div></div>
${sndOn?'':`<p class="pill-note">${ic('mute')} All sound is muted. The speaker button turns it back on.</p>`}
</div>
<div class="set-sec"><h4>Display</h4>
<div class="set-row"><div class="set-top"><span class="lv-ic" style="--tone:var(--ember)">${ic('sun')}</span><span class="nm2">Theme</span></div>${segSet('theme',SET.theme,[['auto','Auto'],['light','Light'],['dark','Dark']])}</div>
<div class="set-row"><div class="set-top"><span class="lv-ic" style="--tone:var(--pulse)">${ic('eye')}</span><span class="nm2">Animations<small>Reduced stops movement like weather, cars and pulses</small></span></div>${segSet('motion',SET.motion,[['full','Full'],['reduce','Reduced']]).replace('class="seg" style="','class="seg" style="grid-template-columns:1fr 1fr;')}</div>
</div>
<div class="set-sec"><h4>Game</h4>
<div class="set-btns">${inGame?`<button class="ghost-btn" data-act="quit">Quit to menu</button>`:''}<button class="ghost-btn danger" data-act="clearboard" style="${inGame?'':'grid-column:1/-1'}">Clear leaderboard</button></div>
</div>
<button class="go-btn" data-close style="margin-top:18px">Done</button>`);
}
document.addEventListener('input',e=>{
 const el=e.target;if(!el.closest('#sheet'))return;
 if(el.dataset.setv){SET[el.dataset.setv]=+el.value;saveSet();if(el.dataset.setv==='musicVol')musicVol()}
 else if(el.name==='set-theme'){SET.theme=el.value;saveSet();applyDisplay()}
 else if(el.name==='set-motion'){SET.motion=el.value;saveSet();applyDisplay()}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.setv==='sfxVol')sfx('select')});

/* ---------- Render and interaction ---------- */
function render(){
 renderStatus();
 const a=document.getElementById('app');
 document.body.classList.toggle('on-cover',s.phase==='intro');
 a.innerHTML=s.phase==='intro'?coverHTML():s.phase==='brief'?briefHTML():s.phase==='decide'?decideHTML():s.phase==='results'?resultsHTML()+playbookHTML():endHTML();
 renderSnd();
 const cu=document.getElementById('countup');
 if(cu&&SET.motion!=='reduce'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const to=+cu.dataset.to,t0=performance.now(),d=800;
  const step=t=>{const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,3),v=to*e;cu.textContent=(v>=0?'+':'')+m(v);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
 }
}
function openExplain(key){
 let e;
 if(key.startsWith('c:')){const id=key.slice(2),c=CONCEPTS[id];e={i:C_ICON[id],k:'Playbook card',t:c.t,p:c.d}}
 else e=EXPLAIN[key];
 if(!e)return;
 const d=document.getElementById('sheet');
 d.innerHTML=`<div class="sheet-in"><div class="sheet-top"><div class="ev-art" style="--tone:var(--signal);width:52px;height:52px;font-size:26px;border-radius:15px">${ic(e.i)}</div><div><div class="k">${e.k}</div><h3 id="sheetTitle">${esc(e.t)}</h3></div><button class="x" data-close aria-label="Close">${ic('x')}</button></div>
<div class="sheet-sec"><b>In plain English</b>${esc(e.p)}</div>${e.r?`<div class="sheet-sec"><b>In the real world</b>${esc(e.r)}</div>`:''}
<button class="go-btn" data-close style="margin-top:14px">Got it</button></div>`;
 if(d.showModal)d.showModal();else d.setAttribute('open','');
}
let toastT;
function toast(msg,icon){const t=document.getElementById('toast');t.innerHTML=ic(icon||'book')+esc(msg);t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

document.addEventListener('click',e=>{
 const d=document.getElementById('sheet');
 const tg=e.target.closest('[data-set]');
 if(tg){const k=tg.dataset.set;SET[k]=!SET[k];saveSet();tg.setAttribute('aria-checked',String(SET[k]));const row=document.getElementById('row-'+k);if(row)row.classList.toggle('off',!SET[k]);if(k==='music')musicSync();else if(SET[k])sfx('select');return}
 if(SET.music&&sndOn&&!musicPlaying())musicStart();
 const anyBtn=e.target.closest('button');
 if(anyBtn&&!anyBtn.disabled&&!anyBtn.matches('[data-opt],[data-act=close],[data-act=next],[data-act=mute],[type=submit]'))sfx('click');
 if(e.target===d||e.target.closest('[data-close]')){closeSheet();return}
 const ex=e.target.closest('[data-explain]');if(ex){openExplain(ex.dataset.explain);return}
 const o=e.target.closest('[data-opt]');
 if(o&&s.event&&s.choice==null){const i=+o.dataset.opt;s.event.opts[i].a(s);s.trust=clamp(s.trust,0,100);s.choice=i;sfx('select');
  if(unlock(s.event.lesson)){toast('New playbook card: '+CONCEPTS[s.event.lesson].t);setTimeout(()=>sfx('card'),250)}render();return}
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 const a=b.dataset.act;
 if(a==='mute'){sndOn=!sndOn;lsSet(SND_KEY,sndOn?'on':'off');renderSnd();musicSync();if(sndOn)sfx('select');return}
 if(a==='settings'){openSettings();return}
 if(a==='quit'||a==='clearboard'){
  if(!b.classList.contains('armed')){b.classList.add('armed');b.dataset.label=b.textContent;b.textContent=a==='quit'?'Tap again to quit':'Tap again to clear';setTimeout(()=>{if(b.isConnected){b.classList.remove('armed');b.textContent=b.dataset.label}},3000);return}
  if(a==='clearboard'){memBoard=[];lsSet(LB_KEY,'[]');b.classList.remove('armed');b.textContent='Leaderboard cleared';b.disabled=true;if(s.phase==='end')render();return}
  closeSheet();newGame();resetRun();render();window.scrollTo(0,0);return}
 if(a==='dice'){const inp=document.getElementById('gname');if(inp)inp.value=randomName();return}
 if(a==='board'){openBoardSheet();return}
 if(a==='newgame'){openNameSheet();return}
 else if(a==='bnext'){ui.slide=Math.min(2,ui.slide+1);sfx('whoosh')}
 else if(a==='bback'){ui.slide=Math.max(0,ui.slide-1);sfx('whoosh')}
 else if(a==='start'){s.phase='decide';s.event=null;s.choice=null;sfx('select')}
 else if(a==='close'){const before=scoreTotal(false);ui.prevTrust=s.trust;closeQuarter();ui.quarters++;if(s.last.profit>0)ui.profitable++;if(s.last.cat&&!s.failed)ui.cats++;ui.delta=scoreTotal(false)-before;
  {const r=s.last,w=catWeather(r);sfx('endq');if(r.cat)setTimeout(()=>sfx(w),250);setTimeout(()=>sfx(r.profit>=0?'profit':'loss'),r.cat?1500:450);if(r.unlocked.length)setTimeout(()=>sfx('card'),r.cat?2200:1100)}
  if(s.last.unlocked.length)setTimeout(()=>toast(s.last.unlocked.length===1?'New playbook card: '+CONCEPTS[s.last.unlocked[0]].t:s.last.unlocked.length+' new playbook cards'),700)}
 else if(a==='next'){nextQuarter();if(s.phase==='end'&&!ui.saved){saveScore();setTimeout(()=>sfx(s.failed?'fail':'win'),200)}else sfx('whoosh')}
 else if(a==='restart'){newGame();resetRun();s.phase='decide';sfx('select')}
 else if(a==='menu'){newGame();resetRun()}
 render();window.scrollTo(0,0);
});
document.getElementById('app').addEventListener('input',e=>{
 const t=e.target,set=(id,txt)=>{const el=document.getElementById(id);if(el)el.textContent=txt};
 if(t.id==='pHome'){const v=+t.value;s.lines.home.price=1+v/100;set('o_pHome',sign(v));set('h_pHome',priceHint(v))}
 else if(t.id==='pMotor'){const v=+t.value;s.lines.motor.price=1+v/100;set('o_pMotor',sign(v));set('h_pMotor',priceHint(v))}
 else if(t.id==='mkt'){s.marketing=+t.value;set('o_mkt',m(s.marketing));set('h_mkt',mktHint(s.marketing))}
 else if(t.name==='appetite'){s.appetite=t.value;set('h_appetite',HINTS.appetite[t.value])}
 else if(t.name==='claims'){s.claims=t.value;set('h_claims',HINTS.claims[t.value])}
 else if(t.name==='reins'){s.reinsNext=t.value;set('h_reins',HINTS.reins[t.value])}
});

applyDisplay();buildHud();newGame();resetRun();ui.name=cleanName(lsGet(NAME_KEY));render();
})();

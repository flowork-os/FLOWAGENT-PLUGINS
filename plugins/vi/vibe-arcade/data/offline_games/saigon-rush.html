<title>Sài Gòn Vội Vã</title><link rel="canonical" href="https://saigonvoiva.com/">
<script>
(() => {
  const here = new URL(location.href);
  if (navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches) {
    here.searchParams.set('stay', '1');
    return location.replace(here.pathname + here.search);
  }
  const to = new URL(here.pathname + here.search, 'https://saigonvoiva.com');
  try {
    const d = JSON.parse(localStorage.getItem('ram-brawl.v1') || 'null');
    if (d && /^[a-f0-9]{32}$/.test(d.key)) {
      for (const k of ['installed', 'installAsks', 'installLater']) delete d[k];   // the new address can be installed again
      to.hash = 'move=' + btoa(unescape(encodeURIComponent(JSON.stringify(d)))).replace(/+/g, '-').replace(///g, '_').replace(/=+$/, '');
    }
  } catch (e) {}
  location.replace(to.href);
})();
</script>

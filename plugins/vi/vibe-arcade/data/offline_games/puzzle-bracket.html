    $$('.on', bk).forEach(function (el) { el.classList.remove('on', 'trace'); });
    if (!s) { tip.classList.remove('show'); return; }
    // retrace the game's line from where it started to where it stopped
    var on = $$('.ln[data-slug="' + s + '"]', svg);
    on.forEach(function (p) { p.style.setProperty('--t', ((+p.getAttribute('data-k') + 1) * .16) + 's'); p.classList.add('on'); });
    void svg.getBoundingClientRect();
    on.forEach(function (p) { p.classList.add('trace'); });
    nodes.forEach(function (q) { if (q.slug === s) q.el.classList.add('on'); });
    place(n);
  }
  function place(n) {
    var s = n.slug, e = E[s], body;
    if (n.k === -1 || n === root) body = '<b>' + nm(s) + '</b>' + esc(e.tag || e.pitch) + '<i>' + esc(fate(s)) + ' · click to play</i>';
    else body = '<b>' + nm(n.m.winner) + ' beat ' + nm(n.m.loser) + '</b><i>' + votesSaid(n.m) + ' · click to see them</i>';
    if (n === root) { tip.classList.remove('show'); return; }
    tip.innerHTML = body;
    var W = bk.clientWidth, tw = tip.offsetWidth, th = tip.offsetHeight, r = n.el.offsetHeight / 2;
    var x = Math.max(4, Math.min(W - tw - 4, n.x - tw / 2)), below = n.y - r - th - 14 < 0;
    var y = below ? n.y + r + 16 : n.y - r - th - 14;
    tip.classList.toggle('below', below);
    tip.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    tip.style.setProperty('--ax', (n.x - x) + 'px');
    tip.classList.add('show');
  }
  var nodeOf = function (t) { var el = t && t.closest && t.closest('.nd'); return el ? nodes[+el.getAttribute('data-i')] : null; };
  bk.addEventListener('pointerover', function (e) { highlight(nodeOf(e.target)); });
  bk.addEventListener('pointerleave', function () { highlight(null); });
  bk.addEventListener('focusin', function (e) { highlight(nodeOf(e.target)); });
  bk.addEventListener('focusout', function () { highlight(null); });

  if (window.ResizeObserver) new ResizeObserver(function () { layout(); }).observe(bk); else window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  window.addEventListener('load', layout);
  layout();
  showPlayed();
  setTimeout(function () { bk.classList.remove('intro'); }, 2600);

  // ---------- dialogs ----------
  var matchDlg = $('#matchDlg'), gameDlg = $('#gameDlg'), playDlg = $('#playDlg'), frame = $('#playFrame');
  function renderMatch(id) {
    var m = M[id]; if (!m) return false;
    var cap = function (t) { t = String(t).trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
    var game = function (k) {
      var g = m[k], won = m.winner === g, pips = '';
      for (var i = 0; i < m.votes[k]; i++) pips += '<i></i>';
      return '<div class="g' + (won ? '' : ' lose') + '"><button type="button" class="shot" data-route="play/' + g + '" aria-label="Play ' + nm(g) + '"><img src="' + E[g].cover + '" alt="" width="960" height="600"></button>' +
        '<span class="pips' + (m.votes[k] ? '' : ' none') + '" aria-label="' + m.votes[k] + ' votes">' + pips + '</span>' +
        '<div><button type="button" class="play" data-route="play/' + g + '">' + PLAY + ' Play</button></div></div>';
    };
    var ballots = m.cards.map(function (c) {
      var dis = c.pick !== m.winner;
      return '<li class="ballot' + (dis ? ' dis' : '') + '"><span class="who">' + esc(D.judges[c.judge].name) + '</span>' +
        (c.quote ? '<q>' + esc(cap(c.quote)) + '</q>' : '<span></span>') +
        '<span class="vote"><img src="' + E[c.pick].mark + '" alt="" width="600" height="600">' + nm(c.pick) + '</span></li>';
    }).join('');
    matchDlg.classList.add('bal');
    matchDlg.innerHTML = '<div class="sheet-bar"><span class="stage" id="matchTitle">' + esc(STAGE_LONG[m.stage]) + '</span><button type="button" class="x" data-close aria-label="Close">' + X + '</button></div>' +
      '<div class="sheet-body"><div class="duel">' + game('a') + game('b') + '</div><ul class="ballots">' + ballots + '</ul></div>';
    return matchDlg;
  }
  function renderGame(slug) {
    var s = standing(slug); if (!s || !s.run.length) return false;
    return renderMatch(s.run[s.run.length - 1].match);
  }
  function renderPlay(slug) {
    var full = slug === 'full', e = full ? E[champ] : E[slug];
    if (!e) return false;
    var src = full ? D.game : e.proto;
    markPlayed(full ? champ : slug);
    $('#playName').innerHTML = esc(e.name) + '<small>' + (full ? 'Full game' : 'Prototype') + '</small>';
    $('#playNew').href = src;
    frame.title = e.name;
    if (frame.getAttribute('src') !== src) { unload(); frame.setAttribute('src', src); }
    return playDlg;
  }

  // ---------- routing ----------
  var shown = null;
  function parse(h) { var m = /^#(match|game|play)\/([\w-]+)$/.exec(h || ''); return m ? { kind: m[1], id: m[2] } : null; }
  // Swap in a fresh iframe rather than clearing src: that stops the game (and its sound) outright,
  // and a new frame's first load adds no session-history entry, so Back keeps closing the player.
  function unload() {
    if (!frame.getAttribute('src')) return;
    var f = frame.cloneNode(false); f.removeAttribute('src'); frame.replaceWith(f); frame = f;
  }
  function closeAll() {
    [matchDlg, gameDlg, playDlg].forEach(function (d) { if (d.open) d.close(); });
    unload();
    document.documentElement.classList.remove('locked');
    shown = null;
    showPlayed();
  }
  function render() {
    var r = parse(location.hash);
    if (!r) return closeAll();
    var dlg = r.kind === 'match' ? renderMatch(r.id) : r.kind === 'game' ? renderGame(r.id) : renderPlay(r.id);
    if (!dlg) return closeAll();
    [matchDlg, gameDlg, playDlg].forEach(function (d) { if (d !== dlg && d.open) d.close(); });
    if (dlg !== playDlg) unload();
    if (!dlg.open) dlg.showModal();
    dlg.scrollTop = 0;
    document.documentElement.classList.add('locked');
    shown = dlg;
    if (dlg === playDlg) { frame.addEventListener('load', function f() { frame.removeEventListener('load', f); try { frame.focus(); frame.contentWindow.focus(); } catch (e) {} }); }
    else { var first = $('.x', dlg); if (first) first.focus(); }
  }
  var depth = 0;
  function go(route) {
    history.pushState({ tb: ++depth }, '', '#' + route);
    render();
  }
  function close() {
    if (history.state && history.state.tb) history.back();
    else { history.replaceState(null, '', location.pathname + location.search); render(); }
  }
  window.addEventListener('popstate', render);
  window.addEventListener('hashchange', render);
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-close]');
    if (c) { e.preventDefault(); close(); return; }
    var t = e.target.closest('[data-route]');
    if (t) { e.preventDefault(); go(t.getAttribute('data-route')); return; }
    if (e.target === matchDlg || e.target === gameDlg) close(); // backdrop
  });
  [matchDlg, gameDlg, playDlg].forEach(function (d) { d.addEventListener('cancel', function (e) { e.preventDefault(); close(); }); });
  if (parse(location.hash)) render();
})();
</script>
</body>
</html>

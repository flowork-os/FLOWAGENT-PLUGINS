<body>

<header class="hero">
  <h1 class="sr">The Puzzle Bracket: twelve puzzle games, judged by AI. Tidekeeper won. Play any of them.</h1>
  <div class="bk intro" id="bk" aria-label="The bracket"></div>
</header>

<dialog class="sheet" id="matchDlg" aria-labelledby="matchTitle"></dialog>
<dialog class="sheet narrow" id="gameDlg" aria-labelledby="gameTitle"></dialog>
<dialog class="player" id="playDlg" aria-label="Game">
  <div class="pbar">
    <button type="button" data-close><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3 5 8l5 5"/></svg><span class="lbl">Back to the bracket</span></button>
    <div class="pname" id="playName"></div>
    <a id="playNew" target="_blank" rel="noopener"><span class="lbl">New tab</span><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h4v4M13 3 7 9M11 10v3H3V5h3"/></svg></a>
  </div>
  <iframe id="playFrame" title="Game" allow="autoplay; fullscreen; gamepad"></iframe>
</dialog>

<script>
(function () {
  'use strict';
  var D = {"entrants":{"01-umbra":{"slug":"01-umbra","name":"Umbra","pitch":"You are a shadow. Turn the sun so pillars and crates throw a path of shade to the moon well.","tag":"Turn the sun. Walk only in shade.","thumb":"thumbs/01-umbra.jpg","cover":"covers/01-umbra.jpg","mark":"covers/01-umbra-mark.jpg","proto":"games/01-umbra/index.html"},"02-warp-weft":{"slug":"02-warp-weft","name":"Warp & Weft","pitch":"You are shown a finished cloth. Thread the shafts and plan the lifts that weave it exactly.","tag":"Plan the loom lifts that weave the cloth.","thumb":"thumbs/02-warp-weft.jpg","cover":"covers/02-warp-weft.jpg","mark":"covers/02-warp-weft-mark.jpg","proto":"games/02-warp-weft/index.html"},"03-backstitch":{"slug":"03-backstitch","name":"Backstitch","pitch":"Sew one continuous thread, alternating front and back, until the front matches the pattern.","tag":"One thread, front and back, to match.","thumb":"thumbs/03-backstitch.jpg","cover":"covers/03-backstitch.jpg","mark":"covers/03-backstitch-mark.jpg","proto":"games/03-backstitch/index.html"},"04-stamp-roller":{"slug":"04-stamp-roller","name":"Stamp Roller","pitch":"Roll an inked die through paint pools and print the canvas to match the blueprint.","tag":"Roll an inked die to print the blueprint.","thumb":"thumbs/04-stamp-roller.jpg","cover":"covers/04-stamp-roller.jpg","mark":"covers/04-stamp-roller-mark.jpg","proto":"games/04-stamp-roller/index.html"},"05-leadlight":{"slug":"05-leadlight","name":"Leadlight","pitch":"Rotate, flip and stack tinted panes until their overlaps match the stained-glass cartoon.","tag":"Stack tinted glass to match the window.","thumb":"thumbs/05-leadlight.jpg","cover":"covers/05-leadlight.jpg","mark":"covers/05-leadlight-mark.jpg","proto":"games/05-leadlight/index.html"},"06-inkgrain":{"slug":"06-inkgrain","name":"Inkgrain","pitch":"Place drops of ink that wick along the paper’s grain, filling a kanji stencil with no blots.","tag":"Ink wicks along the grain. Fill the stencil.","thumb":"thumbs/06-inkgrain.jpg","cover":"covers/06-inkgrain.jpg","mark":"covers/06-inkgrain-mark.jpg","proto":"games/06-inkgrain/index.html"},"07-topple-town":{"slug":"07-topple-town","name":"Topple Town","pitch":"Place a few dominoes, give one push, and topple every block and ring every bell.","tag":"Place dominoes. One push topples them all.","thumb":"thumbs/07-topple-town.jpg","cover":"covers/07-topple-town.jpg","mark":"covers/07-topple-town-mark.jpg","proto":"games/07-topple-town/index.html"},"08-tidekeeper":{"slug":"08-tidekeeper","name":"Tidekeeper","pitch":"Dig and pile sand before the tide comes in, so every creature on the beach ends up happy.","tag":"Shape the sand before the tide comes in.","thumb":"thumbs/08-tidekeeper.jpg","cover":"covers/08-tidekeeper.jpg","mark":"covers/08-tidekeeper-mark.jpg","proto":"games/08-tidekeeper/index.html"},"09-foldmap":{"slug":"09-foldmap","name":"Foldmap","pitch":"Fold a road map printed on both sides until its face-up roads join every town.","tag":"Fold the map until the roads connect.","thumb":"thumbs/09-foldmap.jpg","cover":"covers/09-foldmap.jpg","mark":"covers/09-foldmap-mark.jpg","proto":"games/09-foldmap/index.html"},"10-orrery":{"slug":"10-orrery","name":"Orrery","pitch":"Ride clockwork planets and hop between rings as they align, until you reach the gold world.","tag":"Hop between planets as the rings align.","thumb":"thumbs/10-orrery.jpg","cover":"covers/10-orrery.jpg","mark":"covers/10-orrery-mark.jpg","proto":"games/10-orrery/index.html"},"11-mycel":{"slug":"11-mycel","name":"Mycel","pitch":"Grow a fungus network on a tight nutrient budget until it touches every tree.","tag":"Grow a fungus to every tree, on a budget.","thumb":"thumbs/11-mycel.jpg","cover":"covers/11-mycel.jpg","mark":"covers/11-mycel-mark.jpg","proto":"games/11-mycel/index.html"},"12-reflection-pond":{"slug":"12-reflection-pond","name":"Reflection Pond","pitch":"Your reflection copies you with up and down flipped. Get yourself to the lantern and it to the moon.","tag":"Guide you and your mirrored reflection home.","thumb":"thumbs/12-reflection-pond.jpg","cover":"covers/12-reflection-pond.jpg","mark":"covers/12-reflection-pond-mark.jpg","proto":"games/12-reflection-pond/index.html"}},"judges":{"designer":{"name":"Designer","role":"Puzzle designer. Weighs rule depth and whether solutions come from insight."},"player":{"name":"Player","role":"Has played a lot of puzzle games. Judges fun: feel, readability, the click of a solve."},"producer":{"name":"Producer","role":"Decides which concept gets greenlit as a full 15-hour commercial game."},"critic":{"name":"Critic","role":"Veteran indie puzzle critic. Weighs originality against existing games."},"newcomer":{"name":"Newcomer","role":"Casual cozy-game player who rarely plays hard puzzle games."}},"criteria":["Uniqueness","Interestingness","Satisfaction","Package / scalability","Execution"],"matches":[{"id":"R1-M1","stage":"R1","stageName":"Round 1","col":0,"a":"09-foldmap","b":"10-orrery","votes":{"a":3,"b":0},"combined":{"a":111,"b":105},"winner":"09-foldmap","loser":"10-orrery","cards":[{"judge":"designer","scores":{"a":[5,7,8,7,8],"b":[7,5,7,6,9]},"total":{"a":35,"b":34},"pick":"09-foldmap","quote":"real spatial ahas; Orrery is modular timing with low branching","persona":null,"html":"<h5>Reasoning</h5>\n<p>Both prototypes run cleanly. Neither threw a JS error, both solvers confirm every par, and I drove both hardest levels to a win. Foldmap's rules come straight from real paper: a fold flips the flap, only the top layer counts, and a line folds only where every layer is creased. Those rules produce insights you get by understanding them. You find out that the back is part of the map, that two folds over equal one fold under, and in Pocket Atlas that you should build the route face-down and reveal it with the last fold. The route is invisible until that fold, and it is the best single \"aha\" in the match. Orrery is beautifully presented, and the retrograde world is a real idea: riding it rephases the machine. But every insight here is modular arithmetic: parity locks, relative speed, and in Grand Syzygy \"3 retro ticks × 2 = the 6-sector gap.\" With only wait, hop in and hop out on each move, Forecast and undo turn the solve into cheap lookahead instead of deduction, and the expansion list mostly adds arithmetic (LCMs, nested clocks). Foldmap owes a lot to Paper Trail and asks for heavy mental simulation, but its mechanic space (windows, tracing paper, mountain/valley folds, orientation goals) offers qualitatively different insights, not just harder sums. That space is deeper and more varied.</p>"},{"judge":"player","scores":{"a":[6,7,9,7,8],"b":[7,7,7,6,9]},"total":{"a":37,"b":36},"pick":"09-foldmap","quote":"tactile folds more fun; Orrery gorgeous but wait-and-count","persona":null,"html":"<h5>What I played</h5>\n<ul><li><strong>Foldmap</strong>: Played maps 1, 2, 3, 4 and 6 in the browser. On map 4 (Here Be Dragons) I made the obvious left fold first. It joined Kestrel to Dunmore but left the serpent showing. Folding the bottom up then covered the serpent and broke the road. The par solution (fold the east flap first, then the bottom, then the west) fixed both, and the reason was clear: fold order decides the stacking. Map 6 (Pocket Atlas) keeps the route hidden until the fourth fold, and that final reveal lands well. No JS errors. One small quirk: a leftward drag on a sheet with many creases committed a horizontal fold, because the fold is picked by the nearest crease rather than by the drag direction.</li><li><strong>Orrery</strong>: Played levels 1, 3 and 6. On level 3 I took the \"obvious\" first hop and was vaporised two ticks later. On level 6 I rode the retrograde world for 3 ticks (\"slipped 6 sectors\"), returned home, waited 4 ticks and chained 4 hops into a Grand Syzygy. Its payoff is spectacular. No JS errors. The HUD is excellent (beam ETA, alignment status, forecast ghosts, Oracle).</li></ul>\n<h5>Reasoning</h5>\n<p>Both are beautifully made, but Foldmap is the one I'd lose an evening to. Every action is a big, tactile paper fold with a real 3D flap, a rustle, and rising blips as the road connects. Experimenting is a joy, and the solves come from spatial insight: order is stacking, a double fold turns a face 180°, the table side becomes the top. That is the Stephen's Sausage Roll kind of thinking. Orrery has clever ahas (parity lock, safe harbour, gear re-timing) and a stunning finale. But its main verb is pressing Wait and counting sectors. With only 2–3 choices per move, state spaces of 25–564 states, a forecast and free undo, I'd often poke my way through instead of thinking, and I'd \"see sums, not planets.\" Foldmap's biggest risk is the load of simulating mirrored backs in your head (and a Paper Trail comparison hurts its uniqueness a bit). Still, its expansion list (windows, tracing paper, mountain/valley creases, diagonal flaps) keeps changing what you see, which I trust more over 150 puzzles than more timing layers on a tiny branching factor.</p>"},{"judge":"producer","scores":{"a":[8,7,8,8,8],"b":[7,6,8,6,8]},"total":{"a":39,"b":35},"pick":"09-foldmap","quote":"hook legible from one screenshot; Orrery wait/hop core is narrow","persona":null,"html":"<p>Both prototypes are polished and error-free: puppeteer runs showed no JS errors, both solvers pass, and I played the finales to 3 stars. Foldmap sells in one screenshot: \"fold a double-sided road map so the roads line up\". Everyone has fought a road map, and the back-of-the-map reveal plus \"whatever faces the table on the last fold faces you\" (Pocket Atlas: 4 folds, 1,647 states, 9 near misses) are real spatial ahas with cozy, broad appeal. Its expansion list is strong: windows/slits, tracing paper, diagonal creases, one-way arrows that mirror, two-sided goals. Each of those changes <em>how you think</em>, which makes 150+ distinct puzzles believable, and the BFS solver lowers the level-design risk. Orrery is gorgeous brass-clockwork eye candy with a great syzygy-chain payoff, and the Grand Syzygy is verified unique and uses every mechanic. But the core is modular arithmetic with only wait/hop choices (the finale has just 339 reachable states), and the forecast/Oracle push solving toward lookahead. Most of its chapter twists add parameters to the same timing sum, so I see a higher risk of sameness and a nichier audience. Foldmap's main risk, heavy mental simulation of mirrored backs, is fixable with UI (ghost previews). Orrery's risk is baked into the mechanic. So I greenlight Foldmap.</p>"}]},{"id":"R1-M2","stage":"R1","stageName":"Round 1","col":0,"a":"05-leadlight","b":"07-topple-town","votes":{"a":0,"b":3},"combined":{"a":98,"b":103},"winner":"07-topple-town","loser":"05-leadlight","cards":[{"judge":"designer","scores":{"a":[6,4,7,5,8],"b":[5,6,7,6,7]},"total":{"a":30,"b":31},"pick":"07-topple-town","quote":"Leadlight is a forced fit-check; Topple's crush and timing rules make real puzzles","persona":null,"html":"<h5>Reasoning</h5>\n<p>Leadlight has the more elegant rule: bitwise-OR CMY filters, stated in one sentence. That rule is also monotone, so the subset rule settles almost everything locally. The bundled solver confirms that every pane in I–V has exactly one legal placement ([1,1,1] in Trefoil and Nocturne). Rose Window's [4,4,4,4,1] is one corner fit repeated four times, with the keystone forced into the only 2x2 of cyan-bearing cells. So each window is a visual fit-check with live feedback. You don't deduce much, and Nocturne's \"stars are holes\" is the only real aha.</p>\n<p>Topple Town sits in a more familiar lineage (Pushover-style one-push dominoes). Its rules are non-monotone, though: crushing stops the push, a two-sided hit crumples a block, and a marble can be parked and kicked again. Those rules interact, and the levels use it:</p>\n<ul><li>In Tall Order, height is both the tool and the hazard. The tall block must flatten the decoy ramp, but it would also flatten the corner ramp.</li><li>In Marble Run, one block does double duty: it stops the marble under the bell and carries the returning chain.</li><li>In Photo Finish, I simulated all 6 ways to put the three blocks in the gaps, and only one wins. The solution follows from two ideas: a tall block beside a ramp kills the chain, and height is speed. The slow block goes on the marble's street and the fast ones on the long route.</li></ul>\n<p>Topple's search spaces are small enough that trial and error works, and beats can't be seen until you run the chain. Leadlight's best expansions (XOR glass, opaque stacking order, double-sided cartoons) are stronger ideas than Topple's gadget list. But they are hypothetical, and they are needed just to make its current rule produce reasoning. Judged on the potential it shows, Topple Town already contains real puzzle design, while Leadlight's depth is postponed to future rules. Leadlight is the more polished and legible prototype, and neither threw a JS error.</p>"},{"judge":"player","scores":{"a":[6,5,8,6,8],"b":[6,7,8,7,8]},"total":{"a":33,"b":36},"pick":"07-topple-town","quote":"marble re-kick and the one-beat race are real ahas; Leadlight is rotate-and-compare","persona":null,"html":"<h5>Reasoning</h5>\n<p>I played both in the browser. In Leadlight I dragged, rotated and flipped panes through First Light and part of Rose Window, then used the hint. In Topple Town I solved First Push, Marble Run and Photo Finish by clicking, and failed Photo Finish once first. Leadlight is the prettier of the two. Light falls on the floor, the lead turns gold and the rose lights up when you win. But its solver confirms every window is statically forced (placements [1,1,1] or the petal symmetry), so play comes down to rotating each pane until it matches, then squinting to compare an 8x8 overlap against the cartoon. \"Stars are holes\" and \"flip the twin\" are nice ideas, but each one is a single observation rather than a chain of deductions. Topple Town gave me real \"aha\" moments. In Marble Run you park the marble against your own block and let the chain loop round a ramp to kick it north to the bell. In Photo Finish the tower's extra reach is what gets the gate down one beat ahead of the marble. My failed attempt was fun to watch, too, because the marble ran into a gate that hadn't fallen yet. Its weak spots are that you can't see the beat count before you run it, the failure message doesn't say what went wrong, and the small trays invite brute force. Still, the one-push chain reaction is the loop I'd keep coming back to and tell friends about. Its mechanics (springs, chord bells, a second push, conveyors) combine in more ways than Leadlight's per-pane matching.</p>"},{"judge":"producer","scores":{"a":[7,5,8,6,9],"b":[6,7,8,7,8]},"total":{"a":35,"b":36},"pick":"07-topple-town","quote":"broader appeal and trailer value; Leadlight panes each have 1 legal placement","persona":null,"html":"<h5>Reasoning</h5>\n<p>Leadlight has the more distinctive capsule and store-page art: glowing stained glass, a light projection on the floor, and a lovely win bloom. It is the most polished of the two. I solved the Rose Window end to end with no errors. Its core, though, is thin for a 15-hour game. The solver's own placement counts show each pane has exactly one legal spot after the subset rule in Trefoil and Nocturne, and the \"hardest\" Rose Window reduces to putting one identical petal in each quadrant. The ahas (\"stars are holes\", \"the keystone vanishes\") are elegant but light, and the depth for 150 puzzles depends on unproven modifiers (opaque, XOR, decoys). It also depends on colour, which is an accessibility risk. Topple Town is less original, since it descends from Pushover. It has the stronger commercial loop, though: plan, then watch a chain reaction snake through a toy town. That is instantly readable to anyone and ideal for trailers and GIFs. Its ahas are genuinely surprising: in Marble Run you park a marble and re-kick it with the returning chain, and in Photo Finish height is speed in a beat race where a tie crumples the gate. Its gadget list (springs, conveyors, chord bells, pressure plates, a second push) combines in both space and time, which gives it a higher ceiling for non-repetitive escalation. Its risks are small solution spaces that invite brute force, invisible beat counting and ramp readability, but those are fixable UX and curation problems. Leadlight's \"noticing, not searching\" problem sits in the core design. Topple Town wins narrowly because it has the broader appeal and the deeper mechanic ceiling.</p>"}]},{"id":"R1-M3","stage":"R1","stageName":"Round 1","col":0,"a":"08-tidekeeper","b":"03-backstitch","votes":{"a":2,"b":1},"combined":{"a":112,"b":110},"winner":"08-tidekeeper","loser":"03-backstitch","cards":[{"judge":"designer","scores":{"a":[6,6,8,6,9],"b":[8,8,7,7,8]},"total":{"a":35,"b":38},"pick":"03-backstitch","quote":"the front/back alternation is a new rule system; Tidekeeper beaches decompose into independent fixes","persona":null,"html":"<h5>Reasoning</h5>\n<p>Tidekeeper has the cleaner rule set: water settles at the minimax spill height, and each creature needs that height to land in a band. It is very readable, and its bucket rule is elegant because every dig has to earn its place. But all six beaches split into independent local fixes you can find by looking. Even Spring Tide (4 scoops, unique solution, which I played through and won) is two one-step ideas: move the octopus's door when you seal the castle, and chain the crab drains. The \"plug exactly 1\" beats are arithmetic, not insight.</p>\n<p>Backstitch's single alternating front/back thread is a genuinely new constraint grammar, and it has a real structural spine. On organza every line holds one front and one back, so every edge except one gets a back thread, and that unbacked edge must join your start hole to your end hole. Cul-de-sacs, Holbein laps and \"slip back behind the stitch you just made\" all fall out of that understanding. It is satisfying that the optimal solutions rediscover real embroidery techniques. I played Dragonfly through to the par star; the random-play win rate there is 0% and on Skeleton Key 0.05%, yet both yield to reasoning.</p>\n<p>Its weaknesses are real. There are more rules. The Aida levels are looser and par-driven (on Cross Stitch Heart every solution is optimal). A red \"can't come straight back\" message stays on screen while the cursor rests on the current hole. Its expansions (charted backs, fixed knots, shared colours, weaving) deepen the same core, while several of Tidekeeper's (slumping, erosion, wind waves) bolt simulation onto it. Backstitch shows more depth per rule and more genuine aha potential.</p>"},{"judge":"player","scores":{"a":[7,7,9,8,8],"b":[9,7,7,7,7]},"total":{"a":39,"b":37},"pick":"08-tidekeeper","quote":"legible physics, exciting release; Backstitch rule-heavy","persona":"a player of many puzzle games who judges mainly on fun, meaning moment-to-moment feel, readability and the click of solving.","html":"<h5>Scores</h5>\n<h5>What I played</h5>\n<ul><li><strong>Tidekeeper, Spring Tide (the hardest level).</strong> Before changing anything I released the tide. The castle washed away, one fish drained dry and a crab ended up trapped. The V preview showed the tide getting into the octopus basin through the cell next to the castle. When I piled that cell first, the game refused: \"Your bucket is empty. Dig somewhere first.\" So I dug the basin's new inlet at (5,4) down to 3 and then piled the castle's side. That fixed the castle, octopus and upper fish, but the lower fish was still dry and a crab was still wet. Two more scoops finished it: dig (5,7) so the crab drains through its neighbour, then pile the drain at (3,8). The crabs now drain into the fish pool at exactly the fish's depth, and everything passed. I also worked through Deep Water and Corner Cases on paper. Each has one clean idea: build a new wall inward, and seal a gap diagonally. No JS errors.</li><li><strong>Backstitch, Dragonfly (the hardest level) and Cross Stitch Heart.</strong> On Dragonfly I tried laying a <code>\\</code> leg first and got a clear layering error. I then wandered down the body until the hint said \"Dead end... Undo 5 stitches (marked red)\". I solved it at par for the star. On Heart the reach circle and \"Too far\" feedback were clear. Legal holes are ringed, which helps, but it also turns play into following the rings. No JS errors. The solver shows most levels are very loose. Heart has 51,819 solutions and all of them meet par, so par adds nothing there.</li></ul>\n<h5>Reasoning</h5>\n<p>Tidekeeper is the more fun game to play right now. Its rules are physical and intuitive (\"water fills to the lowest rim\"), each puzzle takes 2 to 4 meaningful scoops, and releasing the tide is a moment of truth like Snakebird's. The water rises, the castle crumbles or stands, the creatures react, and verdict bubbles show exactly what went wrong. Spring Tide gave me a real layered \"aha\": dig to fund the pile, move the door, and let the crabs drain through each other. Backstitch is the fresher idea, and its two-sided thread is genuinely novel and beautifully rendered. However, it asks a new player to take in a large stack of rules: alternation, no straight return, the reach circle, coming up only where a stitch waits, hiding behind lines whether sewn or not, one thread per line, and leg layering. Its early levels are so loose that they mostly amount to tracing a route. Solving it feels more like carefully clicking through 28 holes than a sudden insight, and on organza the back view can't be told apart from the front. Tidekeeper's weak spots are small scoop counts, a roughly 6-second tide wait (Space hurries it) and an oblique view that can hide pits. Its list of physical mechanics (tide tables, rain, springs, sluice gates, multi-day beaches) looks more likely to keep me playing for hours.</p>"},{"judge":"producer","scores":{"a":[7,7,8,8,8],"b":[8,7,6,7,7]},"total":{"a":38,"b":35},"pick":"08-tidekeeper","quote":"one-frame trailer hook; low production risk","persona":null,"html":"<h5>Reasoning</h5>\n<p>Backstitch has the more original premise. Real embroidery logic (front and back alternating, Holbein turnarounds, crossed legs laid in order, hiding thread behind sheer organza) has never been a puzzle game, and \"the back must spell a second picture\" is a great hook. I played Dragonfly (the finale) through to par. Counting it out is a real aha: every wing leg is a dead end that costs a pair of trips, and the six-segment body is the only place to hide the rest of the thread. As a publisher, though, I see high onboarding risk. The rules are abstract. The sheer back view is visually muddy when you flip mid-sew. Early levels have tens of thousands of solutions, so par carries the challenge, and the late levels have random-play win rates near 0%, which points to search as much as insight. Tidekeeper's hook is readable from one trailer frame (sculpt sand, release the tide, watch creatures react), everyone already understands \"water fills to the lowest rim\", and the payoff is one big animated moment of truth. That is broad appeal with a satisfying click. In Spring Tide, dig the new inlet first to fund the castle plug, then let the crabs drain through each other into the fish pool. The solver proves that solution unique and minimal. That kind of sim-plus-solver pipeline also lowers level-design risk for a 150-puzzle production. Tide tables, rain, sluices, slumping and multi-day beaches all build on the same readable water sim, so I'd greenlight Tidekeeper.</p>"}]},{"id":"R1-M4","stage":"R1","stageName":"Round 1","col":0,"a":"01-umbra","b":"04-stamp-roller","votes":{"a":0,"b":3},"combined":{"a":105,"b":112},"winner":"04-stamp-roller","loser":"01-umbra","cards":[{"judge":"designer","scores":{"a":[7,6,6,7,7],"b":[6,8,7,7,8]},"total":{"a":33,"b":36},"pick":"04-stamp-roller","quote":"set-union rules and real deduction; 4 of 6 Umbra levels are tiny dead-end-free mazes","persona":null,"html":"<p>Both solvers pass (par = BFS min on every level), and I replayed each hardest level (Keystone, Masterpiece) end to end in the browser with no JS errors. Umbra has the fresher premise, and its best moments come straight out of the rules: Parasol (push the crate toward the sun to carry your own shade) and Keystone (the freed crate's own shadow keeps the stone dark) are real understanding-driven ahas. But my own full-graph analysis shows First Light, Relay, Colonnade and Sunlock are tiny, fully reversible mazes: 48–101 states, zero dead ends, branching about 2.3, and Sunlock has 208 optimal paths in 58 states. Because the UI greys out illegal sun turns, those four levels can be solved by wandering. Only Keystone (1,851 states, 8 optimal paths) asks for a real plan, and the hand-tuned 3-wide diagonal wedge is an inelegant rule the player has to memorise. Stamp Roller's rules are cleaner (pigment as set-union, stamps as OR), and its levels teach structural facts about the die: a straight roll prints a period-4 ring, side faces stay dry, and the blueprint is the die's net. Masterpiece is excellent deduction: four straight rolls return the die to identity, so every corner of the frame is the bottom face and every side midpoint is the top face, which pins the whole loading (U=R, D=Y, N/S=P, E/W=O) before you move. That level has 5M states and only 2 optimal routes. Its risks are a well-worn genre (rolling-die puzzles), rote orientation tracking during long loading phases, and instant smudge dead ends. Even so, it shows far more depth per rule and a proven difficulty ceiling, while Umbra shows a lovely theme on boards too thin to test it.</p>"},{"judge":"player","scores":{"a":[8,6,7,7,7],"b":[6,7,8,8,8]},"total":{"a":35,"b":37},"pick":"04-stamp-roller","quote":"Umbra levels are narrow corridors; Stamp's juice and readability win","persona":null,"html":"<p>I played Umbra levels 1 and 6 (Keystone) at par in the browser and traced level 2 by hand. I played Stamp Roller levels 1, 2, 5 and 6 (Masterpiece) at par. I also deliberately burned, blocked, smudged and undid moves, and saw no JS errors in either. Umbra has the fresher hook and the better mood: you turn the sun, the whole courtyard's shade swings with it, and the soundscape is lovely. Keystone is a real aha, because the crate's own shadow keeps the sunstone dark. But most moves are refused, and the non-crate levels have only 47–75 states, so Relay, Sunlock and First Light play like following the one open corridor, and poking at every legal move will solve them. Tall pillars also hide their own shadows in the 3/4 view (on First Light's first screen the whole shade strip sits behind the pillar). Stamp Roller is the one I'd keep playing. Every stamp pops with a splash and a rising note, the face compass and the landing chips on nearby tiles make die orientation readable, and the late levels (40k–5M states) need real planning. Masterpiece has the best moment in the match: you read the frame backwards and work out that the top face stays red, the bottom face must be washed and dipped yellow, the N/S faces take blue and the E/W faces take yellow. Then you watch the whole frame print in one lap. Rolling dice is a well-worn genre and the loading phases can drag, but the pigment-mixing blueprint and its expansion list (cuboids, twin dice, stencils, blotters) give it the stronger long-term fun loop.</p>"},{"judge":"producer","scores":{"a":[8,7,7,7,8],"b":[6,8,8,8,9]},"total":{"a":37,"b":39},"pick":"04-stamp-roller","quote":"Umbra has the better trailer hook, but its state spaces are shallow","persona":null,"html":"<h5>Reasoning</h5>\n<p>Umbra has the stronger trailer hook: \"you are a shadow, and you steer the sun\" is a fresh pitch with a marketable little character, and Parasol and Keystone (where the crate's own shadow keeps the key dark) are real aha moments. Its demonstrated depth is thin, though: four of its six levels have only 47 to 75 reachable states, and because moves into light are simply refused, a player can wander to a solution without insight. The designer admits real difficulty needs bigger boards, which run straight into the 3/4-view pillar occlusion and the approximated diagonal-wedge rule. Stamp Roller works in a more familiar rolling-cube genre, but stamping, pigment mixing and blueprint targets give it an identity, and Masterpiece (about 5M states, solved backwards from the frame to one die loading that prints it in a single lap) shows real planning depth. \"Any picture is a level\" is a scalable, marketable content pipeline for 150+ puzzles, the print run leaves a visible artwork as the payoff, and the face panel and landing chips already reduce the mental-rotation risk. Both prototypes ran with no JS errors and every par equals the solver's BFS minimum, so I'd greenlight the proven depth over the better hook with shallow puzzles.</p>"}]},{"id":"R1-M5","stage":"R1","stageName":"Round 1","col":0,"a":"12-reflection-pond","b":"02-warp-weft","votes":{"a":2,"b":1},"combined":{"a":105,"b":107},"winner":"12-reflection-pond","loser":"02-warp-weft","cards":[{"judge":"designer","scores":{"a":[4,6,7,6,8],"b":[8,7,6,7,7]},"total":{"a":31,"b":35},"pick":"02-warp-weft","quote":"fresh inverse-weaving; Pond's final level is offset shuffling","persona":null,"html":"<p>Judge: designer (veteran puzzle designer)</p>\n<h5>Reasoning</h5>\n<p>Reflection Pond is a well-made example of a familiar genre: two walkers share one input, each world has its own walls, and you desync them by leaning on those walls. The \"up is down\" mirror is purely visual, because the engine moves both walkers in the same logical direction. So the whole puzzle is managing an offset vector, and the desync-by-wall ahas in L1 to L3 are well known. The crate that needs room in both worlds and the pad pinned against a reed are its genuinely good rules. Moonrise has one real backward-reasoning insight: the crate at (1,3) stops the pad, so the pad can later pin at (0,2) against the reed and hold the moon. The rest of its 34 moves is offset shuffling, and the design doc admits that invites trial and error. The expansion list (fish, wind, ice, night, rain...) is mostly generic bolt-ons, not consequences of the core rule.</p>\n<p>Warp &amp; Weft is a fresh inverse problem: factor a cloth into a threading and a lift plan, where cells with matching warp and weft colours are free. Its one extra rule, the float limit (a Takuzu-style run cap in both axes), is what turns the free cells into deduction. Without it, Houndstooth has 24 solutions and Coverlet has 27. With it, each has exactly one. I checked Coverlet's hidden rows by hand, and the chain is real logic, not search. Row 4's horizontal float forces shaft 4 up. Shaft 4 is then up for three rows running, so it can't lift in row 5, which rules out indigo there. Cream fails on its own row because five threads in a row would float. Its weaknesses are real: L1 and L2 are rote grouping of identical columns, the three linked grids are dense, and cell-by-cell mismatch dots allow some guessing. But its hardest level rewards understanding, and real weaving (tie-ups, treadle limits, overshot, double weave) gives it a coherent, non-arbitrary ladder of mechanics. Both prototypes ran without JS errors and their solvers verify every level; Warp &amp; Weft wins on depth per rule and freshness.</p>"},{"judge":"player","scores":{"a":[6,7,8,7,9],"b":[9,7,6,7,7]},"total":{"a":37,"b":36},"pick":"12-reflection-pond","quote":"more fun to play, readable","persona":null,"html":"<p>Reasoning: I played Reflection Pond L1 at par (8), then played L5 Lily Drift and L6 Moonrise all the way through in the live build (14 and 34 moves). Lily Drift has a real aha. You first walk down so your reflection shoves the pad against the reed. Then you come back, stand under the hedge and \"lower\" your reflection three rows onto the moon, where the pinned pad holds it while you walk to the lantern. Moonrise stacks that idea: you use the crate as a stopper to re-park the pad a row higher, then return the crate so it can hold you. That is clever, though at 34 moves it is hard to plan ahead. The watercolor art is gorgeous, the dotted \"in-sync\" ghost rings make desyncs readable, and arrow-key play feels instant; it is the one I'd keep playing. Warp &amp; Weft is the fresher idea: weaving-draft reverse-engineering with float-limit and hidden-weft deductions (Coverlet's chain is a real Picross-style logic puzzle), and the woven swatch payoff is lovely. Moment to moment, though, it's three linked dense grids. Once you've grouped the columns, the lift plan is mostly transcription. Mid-solve the cloth fills with pulsing red float warnings. A small bug: the status line goes stale on level change, e.g. \"threaded 0/8\" on a 16-column pattern. Both have deep expansion lists. For pure fun, readability and feel, Reflection Pond edges it.</p>\n<p>Note: tools/play.mjs has a syntax error (a mangled regex on line 14), so I drove both games with a fixed copy in my scratchpad.</p>"},{"judge":"producer","scores":{"a":[6,7,8,7,9],"b":[9,7,6,7,7]},"total":{"a":37,"b":36},"pick":"12-reflection-pond","quote":null,"persona":null,"html":"<p>Warp &amp; Weft has the more distinctive concept. Reverse-engineering a loom setup from a finished cloth is something I've never seen shipped. Coverlet is a real deduction chain: for a row that shows only warp colours, float limits in the row and in the column settle its hidden weft. Historic drafts also give it a deep, authentic content well. As a greenlight, though, it carries onboarding and appeal risk. The player juggles three linked grids plus weaving vocabulary, the game depends on colour, and a lot of each level is clerical: spot the identical columns (Coverlet has exactly 4 visual classes for 4 shafts), then click in 16 rows of lifts. That makes a hard trailer and a niche audience. Reflection Pond reads from a single GIF: you walk the bank while your reflection walks the pond upside-down, in charming watercolour. Its levels have clean ahas. In Hedgerow you lean on hedges to build an x offset and then a depth offset. In Lily Drift you pre-push the pad so it pins against the reed and holds your reflection on the moon. The BFS solver checks every par and runs ablations (removing one mechanic at a time to show each is required), which lowers the risk of producing 150+ levels. Its weaknesses are real but fixable in design: the twin-control idea is a known trope, many cells go dead while the pair is in sync, and the 34-move finale invites undo-spam. Overall it's the safer, broader package with the stronger trailer hook, so it gets the greenlight by a narrow margin.</p>"}]},{"id":"R1-M6","stage":"R1","stageName":"Round 1","col":0,"a":"11-mycel","b":"06-inkgrain","votes":{"a":0,"b":3},"combined":{"a":107,"b":117},"winner":"06-inkgrain","loser":"11-mycel","cards":[{"judge":"designer","scores":{"a":[6,6,7,6,8],"b":[8,7,8,8,8]},"total":{"a":33,"b":39},"pick":"06-inkgrain","quote":"grain-following creates directional junctions, so insights come from understanding the rule; Mycel is bookkeeping","persona":null,"html":"<p>Checks run: both solvers pass (Inkgrain has a unique ink placement on sheets 2-6; Mycel has exact-minimum budgets, but 41, 8 and 12 winning networks on levels 1, 2 and 4, and a greedy meal-grabber beats level 3). I solved both finales in the browser (Inkgrain 木 by clicks, Mycel Wood Wide Web through its debug hooks) with no JS errors. Screenshots are in <code>bracket/shots/R1-M6-designer-*</code>.</p>\n<h5>Reasoning</h5>\n<p>Inkgrain gets a lot of depth from very few rules. \"Liquid moves only along the grain of the cell it is in\" makes one-way junctions appear on their own, and the finale's aha comes from understanding that rule, not from counting. The felt heart can't feed the diagonal branches, but a branch can feed the heart, so the 7 has to start in a branch. Beside that, one water turns a corner to guard two leaks, and the 1 lands on both diagonal ends with zero reach left. The sheets teach distinct ideas: dried ink as a wall, a 0-drop as a plug, a felt hub as either a shield or a trap. When you solve a sheet, the kanji appears as a brush stroke with a seal. The theme is the logic. Mycel is polished and its crystal-surround rule is a good Go-like idea (Smother's rock-sealed crystals and shared sides are a real insight). Underneath, though, it is exact-change Steiner optimisation: the cap levels are bookkeeping about spending before you eat, several levels have many valid networks, and its own notes admit that trial-and-undo replaces planning. Inkgrain also has a flaw: the full hover preview invites search, so it needs a peek limit or preview off by default. Even so, its expansion list (swelling fibres, folding, sized paper, two inks, gold leaf) extends the physics coherently, and kanji chapters give 150 sheets a natural difficulty ramp. Mycel's list leans toward systems bloat (rival fungus, insects, floods, seasons).</p>"},{"judge":"player","scores":{"a":[6,7,8,8,9],"b":[8,7,9,8,8]},"total":{"a":38,"b":40},"pick":"06-inkgrain","quote":"real spatial ahas plus a calligraphy payoff; Mycel is exact-budget counting","persona":null,"html":"<h5>Reasoning</h5>\n<p>I played both with scripted input and hit no JS errors. Mycel: I solved First Thread and then Wood Wide Web on my first plan, spending all 22 and finishing with 0 left. The trick was holding log b back as a reserve and closing the in-stream crystal only once my store had room. I also checked that the Brimful \"4 lost\" waste feedback reads clearly. Mycel is gorgeous and very readable, with glowing threads, a live nutrient preview, and crystal notches. But its core is exact-budget cell counting (a Steiner tree), so its \"aha\"s feel like resource arithmetic, and a level takes around 27 clicks. Inkgrain: I solved 一, 山 and 木. I also blotted 山 on purpose by inking the right leg into the felt corner. Its \"aha\"s are spatial, and they feel better. The 5 on 山 has one spot where both runs end exactly on the peaks. On 木, one-way diagonals let a 7 climb from a branch into the felt heart and flood the whole character, ending exactly at the foot, while water turns a corner to guard two leaks. You only drop 2–4 per sheet, each drop matters, and the ink bleeding along the grain into a finished kanji with a hanko stamp is a far stronger payoff than any moment in Mycel. The kanji chapters also give it a natural spine for 150 sheets. Inkgrain's real flaw is that the full hover preview makes small sheets easy to brute-force. Even so, it is fresher and more delightful to play, and it's the one I would tell friends about.</p>"},{"judge":"producer","scores":{"a":[6,7,7,8,8],"b":[8,7,8,7,8]},"total":{"a":36,"b":38},"pick":"06-inkgrain","quote":"strongest trailer hook, the grain-wicking kanji; Mycel is a competent budget-network puzzle","persona":null,"html":"<p>Evidence: I ran both solvers, and every level in both games verified. I played Mycel 6 (Wood Wide Web) by real clicks to a 0-spare win and saw the \"5 nutrients lost\" cap feedback when I ate the log too early. I played Inkgrain 6 (木) by keyboard to a clean win. Neither game threw JS errors. I worked through Mycel 4–6 and Inkgrain 3 and 6 in my head.</p>\n<p>Reasoning: Mycel is the safer production bet. It is a budgeted node-weighted Steiner tree with meals and a store cap. Its solver can tune every budget to exactly enough, so a team could turn out 150 tight levels cheaply, and \"arrive hungry\" / \"spend first, eat second\" are real ordering ahas. But the design doc admits the theme sells the feel more than the logic. In a trailer it reads as a pretty glowing network-on-a-budget puzzle: the arithmetic is heavy, and many near-equal solutions make it feel like optimizing more than discovering.</p>\n<p>Inkgrain has the hook I would greenlight. Ink wicks along the paper's grain, and every solved sheet ends as a brushed kanji with a seal stamp, which is the money shot for a trailer. It also gives the game a natural progression, from 一 up to compound characters, and a collection meta. Its levels have one unique placement each and real ahas. On 山 the 5 has one spot where both runs stop exactly on the peaks. On 木 the branches can feed the felt heart but the heart can't feed them, and the two waters plug the leaks. Its twist list (bleach, sized paper, swelling fibres, two inks, folding, gold leaf) all comes from the same ink-and-paper physics, so it is coherent.</p>\n<p>Its production risks are real. The full hover preview invites search, grain fields are harder to author, and big boards are unproven. I still judge them fixable design problems rather than a ceiling on the concept, so Inkgrain gets the greenlight.</p>"}]},{"id":"QF1","stage":"QF","stageName":"Quarterfinal","col":1,"a":"08-tidekeeper","b":"07-topple-town","votes":{"a":3,"b":0},"combined":{"a":116,"b":102},"winner":"08-tidekeeper","loser":"07-topple-town","cards":[{"judge":"designer","scores":{"a":[7,8,7,7,8],"b":[5,6,8,5,8]},"total":{"a":37,"b":32},"pick":"08-tidekeeper","quote":"one water rule, understanding-based insights; Topple is height-assignment permutations","persona":null,"html":"<p>Evidence: I ran both solvers. All levels pass, and each game's minimum or unique solution matches its brute-force check. I drove both finales in the browser with no JS errors. Tidekeeper L6 gave \"Every creature is happy\" with (2,4)+1, (5,4)-1, (5,7)-1, (3,8)+1. Topple Town L6 rang the bell in 19 beats. I also simulated all 6 ways to assign heights to Topple Town L6's three gaps.</p>\n<p>Reasoning: Tidekeeper gets its depth from one physical rule: water settles to the lowest rim along a 4-connected spill path. The creatures read that terrain in two different ways. The castle cares where the high tide reaches, while fish, octopuses and crabs care what water stays behind, and the sand bucket ties far-apart goals together. Its insights come from understanding the rule, not from trying things: the plug must be exactly 1 or the crab floods, corners that touch diagonally are watertight, a crab sitting on the spillway forces you to build a wall inward, and crabs can drain through each other. Spring Tide (unique, 4 scoops) chains these into a real aha: sealing the castle strands the octopus, so you dig a new inlet, and that dig pays for the castle plug. Topple Town is lovely to watch and very well made, but it belongs to the Pushover/domino-rally genre, and its levels mostly come down to \"fill the obvious gaps with the right piece.\" The finale, Photo Finish, is really a 6-way assignment of heights to three visible gaps. Putting the fast pieces on the route that has to be fast nearly solves it, and the headline tie-crumples-the-gate rule never comes up in any of the six assignments, so it rewards counting beats and trying options more than insight. For a 15-hour game, Tidekeeper's expansions (tide tables with carry-over, sluice gates, multi-day beaches, rain) deepen the same water rule. Topple Town's list (springs, conveyors, turntables, pressure plates) is a pile of Incredible Machine gadgets, and the designer admits its mechanic set is thin.</p>"},{"judge":"player","scores":{"a":[8,7,7,8,8],"b":[6,7,8,7,7]},"total":{"a":38,"b":35},"pick":"08-tidekeeper","quote":"Topple is spectacle but obvious gap-filling; Tidekeeper's finale needs a real multi-step deduction","persona":null,"html":"<p>Played both in headless Edge (screenshots in <code>bracket/shots/QF1-player-*.png</code>). Tidekeeper: failed Beach 1 on purpose, then solved it. Solved Beach 6 \"Spring Tide\" on paper (seal the castle door, dig a new inlet at exactly 3, let the crabs drain through each other into the fish pool), and it won on the first in-game try. Topple Town: solved L1. On L6 \"Photo Finish\" I ran a wrong plan (marble reached the gate early and stalled, exactly as I had predicted) and then the correct plan, which won in 19 beats. Both solvers confirm the finales have unique solutions. Neither game threw a JS error.</p>\n<p><strong>Reasoning.</strong> Topple Town is the better toy. The chain reaction, clacks, bell and slow-motion final ring are a real joy to watch, and Marble Run's \"park the marble, then re-kick it\" is a lovely trick. But its puzzles mostly ask \"which piece goes in which obvious gap\". The finale has three gaps and three pieces, so trial and error costs about six 6-second replays and the deduction never becomes necessary. It is also fiddly to control: in the tilted view I twice placed pieces one row off, and clicking the upper body of a block places a piece on the cell behind it instead of selecting the block. Tidekeeper's rule, that water fills to the lowest rim, is instantly intuitive and physical. Its finale is a genuine multi-step deduction: 49 editable cells, 2.5M beaches brute-forced, one answer. The per-creature verdict bubbles (\"never reached\", \"drained dry\", \"trapped in pool\") make failures readable and fixable rather than confusing. Its weaknesses are an early game that is too easy with several equivalent answers, and a numeral-heavy oblique view that is less juicy. Still, basins, spill points and a growing roster of creatures with different needs are a deeper, fresher well for 150 puzzles than domino routing. For 15 hours I would keep playing and recommend Tidekeeper.</p>"},{"judge":"producer","scores":{"a":[8,8,8,9,8],"b":[6,7,8,6,8]},"total":{"a":41,"b":35},"pick":"08-tidekeeper","quote":"distinctive cozy hook; dominoes are a familiar genre","persona":null,"html":"<h5>Reasoning</h5>\n<p>Both prototypes run without errors, and both solvers verify every level. I played Spring Tide (Tidekeeper L6) through a failed tide and then the unique 4-scoop solution, and Photo Finish (Topple Town L6) with a wrong height permutation and then the correct one. Topple Town has the more obvious trailer moment: a whole town toppling in a chain reaction reads instantly and appeals widely. But domino chains are a well-worn genre. In its levels, the three pieces go into three visible gaps, so a player can simply try the six permutations. The designer also admits that beat counting is invisible and the mechanic set is thin for 15 hours. Tidekeeper's cozy \"sculpt the beach, then release the tide\" hook is more distinctive on Steam. Its hardest beach gave a real chain of deductions: sealing the castle strands the octopus, so the inlet has to move to exactly height 3, the crabs drain through each other, and the empty bucket forces you to dig first. Its water-physics expansion list (tide tables, rain, springs, sluices, slumping, erosion, multi-day beaches, new creature constraints) grows naturally out of one readable rule, so it can produce 150+ escalating puzzles at lower design risk, provided grids stay small and a top-down view fixes the oblique-view readability. Greenlight Tidekeeper.</p>"}]},{"id":"QF2","stage":"QF","stageName":"Quarterfinal","col":1,"a":"09-foldmap","b":"12-reflection-pond","votes":{"a":3,"b":0},"combined":{"a":119,"b":100},"winner":"09-foldmap","loser":"12-reflection-pond","cards":[{"judge":"designer","scores":{"a":[8,8,8,7,8],"b":[5,6,7,6,8]},"total":{"a":39,"b":32},"pick":"09-foldmap","quote":"paper-physics insights; Pond is a familiar twin-walker","persona":null,"html":"<p>Foldmap has one verb, and every aha falls out of the physics of that verb rather than out of a new object. The back is part of the map. The last flap lands on top. Folding a face over twice turns it 180 degrees. Folding over twice is folding under. Uneven stacks lock creases. I solved Here Be Dragons in my head: the quick v1 fold reveals Dunmore and the serpent together, and the fix is to realise that col 0's back has to land last. Pocket Atlas (4 folds, 1 winning layout out of 1,472 four-fold sequences) has a lovely trap. One fold links the route, but then it can't be pocketed. The real solution keeps the whole route face down until the final fold flips it into view, and that is a planning-backwards insight, not a lucky click. Reflection Pond is a clean, well-made synced-twin walker, a well-worn genre. Its core idea, building an offset against a one-world blocker and carrying it, is sound. I solved Lily Drift by reasoning (hedge used twice, pad pinned between reed and moon). But each new idea is an added object rather than an emergent consequence. Its hardest map, Moonrise, is a 34-move BFS line that drags a crate out and back to act as a pad stopper, which reads more like search than understanding. Foldmap's real risk at 15 hours is the mental cost of simulating mirrored backs, which could push big maps toward undo-spam. Even so, its expansion list (mountain/valley creases, windows, tracing paper, diagonal creases) grows the same paper physics. Pond's list (wind, ice, night, fish, moonphase) is mostly bolt-on gimmicks, so Foldmap has the higher ceiling for deep, non-repetitive content.</p>"},{"judge":"player","scores":{"a":[8,8,9,8,8],"b":[5,6,7,7,8]},"total":{"a":41,"b":33},"pick":"09-foldmap","quote":"plan-backwards reveals, tactile; Pond finale is a 34-move shuffle","persona":null,"html":"<p><strong>Reasoning.</strong> I played both games in the browser. Foldmap gave me the biggest laugh-out-loud moment of the match. In Washed Out, the fold flips the map, and the blue back side patches the broken road. In Pocket Atlas, the obvious first fold links all three towns but leaves the map too big to pocket. The real solution hides every town mid-sequence, and the route shows up rotated 180° only on the final crease. That is a proper plan-backwards \"aha\", and the 3D fold animation, the hover preview, the peek at the underside and the \"Route Charted\" stamp make every fold feel tactile and rewarding. Its weaknesses are real. Mirrored backs demand heavy mental simulation. Small maps have few legal folds, so you can click your way through. Picking a crease uses distance only, not drag direction, so dragging in a corner cell sometimes grabbed the wrong line. Reflection Pond is lovely and very readable: watercolor art, ghost rings, and a pebble glide that works nicely. But its core is the familiar twin-walker trick, where one input drives two avatars with different walls. Its hardest level, Moonrise, is a 34-move shuffle that pushes a crate away and then back, which pushed me toward undo-grinding instead of insight. Foldmap is the concept I'd happily sink 15 hours into, because the expansion list (slits, tracing paper, mountain and valley creases, two-sided goals) keeps changing what a fold means.</p>"},{"judge":"producer","scores":{"a":[8,7,8,7,9],"b":[6,7,7,7,8]},"total":{"a":39,"b":35},"pick":"09-foldmap","quote":"more distinctive hook, and it can grow in ways only paper allows","persona":null,"html":"<p>Judge persona: games producer/publisher deciding which concept to greenlight into a full ~15-hour commercial puzzle game.</p>\n<h5>What I checked</h5>\n<ul><li>Read both DESIGN.md files and the core engine and level data. Ran both solvers: every par is verified. Foldmap's hardest map, Pocket Atlas, is 4 folds with 1,647 reachable states. Reflection Pond's Moonrise is 34 moves with 15,414 states, and its ablations show every mechanic is needed.</li><li>Took screenshots and drove both games in headless Edge with no JS errors. For Foldmap I played the Pocket Atlas solution through to the win card, plus Here Be Dragons with the hover or arrow-key fold preview. For Reflection Pond I played the full 34-move Moonrise to the win card.</li><li>Worked through the solutions by hand. Pond: Still Water, Hedgerow (lean on a hedge to set a 2D offset) and Moonrise. Foldmap: Here Be Dragons (fold order is stacking order) and Pocket Atlas (the route across the back of the west edge and the front of the middle only appears on the last fold, so you have to plan backwards).</li></ul>\n<h5>Reasoning</h5>\n<p>Foldmap has the stronger hook. A vintage road map printed on both sides, folded by hand, with the route showing up on the last crease and a \"Route Charted\" stamp, reads instantly in a GIF or trailer. Reflection Pond's synced twins who drift apart when one is blocked is lovely to look at, but the mechanic is a well-known puzzle staple. Foldmap also gets a different insight out of each of its six maps (the back counts, the last fold is on top, folding twice turns a face 180°, stacking order, folding over twice is folding under, plan backwards). Reflection Pond keeps coming back to one idea, \"build an offset, then carry it,\" and its 34-move finale invites trial and error with undo, as its own design notes admit. Reflection Pond is the lower-risk build: grid levels are cheap to author and certain to scale. Foldmap's risks are real: solutions are shallow, few folds are legal at once so small maps can be brute-forced, and simulating mirrored backs in your head is heavy. Still, its expansion list is made of rules only paper can have (punched windows, tracing paper, mountain/valley creases, diagonal flaps, tearing), and that gives more non-repetitive runway for 150+ puzzles than Reflection Pond's more generic ice, wind and night additions. I'd greenlight Foldmap.</p>"}]},{"id":"SF1","stage":"SF","stageName":"Semifinal","col":2,"a":"06-inkgrain","b":"09-foldmap","votes":{"a":1,"b":2},"combined":{"a":120,"b":119},"winner":"09-foldmap","loser":"06-inkgrain","cards":[{"judge":"designer","scores":{"a":[8,7,8,7,9],"b":[7,9,8,8,8]},"total":{"a":39,"b":40},"pick":"09-foldmap","quote":"every Foldmap insight comes from paper physics; Inkgrain's reach-counting is done by the preview","persona":null,"html":"<p>Inkgrain is beautifully executed. It has a real idea in per-cell grain, which makes every junction one-way, so on 木 the flood has to start in a branch because the felt heart can't feed the diagonals. But much of each puzzle comes down to reach-counting, such as finding the cell where both runs of the 5 stop exactly on the peaks of 山 or giving the 7 exactly enough reach for the trunk. The full hover preview hands that counting to the player anyway, and its expansion list reads like a catalogue of new tiles rather than consequences of the core rule. Foldmap's rules come from a single physical action, and every lesson in it is a truth about paper, not about the level author's layout: the last fold lands on top, folding a face over twice brings it back up turned 180°, folding over twice is folding under, uneven stacks lock creases, and whatever faces the table on the final flap will face you. Pocket Atlas, the hardest map, needs a real backward plan and rewards it with a route that only appears on the last fold. Its planned additions (windows, tracing paper, arrows that mirror when flipped, two-sided goals) build on its layering and mirroring, so the space can grow without bloat. Its risks are real: small maps have 10 or fewer legal folds and can be clicked through, Paper Trail and Paperama are precedents, and mirrored backs are hard to simulate in your head. Still, it offers more depth per rule for a 150-puzzle game, so it takes the match narrowly.</p>"},{"judge":"player","scores":{"a":[8,7,9,8,9],"b":[6,7,8,8,9]},"total":{"a":41,"b":38},"pick":"06-inkgrain","quote":"clearer rules, joyful payoff; Foldmap is close to Paper Trail (2024)","persona":null,"html":"<p>Both are gorgeous and bug-free (no JS errors, and I scripted wins on the first and last level of each). What decides it for me as a player is how the moment-to-moment feel compares.</p>\n<p>Inkgrain's rules are clear the moment you hover: ink follows the grain, dried ink is a wall, and a leak is a red notch. Every drop gets a small, readable \"aha\", and the 木 finale makes you work it out properly. The heart can't feed the branches, so you have to flood from a branch and pair the two waters off against the four leaks, one turning a corner and the other arriving with zero reach. The solver agrees there is exactly one solution. The blot thud and the strokes merging into one brushed kanji with a seal stamp is the most satisfying payoff in this match, and the fibre/water/wax toolkit plus the expansion list (bleach, combed fibres, two inks, stroke-order chapters) can plausibly fill 150 sheets.</p>\n<p>Foldmap's 3D folds, peek and \"Route Charted\" stamp are lovely too, and Pocket Atlas is a real work-backwards spatial aha. But the mirrored-back mental simulation is heavy, and there are only about one to ten legal folds per state (level 1 falls to a single click), so a stuck player can click around until something works. It also sits close to Paper Trail. Its \"aha\" feels more like homework and less like a click.</p>"},{"judge":"producer","scores":{"a":[9,7,8,8,8],"b":[7,8,9,8,9]},"total":{"a":40,"b":41},"pick":"09-foldmap","quote":"Foldmap is the safer greenlight and universally legible; Inkgrain's preview enables hover-solving","persona":null,"html":"<p>Inkgrain has the fresher hook. Ink bleeding along paper grain into a kanji that gets stamped with a seal makes a gorgeous screenshot, it has no obvious Steam comparable, and kanji chapters give it a natural content pipeline. Its mental plays hold up: in 木 the 7 has to start in a diagonal branch, because felt can't feed diagonals, and it must reach the bottom of the stroke with zero reach left. That is a real \"aha\". Still, its insights mostly come from one family: count reach and manage leaks. The default full preview shows the exact result of each drop, blots included, so the hardest sheet turns into a guided hover-search. That is a core-loop problem the team hasn't solved yet.</p>\n<p>Foldmap is the safer greenlight. Everyone understands \"fold the road map so the towns connect\", a 3D fold reads instantly in a trailer, and its six maps each teach a different spatial idea:</p>\n<ul><li>the back is part of the map</li><li>the last fold lands on top</li><li>a double fold comes back rotated</li><li>fold order is stacking order</li><li>folding over twice is folding under</li><li>plan backwards</li></ul>\n<p>It already mixes three goal types (link, hide, fit). Its twist list (windows, tracing paper, orientation goals, multiple networks) changes what you can see and what counts as the goal, not just how the paper behaves. I checked the solutions by hand and in the harness. Pocket Atlas, where the route stays hidden until the fourth fold, is the best single puzzle across both prototypes. Its risks are real: it sits close to Paper Trail, the mirrored backs are heavy to simulate in your head, and small maps can be clicked through. Even so, broader appeal, more varied insights and a very clear, polished UI outweigh Inkgrain's edge in freshness for a 15-hour commercial game.</p>"}]},{"id":"SF2","stage":"SF","stageName":"Semifinal","col":2,"a":"04-stamp-roller","b":"08-tidekeeper","votes":{"a":1,"b":2},"combined":{"a":120,"b":120},"winner":"08-tidekeeper","loser":"04-stamp-roller","cards":[{"judge":"designer","scores":{"a":[7,8,8,8,9],"b":[8,7,8,7,8]},"total":{"a":40,"b":38},"pick":"04-stamp-roller","quote":"each level teaches rolling-cube truths; Tidekeeper decomposes into local fixes","persona":null,"html":"<p>Both entrants are solver-verified, and I scripted both hardest levels to a win with no JS errors. Tidekeeper has the more elegant rule: water settles at the lowest rim between it and the sea, and a basin floods only if that rim is below the peak. Spring Tide chains its ideas nicely: seal the castle, dig a new inlet at exactly 3, and let the crabs drain through each other. But most beaches split into independent one-scoop fixes (Corner Cases is three separate patches), the play is comparing numbers on a static heightmap with a free preview, and the doc itself admits that larger grids become search. Stamp Roller's six levels teach a real theory of the rolling cube, one \"aha\" of understanding at a time: faces return every fourth tile, the sidestep, the blueprint as the die's net, side faces riding safely on a straight line, a stripe as a ring of four. Masterpiece has you reduce a 15-tile frame to one six-face loading, working backwards. The loading phases do lean on mental rotation, but its expansions (rotation-sensitive stamps, 1x1x2 rollers, side-face wall canvases, stencils, wax) keep deepening the core question of which face touches where. Tidekeeper's list leans on bolted-on simulation (erosion, wind, slumping), so Stamp Roller is the better base for 150 puzzles.</p>"},{"judge":"player","scores":{"a":[7,8,9,8,9],"b":[9,8,8,9,8]},"total":{"a":41,"b":42},"pick":"08-tidekeeper","quote":"intuitive and charming, deduction-driven ahas; Stamp weighed down by rotation-tracking","persona":null,"html":"<p>Stamp Roller is the better toy to push around: the roll animation, squash, stamp chimes and neighbour chips (which show the face that lands next) all feel great, and working out the U=R, D=Y, N/S=P, E/W=O load for Masterpiece before printing its 15-tile frame in one lap was a genuine aha. The rest of each level drags, though: 23–31-move solutions, long loading phases and constant mental cube rotation are the classic rolling-cube fatigue I'd expect to wear thin over 15 hours, and the genre feels familiar even with the pigment twist. Tidekeeper is fresher and more inviting: water behaves the way you expect, the creatures are charming, and per-creature bubbles like \"never reached\", \"drained dry\" and \"trapped in pool\" turn each failed tide into a clue rather than a punishment. Spring Tide is a Witness-grade deduction where each of the four scoops does double duty: seal the castle, move the inlet down to exactly 3, dig first to fill the bucket, then pile and dig so the trapped crab drains into the fish pool. Its vocabulary of depth-specific creatures, tide tables, rain, sluices and multi-day beaches looks like the stronger engine for 150+ short, elegant, varied puzzles. It's less tactile, and the oblique view leans on numerals for heights, but it's the one I'd keep playing and tell friends about. (Played Stamp Roller 1, 2, 4, 5, 6 and Tidekeeper 1 and 6, including failed tides, with no JS errors in either. I used a patched copy of tools/play.mjs because the checked-in one has an invalid regex on line 14.)</p>"},{"judge":"producer","scores":{"a":[7,8,8,7,9],"b":[8,8,8,8,8]},"total":{"a":39,"b":40},"pick":"08-tidekeeper","quote":"cozy, intuitive, wider audience; Stamp's mental rotation raises the barrier","persona":null,"html":"<p>Verification: both solvers pass and their pars and scoop limits match (Stamp Roller L6: 31 moves after searching 5M states. Tidekeeper L6: 4 scoops with a unique solution, cross-checked by brute force). I played both hardest levels to a win in a headless browser with no JS errors. I also played a naive Spring Tide attempt: it failed correctly, and each creature got a label saying why.</p>\n<h5>Reasoning</h5>\n<p>Stamp Roller is the more polished prototype and has the prettiest payoff. In Masterpiece the whole 15-tile frame turns out to be one die state (top red, bottom yellow, N/S purple, E/W orange), because every 4-roll leg brings the die back to the same orientation. That is a lovely \"aha\", and the finished frame would look great in a trailer. As a greenlight decision, though, it has three problems. Die-rolling puzzlers are a crowded, well-known subgenre. The core skill is mental rotation, which filters out a large share of the mainstream audience. And its structure front-loads long, fiddly loading phases (16 of Masterpiece's 31 moves) before the fun print run, while the packed-state solver is already at 5M states on a small board, so bigger blueprints are a real authoring risk. Tidekeeper's hook is fresher and more broadly appealing: cozy beach, cute creatures, and physics that everyone already understands (water settles to the lowest rim). Its build-then-release-the-tide loop gives a \"moment of truth\" that works in a trailer, and Spring Tide still delivers a real multi-step insight: move the door, dig the inlet to exactly 3, and let the crabs drain through each other, all with only 4 scoops. Its puzzles are small, quick to author and solver-verified. The expansion list (tide tables, sluice gates, rain, slumping, multi-day beaches) keeps changing the simulation rather than just adding objects. The risks are a flat, number-heavy oblique view and a stated plan of only 96 beaches. Both are fixable, which makes Tidekeeper the lower-risk, higher-reach 15-hour game.</p>"}]},{"id":"FINAL","stage":"FINAL","stageName":"Final","col":3,"a":"09-foldmap","b":"08-tidekeeper","votes":{"a":1,"b":4},"combined":{"a":187,"b":200},"winner":"08-tidekeeper","loser":"09-foldmap","cards":[{"judge":"designer","scores":{"a":[6,8,8,8,8],"b":[7,6,8,7,9]},"total":{"a":38,"b":37},"pick":"09-foldmap","quote":"Tidekeeper is local height arithmetic","persona":null,"html":"<p>Both run bug-free (solvers verified; I played Pocket Atlas and Spring Tide to wins in-browser), and Tidekeeper is the more legible, better-finished toy, with water filling to the lowest rim and a great moment of truth when the tide comes in. But its insights are mostly local height arithmetic (plug exactly 1, pile twice, one diagonal seal): even Spring Tide splits into three nearly independent fixes, and its own designer admits big beaches become search. Foldmap's handful of rules, all taken from real paper, keep producing conceptual truths: the back is part of the map, the last fold's underside comes up, a double flip is a 180° turn, folding over twice folds under, and Pocket Atlas makes you plan backwards. When I sketched ten late-game puzzles for each, only Foldmap's surprised me: parity locking which side a cell can ever show, overhangs that make a crease the base doesn't have, a tracing-paper road unioned with its own mirror image to form a junction, mountain creases that fold only once their region is turned over. Tidekeeper's extensions (gates, erosion, slumping, more creature thresholds) mostly add simulation rather than new ways of seeing. Foldmap's mental load is real and a full game needs a ghost preview, but it is the deeper design to spend 150 puzzles on.</p>"},{"judge":"player","scores":{"a":[9,8,7,7,8],"b":[7,8,9,8,9]},"total":{"a":39,"b":41},"pick":"08-tidekeeper","quote":"easy to read, small deductions, creature reactions","persona":null,"html":"<p>Reasoning: Foldmap is the fresher idea and has the bigger \"whoa\" moment. On Pocket Atlas, the obvious first fold links three towns but leaves the sheet 3x4, so you have to plan backwards. After four folds that each look like no progress, the 2x2 packet flips over, upside down and connected. The fold animation, hover ghost and \"Route Charted\" stamp feel tactile and lovely. As a player, though, I spent most of my Foldmap time trying to track mirrored backs and reversed stacks in my head. There are only a handful of legal folds, and nothing tells you whether you're getting closer, so I was tempted to click through options rather than reason. Over 15 hours that becomes tiring more often than it becomes an aha.</p>\n<p>Tidekeeper made me want to keep playing. The water physics make sense within seconds, the V preview and height numbers keep things readable, and every scoop is a small deduction. On Spring Tide, I sealed the castle door, dug a new inlet at exactly 4, raised the fish's spillway and dug the crab a drain, and I had to dig first because the bucket starts empty. I played it in the browser and it worked on the first try. Then came the tide, the creatures reacting one by one, and the confetti. Its failures also teach you something (\"Fish drained dry\" appears right on the creature), and the long list of water mechanics (rain, springs, sluices, erosion, new creatures) gives it clearer room to grow than folding does. This is the one I'd tell friends about.</p>"},{"judge":"producer","scores":{"a":[7,7,8,7,9],"b":[8,8,8,9,8]},"total":{"a":38,"b":41},"pick":"08-tidekeeper","quote":"rules every player knows, cheap-to-author mechanics, trailer-ready cozy hook; Foldmap is near Paper Trail","persona":"a producer/publisher deciding which concept to greenlight into a full ~15-hour commercial puzzle game.","html":"<h5>What I checked</h5>\n<ul><li>Both solvers pass: every Foldmap par is the BFS minimum, and every Tidekeeper scoop limit is tight and brute-force verified.</li><li>I drove both in headless Edge with no JS errors. In Foldmap I played Here Be Dragons, including the \"obvious\" fold that links the road but shows the serpent, and solved Pocket Atlas in 4 folds. In Tidekeeper I released an untouched Spring Tide and got clear per-creature failure labels (washed away, drained dry, trapped in pool), then solved it with the unique 4-scoop answer.</li></ul>\n<h5>Reasoning</h5>\n<p>Foldmap is the more polished prototype. The 3D paper fold, the drag-to-peek and the \"Route Charted\" stamp are gorgeous, and Pocket Atlas has a real aha: all three towns are hidden until the last fold turns them face up. But as a product, its core risk is built in. Tracking mirrored backs through 3–4 folds is hard work for most players, and each move offers only a few legal folds (the hardest map has 1,647 states), so many players will just click around until it works. It also sits close to Paper Trail's double-sided fold hook on Steam. Tidekeeper's rule is water filling to its lowest rim, which every player already understands, and that makes Spring Tide solvable by reasoning rather than guessing. You seal the castle's neck, cut a new inlet at exactly 3, plug the drain, and let the crabs drain through each other into the fish pool. Its expansion is cheap and wide. Creature goals (anemones, eels, starfish), tide tables, rain, sluices and multi-day beaches are all easy to author as heightmaps, with a solver that proves minimality. The cozy beach theme and the moment the tide comes in also make a stronger trailer for a broad audience. I'm greenlighting the concept with the lower design risk and more room to grow.</p>"},{"judge":"critic","scores":{"a":[6,7,8,6,8],"b":[8,8,8,8,9]},"total":{"a":35,"b":41},"pick":"08-tidekeeper","quote":"Foldmap's hook is Paper Trail's; lowest-rim pooling is fresh","persona":"a veteran indie puzzle critic. I weight originality relative to existing games and whether the game has an identity that would carry a memorable review.","html":"<p><strong>Precedents checked.</strong> Foldmap's central hook (fold the sheet so its printed back completes a path from A to B) is the hook of Paper Trail (Newfangled/Netflix, 2024), with A Fold Apart (2020) and Dudeney's classic map-folding problem nearby. Tidekeeper's nearest relatives are Wetrix/Aqua Aqua (real-time terrain-and-water), From Dust (a god sim), Sandcastle (Bubblebird, a cozy tide sandbox) and the \"trapping rain water\" algorithm. None of them turns lowest-rim pooling into a deterministic, minimum-move logic puzzle with creature constraints.</p>\n<p><strong>Reasoning.</strong> Foldmap has the stronger artistic identity. The vintage atlas, the engraver's serpent on \"Here Be Dragons\", the courier story and the \"Route Charted\" stamp would make a lovely review, and the Pocket Atlas finale is a real showstopper: I played it through, and nothing of the route shows until the fourth fold makes all three towns appear at once. But a critic's first line has to be \"Paper Trail with multi-layer map folding\". Its added ideas (stack order, fold-twice-to-tuck, lock rules on uneven stacks, fit-the-pocket) are real, yet they make mirrored-back simulation so heavy that the hardest map, with 1,647 states and nothing to go on until the last fold, turns into clicking around more than reasoning. Its own design notes admit this. Tidekeeper feels newer as a puzzle. On Spring Tide I followed the deduction step by step: seal the castle's door to 4, move the octopus's inlet to exactly 3, and let the two crabs drain through each other into the fish pool, with the budget forcing digs before piles. It is unique and solver-proven. Every step can be reasoned out, and the V preview, height numerals and per-creature verdicts (\"drained dry\", \"trapped in pool\") make it very readable. Its beach look is charming but more generic than Foldmap's. Still, its rule set (tide tables, rain, sluices, slumping, erosion, multi-day beaches) grows naturally into 150+ puzzles that can be reasoned out, so it is the better foundation for a 15-hour game, and it is the more original one.</p>"},{"judge":"newcomer","scores":{"a":[6,8,8,7,8],"b":[7,8,9,8,8]},"total":{"a":37,"b":40},"pick":"08-tidekeeper","quote":"Foldmap's later levels demand mental mirroring; the tide ritual and per-creature feedback let a newcomer reason their way to every solution","persona":"a casual, cozy-game player (Stardew, Unpacking, A Short Hike, Wordle, Monument Valley) who rarely plays hardcore puzzlers.","html":"<h5>Reasoning</h5>\n<p>Foldmap has the better first minute. On map 1 you fold once, the blue back swings up, and the road bridges the flood. The 3D drag-fold, paper-rustle sounds and \"Route Charted\" stamp are gorgeous, and Pocket Edition (\"fold it twice to tuck it under\") gave me a real clever moment. The trouble starts at Upside Down, and Here Be Dragons and Pocket Atlas make it worse: I had to simulate mirrored, 180°-turned backs in my head. The landing ghost shows where a flap goes but not what will face up. Pocket Atlas also deliberately hides every sign of progress until the fourth fold, so a casual player ends up clicking around, feeling stupid instead of smart. The concept also sits close to Paper Trail.</p>\n<p>Tidekeeper asks for more reading up front: a wall of rule text and a heightmap full of numbers, and the oblique view is too shallow to show height on its own. But everyone has dug a moat at the beach, so the physics feels intuitive. Releasing the tide is a calm, repeatable ritual, and it is the best feedback loop in this final. When you fail, each creature gets a bubble (\"never reached\", \"drained dry\", \"trapped in pool\") that tells you exactly what to fix, so you work toward the answer without guessing. The hardest beach, Spring Tide, is a unique 4-scoop solution. I solved it by breaking it into sub-problems one creature at a time, and it made me feel clever. Its expansion path suits a cozy 15-hour game: new creatures, tide tables, rain, multi-day beaches. Its extra mechanics add to the world instead of adding to the mental load. Both prototypes ran with no JS errors.</p>"}]}],"seeds":[{"seed":1,"slug":"06-inkgrain","score":117,"note":"3–0","bye":true},{"seed":2,"slug":"04-stamp-roller","score":112,"note":"3–0, +7","bye":true},{"seed":3,"slug":"08-tidekeeper","score":112,"note":"2–1, +2","bye":false},{"seed":4,"slug":"09-foldmap","score":111,"note":"3–0","bye":false},{"seed":5,"slug":"12-reflection-pond","score":105,"note":"2–1","bye":false},{"seed":6,"slug":"07-topple-town","score":103,"note":"3–0","bye":false}],"standings":[{"slug":"08-tidekeeper","tier":"champion","tierName":"Champion","run":[{"match":"R1-M3","stage":"R1","vs":"03-backstitch","won":true,"votes":[2,1],"pts":[112,110]},{"match":"QF1","stage":"QF","vs":"07-topple-town","won":true,"votes":[3,0],"pts":[116,102]},{"match":"SF2","stage":"SF","vs":"04-stamp-roller","won":true,"votes":[2,1],"pts":[120,120]},{"match":"FINAL","stage":"FINAL","vs":"09-foldmap","won":true,"votes":[4,1],"pts":[200,187]}],"lost":null,"avg":[7.5,7.4,8.1,7.9,8.3],"avgTotal":39.1,"scorecards":14,"seed":3},{"slug":"09-foldmap","tier":"final","tierName":"Runner-up","run":[{"match":"R1-M1","stage":"R1","vs":"10-orrery","won":true,"votes":[3,0],"pts":[111,105]},{"match":"QF2","stage":"QF","vs":"12-reflection-pond","won":true,"votes":[3,0],"pts":[119,100]},{"match":"SF1","stage":"SF","vs":"06-inkgrain","won":true,"votes":[2,1],"pts":[119,120]},{"match":"FINAL","stage":"FINAL","vs":"08-tidekeeper","won":false,"votes":[1,4],"pts":[187,200]}],"lost":{"

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070b11; color: #eef2f6; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", sans-serif; -webkit-font-smoothing: antialiased; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #boot { position: fixed; inset: 0; display: grid; align-items: center; padding: 7vw; background: linear-gradient(90deg,rgba(5,9,14,.96),rgba(6,10,16,.72) 42%,rgba(6,10,16,.08)),linear-gradient(0deg,rgba(5,9,14,.8),rgba(5,9,14,0) 40%),url('cover.png') center/cover; animation: boot-in .6s ease-out both; }
    #boot[hidden] { display: none; }
    .content { max-width: 540px; animation: rise .7s cubic-bezier(.2,.8,.2,1) .05s both; }
    .brand { display: flex; align-items: center; gap: 12px; color: #f2b45c; font-size: 13px; font-weight: 600; letter-spacing: .3em; }
    .brand::before { content: ''; width: 20px; height: 2px; background: #f2b45c; }
    h1 { font-size: clamp(44px,5.2vw,80px); font-weight: 800; margin: 18px 0 10px; letter-spacing: .02em; line-height: 1.05; text-shadow: 0 6px 30px rgba(0,0,0,.45); }
    .subtitle { color: #aeb9c4; font-size: 17px; font-weight: 500; margin-bottom: 40px; }
    button { font: inherit; font-size: 15px; font-weight: 600; color: #eef2f6; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 14px 26px; cursor: pointer; margin: 0 10px 14px 0; box-shadow: inset 0 1px 0 rgba(255,255,255,.1); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: background .16s ease, border-color .16s ease, transform .12s ease, box-shadow .16s ease; }
    button:hover { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.24); transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.16); }
    button:active { transform: translateY(0) scale(.98); }
    #enter { color: #1b1307; background: linear-gradient(#f6c270,#e8a84c); border-color: rgba(255,255,255,.28); box-shadow: 0 8px 24px rgba(242,180,92,.3), inset 0 1px 0 rgba(255,255,255,.55); }
    #enter:hover { background: linear-gradient(#ffd08a,#f2b45c); box-shadow: 0 10px 30px rgba(242,180,92,.42), inset 0 1px 0 rgba(255,255,255,.6); }
    button.secondary { background: transparent; border-color: rgba(255,255,255,.1); color: #c4ced7; box-shadow: none; }
    button:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 2px; }
    button:disabled { opacity: .5; cursor: wait; transform: none; }
    #progress { display: block; width: 100%; height: 6px; margin: 22px 0; border: 0; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); accent-color: #f2b45c; -webkit-appearance: none; appearance: none; }
    #progress::-webkit-progress-bar { background: rgba(255,255,255,.08); border-radius: 999px; }
    #progress::-webkit-progress-value { background: linear-gradient(90deg,#e8a84c,#ffd08a); border-radius: 999px; transition: width .25s ease; }
    #progress::-moz-progress-bar { background: linear-gradient(90deg,#e8a84c,#ffd08a); border-radius: 999px; }
    #progress[hidden] { display: none; }
    #status { line-height: 1.7; color: #f3d7aa; font-weight: 500; }
    .hint { font-size: 13px; color: #8e9cab; line-height: 1.9; }
    #detail { max-height: 150px; overflow: auto; white-space: pre-wrap; font-size: 12px; color: #ffb3a8; background: rgba(255,107,94,.08); border: 1px solid rgba(255,107,94,.3); border-radius: 10px; padding: 12px; }
    .version { position: absolute; bottom: 28px; left: 7vw; color: #5f6b79; font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
    .creator { position: absolute; right: 7vw; bottom: 22px; display: flex; align-items: center; gap: 12px; padding: 7px 18px 7px 7px; border-radius: 999px; color: #eef2f6; text-decoration: none; background: rgba(8,13,20,.72); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 30px rgba(0,0,0,.35); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: border-color .16s ease, background .16s ease, transform .12s ease; animation: rise .7s cubic-bezier(.2,.8,.2,1) .25s both; }
    .creator img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #0a0f16, 0 0 0 3.5px #e8a84c; }
    .creator-text { display: flex; flex-direction: column; gap: 3px; line-height: 1.1; }
    .creator-label { color: #f2b45c; font-size: 10px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    .creator-id { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
    .creator-handle { color: #c4ced7; font-weight: 600; }
    .creator-links { display: flex; gap: 8px; margin-left: 6px; }
    .creator-link { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #eef2f6; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16); transition: border-color .18s, background .18s, transform .18s; }
    .creator-link:hover { border-color: rgba(242,180,92,.8); background: rgba(242,180,92,.18); transform: translateY(-1px); }
    .creator-link:focus-visible { outline: 2px solid rgba(255,255,255,.6); outline-offset: 3px; }
    .creator-link svg { width: 16px; height: 16px; }
    @media (max-width: 760px), (max-height: 520px) { .creator { position: static; margin-top: 8px; width: max-content; max-width: 100%; } }
    @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #boot, .content { animation: none; } button { transition: none; } }

  <script src="index.js"></script>
  <script>
    const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":68193664,"index.wasm":38820072},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const engine = new Engine(config);
    const boot = document.getElementById('boot');
    const status = document.getElementById('status');
    const progress = document.getElementById('progress');
    const enter = document.getElementById('enter');
    const fullscreen = document.getElementById('fullscreen');
    const shellText = (en, zh) => window.ConvergenceLanguage.getLocale() === 'zh' ? zh : en;
    let startPromise = null;
    let running = false;
    let engineExited = false;
    let phase = 'idle';
    let progressPercent = 0;
    let loadedBytes = 0;
    let totalBytes = 0;
    let exitCode = 0;
    function getStatusText() {
      if (phase === 'error') return shellText('Loading failed. Reload this page or use a browser that supports WebGL 2.', '载入未完成，请重新载入或使用支持 WebGL 2 的浏览器。');
      if (phase === 'loading') return shellText(`Loading battlefield resources… ${progressPercent}%`, `正在载入战区资源… ${progressPercent}%`);
      if (phase === 'initializing') return shellText('Initializing the 3D battlefield…', '正在初始化三维战区…');
      if (phase === 'exited') return shellText('You have left the battlefield.', '已退出战区。');
      if (phase === 'stopped') return shellText(`The game has stopped (${exitCode}).`, `游戏已停止（${exitCode}）。`);
      return shellText('Browser command terminal', '浏览器指挥终端');
    }
    function renderShellLanguage() {
      document.title = shellText('Convergence RTS · Command Network', '交汇战线 · Convergence RTS');
      document.getElementById('shell-title').textContent = shellText('Convergence', '交汇战线');
      document.getElementById('shell-subtitle').textContent = shellText('Avengers / Justice League', '复仇者联盟 / 正义联盟');
      document.getElementById('canvas').setAttribute('aria-label', shellText('Convergence 3D real-time strategy game', '交汇战线 3D 即时战略游戏'));
      enter.textContent = phase === 'error' ? shellText('Reload', '重新载入') : engineExited ? shellText('Enter again', '重新进入') : shellText('Single player', '单机指挥中心');
      document.getElementById('online-launch').textContent = shellText('Play online', '联机对战');
      fullscreen.textContent = shellText('Enter fullscreen', '全屏进入');
      const lines = shellText([
        'L Two-point box select · M Tap to command · Space Pan camera',
        'Two-finger scroll to pan · Pinch to zoom · U / I Heroes · Esc Menu',
        'Click the battlefield to enable sound. Saves stay in this browser.'
      ], [
        'L 两点框选 · M 轻点下令 · 空格移动视野',
        '双指滑动平移 · 捏合缩放 · U / I 英雄 · Esc 菜单',
        '点击游戏区域启用声音。存档保存在当前浏览器中。'
      ]);
      const hint = document.getElementById('shell-hint');
      hint.replaceChildren();
      lines.forEach((line, index) => { if (index) hint.append(document.createElement('br')); hint.append(document.createTextNode(line)); });
      document.getElementById('shell-voice').textContent = shellText('Voice: English · Subtitles: English', '人声：英语 · 字幕：中文');
      document.getElementById('creator-label').textContent = shellText('Created by', '制作者');
      document.getElementById('shell-version').textContent = shellText('v0.4.6 · Convergence Command Network', 'v0.4.6 · 交汇指挥网络');
      status.textContent = getStatusText();
    }
    function showError(error) {
      console.error(error);
      phase = 'error';
      boot.hidden = false;
      const detail = document.getElementById('detail');
      detail.hidden = false;
      detail.textContent = String(error?.message || error);
      enter.disabled = false;
      enter.onclick = () => location.reload();
      fullscreen.hidden = true;
      renderShellLanguage();
    }
    function start(useFullscreen) {
      if (running) return Promise.resolve();
      if (engineExited) return Promise.reject(new Error(shellText('Reload this page to start a new game.', '请刷新页面后重新进入游戏。')));
      if (startPromise) return startPromise;
      startPromise = window.ConvergenceLanguage.whenChosen().then(() => loadGame(useFullscreen));
      return startPromise;
    }
    async function loadGame(useFullscreen) {
      enter.disabled = true; fullscreen.disabled = true;
      if (useFullscreen && document.documentElement.requestFullscreen) {
        try { await document.documentElement.requestFullscreen(); } catch (_) { /* Continue in window. */ }
      }
      const missing = Engine.getMissingFeatures({threads: true});
      if (missing.length) { const error = new Error(missing.join('\n')); showError(error); throw error; }
      progress.hidden = false;
      phase = 'loading';
      renderShellLanguage();
      try {
        await engine.startGame({
          onProgress(current, total) {
            if (total > 0) {
              progress.max = total; progress.value = current;
              loadedBytes = current; totalBytes = total;
              progressPercent = Math.round(current / total * 100);
              phase = current < total ? 'loading' : 'initializing';
              status.textContent = getStatusText();
              window.ConvergenceOnline?.status(status.textContent);
              window.dispatchEvent(new CustomEvent('convergence-load-progress', { detail:{ phase, percent:progressPercent, current, total } }));
            }
          },
          onExit(code) {
            running = false; engineExited = true; exitCode = code;
            phase = code === 0 ? 'exited' : 'stopped';
            boot.hidden = false; progress.hidden = true;
            enter.disabled = false;
            enter.onclick = () => location.reload(); fullscreen.hidden = true;
            renderShellLanguage();
          }
        });
        running = true;
        window.dispatchEvent(new CustomEvent('convergence-load-progress', { detail:{ phase:'ready', percent:100, current:loadedBytes, total:totalBytes } }));
        boot.hidden = true;
        renderShellLanguage();
        document.getElementById('canvas').focus();
      } catch (error) { showError(error); throw error; }
    }
    window.ConvergenceShell = { start, getStatusText, getLoadState:()=>({phase:running?'ready':phase,percent:progressPercent,current:loadedBytes,total:totalBytes}) };
    window.addEventListener('convergence-language-change', renderShellLanguage);
    renderShellLanguage();
    enter.onclick = () => start(false).catch(() => {});
    fullscreen.onclick = () => start(true).catch(() => {});
    document.getElementById('canvas').addEventListener('contextmenu', event => event.preventDefault());
  </script>
  <script type="module" src="online/app.js"></script>
</body>
</html>

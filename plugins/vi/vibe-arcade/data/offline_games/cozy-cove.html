         initial loader (and the whole app's CSS variables) render in the
         right theme with no flash. ThemeContext reconciles this on mount. -->

        try {
          var t = localStorage.getItem('onetap_theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';

          document.documentElement.classList.add(t);

    <!-- A signed-in visitor (a saved session) who opens the landing page goes
         to Home (signed-in build, SPEC 2.3). Rewriting the address here,
         before the app boots, means the app starts on /home and the
         prerendered landing page never flashes. Pages that switch by sign-in
         (Create, Play, a store page, a profile, Help, Explore) keep their
         address but are hidden the same way, so the signed-out version the
         server prerendered does not flash before the signed-in one. #root
         stays hidden until the first page has rendered (src/lib/bootLoader.ts
         lifts it; the timeout below is a backstop). Not on a game's own
         address, in the desktop app or for the prerenderer. A session that
         proves stale is sent back to the landing page (App.tsx). -->
    <style>html[data-signed-in-boot] #root{visibility:hidden}</style>
    <script>
      (function () {
        try {
          var d = document.documentElement;
          if (window.__TAURI_INTERNALS__ || d.hasAttribute('data-vanity-boot')) return;
          if (/[?&]__prerender(?:[=&]|$)/.test(location.search)) return;
          if (!localStorage.getItem('auth_token')) return;
          var lang = '(?:/(ru|zh|ja|ko|pt-BR|en))?';
          var root = new RegExp('^' + lang + '/?$').exec(location.pathname);
          var switching = new RegExp('^' + lang + '/(?:create|help|explore|play|play/(?:charts|tags|search)|play/(?:category|tag|section)/[^/]+|game/[^/]+|u/[^/]+)/?$').test(location.pathname);
          if (!root && !switching) return;
          if (root) {
            var prefix = root[1] && root[1] !== 'en' ? '/' + root[1] : '';
            history.replaceState(history.state, '', prefix + '/home' + location.search + location.hash);
            try { sessionStorage.setItem('tesana_root_redirect', '1'); } catch (e) {}
          }
          d.setAttribute('data-signed-in-boot', '');
          setTimeout(function () { d.removeAttribute('data-signed-in-boot'); }, 6000);
        } catch (e) {}
      })();
    </script>

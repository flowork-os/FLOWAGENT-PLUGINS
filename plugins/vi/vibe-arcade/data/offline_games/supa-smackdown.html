<body>

<script src="src/characters/snoopy-moveset.js"></script>

<script>
const W = 1280, H = 720, STEP = 1 / 60;
const cv = document.getElementById('c'); ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const paper = makePaper(W, H, dpr); // the canvas's CSS background, so frames just clear to it instead of repainting every pixel
paper.toBlob(b => cv.style.background = `url(${URL.createObjectURL(b)}) 0 0 / 100% 100%`);

// ---------- arena ----------
const stage = { x: 240, y: 500, w: 800, h: 110 }; // solid collision box
const stagePoly = [[240, 500], [1040, 500], [1040, 530], [960, 610], [320, 610], [240, 530]];
const plats = [{ x: 330, y: 375, w: 210 }, { x: 740, y: 375, w: 210 }, { x: 535, y: 255, w: 210 }]; // pass-through
const BLAST = { l: -220, r: W + 220, t: -360, b: H + 200 };

// ---------- camera ----------
// Smash-style: frames everyone in play (padded, more room above than below), zooms between zmin and zmax, and eases toward that
// framing so it never jerks: out fast (keeps up with a launch), back in slowly. It can look out as far as the blast zone, so a fighter
// flying off is on screen until the moment it's KO'd, but never past it (zmin), so nobody is KO'd in plain view. cam = the world point at screen centre + zoom
const CAM = { ...BLAST, padX: 260, padUp: 260, padDown: 140, zmin: Math.max(W / (BLAST.r - BLAST.l), H / (BLAST.b - BLAST.t)), zmax: 1.35, pan: 3, zoomIn: 1.6, zoomOut: 6,
  punch: 0.1, punchIn: 15, punchOut: 3 }; // big hits: up to 10% closer around where they landed, in fast, out slow
// x y z = the framing, vx vy vz = what's shown (framing + punch) · kick = punch strength 0 … 1 (decaying), kz = it eased · hx hy = the hit
const camHome = () => ({ x: W / 2, y: H / 2, z: 1, vx: W / 2, vy: H / 2, vz: 1, kick: 0, kz: 0, hx: 0, hy: 0, seen: null, exit: null });
const cam = camHome();
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
function stepCam(dt) {
  if (P.state === 'ko') return; // hold still while the KO blast plays, so it stays where it went out
  let l = Infinity, r = -Infinity, t = Infinity, b = -Infinity;
  for (const o of inPlay()) {
    const x = clamp(o.x + o.w / 2, CAM.l, CAM.r), y = clamp(o.y + o.h / 2, CAM.t, CAM.b); // someone flying off still only pulls it so far
    l = Math.min(l, x); r = Math.max(r, x); t = Math.min(t, y); b = Math.max(b, y);
  }
  l -= CAM.padX; r += CAM.padX; t -= CAM.padUp; b += CAM.padDown;
  const z = clamp(Math.min(W / (r - l), H / (b - t)), CAM.zmin, CAM.zmax), rate = z < cam.z ? CAM.zoomOut : CAM.zoomIn;
  cam.z += (z - cam.z) * (1 - Math.exp(-rate * dt));
  const k = 1 - Math.exp(-Math.max(CAM.pan, rate) * dt); // pans as fast as it's zooming out
  const hw = W / 2 / cam.z, hh = H / 2 / cam.z;
  cam.x += (clamp((l + r) / 2, CAM.l + hw, CAM.r - hw) - cam.x) * k;
  cam.y += (clamp((t + b) / 2, CAM.t + hh, CAM.b - hh) - cam.y) * k;
  cam.kz += (cam.kick - cam.kz) * (1 - Math.exp(-CAM.punchIn * dt)); cam.kick *= Math.exp(-CAM.punchOut * dt);
  const f = 1 + CAM.punch * cam.kz, g = 1 - 1 / f; // zoom in by f, keeping the hit's spot on screen put
  Object.assign(cam, { vz: cam.z * f, vx: cam.x + (cam.hx - cam.x) * g, vy: cam.y + (cam.hy - cam.y) * g });
  const [sx, sy] = onScreen();
  if (sx >= 0 && sx <= W && sy >= 0 && sy <= H) { cam.seen = [sx, sy]; cam.exit = null; } else cam.exit = exitPoint(); // a KO blasts from where they left
}
// a hit with knockback k (KB units) at x, y: from k 60 up, full punch by 130
function camPunch(k, x, y) { const s = clamp((k - 60) / 70, 0, 1); if (s > cam.kick) Object.assign(cam, { kick: s, hx: x, hy: y }); }
const onScreen = () => [(P.x + P.w / 2 - cam.vx) * cam.vz + W / 2, (P.y + P.h / 2 - cam.vy) * cam.vz + H / 2];
// where P's path crossed the screen's edge on the way out: from the last point it was seen at toward where it is now
function exitPoint() {
  if (cam.exit || !cam.seen) return cam.exit;
  const [ax, ay] = cam.seen, [bx, by] = onScreen(), dx = bx - ax, dy = by - ay;
  const t = Math.min(dx < 0 ? -ax / dx : dx > 0 ? (W - ax) / dx : 1, dy < 0 ? -ay / dy : dy > 0 ? (H - ay) / dy : 1);
  return [ax + dx * t, ay + dy * t];
}
// world → screen: z scaled around cam; depth < 1 moves less (parallax for the background)
function view(depth = 1) {
  const z = 1 + (cam.vz - 1) * depth;
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-(W / 2 + (cam.vx - W / 2) * depth), -(H / 2 + (cam.vy - H / 2) * depth));
}

// ---------- player ----------
const G = 2300, RUN = 440, DASH = 600, WALK = 190, CRAWL = 110, JUMP = 930, HOP = 640, AIRJUMP = 820;
const TURN_SPEED = 1.4; // turnaround plays this much faster than a plain brake
// attack feel: presses are remembered for BUFFER frames; the last CANCEL share of a move's recovery can be cut short by any input;
// a move that connects recovers in HIT_REC of the time (and can jump out right away)
const BUFFER = 8, CANCEL = 0.4, HIT_REC = 0.6, ATK_FRICTION = 1400;
const TILT_MS = 150; // forward tilt needs ← / → pressed within this long of light; a direction you're just holding (walking) still jabs
const ATTACK_FROM = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'land', 'shield'];
// shield: holding it wears it down, letting go lets it grow back; blocking a hit costs a chunk. Emptied = it breaks (stun), and comes back at SHIELD_MIN
const SHIELD_DRAIN = 1 / 240, SHIELD_REGEN = 1 / 360, SHIELD_HIT = 0.3, SHIELD_MIN = 0.3;
let p1 = null, fighter, M = MOVESET.movement; // P1's pick (null = not yet), the fighter in play (FIGHTER, set on the vs screen), its movement
const has = group => !!fighter.set[group];
const AIR_JUMPS = () => fighter.jumps || 1;
const JABS = ['jab1', 'jab2', 'jab3'];
const NO_KB = { base: 0, growth: 0, angle: 0 }; // damage only: the target stays put
const THROWS = ['forwardThrow', 'backThrow', 'upThrow', 'downThrow']; // holding the bag: hold / pummel / throws
const DODGES = ['spotDodge', 'rollForward', 'rollBack'];
// the fighter in play's moves, by group: its own, with any it hasn't made yet borrowed from Claw'd's (has() still switches whole groups off)
// SP = its specials by direction · FLY = rocket-style specials by state (the flight, and its charge: state + 'Charge')
let L, GR, SP, DOWN_B, ATK, AIR, NEUTRAL_B, US, MOVES, FLY, R, D, AD, SB;
function loadMoves(set) {
  const S = g => ({ ...MOVESET[g], ...set[g] });
  L = S('ledge'); GR = S('grabs'); R = S('reactions'); D = S('defense'); AD = D.airDodge; SB = D.shieldBreak;
  SP = S('specials'); NEUTRAL_B = SP.neutralSpecial; US = SP.upSpecial; // US = MCP tether: its own state, runs off P.teth
  DOWN_B = SP.downSpecial; // the subagent (sub), if it has one
  ATK = { ...S('groundAttacks'), ...S('smashAttacks'), grab: GR.grab, dashGrab: GR.dashGrab }; AIR = { ...S('aerials') }; // attack states are named after their move
  // specials are usable on the ground and in the air, so they live in both maps, as their own states (m.state, else the move's name,
  // e.g. Grok's extra neuralZap, Lego Man's booklet builds). Not Claw'd's held think or MCP tether (no startup / a reach: wired in by hand), nor ones with their
  // own step: flights (they steer themselves), warps (Android's Maps pin, off P.warp), held charges (Android's fast charge, off P.batt)
  FLY = {}; const own = {};
  for (const [k, m] of Object.entries(SP)) {
    const st = m.state || k;
    if (m.flight) FLY[st] = FLY[st + 'Charge'] = own[st] = m;
    else if (m.warp || m.charge || (m.startup == null && m.state)) own[st] = m; // (+ Lego Man's booklet: it runs itself, bookletStep)
    else if (m.startup != null && m.reach == null) { AIR[st] = m; if (!m.thrust) ATK[st] = m; } // a climb (Lego Man's staircase) is air-only: it hops off first
  }
  MOVES = { ...ATK, ...AIR, ...own, ledgeAttack: L.ledgeAttack, pummel: GR.pummel, ...Object.fromEntries(THROWS.map(k => [k, GR[k]])) };
  if (!(NEUTRAL_B.state || 'neutralSpecial' in MOVES)) MOVES.neutralSpecial = NEUTRAL_B; // Claw'd's think: animated, no hitbox
}
loadMoves(MOVESET);
const think = () => { // resume from the last checkpoint reached · Duo's heart zap spends a heart (P.roll = hearts it had before)
  if (NEUTRAL_B.hearts) { P.roll = P.hearts; P.hearts = Math.max(0, P.hearts - 1); return setState('neutralSpecial'); }
  setState('neutralSpecial'); P.f = thinkFrom(P.think);
};
const RESPAWN_Y = 100; // respawn platform: where it stops (top of Claw'd's box)
// dodges and the ledge roll list intangible = [first, last) frames where nothing can hurt Claw'd
const intangible = () => { if (P.state === 'tunnel') return true; const it = (L[P.state] || D[P.state] || R[P.state] || MOVES[P.state])?.intangible; return !!it && P.f >= it[0] && P.f < it[1]; };
// the fighter in play (see newFighter): x, y, w, h = collision box (Claw'd's: body + legs, the arm nubs overhang it) · batt = Android's
// stored fast charge 0 … 1 (spent on its next hit) · think = neutral special effort tier reached (0 … 3), kept until KO
let P;
const GROUNDED = ['idle', 'walk', 'dash', 'run', 'skid', 'crouch', 'crouchWalk', 'crouchUp', 'squat', 'land', 'landLag', 'shield', 'shieldDrop', 'knockdown', 'getup', 'tech', 'hold', 'pummel', ...THROWS, ...DODGES, ...Object.keys(ATK).filter(k => !(k in AIR))];
const STOCKS = 3; let stocks = STOCKS;
const fx = []; // dust clouds left in the world: { x, y, dir, t }
let shots = []; // thrown sparks in flight: { x, y, vx, t, m }
let nelly = null; // Wumpus's side special: Nelly the snail { x, y, w, h, vx, vy, face, t, ground, on, N = her move data }
let wreck = null; // a rocket-style up special's ship once the rider's off it: { x, y (its middle), vx, vy, t, m, boom = 0 … 1 once it's blowing up }
let cart = null; // a ride special's vehicle (Grok's Cybertruck), Steve minecart style: { x, y, w, h, vx, vy, face, t, ground, on, m = the move, dist = px driven, bag = target scooped into it, bagT, done }
let thrown = null; // Lego Man's head while it's off, flying (side special): { x, y, vx, dir, back, sp, t, rot, face, hit, T }
let rockets = [], booms = []; // Lego Man's rockets in flight { x, y, v, dir, t, L } and their blasts { x, y, t, r }
let bricks = []; // Lego Man's loose bricks: boxes that tumble out and lie on the floor, hurting whoever touches one: { x, y, w, h, vx, vy, rot, spin, col, dir, t, m }
let sub = null; // the down special's subagent: a half-size Claw'd box { x, y, w, h, vx, vy, face, t, ground, on, done = seconds since it reported back }
// every fighter: name, collision box [w, h], art = its draw function (bottom-centre x, y, pose, facing), set = its moveset: a group it
// doesn't have yet (attacks, specials, grabs, defense, ledge) is simply off for it · jumps = air jumps · flap = air jump speed ·
// glide = max fall speed holding jump · pad = draws its own respawn platform (pose.pad). draw = standing, idling (t = seconds): dummies, portraits, the select and vs screens
const FIGHTER = {
  clawd: { name: "Claw'd", box: [60, 50], art: drawClawd, set: MOVESET },
  grok: { name: 'Grok Bot', box: [52, 56], art: drawGrok, set: GROK_MOVESET },
  wumpus: { name: 'Wumpus', box: [50, 64], art: drawWumpus, set: WUMPUS_MOVESET },
  android: { name: 'Android', box: [50, 64], art: drawAndroid, set: ANDROID_MOVESET },
  duo: { name: 'Duo', box: [60, 61], art: drawDuo, set: DUO_MOVESET, jumps: 5, flap: 620, glide: 170 }, // flies like Kirby / Meta Knight
  snoo: { name: 'Snoo', box: [46, 76], art: drawSnoo, set: SNOO_MOVESET },
  lego: { name: 'Lego Man', box: [44, 72], art: drawLego, set: LEGO_MOVESET, pad: true },
  muse: { name: 'Muse', box: [50, 70], art: drawMuse, set: MUSE_MOVESET },
  snoopy: { name: 'Snoopy', box: [46, 78], art: drawSnoopy, set: SNOOPY_MOVESET, tile: { k: 1.1, x: -8 } }, // tile: his select tile portrait smaller and back a bit (his big head and nose)
  bag: { name: 'Training Bag', box: [44, 76], draw: (x, y, p) => drawSack(x, y, p.rot || 0) },
  random: { name: 'Random', box: [60, 60], draw: (x, y, p, f, t) => { ctx.save(); ctx.translate(x, y - 32); drawQuestion(48, t); ctx.restore(); } }, // a pick not rolled yet
};
const ROSTER = ['clawd', 'grok', 'wumpus', 'android', 'duo', 'snoo', 'lego', 'muse', 'snoopy']; // select screen order (LOGOS follows it)
ROSTER.forEach((id, k) => FIGHTER[id].draw = (x, y, p, f, t) => FIGHTER[id].art(x, y, { ...idleAt(t, k), ...p }, f)); // each a little out of step
fighter = FIGHTER.clawd;
// in play: P1 and the CPUs picked on the select screen (fighters, below), or the training bag if none. The CPUs fight back (src/cpu.js
// plays them) with STOCKS lives each; the bag just takes hits and knockback, and drops back in where it started when it leaves the blast zone
const BAG_SPAWN = { vx: 0, vy: 0, dmg: 0, hitT: 0, rot: 0, grabbed: false, pinned: false, carted: false, sticker: null, pinT: 0, slowT: 0 }; // what anyone who can be hit carries: grabbed = the P holding it in its claws · pinned = the P whose up special's cord it's on the end of · pinT = s left stuck under a move's pin (Wumpus) · slowT = s left in slowmode
const SPAWN_X = [822, 435, 1000]; // centres the CPUs drop in at: the first where the bag always did, the others to either side
let bags = [], foes = [], cpus = [], lvls = [], sides = [], rolled = [], targets = [], mode = 'ffa'; // cpus = fighter ids picked as enemies ('random' until the vs screen rolls them into rolled), lvls = their levels (indexes into LVL / CPU_LEVELS: 0 beginner … 3 medium … 6 AI trained) · foes = the CPUs' fighters, kept for the hud once out of lives · targets = who the fighter in play can hit · mode = 'teams' (sides: each CPU with you, 0, or against you, 1) or 'ffa' (everyone for themselves)
function spawnTarget(b) { Object.assign(b, BAG_SPAWN, { x: b.home - b.w / 2, y: -120, ground: false, on: null }); }
const heldBag = () => targets.find(b => b.grabbed === P);
const KB = 10; // knockback units → px/s

let keys = {}, jumpQ = false, downQ = false, dropQ = false, ffQ = false, dashQ = false, attackQ = false, heavyQ = false, specialQ = false, dodgeQ = false, grabQ = 0, techQ = 0, techLock = 0, sideQ = false, lastTap = { a: null, t: 0 }, lastDir = 0, pressT = {}, attackT = -1e9, tiltQ = false;
// the engine plays one fighter through its globals: P, its moves, its controls (above) and what it has out. Every fighter in play keeps
// its own set of them (a context, c), and use(c) swaps c's in, stashing the ones that were in. P1's are in between frames, so key
// presses always land on P1's controls. c.P.c = c; a CPU's context also has its brain (src/cpu.js)
let fighters = [], human = null, cur = null; // fighters = P1's context, then the CPUs' still in the fight · cur = whose are in now
const stash = c => Object.assign(c, { P, fighter, M, L, GR, SP, DOWN_B, ATK, AIR, NEUTRAL_B, US, MOVES, FLY, R, D, AD, SB, stocks, keys, jumpQ, downQ, dropQ, ffQ, dashQ, attackQ, heavyQ, specialQ, dodgeQ, grabQ, techQ, techLock, sideQ, lastTap, lastDir, pressT, attackT, tiltQ, sub, cart, wreck, nelly, thrown, shots, rockets, booms, bricks, targets });
function use(c) {
  if (c === cur) return;
  if (cur) stash(cur);
  ({ P, fighter, M, L, GR, SP, DOWN_B, ATK, AIR, NEUTRAL_B, US, MOVES, FLY, R, D, AD, SB, stocks, keys, jumpQ, downQ, dropQ, ffQ, dashQ, attackQ, heavyQ, specialQ, dodgeQ, grabQ, techQ, techLock, sideQ, lastTap, lastDir, pressT, attackT, tiltQ, sub, cart, wreck, nelly, thrown, shots, rockets, booms, bricks, targets } = cur = c);
}
// a fighter's context, fresh: its moves, STOCKS lives, P standing in the air with its feet at x, y (facing the middle), no controls held,
// nothing out. Its globals are the ones in play after
function newFighter(f, x, y) {
  if (cur) stash(cur);
  fighter = f; M = f.set.movement; loadMoves(f.set); stocks = STOCKS;
  const [w, h] = f.box;
  P = { ...BAG_SPAWN, x: x - w / 2, y: y - h, w, h, ground: false, on: null, jumps: 1, face: x > W / 2 ? -1 : 1, drop: 0, inv: 0, state: 'air', f: 0, fastFall: false, ledge: 0, regrab: 0, shield: 1, think: 0, batt: 0,
    hearts: NEUTRAL_B.hearts || 0, toastT: null, studs: NEUTRAL_B.studs?.start ?? 0, gold: 0, mech: 0, stairs: false, warn: null, streak: 0, buff: 0, struck: new Map() }; // Lego Man: studs to spend on builds, the gold brick's and mech suit's time left · Duo: its streak meter (0 … 1), buff time left · struck = who the attack it's doing has hit (with which hit)
  keys = {}; jumpQ = downQ = dropQ = ffQ = dashQ = attackQ = heavyQ = specialQ = dodgeQ = sideQ = tiltQ = false; grabQ = techQ = techLock = lastDir = 0; lastTap = { a: null, t: 0 }; pressT = {}; attackT = -1e9;
  sub = cart = wreck = nelly = thrown = null; shots = []; rockets = []; booms = []; bricks = []; targets = [];
  cur = P.c = {}; stash(cur); return cur;
}
const everyone = () => [...fighters.map(c => c.P), ...bags], inPlay = () => everyone().filter(p => p.state !== 'ko'); // anyone who can be hit · what the camera frames
restart(); // Claw'd and the bag, behind the home screen
// key bindings: two sets, both live at once, changed on the controls screen and kept in the 'keys' cookie (a slot can be
// empty: null). Brawlhalla-style light / heavy: J K (WASD) · C X (arrows); special L / V; grab I / G; dodge (held on the ground: shield, like Smash) Shift / Z
const ACTIONS = ['left', 'right', 'up', 'down', 'jump', 'attack', 'heavy', 'special', 'grab', 'dodge'];
const DEFAULT_BINDS = [
  { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', jump: 'Space', attack: 'KeyJ', heavy: 'KeyK', special: 'KeyL', grab: 'KeyI', dodge: 'ShiftLeft' },
  { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', jump: 'Space', attack: 'KeyC', heavy: 'KeyX', special: 'KeyV', grab: 'KeyG', dodge: 'KeyZ' }];
const MENU_NAV = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' }; // menus always take the arrows, whatever they're bound to
let binds, KEYMAP; // KEYMAP = key code → action
function setBinds(b, save) { // b's slots (anything missing or not a key code: the default), then KEYMAP from them
  binds = DEFAULT_BINDS.map((d, s) => Object.fromEntries(ACTIONS.map(a => { const k = b?.[s]?.[a]; return [a, typeof k === 'string' || k === null ? k : d[a]]; })));
  KEYMAP = {}; for (const set of binds) for (const a of ACTIONS) if (set[a]) KEYMAP[set[a]] ??= a;
  if (save) document.cookie = `keys=${encodeURIComponent(JSON.stringify(binds))}; max-age=31536000; path=/; SameSite=Lax`;
}
try { setBinds(JSON.parse(decodeURIComponent(document.cookie.match(/(?:^|; )keys=([^;]*)/)?.[1] ?? 'null'))); } catch { setBinds(); }
function bindKey(a, s, code) { binds.forEach(set => { for (const b of ACTIONS) if (set[b] === code && b !== a) set[b] = null; }); binds[s][a] = code; setBinds(binds, true); } // a key does one thing: it leaves any other action it was on
const KEY_NAMES = { ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓', ShiftLeft: 'Shift', ShiftRight: 'R Shift', ControlLeft: 'Ctrl', ControlRight: 'R Ctrl', AltLeft: 'Alt', AltRight: 'R Alt', MetaLeft: 'Cmd', MetaRight: 'R Cmd' };
const keyName = c => c ? KEY_NAMES[c] ?? c.replace(/^(Key|Digit)/, '') : '—';
// ---------- pause menu ----------
const MENU = ['resume', 'controls', 'sound', 'music', 'restart', 'quit'], HOME_MENU = ['play', 'characters', 'controls', 'sound', 'music'];
let paused = true, sel = 0, showControls = false, keyEdit = null, over = false, home = true, picking = false, vsT = null, menu = HOME_MENU; // boots to the home screen · picking = character select (after play) · vsT = when the vs screen started (after picking)
function setPaused(on) {
  paused = on; sel = 0; showControls = false; keyEdit = null; over = false; home = false; picking = false; vsT = null; menu = MENU;

      if (pr.hitFx) fx.push({ x: sh.x, y: sh.y, t: 0, ...pr.hitFx }); // hitFx = { draw(x, y, t), dur s }

    }

  for (let i = rockets.length - 1; i >= 0; i--) { // rockets: speed up along their line, burst on a target, the stage, or at the end of their range
    const r = rockets[i], L = r.L; r.t += dt; r.v = Math.min(L.speed[1], r.v + L.accel * dt); r.x += r.dir * r.v * dt;

}

// Nelly crawls straight ahead (falls if she's in the air) until she slows the first target she touches, or gives up
function stepNelly(dt) {
  const n = nelly, N = n.N;

  n.vy = Math.min(n.vy + G * dt, 950);
  move(n, dt, s => { n.vy = 0; n.ground = true; n.on = s; });
  const b = targets.find(b => !b.grabbed && overlaps(n, b));
  if (b) { if (hitBag(b, N.damage, N.kb, n.face)) b.slowT = N.slow; fx.push({ x: n.x + n.w / 2, y: n.y + n.h, dir: n.face, t: 0 }); nelly = null; }

// Lego Man's thrown head: out along its line, slowing, then back to his neck wherever he's got to (speeding up), where it clicks
// back on; gives up and snaps straight back after T.life. Hits each target once going out and once coming back
function stepThrown(dt) {
  const h = thrown, T = h.T, nx = P.x + P.w / 2, ny = P.y + P.h - 61;

    if (d <= step + 10 || h.t > T.life) return thrown = null;
    h.x += dx / d * step; h.y += dy / d * step; h.vx = dx / d * h.sp;
  }
  const box = { x: h.x - 10, y: h.y - 10, w: 20, h: 20 };
  for (const b of targets) if (!h.hit.has(b) && overlaps(box, b)) { h.hit.add(b); const H = h.back ? T.back : T.out; hitBag(b, H.damage, H.kb, Math.sign(h.vx) || h.dir); }
}

// the subagent runs straight ahead (falls if it's in the air), bonks a target once and reports back, or gives up after a while
function stepSub(dt) {
  const S = DOWN_B.sub;
  if (sub.done) { if ((sub.done += dt) > S.report) sub = null; return; }
  sub.t += dt;
  if (sub.ground) sub.vx = sub.face * S.speed;
  sub.vy = Math.min(sub.vy + G * dt, 950);
  move(sub, dt, s => { sub.vy = 0; sub.ground = true; sub.on = s; });
  if (out(sub)) return sub = null; // ran off the stage
  const hit = targets.find(b => overlaps(sub, b));
  if (hit) hitBag(hit, DOWN_B.damage, DOWN_B.kb, sub.face);
  if (hit || sub.t > S.life) { sub.done = dt; fx.push({ x: sub.x + sub.w / 2, y: sub.y + sub.h, dir: -1, t: 0 }, { x: sub.x + sub.w / 2, y: sub.y + sub.h, dir: 1, t: 0 }); } // poof
}

// a ride speeds up along the ground (falls off ledges), carrying the rider. Running into a target with the rider in scoops it into
// the back (the rider leaps out), carries it scoop.carry seconds and launches it; a driverless one just rams the first thing it
// meets. Ends on a hit, a crash into the stage's side, after ride.life seconds or out of the blast zone, with a poof
function stepCart(dt) {
  const c = cart, rd = c.m.ride, riding = P.state === 'ride';
  if (c.done) { if ((c.done += dt) > 0.2) cart = null; return; }
  c.t += dt;
  const sp = Math.min(rd.speed[1], Math.abs(c.vx) + rd.accel * dt);

  c.dist += Math.abs(c.x - x0);

  if (riding) Object.assign(P, { x: c.x + c.w / 2 - P.w / 2, y: c.y + c.h - P.h, vx: c.vx, vy: c.vy, ground: c.ground, on: c.on });

}

// damage + knockback on a target from the fighter in play, growing with the target's damage. A fighter

  if (P.buff > 0) kb = { ...kb, base: kb.base * DOWN_B.streak.kb, growth: kb.growth * DOWN_B.streak.kb }; // buff Duo hits harder

function out(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  return cx < BLAST.l || cx > BLAST.r || cy > BLAST.b || cy < BLAST.t;
}

// move a box by its velocity, colliding with the solid stage and landing on pass-through platforms
function move(b, dt, onLand) {
  b.x += b.vx * dt;
  if (overlaps(b, stage)) { b.x = b.x + b.w / 2 < stage.x + stage.w / 2 ? stage.x - b.w : stage.x + stage.w; b.vx = 0; } // out the nearer side (vx can be 0)

  const prevBottom = b.y + b.h;
  b.y += b.vy * dt;
  const was = b.on; b.ground = false; b.on = null;
  if (overlaps(b, stage)) {
    if (b.vy > 0) { b.y = stage.y - b.h; onLand(stage); }
    else { b.y = stage.y + stage.h; b.vy = 0; }
  }

    if (b === P && keys.down && pl !== was) continue; // holding ↓: fall straight through (standing on one, the drop waits a beat instead)
    if (b.x + b.w > pl.x && b.x < pl.x + pl.w && prevBottom <= pl.y + 0.5 && b.y + b.h >= pl.y) {

}

// which frame of which animation to show for the current state
function clawdPose() {
  const f = P.f, atk = MOVES[P.state], fly = FLY[P.state];
  if (fly && P.state !== fly.state) return { ...fly.chargeAnim(f, P.chg / fly.chargeFrames), tilt: P.aim }; // charging a flight (c runs past 1 into the overheat), aimed
  if (atk) { const p = ((P.buff > 0 && fighter.set.buffed?.[P.state]) || atk).anim(f, undefined, sizeOf(atk), P.roll); if (P.held && f === atk.chargeAt && atk.chargeMult) p.x = (p.x || 0) + (P.chg % 4 < 2 ? 1.5 : -1.5); if (fly) p.tilt = P.fly.ang; return p; } // tremble while charging a smash · P.roll = a random outcome (Duo's quiz, Android's app) · buff Duo punches instead (its buffed anims)
  switch (P.state) {
    case 'idle': return M.idle.anim(f % 120, 120);
    case 'walk': return M.walk.anim(f % 40, 40);
    case 'dash': return M.dash.anim(Math.min(f, 16), 20);
    case 'run': return M.run.anim(f % 24, 24);
    case 'skid': return M.skid.anim(Math.min(Math.floor(P.sk), P.turn ? 25 : 13), 26); // a plain brake holds before the flip
    case 'crouch': return M.crouch.anim(f < 50 ? f : 5 + (f - 5) % 45, 60); // loop the held part
    case 'crouchWalk': return M.crouchWalk.anim(f % 32, 32);
    case 'crouchUp': return M.crouch.anim(Math.min(50 + f, 59), 60);
    case 'squat': return M.jumpSquat.anim(Math.min(6, f * 1.5), 14);
    case 'land': return M.land.anim(Math.min(3 + f, 17), 18);
    case 'landLag': return M.land.anim(Math.min(3 + f * 14 / P.lag, 17), 18); // the landing squash stretched over the lag
    case 'drop': return M.platformDrop.anim(Math.min(8 + f, 30), 40);
    case 'djump': return M.doubleJump.anim(Math.min(3 + f, 28), 36);
    case 'ledgeGrab': return L.ledgeGrab.anim(Math.min(f, 10));
    case 'ledgeHang': return L.ledgeHang.anim(f % 60, 60);
    case 'ledgeGetup': return L.ledgeGetup.anim(Math.min(f, 24));
    case 'ledgeJump': return L.ledgeJump.anim(f);
    case 'ledgeRoll': return L.ledgeRoll.anim(Math.min(f, 35));
    case 'shield': case 'shieldDrop': { // the terminal shrinks a little, cracks and fades as the shield wears down
      const p = D.shield.anim(P.state === 'shieldDrop' ? Math.min(50 + f, 59) : f < 4 ? f : 4 + (f - 4) % 46);
      if (p.shield) p.shield *= 0.75 + 0.25 * P.shield; p.wear = 1 - P.shield; return p; // (Duo's phone reads wear as its battery)
    }
    case 'shieldBreak': return { oopsMsg: P.oopsMsg, ...SB.anim(Math.min(f, SB.frames - 1)) }; // a fighter's own break message wins over Claw'd's random one
    case 'airDodge': { const p = D[P.dodgeAnim].anim(Math.min(f, AD.frames - 1)); p.rot = (p.rot || 0) + P.dodgeTilt * Math.min(1, f / 3, Math.max(0, (AD.frames - f) / 10)); return p; }
    case 'spotDodge': case 'rollForward': case 'rollBack': return D[P.state].anim(Math.min(f, D[P.state].frames - 1));
    case 'ledgeDrop': return L.ledgeDrop.anim(Math.min(f, 16));

      const T = P.teth, p = T.side || T.link != null ? { ...US.reelPose } : US.anim(Math.min(f, US.startup + US.active + US.endlag - 1));

      if (T.side) Object.assign(p, { tether: [Math.hypot(lx - ax, stage.y - ay), Math.atan2(ay - stage.y, P.face * (lx - ax))], plugged: true });
      else if (T.link != null) { const px = T.bag.x + T.at[0], py = T.bag.y + T.at[1]; Object.assign(p, { tether: [Math.hypot(px - ax, py - ay), Math.atan2(ay - py, P.face * (px - ax))], plugged: true, flow: T.link / 24 }); }

    }
    case 'hold': return GR.hold.anim(f % 60, 60);
    case 'hitstun': return R.hitstun.anim(Math.min(f, P.stun - 1), P.stun);
    case 'tumble': return R.tumble.anim(f % 40, 40);
    case 'knockdown': return R.knockdown.anim(f);
    case 'getup': case 'tech': return R[P.state].anim(Math.min(f, R[P.state].frames - 1));
    case 'respawn': return { ...M.idle.anim(f % 120, 120), pad: 1, padMark: R.respawn.mark, say: [R.respawn.say, Math.min(1, f / 10)] };

  if (P.fastFall) return M.fastFall.anim(f % 24, 24);
  if (P.vy > 450) return M.fall.anim(f % 40, 40);

  return M.fullHop.anim(7 + 48 * Math.min(1, Math.max(0, (P.vy + JUMP) / (JUMP + 450))), 64);
}

// ---------- render ----------
function surfaceBelow() {
  const cx = P.x + P.w / 2, feet = P.y + P.h;
  let best = null;
  for (const s of [stage, ...plats]) if (cx > s.x && cx < s.x + s.w && s.y >= feet - 1 && (best === null || s.y < best)) best = s.y;
  return best;
}

function render(t) {
  seed = Math.floor(t * 8) * 7919 + 1;
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = ctx.lineJoin = 'round';

  // faint pencil background (far away: follows the camera at half strength)
  ctx.save(); view(0.5);
  ctx.strokeStyle = INK; ctx.globalAlpha = 0.18; ctx.lineWidth = 1.5;
  ellipse(1040, 150, 62, 62, 2);
  line(40, 470, 330, 440, 3, 1); line(330, 440, 620, 468, 3, 1); line(700, 460, 1000, 430, 3, 1); line(1000, 430, 1240, 462, 3, 1);
  ctx.globalAlpha = 1; ctx.restore();

  ctx.lineWidth = 2.6; poly(stagePoly, 1.6);
  ctx.lineWidth = 1.4; line(250, 512, 1030, 512, 1.2, 1);

  // platforms
  for (const pl of plats) {
    if (pl.lego) { if (pl.life - pl.t > 1.5 || Math.floor(pl.t * 10) % 2) drawLegoPlate(pl); continue; } // blinks before it goes

    ctx.fillStyle = '#e3d9c6'; path(r); ctx.fill();

    ctx.lineWidth = 2.2; poly(r, 1.3);
  }

  // shadows
  const all = [...fighters.filter(c => c !== human), human]; // each drawn with its own globals in; P1 on top
  for (const c of all) {
    use(c); const sy = surfaceBelow();
    if (sy === null || P.state === 'ko') continue;
    const dist = sy - (P.y + P.h), s = Math.max(0.25, 1 - dist / 400);
    ctx.globalAlpha = 0.35 * s;
    ctx.fillStyle = 'rgba(42,38,34,0.35)';

    ctx.globalAlpha = 1;
  }

  drawTargets(t);

    use(c);

    for (const k of bricks) if (k.m.life - k.t > 1.5 || Math.floor(k.t * 10) % 2) drawLooseBrick(k); // blinks before it goes
    for (const r of rockets) drawLegoRocket(r);
    for (const b of booms) drawLegoBoom(b.x, b.y, b.t, b.r);
    if (thrown) drawLegoHead(thrown);
    if (nelly) drawNelly(nelly.x + nelly.w / 2, nelly.y + nelly.h, nelly.t, nelly.face);
    if (wreck) wreck.m.wreck.draw(wreck.x, wreck.y, Math.atan2(wreck.vx, -wreck.vy), wreck.boom);
    if (cart && !cart.done) { const c = cart, air = c.ground ? 0 : Math.max(-0.25, Math.min(0.3, c.vy / 2500)); // noses down as it falls, a wheelie as it sets off
      fighter.art(c.x + c.w / 2, c.y + c.h, { car: 1, empty: P.state !== 'ride', squint: true, wheel: c.dist / 11, rot: air - 0.1 * Math.max(0, 1 - c.t / 0.15) }, c.face); }
    for (const sh of shots) { const k = Math.min(1, (sh.pr.life - sh.t) / 0.1); sh.m.shotArt ? sh.m.shotArt(sh.x, sh.y, Math.min(k, sh.t / 0.1), Math.sign(sh.vx) || 1) : (sh.pr.draw || drawSpark)(sh.x, sh.y, sh.r * k, sh.t * 14 * Math.sign(sh.vx), sh); } // shrinks away at max range
    if (P.state === 'upSpecial' && US.warp) US.marker(P.warp[0], P.warp[1], P.f); // where the warp's headed
  }

  // fighters (flicker after respawn)
  for (const d of fx) d.draw ? d.draw(d.x, d.y, d.t) : drawDust(d.x, d.y, d.t, d.dir);
  for (const c of all) {
    use(c);
    // x / air in poses are preview-only root motion; here physics moves Claw'd
    if (P.state !== 'ride' && P.state !== 'ko' && !(P.inv > 0 && Math.floor(t * 14) % 2)) { const pose = clawdPose(); ctx.globalAlpha = intangible() ? 0.5 : 1; drawFighter(P.x + P.w / 2, P.y + P.h, { ...pose, x: P.state in MOVES && !P.ledge ? pose.x : 0, ...powered(pose), ...toast(), ...(P.batt || (P.state === 'downSpecial' && DOWN_B.charge) ? { batt: P.batt } : {}), headless: pose.headless || !!thrown, gold: pose.gold || (P.gold > 0 && (P.gold > 2 || Math.floor(t * 8) % 2)), mech: pose.mech || P.mech > 0, ...streakPose(pose) }, P.face); ctx.globalAlpha = 1; } // attacks lean and come back
    if (P.state === 'booklet') { const B = MOVES.booklet; drawLegoBooklet(P.x + P.w / 2, P.y - 12, B.builds.map(k => MOVES[k]), P.bk.i, Math.min(1, P.f / B.open), P.studs); } // Lego Man's pick list
    if (P.warn) drawLegoWarn(P.x + P.w / 2, P.y - 14 - lift(), P.warn.text, P.warn.t / WARN_T, P.warn.icon);

  use(human);

}

// the fighter in play; anyone but Claw'd is drawn inside his effects (speed lines, dizzy stars, respawn pad…), stretched to its height,
// minus his terminal shield and its shards: shield / wear / shatter are theirs to draw
const drawFighter = (cx, b, p, face) => drawClawd(cx, b, fighter.art === drawClawd ? p : { ...p, shield: 0, shatter: null, pad: fighter.pad ? 0 : p.pad, sy: (p.sy ?? 1) * fighter.box[1] / 50, body: () => fighter.art(cx, b, p, face) }, face);

// the up special's toasts ("connection refused" on a miss, "mcp connected" plugging into the bag): stay up TOAST frames whatever
// Claw'd does next (landing, getting up…). P.toastMsg = OOPS index or [headline, detail], P.toastOk = success style
const TOAST = 150;
const toast = () => P.toastT == null ? {} : { oops: Math.min(1, P.toastT / 6, (TOAST - P.toastT) / 12), oopsMsg: P.toastMsg, oopsOk: P.toastOk };

// Duo's streak: buff (flickering back to the owl over its last half second; the down special draws its own way in), and the flame
// that bursts up behind it, with a shout, when the meter fills
function streakPose(pose) {
  if (!DOWN_B.streak || P.state === 'downSpecial') return {};
  const lit = P.lit != null && P.lit < 1.2 && !pose.flame ? { flame: [100 * Math.min(1, P.lit / 0.12), Math.min(1, (1.2 - P.lit) / 0.5)], say: pose.say || ['🔥 streak full!', Math.min(1, (1.2 - P.lit) / 0.3)] } : {};
  return { buff: P.buff > 0 ? Math.min(1, P.buff / 0.5) : 0, eyeFire: P.streak >= 1, ...lit, ...(pose.say && lift() ? { say: [pose.say[0], pose.say[1], (pose.say[2] || 0) + lift()] } : {}) }; // captions over buff Duo's head
}
const lift = () => P.buff > 0 ? DOWN_B.streak.lift : 0; // how far buff Duo stands over its box

// effort tiers stay on Claw'd until KO: its aura, and 5% more size per tier (the neutral special's own pose already has both)
function powered(pose) {
  if (!P.think || P.state === 'neutralSpecial') return {};
  const g = 1 + 0.05 * P.think;
  return { aura: P.think, sx: (pose.sx ?? 1) * g, sy: (pose.sy ?? 1) * g };
}

// the subagent: the fighter at half size, popping in, running (or falling); once done just its toast, over where it poofed
function drawSub() {
  const S = DOWN_B.sub, bx = sub.x + sub.w / 2, by = sub.y + sub.h, fr = Math.floor(sub.t * 60);
  if (sub.done) return S.report && drawOops(bx, sub.y - 4, Math.min(1, sub.done / 0.1, (S.report - sub.done) / 0.2), DONE, true);
  const k = S.scale * Math.min(1, 0.4 + sub.t / 0.15), pose = !sub.ground ? M.fall.anim(fr % 40, 40) : S.speed ? M.run.anim(fr % 24, 24) : M.idle.anim(fr % 120, 120); // a plush that stays put just sits
  ctx.save(); ctx.translate(bx, by); ctx.scale(k, k); ctx.lineWidth = 2; fighter.art(0, 0, { ...pose, x: 0 }, sub.face); ctx.restore();
}

// the training bag (turned to face Claw'd), shaking when hit, its damage % floating above it
function drawTargets(t) {
  for (const b of bags) {
    const sh = b.hitT * 14, bx = b.x + b.w / 2 + (Math.random() - 0.5) * sh + (b.pinT > 0 ? Math.sin(t * 50) * 1.5 : 0), by = b.y + b.h; // pinned: struggling
    FIGHTER[b.id].draw(bx, by, { rot: b.rot }, Math.sign(P.x + P.w / 2 - bx) || -1, t);
    drawOn(b, bx);
    ctx.font = '700 30px Caveat, cursive'; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeStyle = INK;
    const pct = Math.round(b.dmg) + '%';
    ctx.strokeText(pct, bx, b.y - 12); ctx.fillStyle = dmgColor(b.dmg); ctx.fillText(pct, bx, b.y - 12);
  }
  ctx.textAlign = 'left';
}
const drawStuck = () => { for (const c of fighters) drawOn(c.P, c.P.x + c.P.w / 2); ctx.textAlign = 'left'; }; // over the fighters
// what's on a target (the bag or a fighter), centred on bx
function drawOn(b, bx) {
  if (b.pinT > 0) drawPin(...b.pinAt, Math.min(1, b.pinT * 5)); // Wumpus's pin, still stuck through it (fades as it pops free)
  if (b.grabbed && b.pings) { // unread pings from Wumpus's pummel: a red badge on its shoulder
    const x = bx + b.w / 2 - 2, y = b.y + 4; ctx.fillStyle = '#ed4245'; ctx.strokeStyle = INK; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = '700 11px ui-sans-serif, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.pings, x, y + 0.5); ctx.textBaseline = 'alphabetic';
  }
  if (b.slowT > 0) { ctx.font = '700 11px ui-monospace, Menlo, monospace'; ctx.textAlign = 'center'; ctx.fillStyle = INK; ctx.fillText(`slowmode · ${Math.ceil(b.slowT)}s`, bx, b.y - (b.id === 'bag' ? 44 : 10)); } // Nelly got it
  if (b.sticker) b.sticker.draw(bx, b.y + b.h * 0.45, b.rot, Math.min(1, (b.sticker.secs - b.sticker.t) / 0.3)); // fades at the end

}
// under a fighter's feet when there are CPUs: whose is whose (P1 and its allies orange, a CPU against it grey, like their tags on the select screen); overhead is left to the moves' own text
function drawMark(c) {
  const x = P.x + P.w / 2, y = P.y + P.h + 8, you = c.team === human.team, text = c === human ? 'P1' : you ? 'ALLY' : 'CPU';
  ctx.font = '700 17px Caveat, cursive'; ctx.textAlign = 'center'; const w = ctx.measureText(text).width + 12;
  ctx.fillStyle = you ? CLAWD : '#6b7280'; ctx.beginPath(); ctx.roundRect(x - w / 2, y, w, 17, 4); ctx.moveTo(x - 5, y + 1); ctx.lineTo(x, y - 5); ctx.lineTo(x + 5, y + 1); ctx.fill();
  ctx.fillStyle = PAPER; ctx.fillText(text, x, y + 13); ctx.textAlign = 'left';
}

// hud: P1's badge top right, the CPUs' in a row to its left (the training bag keeps its % overhead instead)
function drawHealth(t) {
  const portrait = (F, face, p = {}, up = 0) => () => { const h = F.box[1] + up, k = Math.min(1, 44 / h / 0.8); ctx.scale(k, k); F.draw(0, h / 2, p, face, t); }; // fit the taller fighters in the circle
  const meter = (Q, S) => S && (Q.buff > 0 ? [Q.buff / S.time, true] : [Q.streak, false]); // Duo's streak meter: filling, or draining while buff
  badge(W - 120, P.dmg, P.hitT, portrait(fighter, 1, { buff: P.buff > 0 ? 1 : 0, eyeFire: P.streak >= 1 }, lift()), stocks, meter(P, DOWN_B.streak), t);
  if (NEUTRAL_B.studs) drawLegoStuds(W - 66, 44, P.studs); // Lego Man's studs, by his badge
  foes.forEach((c, i) => {
    ctx.globalAlpha = c.out ? 0.35 : 1; // faded once out
    badge(W - 120 - (foes.length - i) * 150, c.P.dmg, c.P.hitT, portrait(c.fighter, -1, { buff: c.P.buff > 0 ? 1 : 0, eyeFire: c.P.streak >= 1 }, c.P.buff > 0 ? c.DOWN_B.streak.lift : 0), c.stocks, meter(c.P, c.DOWN_B.streak), t);
  });
  ctx.globalAlpha = 1;
}

// a fighter's damage badge: its portrait in a circle coloured by damage, the % overlapping it, and stock pips if it has lives
function badge(x, dmg, hitT, portrait, lives, streak, t) {
  const sh = hitT * 16, bx = x + (Math.random() - 0.5) * sh, by = 70 + (Math.random() - 0.5) * sh, R = 38; // shakes when hit
  ctx.fillStyle = dmgColor(dmg); ctx.beginPath(); ctx.arc(bx, by, R, 0, 6.28); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.6; ellipse(bx, by, R, R, 1.2);
  ctx.save(); ctx.translate(bx, by); ctx.scale(0.8, 0.8); portrait(); ctx.restore(); // centred inside
  // damage %, overlapping the circle's bottom right, filled with the same colour
  ctx.font = '700 36px Caveat, cursive'; ctx.lineWidth = 3.5; ctx.textAlign = 'left'; ctx.strokeStyle = INK; // grows rightward, away from the circle
  const pct = Math.round(dmg) + '%', tx = bx + 12, ty = by + R + 6;
  ctx.strokeText(pct, tx, ty); ctx.fillStyle = dmgColor(dmg); ctx.fillText(pct, tx, ty);
  // stocks: a white pip per life left (lost ones just go), wrapping the circle's bottom-left quarter, starting at the bottom
  for (let i = 0; i < lives; i++) {
    const a = Math.PI / 2 - 0.04 + i * 0.38, px = bx + (R + 11) * Math.cos(a), py = by + (R + 11) * Math.sin(a);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 5, 0, 6.28); ctx.fill();
    ctx.lineWidth = 1.6; ellipse(px, py, 5, 5, 0.5);
  }
  if (streak) drawStreakMeter(bx, by, R + 12, ...streak, t);
}

// Duo's streak meter, curved over the top of its badge like Little Mac's KO meter: an orange flame fill from the left, a flame riding its
// tip. Full, it throbs and glows; buff (on), it's the time left, draining
function drawStreakMeter(x, y, r, v, on, t) {
  const a0 = Math.PI * 1.1, a1 = Math.PI * 1.9, at = a0 + (a1 - a0) * v, hot = on || v >= 1, pulse = hot ? 0.5 + 0.5 * Math.sin(t * 10) : 0;
  const arc = (a, b) => { ctx.beginPath(); ctx.arc(x, y, r, a, b); ctx.stroke(); };
  ctx.save(); ctx.lineCap = 'round';
  ctx.strokeStyle = INK; ctx.lineWidth = 11; arc(a0, a1); // the track
  ctx.strokeStyle = '#e5ddcb'; ctx.lineWidth = 6; arc(a0, a1);
  if (v > 0.01) {
    if (hot) { ctx.shadowColor = '#ff9600'; ctx.shadowBlur = 8 + 10 * pulse; }
    ctx.strokeStyle = '#ff9600'; ctx.lineWidth = 6 + 1.5 * pulse; arc(a0, at);
    ctx.shadowBlur = 0; ctx.strokeStyle = '#ffc800'; ctx.lineWidth = 2.5; arc(a0, at); // a hot yellow core
  }
  ctx.translate(x + r * Math.cos(at), y + r * Math.sin(at) + 5); ctx.scale(0.3 + 0.08 * pulse, 0.3 + 0.08 * pulse);
  drawStreakFlame(0, 0, 44, v > 0.01 ? 1 : 0.35); // the flame on its tip (grey-faint when empty)
  ctx.restore();
}

const menuY = () => home ? H / 2 + 140 : H / 2 + 10, MENU_DY = 46; // first menu row's baseline (home: below the title and lineup), row to row

// home title: SUPA over a tilted, ink-shadowed SMACKDOWN, then the fighters lined up on a ground line, Claw'd in the middle
function drawTitle(t) {
  ctx.save(); ctx.translate(W / 2, 215); ctx.rotate(-0.035);
  ctx.font = '700 44px Caveat, cursive'; ctx.letterSpacing = '14px'; ctx.fillStyle = INK; ctx.fillText('SUPA', 7, -112);
  ctx.letterSpacing = '0px'; ctx.font = '700 132px Caveat, cursive';
  ctx.fillText('SMACKDOWN', 5, 5); ctx.fillStyle = CLAWD; ctx.fillText('SMACKDOWN', 0, 0);
  ctx.strokeStyle = INK; ctx.lineWidth = 3; line(-250, 22, 250, 18, 2, 2); // scribbled underline
  ctx.restore();
  const gy = H / 2 + 85;
  ctx.strokeStyle = INK; ctx.lineWidth = 2; line(W / 2 - 420, gy, W / 2 + 420, gy, 1.2, 1);
  [[-400, drawWumpus, 1], [-300, drawGrok, 1], [-200, drawLego, 1], [-100, drawSnoopy, 1], [0, drawClawd, 1], [100, drawMuse, -1], [200, drawSnoo, -1], [300, drawAndroid, -1], [400, drawDuo, -1]].forEach(([x, draw, face], i) => {
    ctx.save(); ctx.translate(W / 2 + x, gy); ctx.scale(1.4, 1.4); draw(0, 0, idleAt(t, i), face); ctx.restore();
  });
}
// Claw'd's idle loop (every fighter can pose it) at time t, the k-th fighter out of step with the others so they don't breathe in unison
const idleAt = (t, k = 0) => M.idle.anim((Math.floor(t * 60) + 47 * k) % 120, 120);

function drawPause(t) {
  // home: clean paper with ink; pause / game over: the frozen game dimmed with light text
  if (home) ctx.clearRect(0, 0, W, H);
  else { ctx.fillStyle = `rgba(38,35,31,${showControls ? 0.94 : 0.8})`; ctx.fillRect(0, 0, W, H); } // near-solid behind the controls
  if (picking) return drawSelect(t);
  if (vsT != null) return drawVersus((performance.now() - vsT) / 1000);
  ctx.fillStyle = ctx.strokeStyle = home ? INK : '#efe7d6'; ctx.textAlign = 'center';
  if (home && !showControls) {
    drawTitle(t);
  } else if (!showControls) { ctx.font = '700 84px Caveat, cursive'; ctx.fillText(over ? (over === 'win' ? 'victory!' : 'defeat') : 'paused', W / 2, H / 2 - 70); }
  if (showControls) drawKeys(home ? INK : '#efe7d6');
  else {
    ctx.font = '600 40px Caveat, cursive';
    menu.forEach((m, i) => {
      ctx.globalAlpha = i === sel ? 1 : 0.5;
      ctx.fillText((i === sel ? '›  ' : '') + (m === 'sound' ? `sound ${sfx.on ? 'on' : 'off'}` : m === 'music' ? `music ${sfx.musicLevel ? Math.round(sfx.musicLevel * 100) + '%' : 'off'}` : m) + (i === sel ? '  ‹' : ''), W / 2, menuY() + i * MENU_DY);
    });
  }
  ctx.globalAlpha = 0.6; ctx.font = '600 22px Caveat, cursive'; // key hints (none on the home screen)
  if (showControls || !home) ctx.fillText(showControls ? keyEdit?.wait ? `press a key for ${ACTION_NAMES[ACTIONS[keyEdit.r]]} · Esc cancel` : '↑ ↓ ← → choose · Enter / click  change · Esc back' : '↑ ↓ choose' + (menu[sel] === 'music' ? ' · ← → volume' : '') + ' · Enter / Space / click select' + (over ? '' : ' · Esc resume'), W / 2, showControls ? H - 34 : H / 2 + 290);
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

// vs screen: the pick on a peach panel sliding in from the left, the CPUs (or the training bag) on an ink one from the right,
// split on a slant, and a big VS popping in between. Plays VS_TIME seconds, then the fight starts (any key / click skips)
const VS_TIME = 2.4;
function drawVersus(s) {
  const ease = k => 1 - (1 - Math.min(1, Math.max(0, k))) ** 3, slide = ease(s / 0.35), cut = 70;
  const left = [[0, 0], [W / 2 + cut, 0], [W / 2 - cut, H], [0, H]], right = [[W / 2 + cut, 0], [W, 0], [W, H], [W / 2 - cut, H]];
  ctx.save(); ctx.translate(-(1 - slide) * W / 2, 0);
  ctx.fillStyle = '#f3cdb9'; path(left); ctx.fill(); ctx.strokeStyle = CLAWD; hatch(left, 16, 0.35);
  ctx.save(); ctx.translate(W * 0.27, H * 0.7); ctx.scale(3.4, 3.4); fighter.draw(0, 0, {}, 1, s); ctx.restore();
  ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 76px Caveat, cursive'; ctx.fillText(fighter.name, W * 0.27, H * 0.88);
  ctx.restore();
  ctx.save(); ctx.translate((1 - slide) * W / 2, 0);
  ctx.fillStyle = INK; path(right); ctx.fill(); ctx.strokeStyle = PAPER; hatch(right, 16, 0.08);
  const glow = ctx.createRadialGradient(W * 0.73, H * 0.58, 10, W * 0.73, H * 0.58, 190); glow.addColorStop(0, 'rgba(242,237,226,0.22)'); glow.addColorStop(1, 'rgba(242,237,226,0)');
  ctx.fillStyle = glow; ctx.fillRect(W / 2, 0, W / 2, H); // a spotlight on them
  const foes = rolled.length ? rolled : ['bag'], n = foes.length, k = [3, 2.3, 1.8][n - 1], gap = [0, 200, 160][n - 1];
  foes.forEach((id, i) => {
    ctx.save(); ctx.translate(W * 0.73 + (i - (n - 1) / 2) * gap, H * 0.7); ctx.scale(k, k);
    FIGHTER[id].draw(0, 0, { rot: id === 'bag' ? Math.sin(s * 3) * 0.04 : 0 }, -1, s); ctx.restore();
  });
  ctx.fillStyle = PAPER; ctx.textAlign = 'center'; ctx.font = `700 ${n > 1 ? 44 : 76}px Caveat, cursive`; ctx.fillText(foes.map(id => FIGHTER[id].name).join(' · '), W * 0.73, H * 0.88);
  if (rolled.length) { ctx.font = '600 30px Caveat, cursive'; ctx.globalAlpha = 0.75; ctx.fillText(rolled.map((_, i) => LVL[lvls[i] ?? 3][0]).join(' · '), W * 0.73, H * 0.95); ctx.globalAlpha = 1; } // their levels
  ctx.restore();
  ctx.strokeStyle = PAPER; ctx.lineWidth = 6; line(W / 2 + cut, -10, W / 2 - cut, H + 10, 3, 2); // the seam
  const pop = s < 0.3 ? 0 : 1 + 1.4 * (1 - ease((s - 0.3) / 0.18)); // VS slams in after the panels
  if (pop) {
    ctx.save(); ctx.translate(W / 2, H * 0.42); ctx.rotate(-0.08); ctx.scale(pop, pop);
    ctx.font = '700 190px Caveat, cursive'; ctx.textAlign = 'center';
    ctx.fillStyle = INK; ctx.fillText('VS', 8, 8); ctx.fillStyle = PAPER; ctx.fillText('VS', 0, 0);
    ctx.restore();
  }
  ctx.textAlign = 'left';
}

    ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 28px Caveat, cursive'; ctx.fillText('Random', x + TILE.w / 2, y + TILE.h - 12);
    pickTags(x, y, 'random');
  }

  // READY TO FIGHT: a slightly slanted orange band right across
  const br = [[0, BAND.y + 6], [W, BAND.y - 6], [W, BAND.y + BAND.h - 6], [0, BAND.y + BAND.h + 6]], txt = !p1 ? 'PICK YOUR FIGHTER' : onBand ? '›  READY TO FIGHT  ‹' : 'READY TO FIGHT';
  ctx.fillStyle = CLAWD; path(br); ctx.fill(); ctx.strokeStyle = INK; hatch(br, 14, 0.18); ctx.lineWidth = onBand ? 3.4 : 2; poly(br, 1.2);
  ctx.save(); ctx.translate(W / 2, BAND.y + BAND.h / 2 + 15); ctx.rotate(-0.01); ctx.textAlign = 'center'; ctx.font = '700 46px Caveat, cursive';
  ctx.fillStyle = INK; ctx.fillText(txt, 3, 3); ctx.fillStyle = PAPER; ctx.fillText(txt, 0, 0); ctx.restore();

  for (let i = 0; i <= MAX_CPUS; i++) { // player slots: P1, then the CPUs
    const x = slotX(i), y = SLOT.y, id = i ? cpus[i - 1] ?? (i === 1 && !cpus.length && p1 ? 'bag' : null) : p1, ghost = id === 'bag', r = rect(x, y, SLOT.w, SLOT.h);
    ctx.textAlign = 'center';
    if (!id) { // empty slot: P1 waiting for its pick, or room for a CPU
      ctx.globalAlpha = i ? 0.4 : 0.8; ctx.strokeStyle = ctx.fillStyle = i ? INK : CLAWD; ctx.lineWidth = 2; ctx.setLineDash([10, 8]); ctx.strokeRect(x, y, SLOT.w, SLOT.h); ctx.setLineDash([]);
      ctx.font = '700 44px Caveat, cursive'; ctx.fillText(i ? '+ CPU' : 'P1', x + SLOT.w / 2, y + SLOT.h / 2);
      ctx.font = '600 22px Caveat, cursive'; ctx.fillText(i ? (p1 ? 'pick a fighter above' : 'after your fighter') : 'pick your fighter above', x + SLOT.w / 2, y + SLOT.h / 2 + 32); ctx.globalAlpha = 1; continue;
    }
    ctx.globalAlpha = ghost ? 0.5 : 1;
    ctx.fillStyle = i ? '#d6d2c9' : '#f3cdb9'; path(r); ctx.fill(); ctx.strokeStyle = i ? INK : CLAWD; hatch(r, 16, 0.12);
    const cpu = i && !ghost; // (standing a little higher, over its level pills)
    ctx.save(); ctx.beginPath(); ctx.rect(x + 2, y + 2, SLOT.w - 4, SLOT.h - 64); ctx.clip();
    ctx.translate(x + SLOT.w / 2, y + (cpu ? 208 : 240)); ctx.scale(2.4, 2.4); FIGHTER[id].draw(0, 0, {}, i ? -1 : 1, t); ctx.restore();
    ctx.fillStyle = INK; path(rect(x, y + SLOT.h - 62, SLOT.w, 62)); ctx.fill(); // name plate
    ctx.fillStyle = PAPER; ctx.font = '700 40px Caveat, cursive'; ctx.fillText(FIGHTER[id].name, x + SLOT.w / 2, y + SLOT.h - 18);
    ctx.strokeStyle = i ? INK : CLAWD; ctx.lineWidth = i ? 2.4 : 3.4; poly(r, 1.2);
    const ally = i && !ghost && cpus.length > 1 && mode === 'teams' && !sides[i - 1], teamed = i && !ghost && cpus.length > 1 && mode === 'teams';
    tag(x + 10, y + 10, i ? (ghost ? 'no CPUs' : teamed ? `CPU ${i} · ${ally ? 'with you' : 'against you'}` : `CPU ${i}`) : 'P1', i && !ally ? '#6b7280' : CLAWD);
    if (!ghost) { ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 34px Caveat, cursive'; ctx.fillText('×', x + SLOT.w - 20, y + 32); }
    if (cpu) { // its level: ‹ name ›
      const [name, col] = LVL[lvls[i - 1]], px = pillX(i), cy = PILL.y + 25;
      ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(px, PILL.y, PILL.w, PILL.h, 17); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = '700 26px Caveat, cursive'; ctx.fillText(name, px + PILL.w / 2, cy);
      ctx.font = '700 34px Caveat, cursive'; ctx.fillText('‹', px + 18, cy + 2); ctx.fillText('›', px + PILL.w - 18, cy + 2);
    }
  }
  if (cpus.length) { ctx.fillStyle = INK; ctx.globalAlpha = 0.6; ctx.textAlign = 'center'; ctx.font = '600 22px Caveat, cursive'; ctx.fillText('click ‹ › on a CPU to change its level · 1–7 set them all · AI trained = tuned against other AIs' + (cpus.length > 1 ? mode === 'teams' ? ' · click a CPU\'s tag to switch its side' : ' · everyone fights everyone' : ''), W / 2, H - 9); ctx.globalAlpha = 1; }
  ctx.textAlign = 'left';
}

// the controls screen: a row per action with its two slots (KEYS_AT.x[set], row y = KEYS_AT.y + r * KEYS_AT.dy), then reset under them
const KEYS_AT = { x: [560, 800], y: 200, dy: 40, w: 190, h: 34 }, ACTION_NAMES = { attack: 'light' };
function slotAt(x, y) {
  const r = Math.round((y + 8 - KEYS_AT.y) / KEYS_AT.dy), c = KEYS_AT.x.findIndex(cx => Math.abs(x - cx) < KEYS_AT.w / 2);
  if (r === ACTIONS.length + 1 && Math.abs(x - 680) < KEYS_AT.w / 2) return { r: ACTIONS.length, c: 0 }; // reset (a row's gap below the slots)
  return r >= 0 && r < ACTIONS.length && c >= 0 && Math.abs(y + 8 - KEYS_AT.y - r * KEYS_AT.dy) < KEYS_AT.h / 2 ? { r, c } : null;
}
function drawKeys(fg) {
  const { x: X, y: Y, dy, w, h } = KEYS_AT, box = (cx, y, on) => { ctx.globalAlpha = on ? 1 : 0.25; ctx.strokeStyle = on ? CLAWD : fg; ctx.lineWidth = on ? 2.6 : 1.4; ctx.beginPath(); ctx.roundRect(cx - w / 2, y - 25, w, h, 6); ctx.stroke(); };
  ctx.font = '700 72px Caveat, cursive'; ctx.textAlign = 'center'; ctx.fillText('controls', W / 2, 92);
  ctx.font = '700 30px Caveat, cursive'; ctx.globalAlpha = 0.8; X.forEach((cx, s) => ctx.fillText(`keys ${s + 1}`, cx, Y - 42));
  ACTIONS.forEach((a, r) => {
    const y = Y + r * dy;
    ctx.globalAlpha = 0.8; ctx.fillStyle = fg; ctx.textAlign = 'right'; ctx.font = '700 28px Caveat, cursive'; ctx.fillText(ACTION_NAMES[a] ?? a, X[0] - w / 2 - 24, y);
    X.forEach((cx, s) => {
      const on = keyEdit.r === r && keyEdit.c === s, waiting = on && keyEdit.wait;
      box(cx, y, on); ctx.globalAlpha = 1; ctx.fillStyle = waiting ? fg : CLAWD; ctx.textAlign = 'center'; ctx.font = '700 26px Caveat, cursive';
      ctx.fillText(waiting ? 'press a key…' : keyName(binds[s][a]), cx, y);
    });
  });
  const y = Y + (ACTIONS.length + 1) * dy, on = keyEdit.r === ACTIONS.length;
  box(680, y, on); ctx.globalAlpha = on ? 1 : 0.8; ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.font = '700 26px Caveat, cursive'; ctx.fillText('reset to defaults', 680, y);
  ctx.globalAlpha = 1; ctx.fillStyle = ctx.strokeStyle = fg;
}

let last = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  const snap = Math.round(dt / (STEP / 2)) * STEP / 2; if (snap && Math.abs(dt - snap) < 0.002) dt = snap; // a 60 / 120 Hz frame's timing wobble would sometimes give 0 steps then 2 (a stutter): count it as exactly one refresh
  acc += dt;
  if (paused) acc = 0;
  if (vsT != null && now - vsT > VS_TIME * 1000) fight();
  let steps = 0;
  while (!paused && acc >= STEP) { update(STEP); acc -= STEP; steps++; } // game over can pause mid-frame
  if (!paused) stepCam(dt); // after the moves, so it frames what's drawn
  sfx.music(over ? null : home || picking || vsT != null ? 'menu' : paused ? 'pause' : 'fight');
  if (steps || paused) render(now / 1000); // a frame with no step would redraw the same picture (120 Hz+ screens: half the draws)
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

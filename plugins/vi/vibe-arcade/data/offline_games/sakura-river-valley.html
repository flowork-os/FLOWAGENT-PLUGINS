<!--
  Real-time scene built with three.js (MIT, https://threejs.org), bundled with local assets.
  Textures and scanned rocks/ferns/roots: Poly Haven (CC0, https://polyhaven.com):
  sakura_bark, pine_bark, lichen_rock, forrest_ground_01, forest_ground_04, ganges_river_pebbles,
  japanese_stone_wall, weathered_planks, rock_moss_set_01/02, rock_face_01, fern_02, root_cluster_01.
  Everything else (terrain, trees, temples, water, sky, particles) is generated procedurally at load.
-->
<style>
  :root { --bg: #0b0f10; --ink: #e9c89b; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas#c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  /* loading: an ensō brushes itself round as the valley is built; a light circles it while the page downloads */
  #load { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 52%, #151c1d 0%, var(--bg) 68%); display: grid; place-items: center; transition: opacity 1.1s ease; z-index: 2; pointer-events: none; }
  #load .mark { position: relative; width: min(140px, 32vw); aspect-ratio: 1; }
  #load svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #load .track { fill: none; stroke: rgba(233, 200, 155, 0.07); stroke-width: 2; }
  #load .comet { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 0.07 0.93; opacity: 0.75; animation: ensoOrbit 2.2s linear infinite; transition: opacity 0.8s ease; }
  #load.go .comet { opacity: 0.18; }
  #load .enso { fill: none; stroke: var(--ink); stroke-width: 3.6; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 0.985; transition: stroke-dashoffset 0.6s cubic-bezier(.3,.7,.2,1); filter: url(#ensoBrush) drop-shadow(0 0 5px rgba(233, 200, 155, 0.55)); }
  #load .ember { fill: #f1c98f; opacity: 0.85; animation: ensoBreath 3.2s ease-in-out infinite; transform-origin: 60px 60px; }
  #load i { position: absolute; width: 8px; height: 5px; border-radius: 70% 0 70% 0; background: #efb3c2; opacity: 0; animation: ensoPetal 7s linear infinite; }
  @keyframes ensoOrbit { to { stroke-dashoffset: -1; } }
  @keyframes ensoBreath { 0%, 100% { opacity: 0.35; transform: scale(0.8); } 50% { opacity: 0.95; transform: scale(1.15); } }
  @keyframes ensoPetal { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 12% { opacity: 0.85; } 80% { opacity: 0.55; } 100% { transform: translate(70px, 150px) rotate(560deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #load .comet, #load .ember, #load i { animation: none; } #load i { display: none; } }
</style>
<meta property="og:title" content="Sakura River Valley" />
<meta property="og:description" content="A real time 3D mountain river valley in feudal East Asia at golden hour" />
<meta property="og:url" content="https://valley.mengto.here.now/" />

<body>
<canvas id="c" tabindex="0"></canvas>
<div id="load" aria-hidden="true"><div class="mark">
  <svg viewBox="0 0 120 120">
    <defs><filter id="ensoBrush" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="1.8"/></filter></defs>
    <circle class="track" cx="60" cy="60" r="44"/>
    <path class="comet" pathLength="1" d="M60 16 A44 44 0 1 1 59.99 16"/>
    <path id="enso" class="enso" pathLength="1" d="M18.65 44.95 A44 44 0 1 1 16.67 67.64"/>
    <circle class="ember" cx="60" cy="60" r="2.2"/>
  </svg>
  <i style="left:8%;top:-8%;animation-delay:0s"></i><i style="left:38%;top:-18%;animation-delay:1.6s;animation-duration:8.5s"></i><i style="left:66%;top:-4%;animation-delay:3.1s"></i><i style="left:-14%;top:20%;animation-delay:4.4s;animation-duration:9s"></i><i style="left:52%;top:10%;animation-delay:5.6s;animation-duration:6.5s"></i>
</div></div>
<script>window.__load = function (p) { var e = document.getElementById('enso'); if (!e) return; document.getElementById('load').className = 'go'; e.style.strokeDashoffset = String(1 - Math.max(0.015, Math.min(1, p))); };</script>
<script defer src="./scene-SV5IBQX7.js"></script>

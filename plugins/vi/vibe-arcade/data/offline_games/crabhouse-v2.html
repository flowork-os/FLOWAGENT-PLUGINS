<!doctype html>
<html lang="ja">
<head>
  <base href="https://kamibukuro18.github.io/opuscrabhouse/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbefdc">
<title>Crabhouse — カニのおうち</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="kp" id="kpBox"><i class="coin"></i><b id="kp">0</b><span>KP</span></div>
    <div class="meta"><span id="count"></span><span id="rate"></span></div>
    <button id="btnSet" class="icon" aria-label="せってい">≡</button>
  </header>

  <div id="stage">
    <canvas id="room" width="192" height="144"></canvas>
    <div id="label" hidden></div>
    <div id="fever"><i></i><span>フィーバー ゲージ</span></div>
    <div id="combo" hidden></div>
    <div id="flash"></div>
    <div id="banner"></div>
  </div>

  <div id="dialog" class="win" role="status" aria-live="polite">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgNext">▼</div>
  </div>

  <nav id="menu">
    <button data-act="invite">ドア<small id="costInvite"></small></button>
    <button data-act="crabs">カニたち<small id="crabNum"></small></button>
    <button data-act="train">きたえる<small>パワーアップ</small></button>
    <button data-act="tanken">たんけん<small id="tankenNum"></small></button>
    <button data-act="quest">おねがい<small id="questNum"></small></button>
    <button data-act="shop">もようがえ<small>かぐ・ぞうちく</small></button>
    <button data-act="zukan">ずかん<small id="zukanNum"></small></button>
    <button data-act="music">おんがく<small id="trackName"></small></button>
  </nav>
</div>

<div id="modal" hidden>
  <div class="win sheet">
    <div class="mhead"><h2 id="mTitle"></h2><button id="mClose" class="icon" aria-label="とじる">×</button></div>
    <div id="mTabs"></div>
    <div id="mBody"></div>
  </div>
</div>

<div id="title">
  <div class="logo"><span class="en">Crabhouse</span><span class="jp">〜 カニの おうち 〜</span></div>
  <canvas id="titleCv" width="192" height="40"></canvas>
  <button id="btnStart" class="big">Go To House</button>
  <p class="hint">おとが でます ♪</p>
</div>

<script src="game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <base href="https://carbon-body.bloomlabs.games/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Carbon Body</title>
<style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}</style>
</head>
<body>
<title>Carbon Body</title>
<meta name="description" content="A side-scrolling action game inside a possessed photocopier. Fight as paper, flow as ink.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Special+Elite&display=swap">
<style>
:root{
  --printer:#1c1a1e; --printer2:#2a272c; --paper:#EFE4CB; --ink:#16131A; --blue:#1F4BFF; --orange:#FF5A1F;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--printer);overflow:hidden;}
body{
  font-family:"Special Elite","Courier New",monospace;color:var(--paper);
  background:
    radial-gradient(120% 80% at 50% 0%, #34303a 0%, var(--printer) 60%),
    var(--printer);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-inline:16px;box-sizing:border-box;}
#slot{position:relative;height:12px;border-radius:6px 6px 0 0;background:linear-gradient(#0c0b0d,#3a3640 60%,#141216);box-shadow:0 2px 0 #000 inset;}
#slot::after{content:"";position:absolute;left:8%;right:8%;top:5px;height:2px;background:repeating-linear-gradient(90deg,#555 0 18px,#111 18px 30px);opacity:.6;}
#game{display:block;background:var(--paper);touch-action:none;outline:none;
  box-shadow:0 1px 0 rgba(255,255,255,.06), 0 24px 60px rgba(0,0,0,.65), 0 0 0 1px #000;}
#game:focus-visible{box-shadow:0 0 0 3px var(--orange),0 24px 60px rgba(0,0,0,.65);}
/* ---- touch mode: phones and tablets ---- */
body.tmode{overscroll-behavior:none;touch-action:none;}
body.tmode #stage{padding:0;justify-content:center;}
body.tmode #slot{display:none;}
body.tmode #game:focus-visible{box-shadow:none;}
#tpad{display:none;position:fixed;inset:0;z-index:5;pointer-events:none;touch-action:none;-webkit-tap-highlight-color:transparent;}
body.tmode #tpad{display:block;}
#tpad.live{pointer-events:auto;}
#tpad .tbtn,#tpad .tstick,#tpad .tpause{position:absolute;box-sizing:border-box;pointer-events:none;opacity:0;transition:opacity .18s;}
#tpad.live .tbtn,#tpad.live .tpause{opacity:.85;}
.tbtn{border-radius:50%;border:2.5px solid #16131A;background:rgba(239,228,203,.42);color:#16131A;display:flex;flex-direction:column;align-items:center;justify-content:center;
  box-shadow:3px 4px 0 rgba(31,75,255,.72);font-family:"Dela Gothic One","Arial Black",sans-serif;line-height:1;text-align:center;}
.tbtn b{font-weight:400;font-size:var(--fs,14px);letter-spacing:.02em;}
.tbtn i{font-style:normal;font-family:"Special Elite","Courier New",monospace;font-size:calc(var(--fs,14px) * .72);margin-top:3px;opacity:.85;}
.tbtn.hot{background:rgba(255,90,31,.6);}
.tbtn.dn{transform:translate(2px,3px);box-shadow:1px 1px 0 rgba(31,75,255,.8);background:rgba(239,228,203,.9);}
.tbtn.hot.dn{background:rgba(255,90,31,.92);}
#tpad.live .tbtn.off{opacity:.3;}
.tstick{border-radius:50%;border:2px dashed rgba(239,228,203,.75);background:rgba(22,19,26,.18);}
.tstick::before{content:"";position:absolute;inset:18%;border-radius:50%;border:1.5px solid rgba(22,19,26,.35);}
.tstick .tk{position:absolute;left:50%;top:50%;border-radius:50%;background:#16131A;border:2px solid rgba(239,228,203,.85);box-shadow:inset -4px -5px 0 rgba(31,75,255,.55);transform:translate(-50%,-50%);}
.tstick .tl{position:absolute;left:0;right:0;top:100%;margin-top:4px;text-align:center;font:11px "Dela Gothic One","Arial Black",sans-serif;color:rgba(239,228,203,.8);text-shadow:0 1px 0 #000;}
#tpad.live .tstick.idle{opacity:.45;}
#tpad.live .tstick.idle.known{opacity:.16;}
#tpad.live .tstick.act{opacity:.9;transition:none;}
.tpause{border:2px solid #16131A;border-radius:7px;background:rgba(239,228,203,.62);box-shadow:2px 3px 0 rgba(31,75,255,.72);display:flex;align-items:center;justify-content:center;gap:5px;}
.tpause::before,.tpause::after{content:"";width:5px;height:42%;background:#16131A;border-radius:1px;}
#trot{display:none;position:fixed;left:0;right:0;text-align:center;font:12px "Special Elite","Courier New",monospace;color:rgba(239,228,203,.7);pointer-events:none;letter-spacing:.03em;}
body.tmode.tport #trot{display:block;}
@media (max-height:520px){#slot{display:none}}
@media (prefers-reduced-motion: reduce){ #slot::after{opacity:.3} }
</style>
<div id="stage">
  <div id="slot"></div>
  <canvas id="game" width="960" height="540" tabindex="0" aria-label="Carbon Body game canvas"></canvas>
</div>
<div id="tpad" aria-hidden="true">
  <div class="tstick idle"><div class="tk"></div><div class="tl">MOVE</div></div>
  <div class="tpause"></div>
</div>
<div id="trot" aria-hidden="true">↻ turn your phone sideways for a bigger page</div>

<script>

// ---- 00_platform.js
// ======================================================================
//  PLATFORM — the only file that knows the bloomplay SDK exists.
//  It is imported from the game's own origin at boot, so this same build
//  still runs from a plain static server (where the import 404s) and from
//  scratch/test.html. Off the platform every call below is a local no-op
//  and the game behaves exactly as it always did: the save file lives in
//  this browser and online co-op is unavailable.
//  The save file is one KV document: localStorage stays the synchronous
//  cache, KV is the truth that follows the player to another machine.
// ======================================================================
const SAVE_DOC = 'save';
const Plat = {
  sdk: null, ctx: null, me: null, online: false,
  embedded: window.parent !== window,
  shown: false, told: false, inPlay: false,
  dirty: false, flushT: null, runT: 0, mode: '', label: '', seen: {},
  load: null,         // the newest boot figure, waiting for the SDK module
  awayReal: 0,        // G.real when the platform last hid us (see hostResume)

  // ---------------------------------------------------------------- handshake
  async start() {
    // not in a frame: nobody is hosting us, and asking for the module would only
    // be a failed fetch in the console of every offline copy
    if (!this.embedded) return;
    try {
      const mod = await import('/sdk/bloomplay.js');
      // opened on the games origin directly: init() would wait for a host forever
      // The save file is asked for in the handshake, so it is read by the time
      // init() resolves — one round trip, and no watchdog gating the menu on it.
      if (mod.bloomplay.isEmbedded) {
        // Held the moment the module answers, so the boot figure boot() already
        // reported goes out NOW rather than in the same breath as loaded(),
        // where it would buy no patience at all. Only ctx waits for the host.
        this.sdk = mod.bloomplay;
        this.flushLoading();
        this.ctx = await this.sdk.init({ preload: [SAVE_DOC] });
      }
    } catch (e) { /* no SDK here; everything below stays local */ }
    if (!this.sdk || !this.ctx) return;
    try {
      this.me = this.ctx.user; // the handshake already carries the profile
      this.online = (this.ctx.capabilities || []).indexOf('multiplayer') >= 0;
      // The page's own mute rides in the handshake, so a player who arrives
      // muted never hears the title song start and stop again.
      AU.setHostMute(!!(this.ctx.audio && this.ctx.audio.muted));
      this.sdk.onMute(m => AU.setHostMute(m));
      this.sdk.onPause(() => this.hostPause());
      this.sdk.onResume(info => this.hostResume(info));
      this.tellLoaded();
      await this.hydrate();
      Net.onPlatform();
    } catch (e) { /* a half-connected host: play on, locally */ }
  },
  // the first painted frame is the title (or the gate): that is "interactive"
  firstFrame() { this.shown = true; this.tellLoaded(); },
  tellLoaded() { if (this.sdk && this.shown && !this.told) { this.told = true; this.sdk.loaded(); } },
  /**
   * How far the copier has warmed up, so the platform draws this boot instead
   * of a spinner over nothing.
   *
   * boot() runs before the SDK module has landed — it is fetched by start()
   * and not waited on, deliberately, so an offline copy never blocks — so the
   * newest figure waits here for it rather than being dropped. Only the newest
   * one is worth keeping: a figure the platform never saw buys no patience.
   */
  loading(f, label) {
    if (this.told) return;
    if (this.sdk) this.sdk.loading(f, label); else this.load = [f, label];
  },
  flushLoading() { if (this.sdk && this.load && !this.told) { this.sdk.loading(this.load[0], this.load[1]); } this.load = null; },

  // ---------------------------------------------------------------- the save file
  // Boot renders from localStorage; the account's document arrives WITH the
  // handshake (init({preload})) and wins if it holds something this browser has
  // not seen. There is nothing left for the menu to wait on — the 2.5 s cap that
  // used to block its confirm was a clock inside a game, which is never a bound.
  async hydrate() {
    // a read that FAILED is not an empty drawer, and filing this browser's copy
    // over a document we could not see would destroy it. `preloaded: null` is the
    // platform saying exactly that, and it is not the same value as "empty".
    const pre = this.ctx.preloaded;
    let e = pre ? pre[SAVE_DOC] : null;
    if (!e) {
      const r = await this.sdk.kv.tryGet(SAVE_DOC);
      if (!r.ok) return;
      e = { value: r.value, version: r.version, updatedAt: r.updatedAt };
    }
    await this.reconcile(e);
  },
  /**
   * Which copy is the save file — decided on the SERVER's version, never on a
   * clock. `SAVE.seenVersion()` is what this machine last filed or took: if the
   * account's document is still at that version, nothing was filed anywhere
   * else and this browser's copy is simply further along. If it moved — or this
   * browser never synced at all, which is every player's first boot after the
   * port — the account's document is the one that followed the player, and it
   * wins. That last case used to be the undefined one, and it is the one where
   * a career is on the table.
   */
  async reconcile(e) {
    const seen = SAVE.seenVersion();
    if (e.version > 0 && e.version !== seen) {
      if (SAVE.adopt(e.value)) SAVE.synced(e.version);
      return;
    }
    if (!SAVE.had) return;
    // Nothing filed for this account, or nothing since this browser last
    // synced: this browser's copy is the save, and filing it is the migration
    // for everyone who played before the port. It is also the one write that
    // can destroy a career, so it is conditional — if another machine filed
    // between the read above and here, we take theirs instead of flattening it.
    try {
      const ack = await this.sdk.kv.set(SAVE_DOC, SAVE.data, { ifVersion: e.version });
      SAVE.synced(ack.version);
    } catch (err) {
      if (err && err.code === 'conflict') {
        const fresh = await this.sdk.kv.getEntry(SAVE_DOC).catch(() => null);
        if (fresh && SAVE.adopt(fresh.value)) SAVE.synced(fresh.version);
      } else {
        this.dirty = true; // a blip: the debounce will try again
      }
    }
  },
  // Beside the cache write, on every change. `pagehide` cannot await an RPC, so
  // the debounced write below simply dropped the last file of a session there;
  // this hands the value over now (one postMessage, no network) and the platform
  // files it when the tab is hidden or the page goes away.
  touch() {
    if (!this.sdk) return;
    this.sdk.kv.setOnExit(SAVE_DOC, SAVE.data);
    this.dirty = true;
    if (this.flushT == null) this.flushT = setTimeout(() => this.flush(), 1200);
  },
  flush() {
    if (this.flushT != null) { clearTimeout(this.flushT); this.flushT = null; }
    if (!this.sdk) return;
    this.dirty = false;
    // Unconditional: this is the session the player is in, and the write that
    // must not clobber another machine is the boot-time one above. Recording
    // the version it landed at is what lets the NEXT boot tell whether
    // anything was filed elsewhere.
    this.sdk.kv.set(SAVE_DOC, SAVE.data).then((ack) => SAVE.synced(ack.version), () => { this.dirty = true; });
  },

  // ---------------------------------------------------------------- lifecycle
  // One read of the game's own state machine: every way into a run passes
  // through it, and so does every way out.
  state(s) {
    const now = !!PLAY_STATES[s];
    if (now === this.inPlay) return;
    this.inPlay = now;
    if (now) {
      this.runT = G.real;
      this.mode = G.endless ? 'degradation' : G.coop ? (G.coop.online ? 'coop-online' : 'coop-local') : 'campaign';
      if (this.sdk) this.sdk.gameplayStart();
      this.track('run_start', { mode: this.mode, file: (curDef() || {}).id || '', hard: !!G.hard });
    } else {
      if (this.sdk) this.sdk.gameplayStop();
      this.track('run_end', { mode: this.mode, outcome: s === 'ending' ? 'ending_' + (G.endKind || 'A').toLowerCase() : 'left', seconds: Math.round(G.real - this.runT) });
      if (this.dirty) this.flush();
    }
  },
  // the tab went away, or the platform put an overlay over us
  hostPause() {
    if (this.dirty) this.flush();
    // Ducking is its own reason for silence, so a player who reaches for [M]
    // while a sign-in sheet is up still has their mute when the sheet goes.
    AU.setDuck(true);
    this.awayReal = G.real;
    if (G.state === 'play' && !G.coop) { G.state = 'pause'; if (typeof touchReleaseAll === 'function' && TUI.on) touchReleaseAll(); }
  },
  /**
   * Back, and `hiddenMs` is how long we were gone — measured by the platform,
   * outside the frame that was not running, which is the only honest place to
   * measure it from. Online, the copier keeps a throttled timer stepping the
   * world while hidden; the gap that timer managed is `G.real - awayReal`, and
   * the difference between the two figures is the stretch NOTHING ran for.
   * Net decides what that is worth.
   */
  hostResume(info) {
    AU.setDuck(false);
    const ms = info && typeof info.hiddenMs === 'number' ? info.hiddenMs : 0;
    Net.resumed(ms, Math.max(0, G.real - this.awayReal));
  },

  // ---------------------------------------------------------------- outside the game
  progress(label) { if (this.sdk && label && label !== this.label) { this.label = label; this.sdk.progress.set(label); } },
  moment(name) { if (this.sdk && !this.seen[name]) { this.seen[name] = 1; this.sdk.progress.moment(name); } },
  track(event, props) { if (this.sdk) this.sdk.analytics.track(event, props); },

  // ---------------------------------------------------------------- relay rooms
  mp() { return this.online ? this.sdk.multiplayer : null; },
  /** Where the room connection stands: 'connected' | 'reconnecting' |
   * 'disconnected'. Until the SDK reported this, a dead line looked exactly
   * like a pal walking off, and both copiers quit to the title over it. */
  onConnection(fn) {
    const mp = this.mp();
    if (!mp || typeof mp.onConnectionChange !== 'function') return () => { };
    return mp.onConnectionChange(fn);
  },
  inviteRoom() { return (this.ctx && this.ctx.joinPayload && this.ctx.joinPayload.roomId) || null; },
  async invite() {
    if (!this.sdk) return false;
    await Net.open(); // the share sheet needs a room to point at
    if (!Net.room) return false;
    const r = await this.sdk.social.invite().catch(() => null);
    return !!(r && r.ok);
  },
};
// the states that mean "a run is happening" (pause and the card screens included)
const PLAY_STATES = { play: 1, pause: 1, memo: 1, review: 1, shop: 1, manga: 1, dgover: 1, verdict: 1 };

// ---- 01_core.js
'use strict';
// ======================================================================
//  CARBON BODY — core
// ======================================================================
const W = 960, H = 540, T = 30, TAU = Math.PI * 2;
// the playfield window inside the photocopier casing
const VIEW = { x: 84, y: 46, w: 792, h: 450, cx: 480, cy: 271 };
// Paper stocks: the whole game is printed on whichever stock is loaded in the tray.
const STOCKS = [
  { id: 'cream', name: 'OFFICE CREAM', note: 'the standard issue', need: 0, paper: [239, 228, 203], hi: [247, 240, 222], ink: [22, 19, 26], blue: [31, 75, 255], orange: [255, 90, 31] },
  { id: 'pink', name: 'CARBONLESS PINK', note: 'copy 3 of 3, for the files', need: 3, paper: [243, 207, 202], hi: [250, 226, 222], ink: [27, 22, 48], blue: [52, 66, 200], orange: [232, 44, 72] },
  { id: 'canary', name: 'CANARY', note: 'copy 2 of 3, for accounting', need: 6, paper: [238, 224, 150], hi: [247, 238, 190], ink: [24, 22, 26], blue: [28, 92, 204], orange: [226, 70, 22] },
  { id: 'news', name: 'NEWSPRINT', note: 'extra! extra!', need: 9, paper: [214, 209, 195], hi: [228, 224, 212], ink: [17, 17, 17], blue: [66, 82, 112], orange: [212, 36, 36] },
  { id: 'fax', name: 'THERMAL FAX', note: 'fades in sunlight', need: 12, paper: [241, 239, 232], hi: [250, 249, 244], ink: [44, 34, 54], blue: [118, 88, 196], orange: [240, 108, 64] },
  { id: 'diazo', name: 'DIAZO BLUELINE', note: 'the architect\'s copy', need: 15, paper: [212, 225, 238], hi: [229, 237, 246], ink: [16, 38, 96], blue: [36, 162, 214], orange: [232, 64, 122] },
];
const hex = a => '#' + a.map(v => v.toString(16).padStart(2, '0')).join('');
const COL = {
  blueA: a => `rgba(${COL._b},${a})`, inkA: a => `rgba(${COL._k},${a})`, orA: a => `rgba(${COL._o},${a})`, paperA: a => `rgba(${COL._p},${a})`,
  set(st) {
    this.stock = st.id; this.paper = hex(st.paper); this.paperHi = hex(st.hi); this.ink = hex(st.ink); this.blue = hex(st.blue); this.orange = hex(st.orange);
    this._b = st.blue.join(','); this._k = st.ink.join(','); this._o = st.orange.join(','); this._p = st.paper.join(',');
  },
};
COL.set(STOCKS[0]);
function applyStock(id) {
  const st = STOCKS.find(s => s.id === id) || STOCKS[0];
  COL.set(st);
  if (typeof R !== 'undefined' && R.cv) { R.paper = makePaper(); makePatterns(); R.casing = null; R.cv.style.background = COL.paper; }
}
const F_DISP = '"Dela Gothic One","Arial Black",Impact,sans-serif';
const F_TYPE = '"Special Elite","Courier New",monospace';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rndi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
const dist = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };

function hash(n) {
  n |= 0; n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n ^= n >>> 16;
  return (n >>> 0) / 4294967296;
}
function hash2(a, b) { return hash(Math.imul(a | 0, 73856093) ^ Math.imul(b | 0, 19349663)); }
function srand(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function circRect(cx, cy, r, b) {
  const nx = clamp(cx, b.x, b.x + b.w), ny = clamp(cy, b.y, b.y + b.h);
  return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
}
function segRect(x1, y1, x2, y2, b, pad = 0) {
  // sample segment against rect (cheap, fine for short segments)
  const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 10));
  for (let i = 0; i <= n; i++) {
    const t = i / n, x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t;
    if (x > b.x - pad && x < b.x + b.w + pad && y > b.y - pad && y < b.y + b.h + pad) return true;
  }
  return false;
}
function fmtNum(n) { return Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(+r || 0, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
}
// ---------------------------------------------------------------- global state
const G = {
  t: 0, real: 0, boil: 0, boil2: 0,
  hitstop: 0, timeScale: 1, slowT: 0, slowScale: 1,
  shake: 0, misreg: 0, misAng: 0, neg: 0, zoom: 1, zoomT: 1, baseZoom: 1.2,
  speed: 0, spx: 0, spy: 0,
  state: 'boot', stateT: 0,
  cam: { x: 0, y: 0, lock: null },
  levelIdx: 0,
  unlocked: { burst: false, anchors: false, recall: false },
  seenMemo: {},
  rhythm: 0, rhythmProg: 0, rhythmIdle: 0, lastSwitchT: -9,
  stats: { jams: 0, time: 0, peak: 0, strikes: 0, backstabs: 0 },
  copyNo: 1204553, copyGen: 0,
  arena: null, boss: null,
  flags: {},
  touch: false,
  wt: 0, coop: null, netGuest: false, netHost: false,
};
function addShake(v) { G.shake = Math.min(1, G.shake + v); }
function addMisreg(v, ang) { G.misreg = Math.min(18, G.misreg + v); if (ang !== undefined) G.misAng = ang; else G.misAng = rnd(TAU); }
function ghostPrint(n, dx, dy) { G.ghost = n; G.ghostX = dx; G.ghostY = dy; }
function hitstop(t) { G.hitstop = Math.max(G.hitstop, t); }
function Z() { return G.baseZoom * G.zoom; }
function zoomPunch(z) { G.zoom = Math.max(G.zoom, z); }
function speedLines(t, x, y) { G.speed = Math.max(G.speed, t); G.spx = x; G.spy = y; }
function slowmo(scale, t) { G.slowScale = Math.min(scale, G.slowT > 0 ? G.slowScale : 1); G.slowT = Math.max(G.slowT, t); }

// ---------------------------------------------------------------- input

function drawPlayer() {

}

// ---------------------------------------------------------------- main loop
let lastT = performance.now(), acc = 0;

  if (Input.pressed.full) { try { if (document.fullscreenElement) document.exitFullscreen(); else document.getElementById('stage').requestFullscreen().catch(() => { }); } catch (e) { } }
  if (G.feed) { updateFeed(dt); updateTexts(dt); return; }
  switch (G.state) {
    case 'title':
      G.t += dt; Music.intensity = 1;
      if (G.real > .3) updateMenu(dt);
      break;
    case 'intro': {
      const pt = G.introT; G.introT += dt;
      if (pt < 1.5 && G.introT >= 1.5) { S.slam(); addShake(.5); S.say('reject', 90, .4); }
      if (pt < 2.4 && G.introT >= 2.4) S.scan();
      if ((Input.anyPressed() && G.introT > .4) || G.introT > 6.4) { startFeed('feed', () => Game.newGame(), .9); }
      break;
    }
    case 'play': updatePlay(dt); break;
    case 'shop': updateShop(dt); updateTexts(dt); break;
    case 'manga': updateManga(dt); break;
    case 'gate': if (Input.anyPressed()) gateGo(); break;
    case 'cine': Cine.update(dt); break;
    case 'dgover': updateDgOver(dt); break;
    case 'memo': updateMemo(dt); updateCamera(dt); break;
    case 'review': updateReview(dt); updateTexts(dt); break;
    case 'verdict': updateVerdict(dt); break;
    case 'pause': if (Input.pressed.pause || Input.pressed.start) { G.state = 'play'; Input.clearBuf(); S.beep(); } else if (Input.pressed.evade) quitToTitle(); break;
    case 'ending':
      G.endT += dt;
      if (G.endT > endingLen() && Input.anyPressed()) { G.state = 'title'; Menu.mode = 'main'; playSong('title'); }
      break;
  }

}
function render() {
  if (Manga.req && G.state === 'play') mangaCapture();
  clearPlates();
  let framed = false;
  switch (G.state) {
    case 'title': drawTitle(); composite(); if (Menu.mode === 'amend') drawShop(R.ctx); drawNetNotice(R.ctx); break;
    case 'gate': case 'gateOut': drawGate(); composite(); break;
    case 'cine': drawCine(); composite(); break;
    case 'intro': drawIntro(); composite(); if (G.introT > 1.5 && G.introT < 1.62) { const c = R.ctx; c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'difference'; c.fillStyle = COL.paper; c.fillRect(0, 0, R.cv.width, R.cv.height); c.globalCompositeOperation = 'source-over'; } break;

      drawWorld(); composite(); drawHUD();
      drawNetNotice(R.ctx);   // a dead or reviving line, said over the platen

const Perf = { acc: 0, n: 0, cool: 3 };
function adaptQuality(dt) {
  // drop the internal resolution if this machine can't hold ~50fps
  Perf.cool -= dt; if (Perf.cool > 0 || document.hidden) return;
  Perf.acc += dt; Perf.n++;
  if (Perf.n >= 90) {
    const avg = Perf.acc / Perf.n; Perf.acc = 0; Perf.n = 0;
    if (avg > .021 && R.RS > 1) { R.maxRS = Math.max(1, R.RS - .5); resize(); Perf.cool = 2; }
  }
}
function frame(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  adaptQuality(dt);
  Input.poll();
  acc += dt; let n = 0;
  while (acc >= STEP && n < 5) { acc -= STEP; try { tick(STEP); } catch (e) { if (!G._errLogged || G._errLogged < 5) { console.error(e); G._errLogged = (G._errLogged || 0) + 1; } } n++; }

function boot() {
  // The copier's own boot, said out loud: the platform draws these instead of
  // a spinner over nothing, and keeps waiting while the figure moves. Two real
  // waits live here — the SDK module on the way in, and the display faces
  // below — and nothing else in this function takes any time at all.
  Plat.loading(.2, 'warming the platen');
  setupTouch();
  initRender();
  SAVE.load();
  Plat.loading(.5, 'reading the file');
  Plat.start();
  if (stockUnlocked(currentStock())) applyStock(SAVE.data.stock); else applyStock('cream');
  G.state = SAVE.data.seenIntro ? 'title' : 'gate';
  playSong('title');
  R.cv.addEventListener('pointerdown', e => {
    R.cv.focus(); AU.unlock();
    const r = R.cv.getBoundingClientRect(), px = (e.clientX - r.left) / r.width * W, py = (e.clientY - r.top) / r.height * H;
    if (G.state === 'pause') { pausePointer(px, py); return; }
    if (G.state === 'dgover') { dgPointer(px, py); return; }
    menuPointer(px, py);
  });
  addEventListener('pointerdown', touchTapAnywhere);
  // the phone went to sleep or the app was switched away: stop the copier
  document.addEventListener('visibilitychange', () => { if (document.hidden && G.state === 'play' && !G.coop) { G.state = 'pause'; if (typeof touchReleaseAll === 'function' && TUI.on) touchReleaseAll(); } });
  // Online, stopping is not ours to do: a hidden tab gets no animation frames,
  // so the partner would watch this copier freeze — the host stops running the
  // world, the guest stops answering it — and nothing in the relay can tell
  // that apart from somebody walking away. Timers are throttled to about 1 Hz
  // while hidden but not stopped, so one carries the same fixed step the frame
  // loop uses: the world keeps running in real time for the partner and only
  // the drawing stops. Held keys were already dropped by the blur listener.
  let awayT = performance.now();
  setInterval(() => {
    const now = performance.now(), gap = (now - awayT) / 1000; awayT = now;
    if (!document.hidden || !Net.active) return;
    let n = Math.min(Math.round(gap / STEP), 90); // at most 1.5 s of catch-up
    while (n-- > 0) { try { tick(STEP); } catch (e) { if (!G._errLogged || G._errLogged < 5) { console.error(e); G._errLogged = (G._errLogged || 0) + 1; } } }
  }, 250);
  const go = () => requestAnimationFrame(t => { lastT = t; frame(t); });
  const fontsReady = document.fonts && document.fonts.load ? Promise.race([Promise.all([document.fonts.load(`40px ${F_DISP}`), document.fonts.load(`16px ${F_TYPE}`), document.fonts.load(`20px "Dela Gothic One"`, 'カーボン')]), new Promise(r => setTimeout(r, 1800))]) : Promise.resolve();
  // the faces are the one thing boot actually waits on (capped at 1.8 s above)
  const typeset = () => { Plat.loading(.85, 'setting the type'); go(); };
  fontsReady.then(typeset, typeset);
  window.__cb = { G, get Player() { return Player; }, Game, World, ENEMIES, EPROJ, LEVELS, Input, AU, Music, SAVE, Plat, Net, Lobby };
}

const SAVE = {

  had: false,
  data: { v: 1, stages: {}, stock: 'cream', reached: 0, hard: false, beaten: false, t: 0 },
  load() { try { const s = localStorage.getItem(this.key); if (s) { const d = JSON.parse(s); if (d && d.v === 1) { Object.assign(this.data, d); this.had = true; } } } catch (e) { } },
  cache() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); this.had = true; } catch (e) { } },
  // The version of the account's KV document this browser last filed or took.
  // Device-local by nature — it says what THIS machine has synced, so it is
  // kept beside the cache and never inside the document.
  vkey: 'carbonbody.v1.kv',
  seenVersion() { try { const s = localStorage.getItem(this.vkey); return s == null ? null : (+s || 0); } catch (e) { return null; } },
  synced(v) { try { localStorage.setItem(this.vkey, String(v)); } catch (e) { } },
  store() {

  stage(id) { return this.data.stages[id] || (this.data.stages[id] = { orig: 0, best: 0, grade: '' }); },

// ---------------------------------------------------------------- mode
MODES.airmail = {
  pw: 40, ph: 18, noShell: true, grav: 1300, maxFall: 700,
  wind() { return G.air ? G.air.scroll : 0; },
  enter(def) {
    const hw = VIEW.w / 2 / def.zoom;
    G.baseZoom = def.zoom;
    G.air = { cx: clamp(Player.cx - 150 + hw, hw, World.pw - hw), speed: def.airSpeed || 165, t: 0, delay: .6, scroll: 0, lock: false, exit: false, leaving: false, bg: 0 };
    Player.face = 1; Player.pitch = 0; Player.vx = Player.vy = 0;
    // which solid blocks hang from the top (cabinets) and which stand on the bottom (towers)
    const Wd = World, st = new Uint8Array(Wd.w * Wd.h);
    const sol = (x, y) => { const t = Wd.grid[y * Wd.w + x]; return t === TL.SOLID || t === TL.GRATE; };
    for (let x = 0; x < Wd.w; x++) {
      for (let y = 0; y < Wd.h && sol(x, y); y++) st[y * Wd.w + x] = 1;
      for (let y = Wd.h - 1; y >= 0 && sol(x, y); y--) st[y * Wd.w + x] = 2;
    }
    Wd.skyStyle = st;
  },
  update(dt) {
    const A = G.air, p = Player, v = airView();
    A.t += dt;
    if (!A.lock) {
      A.scroll = A.t < A.delay ? 0 : A.speed * clamp((A.t - A.delay) / 1, 0, 1);
      A.cx += A.scroll * dt;
      const max = World.pw - v.hw;
      if (A.cx >= max) { A.cx = max; A.lock = true; A.scroll = 0; this.onLock(); }
    } else { A.scroll = 0; A.bg += A.speed * dt; }
    // mid-air save points: pass them and they file a copy
    const cp = G.checkpoint;
    for (const m of World.mach) if (m.type === 'check' && !m.on && !G.hard && p.cx > m.x && !(cp && cp.level === G.levelIdx && m.x <= cp.x + 1)) {
      for (const o of World.mach) if (o.type === 'check') o.on = false;
      m.on = true; G.checkpoint = { level: G.levelIdx, x: m.x, y: m.y }; S.save();
      sfxText('COPY SAVED', m.x, m.y - 60, { size: 16, fill: 'o' });
      p.ink = Math.max(p.ink, 50); p.paper = Math.max(p.paper, 60);
    }
    // whatever falls far behind the page is gone
    for (const e of ENEMIES) if (!e.dead && e.x + e.w < v.l - 260) { e.dead = true; e.deadT = 9; }
    for (const pr of EPROJ) if (pr.x < v.l - 200 || pr.x > v.r + 400) pr.dead = true;
    // delivery
    if (A.exit && !G.exiting) {
      const body = p.form === 'paper' ? p : p.c;
      if (!p.dead && body.x + body.w > v.r - 26) {
        G.exiting = true; A.leaving = true; S.whoosh(); speedLines(.4, body.x, body.y);
        sfxText('DELIVERED!', body.x, body.y - 30, { size: 34, sub: '配達' });
        if (G.netGuest) Net.event(['exit']); else later(.7, () => { if (curDef().mode === 'airmail') Game.nextLevel(); });
      }
    }
  },
  onLock() {
    if (G.netGuest) return;
    if (G.flags.courier) G.air.exit = true;
    else if (!G.boss) { G.boss = new Courier(); S.telegraph(); }
  },
  camera(dt, snap) {
    const A = G.air; if (!A) return;
    G.baseZoom = World.def.zoom;
    G.cam.x = A.cx - W / 2; G.cam.y = World.ph / 2 - H / 2;
    const s = G.shake * G.shake * 16;
    G._shx = (hash(G.boil * 3 + 7) - .5) * 2 * s; G._shy = (hash(G.boil * 5 + 3) - .5) * 2 * s;
  },
  updatePaper(dt) { updatePlane(dt); },
  drawPaper() { drawPlane(); },
  onBurst(forced, cx, cy) {
    const c = Player.c, A = G.air;
    if (!inputX() && !inputY()) { c.vx = (A ? A.scroll : 0) + 90; c.vy = -240; }
    part({ t: 'plane', x: cx, y: cy, vx: -60, vy: -160, g: 700, life: 1.6, size: 1, vr: rnd(-7, -3), rot: 0 });
  },
  carbon(dt) {
    const p = Player, c = p.c, A = G.air, v = airView();
    if (!A || A.leaving) return;
    if (c.x < v.l + 2) {
      const r = World.sweep(c, v.l + 2 - c.x, 0, 'carbon');
      if (r.r || c.x < v.l - 4) airUnstick(c, 'carbon');
      else if (c.att === 3) c.att = 0;
      if (c.att === 0 && c.vx < A.scroll) c.vx = A.scroll;
    }
    if (!A.exit && c.x + c.w > v.r - 2) { c.x = v.r - 2 - c.w; if (c.vx > 0) c.vx = 0; }
    if (c.y < v.t + 2) { c.y = v.t + 2; if (c.vy < 0) c.vy = 0; }
    if (c.y > v.b + 6) {
      // the city's updraft throws you back up, at a price
      p.ink -= 12; c.y = v.b - c.h - 2; c.vy = -1000; c.vx = A.scroll + 70; c.att = 0; c.noStick = .25; c.zip = null; c.lash = null;
      kickRing(220); S.whoosh(); sfxText('UPDRAFT −12 INK', c.x + 8, c.y - 40, { size: 16, fill: 'k' });
      for (let i = 0; i < 8; i++) part({ t: 'streak', x: c.x + rnd(-10, 26), y: v.b - 4, vx: 0, vy: -rnd(500, 900), g: 0, life: .3 });

  },
  drawWorld() {
    const v = airView(), k = R.k, o = R.o, A = G.air;
    // clips in open sky hang from the pneumatic post lines
    k.strokeStyle = COL.inkA(.55); k.lineWidth = 1.2;
    for (const a of World.anchors) if (a.fixed && World.tile(a.tx, a.ty - 1) !== TL.SOLID && inView(a.x, a.y, 40)) { k.beginPath(); k.moveTo(a.x, v.t); k.lineTo(a.x, a.y - 14); k.stroke(); }

      o.globalAlpha = .18 + pulse * .15; o.fillStyle = R.pat.oh; o.fillRect(x, v.t, 40, v.b - v.t); o.globalAlpha = 1;
      o.fillStyle = COL.orange; o.font = `26px ${F_DISP}`; o.textAlign = 'right'; o.textBaseline = 'middle';
      for (let i = 0; i < 3; i++) o.fillText('DELIVER ▶', x - 10 + pulse * 8, v.t + 120 + i * 150);
    }
  },
  drawCheck(m) { drawAirCheck(m); },
  bossDefeated() {
    G.flags.courier = true; G.boss = null;
    sfxText('SIGNED FOR', VIEW.cx, 180, { size: 44, sub: '受領', life: 2.2, screen: true, vy: 0, rot: -.05 });
    later(1.3, () => { if (curDef().mode === 'airmail' && G.air) { G.air.exit = true; S.save(); sfxText('FLY RIGHT TO DELIVER ▶', VIEW.cx, 250, { size: 20, screen: true, vy: 0, life: 2.6, fill: 'o' }); } });
  },
};

// ---------------------------------------------------------------- the plane
function updatePlane(dt) {
  const p = Player, A = G.air, v = airView();
  let ix = inputX(), iy = inputY();
  if (p.stun > 0) { p.stun -= dt; ix = iy = 0; }
  p.face = 1; p.foldCd -= dt; p.foldShot -= dt; p.shootCd -= dt; p.flapT = (p.flapT || 0) + dt;
  if (p.ink < 30) p.ink += 2 * dt;
  if (A.leaving) { p.vx = approach(p.vx, 700, 2400 * dt); p.vy = approach(p.vy, -60, 600 * dt); p.x += (A.scroll + p.vx) * dt; p.y += p.vy * dt; p.pitch = approach(p.pitch || 0, -.2, dt * 2); return; }
  // barrel roll: the plane version of the fold
  if (p.fold <= 0 && p.foldCd <= 0 && p.stun <= 0 && Input.take('evade')) {
    p.fold = .32; p.foldPerfect = false; S.fold(); p.vx += ix * 170; p.vy += iy * 170;
    for (let i = 0; i < 4; i++) part({ t: 'streak', x: p.cx, y: p.y + i * 6, vx: -500, vy: 0, g: 0, life: .2 });
  }
  if (p.fold > 0) { p.fold -= dt; if (p.fold <= 0) { p.foldCd = .28; p.foldShot = .35; } }
  const SP = 270, ACC = 1900;
  p.vx = approach(p.vx, ix * SP, ACC * dt);
  p.vy = approach(p.vy, iy * SP * .95, ACC * dt);
  p.pitch = approach(p.pitch || 0, clamp(p.vy / SP, -1, 1) * .36, dt * 4);
  const res = World.sweep(p, (A.scroll + p.vx) * dt, p.vy * dt, 'paper');
  if (res.l || res.r || res.u || res.d) planeCrash(res);
  if (p.form !== 'paper') return;
  // the edges of the page
  const L = v.l + 6, Rr = v.r - p.w - 12, Tp = v.t + 14, Bt = v.b - p.h - 8;
  if (p.x < L) { const r2 = World.sweep(p, L - p.x, 0, 'paper'); if (r2.r || p.x < L - 2) airUnstick(p, 'paper'); if (p.vx < 0) p.vx = 0; }
  if (p.x > Rr && !A.exit) { p.x = Rr; if (p.vx > 0) p.vx = 0; }
  if (p.y < Tp) { p.y = Tp; if (p.vy < 0) p.vy = 0; }
  if (p.y > Bt) { p.y = Bt; if (p.vy > 0) p.vy = 0; }
  if (p.form !== 'paper') return;
  // staples fire along the nose
  if (Input.held.attack && p.fold <= 0 && p.stun <= 0 && p.shootCd <= 0) {
    p.shootCd = .1;
    const spreads = p.foldShot > 0 ? [-.14, 0, .14] : [0]; if (p.foldShot > 0) p.foldShot = 0;
    for (const s of spreads) {
      const a = p.pitch * .7 + s + rnd(-.03, .03), ox = p.x + p.w + 2, oy = p.cy + 6 + Math.sin(p.pitch) * 18;
      PS.push({ x: ox, y: oy, vx: Math.cos(a) * 1100 + A.scroll, vy: Math.sin(a) * 1100, life: .55, a });
    }
    p.flashT = .05; p.recoil = 1; addShake(.006); S.staple();
    part({ t: 'bit', x: p.x + 20, y: p.cy + 8, vx: -rnd(80, 160), vy: rnd(60, 160), g: 900, life: .5, vr: rnd(-20, 20) });
  }
  // contrail
  if (Math.random() < .5) part({ t: 'streak', x: p.x - 2, y: p.cy - 2 + rnd(-3, 3), vx: -260 - A.scroll * .2, vy: 0, g: 0, life: .22 });
  planeHazards(dt);
}
function planeCrash(res) {
  const p = Player;
  if (p.fold <= 0 && p.inv <= 0) {
    const fx = res.r ? p.cx + 40 : res.l ? p.cx - 40 : p.cx;
    if (hurtPaper(10, fx, { word: 'CRUMPLE!', kx: 260, ky: res.u ? -220 : res.d ? 240 : 80 })) { dust(p.cx, p.cy, 4, 80); addCrease(); }
  }
  if (res.r) p.vx = Math.min(p.vx, -140); if (res.l) p.vx = Math.max(p.vx, 140);
  if (res.u) p.vy = Math.max(p.vy, 170); if (res.d) p.vy = Math.min(p.vy, -170);
}
function planeHazards(dt) {
  const p = Player;
  const sh = World.rectTile(p.x + 3, p.y + 3, p.w - 6, p.h - 6, TL.SHRED);
  if (sh && hurtPaper(18, sh.tx * T + T / 2 + 20, { word: 'SHRED!', kx: 380, ky: 60 })) {
    S.shred();
    for (let i = 0; i < 6; i++) part({ t: 'strip', x: p.cx, y: p.cy, vx: rnd(-200, 100), vy: rnd(-300, 0), g: 600, life: .8, size: rnd(6, 12), vr: rnd(-9, 9) });
    if ((G.flags.gateHints || 0) < 2 && G.unlocked.burst) { G.flags.gateHints = (G.flags.gateHints || 0) + 1; sfxText('UNFOLD! [L]', p.cx, p.y - 40, { size: 26, life: 1.2 }); }
  }
  commonPickups(p);
}
// pushed by the edge of the page into a wall: pop out somewhere free
function airUnstick(b, who) {
  const v = airView(), x = v.l + 30;
  for (const dy of [0, -30, 30, -60, 60, -90, 90, -120, 120, -160, 160, -200, 200, -260, 260]) {
    const y = clamp(b.y + dy, v.t + 4, v.b - b.h - 4);
    if (!World.rectHits(x, y, b.w, b.h, who)) { b.x = x; b.y = y; break; }
  }
  if (who === 'paper') { Player.inv = 0; hurtPaper(12, b.x - 20, { word: 'SQUEEZED!', kx: 120, ky: 40 }); Player.vx = 60; }
  else { const c = Player.c; c.att = 0; c.vx = G.air.scroll + 60; c.vy = -200; c.zip = null; if (!(Player.hazardCd.sq > 0)) { Player.hazardCd.sq = .8; hurtCarbon('squish', { amt: 8 }); sfxText('SQUEEZED', c.x + 8, c.y - 24, { size: 16, fill: 'k' }); } }
}

// ---------------------------------------------------------------- drawing: the plane
// local space, nose toward +x
function planeBody(o) {
  const k = R.k, b = R.b, s = o.seed || 1;
  k.strokeStyle = COL.ink;
  // far wing peeking over the top
  k.fillStyle = COL.paperHi; jPath(k, [22, 0, -16, -15, -11, -8], s + 1, .4); k.fill(); k.lineWidth = 1.6; k.stroke();
  b.fillStyle = R.pat.b2; jPath(b, [17, -1, -14, -13, -11, -8], s + 1, .3); b.fill();
  // keel: the fold that is the body
  k.fillStyle = COL.paperHi; jPath(k, [24, 1, -15, -2, -12, 8], s + 2, .4); k.fill(); k.lineWidth = 2; k.stroke();
  b.globalAlpha = .7; b.fillStyle = o.enemy ? R.pat.b3 : R.pat.b1; jPath(b, [19, 2, -13, 0, -11, 7], s + 2, .3); b.fill(); b.globalAlpha = 1;
}
function planeWing(o) {
  const k = R.k, b = R.b, op = R.o, s = o.seed || 1;
  k.fillStyle = COL.paperHi; jPath(k, [25, 0, -21, -11, -15, -2], s + 3, .5); k.fill(); k.lineWidth = 2.2; k.strokeStyle = COL.ink; k.stroke();
  if (o.enemy) { b.globalAlpha = .55; b.fillStyle = R.pat.b2; jPath(b, [22, 0, -19, -10, -15, -3], s + 3, .3); b.fill(); b.globalAlpha = 1; }
  k.lineWidth = 1; k.beginPath(); k.moveTo(24, 0); k.lineTo(-17, -6); k.stroke();
  if (!o.enemy) {
    // the airmail border along the leading edge: red, blue, red, blue
    const N = [25, 0], A = [-21, -11], nx = .21, ny = .98;
    for (let i = 0; i < 6; i++) {
      const t0 = i / 6 + .02, t1 = (i + .55) / 6, c = i % 2 ? b : op;
      const x0 = lerp(N[0], A[0], t0), y0 = lerp(N[1], A[1], t0), x1 = lerp(N[0], A[0], t1), y1 = lerp(N[1], A[1], t1);
      c.fillStyle = i % 2 ? COL.blue : COL.orange; c.beginPath(); c.moveTo(x0, y0 + 1); c.lineTo(x1, y1 + 1); c.lineTo(x1 - 2 + nx * 3.5, y1 + 1 + ny * 3.5); c.lineTo(x0 - 2 + nx * 3.5, y0 + 1 + ny * 3.5); c.fill();
    }
  }
}
function drawPlane() {
  const p = Player, k = R.k, b = R.b, o = R.o;
  const flick = p.inv > 0 && p.inv < .75 && Math.floor(G.t * 24) % 2 === 0;
  if (flick) { k.globalAlpha = .5; b.globalAlpha = .5; o.globalAlpha = .5; }
  const x = p.cx, y = p.cy, seed = 1;
  const roll = p.fold > 0 ? 1 - p.fold / .32 : 0, sy = Math.cos(roll * TAU);
  const ref = p.reformT > 0 ? 1 - p.reformT / .16 : 1;
  if (ref < 1) { // refolding out of a flat sheet
    k.save(); k.translate(x, y); k.rotate(ref * 1.4); const s = 1 - ref;
    k.fillStyle = COL.paperHi; k.fillRect(-20 * s, -26 * s, 40 * s, 52 * s); k.strokeStyle = COL.ink; k.lineWidth = 2; k.strokeRect(-20 * s, -26 * s, 40 * s, 52 * s); k.restore();
    o.fillStyle = COL.orange; o.fillRect(x - 30, y - 1, 60 * ref, 3);
  }
  const plates = [k, b, o];
  for (const c of plates) { c.save(); c.translate(x, y); c.rotate(p.pitch || 0); c.scale((.4 + .6 * ref) * 1.3, sy * 1.3); }
  // tie streaming off the tail
  const tie = [];
  for (let i = 0; i <= 5; i++) tie.push(-14 - i * 5, -2 + Math.sin(G.t * 18 + i * 1.1) * 2.5 * (i / 5) + i * .6);
  o.fillStyle = COL.orange; brush(o, tie, 4.5, 1.5, 5, 0); k.fillStyle = COL.ink; brush(k, tie.map((v, i) => i % 2 ? v + 2.4 : v), .8, .5, 6, 0);
  planeBody({ seed });
  // DUPE rides in his own fold
  const hx = 3, hy = -10;
  k.fillStyle = COL.ink; jPath(k, [hx - 7, hy - 3, hx - 4, hy - 10, hx - 1, hy - 7, hx + 2, hy - 12, hx + 4, hy - 7, hx + 8, hy - 9, hx + 7, hy - 3], seed + 30, .5); k.fill();
  k.fillStyle = COL.paperHi; jPath(k, [hx - 6, hy - 3, hx + 7, hy - 4, hx + 7, hy + 5, hx - 6, hy + 5], seed + 31, .4); k.fill(); k.strokeStyle = COL.ink; k.lineWidth = 1.5; k.stroke();
  const hurt = p.stun > 0;
  k.fillStyle = COL.paperHi; k.beginPath(); k.ellipse(hx + 4, hy + .5, 2.3, hurt ? 2.4 : 1.9, 0, 0, TAU); k.fill(); k.lineWidth = 1; k.stroke();
  k.fillStyle = COL.ink; k.beginPath(); k.arc(hx + 4.9 + (hurt ? -1 : 0), hy + .8, hurt ? .6 : 1, 0, TAU); k.fill();
  brush(k, [hx + 1, hy - 2.6, hx + 4, hy - 1.6, hx + 7.4, hy - 3.2], 1.7, 1.2, seed + 41, 0);
  if (Input.held.attack) { k.fillStyle = COL.ink; k.fillRect(hx + 2, hy + 3, 4, 1.6); }
  planeWing({ seed });
  // tears: the ink shows through
  p.tears.slice(-5).forEach((t, i) => {
    const tx = -12 + hash(t.seed) * 26, ty = -7 + hash(t.seed + 3) * 6, dx = Math.cos(t.a) * 3.5, dy = Math.sin(t.a) * 2;
    k.strokeStyle = COL.ink; k.lineWidth = 1.2; k.beginPath(); k.moveTo(tx - dx, ty - dy); k.lineTo(tx, ty + 1); k.lineTo(tx + dx, ty + dy); k.stroke();
    b.fillStyle = COL.blue; b.beginPath(); b.arc(tx, ty, 1.5, 0, TAU); b.fill();
  });
  // industrial staple gun bolted under the keel
  k.fillStyle = COL.ink; k.fillRect(2 - p.recoil * 2, 5, 13, 4.5); k.fillRect(4 - p.recoil * 2, 9, 4, 3);
  o.fillStyle = COL.orange; o.fillRect(3 - p.recoil * 2, 4, 9, 1.5);
  if (p.flashT > 0) { o.fillStyle = COL.orange; o.beginPath(); for (let i = 0; i < 10; i++) { const a = i / 10 * TAU, r = i % 2 ? 3 : i === 0 ? 12 : 6; o.lineTo(19 + Math.cos(a) * r, 7 + Math.sin(a) * r); } o.fill(); }
  for (const c of plates) c.restore();
  k.globalAlpha = 1; b.globalAlpha = 1; o.globalAlpha = 1;
  // speed lines peel off the wingtips
  b.strokeStyle = COL.blueA(.45); b.lineWidth = 1.5;
  for (let i = 0; i < 3; i++) { const yy = y - 8 + i * 8, len = 20 + hash(i + G.boil) * 30; b.beginPath(); b.moveTo(p.x - 6, yy); b.lineTo(p.x - 6 - len, yy); b.stroke(); }
  if (roll > 0) { o.strokeStyle = COL.orA(.7); o.lineWidth = 2; o.beginPath(); o.arc(x, y, 22, roll * TAU, roll * TAU + 2); o.stroke(); }
}
PART_DRAW.plane = (p, f) => {
  // the empty plane Dupe just fell out of, tumbling
  const k = R.k, b = R.b;
  for (const c of [k, b]) { c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.globalAlpha = Math.min(1, f * 2); }
  planeBody({ seed: 9 }); planeWing({ seed: 9, enemy: true });
  for (const c of [k, b]) { c.globalAlpha = 1; c.restore(); }
};

// ---------------------------------------------------------------- squadron: interoffice memo planes
AI.squad = (e, dt, tgt) => {
  const v = airView();
  e.face = -1;
  if (!e.go) { e.vx = 0; e.vy = 0; if (e.x < v.r + 20) { e.go = true; e.baseY = e.y; e.t0 = G.t; if (Math.random() < .4) S.whoosh(); } return; }
  const t = G.t - e.t0, amp = 30 + (e.seed % 4) * 10;
  e.vx = -(170 + (e.seed % 5) * 12);
  const ty = e.baseY + Math.sin(t * 2.4 + (e.seed % 7)) * amp;
  e.vy = clamp((ty - e.y) * 6, -300, 300);

// ======================================================================

//  The two gauges become two lives that feed each other: paper's hits
//  refill the ink's cartridge, the ink's slips and lashes rebuild paper.
//    INK  [SWAP] near paper: MERGE in (reform SNAP around the paper body;
//         staples come out inked and pierce). [SWAP] again: burst out.
//    PAPER [SWAP] while inked: THROW the ink along your aim.
//    INK  [FIRE] at your partner: YANK the paper body toward you.
//    Down? Your partner stands on you for a moment to revive you.

// ---- 20_net.js
// ======================================================================
//  NET — online co-op over a bloomplay relay room.
//  The room is the page: joining with no code drops us in the public pool
//  for this game, which is the crowd the lobby below browses. An invite
//  link carries a room id instead, so a friend lands next to you.
//  Two channels, split by who has to be told LATER — room state is the only
//  one replayed to a copier that arrives after you, and these snapshots move
//  30 times a second:
//    cb   lobby card, through bloomplay.multiplayer.presence: who hosts, who
//         joins, which body, which file. The SDK owns the key, the whole-card
//         write, the coalescing, the departed peer and the reconnect.
//    snap peer messages addressed to the partner: the host's world, or the
//         guest's body — and the goodbye, which is an event, not a state
//  Every snapshot carries an outbox of numbered events that repeats for
//  ~2 s so a dropped one is never lost. The host runs the world; each
//  player runs their own body; hits on staff go to the host as events.
//  A dead line is not a pal leaving, and neither copier has to guess which
//  it was any more. A dropped connection HOLDS ITS SEAT: our own drop waits
//  (the host bridge re-joins us into the same chair and says `seatKept`), and
//  a pal's drop arrives as `peerAway` — same peer id, same card in room state,
//  same partner when they take the chair back on `peerBack`. Nothing is
//  re-matched by name any more, because nothing was renumbered. A real
//  `peerLeft` is the room's verdict and ends them; so does their `bye`.
// ======================================================================
const NET_V = 3;
const E_KINDS = ['clerk', 'puncher', 'moth', 'archivist', 'hound', 'notary', 'bootleg', 'reprint', 'squad'];
const E_STATES = ['idle', 'walk', 'wind', 'strike', 'recover', 'hop', 'cool', 'hover', 'tele', 'dive', 'turn', 'punch', 'patrol', 'rev', 'dash', 'skid', 'float', 'seal', 'ribbon', 'aim', 'fire', 'run'];
const P_TYPES = ['chad', 'plane', 'ink', 'ribbon', 'staple', 'sticker', 'stamp', 'letter', 'clip', 'file', 'blot'];
const VS = ['squish', 'cut', 'jam', 'absorb'];
const SRC = ['staple', 'lash', 'strike', 'burst', 'drawer', 'env'];
const NET_BOSSES = { courier: () => new Courier() };
const r1 = v => Math.round(v * 10) / 10, ri = v => Math.round(v);

// How much of a hidden stretch the 250 ms catch-up timer has to have MISSED
// before we call the copier frozen rather than throttled. A throttled tab
// fires that timer about once a second and keeps the world in real time for
// the pal; a frozen one does not fire it at all, and its own `document.hidden`
// guard then drops the catch-up, because the tab is visible again by the time
// it next runs. Only the platform can tell the two apart (onResume hiddenMs).
const FROZE_S = 2;
const Net = {
  room: null, me: null, active: false, host: false, partner: null, role: null,
  joining: false, err: '', invited: false, live: new Map(), inbox: null, subs: [], palQuit: false,
  seq: 0, out: [], inSeq: 0, gives: { ink: 0, paper: 0 }, giveT: 0, frame: 0,
  ep: 0, gotEp: -1, flagLog: [], flagBase: 0, flagSeen: 0, lastSnapS: -1, snapAge: 0, partnerBody: null,
  down: false,        // our own line is being re-dialled: nothing is anyone's fault yet
  away: false,        // the pal's line died and the runner is holding their chair
  snapNext: false,    // the next body is taken whole: we missed the stretch before it
  // arrived on somebody's invite link: hold their room and show it as soon as
  // the title is up (the menu picks `invited` up)
  onPlatform() {
    const rid = Plat.inviteRoom();
    if (rid) this.open(rid).then(() => { if (this.room) this.invited = true; });
  },
  // join the room and start listening. No code: the public pool for this game.
  async open(roomId) {
    const mp = Plat.mp();
    if (!mp || this.room || this.joining) return this.room;
    this.joining = true; this.err = '';
    const subs = [
      mp.onPeerJoined(p => { this.live.set(p.id, p); }),
      mp.onPeerLeft(id => { this.live.delete(id); this.away = false; }),
      // A dropped line, and the chair it still owns. Every relay game read
      // this as abandonment because it arrived as silence; it has a name now.

      // same chair and the same number (`seatKept`); past it the room saw us
      // leave, and lineChanged() will not pretend otherwise.

    for (const u of this.subs) { try { u(); } catch (e) { } }

  // what the lobby reads: one entry per live peer, carrying its lobby card. The

  peers() {

    }

  },
  /** Our lobby card. One key that is ours alone, the whole card on every write so a
   * copier sitting idle is still listed, several patches in a tick coalesced into one,
   * and a card that changes nothing costs nothing — all of it the SDK's. */
  presence(patch) {

  },
  // the 30/s half: straight to the partner, never through room state
  snap(d) {

  },
  peerOf(id) { return this.peers().find(p => p.peer === id); },
  profileOf(id) { return id === this.me ? Plat.me : this.live.get(id); },
  // a signed-in player is who they say they are; every guest is called "Guest",

  nick(id) {

  // ---------------------------------------------------------------- game session

  // second words: what each button does for the body you are in right now
  const p = G.coop ? (G.coop.bodies.find(b => !b.puppet) || Player) : Player;
  const air = curDef() && curDef().mode === 'airmail', ink = p.form === 'carbon';
  let sub, off = [false, false, false, false];
  if (ink) sub = ['leap', 'lash', 'dart', air ? 'refold' : 'reform'];
  else if (air) { sub = ['', 'staples', 'roll', 'unfold']; off[0] = true; }
  else sub = ['jump', 'staple', 'dodge', 'burst'];
  if (G.coop) {
    const o = typeof partnerOf === 'function' ? partnerOf(p) : null;
    if (p.role === 'paper') { sub[3] = 'throw ink'; off[3] = !(o && o.merged); }
    else { sub[3] = p.merged ? 'split' : 'merge'; off[3] = false; }
  } else if (!ink && !G.unlocked.burst && !air) { sub[3] = 'locked'; off[3] = true; }
  const key = sub.join('|') + off.join('');
  if (key !== TUI.lab) {
    TUI.lab = key;
    TUI.btns.forEach((b, i) => { b.sub.textContent = sub[i]; b.el.classList.toggle('off', off[i]); });
  }
}
// taps on screens that have no buttons: notes, reviews, comic panels, game over
function touchTapAnywhere(e) {
  if (!TUI.on || (e.pointerType && e.pointerType !== 'touch')) return;
  if (G.state === 'memo' || G.state === 'review' || G.state === 'manga') Input.S.all.press('jump');
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

/* ---------------- colour helpers ---------------- */
const _cc = new Map();
function hexRgb(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function toHex(r, g, b) { return '#' + [r, g, b].map(v => clamp(v | 0, 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(h, a) {
  a = clamp(Math.round(a * 50) / 50, -1, 1);
  const k = h + a; let v = _cc.get(k); if (v) return v;
  let [r, g, b] = hexRgb(h);
  if (a < 0) { r *= 1 + a; g *= 1 + a; b *= 1 + a; } else { r += (255 - r) * a; g += (255 - g) * a; b += (255 - b) * a; }
  v = toHex(r, g, b); _cc.set(k, v); return v;
}
function mixHex(a, b, t) {
  t = clamp(Math.round(t * 20) / 20, 0, 1);
  const k = a + b + t; let v = _cc.get(k); if (v) return v;
  const A = hexRgb(a), B = hexRgb(b);
  v = toHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); _cc.set(k, v); return v;
}

/* ---------------- skeleton / IK ---------------- */
const THIGH = 55, SHIN = 54, UARM = 37, FARM = 36, TORSO = 70, HIPH = 103, ANK = 7;
function P(hx, hy, tor, hd, bh, fh, bf, ff, rot = 0) { return { hx, hy, tor, hd, bh, fh, bf, ff, rot }; }
function lerpPose(a, b, t) {
  return {
    hx: lerp(a.hx, b.hx, t), hy: lerp(a.hy, b.hy, t), tor: lerp(a.tor, b.tor, t), hd: lerp(a.hd, b.hd, t), rot: lerp(a.rot, b.rot, t),
    bh: [lerp(a.bh[0], b.bh[0], t), lerp(a.bh[1], b.bh[1], t)], fh: [lerp(a.fh[0], b.fh[0], t), lerp(a.fh[1], b.fh[1], t)],
    bf: [lerp(a.bf[0], b.bf[0], t), lerp(a.bf[1], b.bf[1], t)], ff: [lerp(a.ff[0], b.ff[0], t), lerp(a.ff[1], b.ff[1], t)]
  };
}
function ik(ox, oy, tx, ty, a, b, bend) {
  let dx = tx - ox, dy = ty - oy, d = Math.hypot(dx, dy);
  const mx = a + b - 0.5; if (d > mx) { dx *= mx / d; dy *= mx / d; d = mx; } if (d < 2) { d = 2; dy = 2; dx = 0; }
  const base = Math.atan2(dy, dx), c = clamp((a * a + d * d - b * b) / (2 * a * d), -1, 1);
  const j = base - bend * Math.acos(c);
  return { j: { x: ox + Math.cos(j) * a, y: oy + Math.sin(j) * a }, e: { x: ox + dx, y: oy + dy } };
}
function rig(p) {
  const hip = { x: p.hx, y: -HIPH + p.hy };
  const st = Math.sin(p.tor), ct = Math.cos(p.tor);
  const neck = { x: hip.x + st * TORSO, y: hip.y - ct * TORSO };
  const sh = { x: hip.x + st * (TORSO - 7), y: hip.y - ct * (TORSO - 7) };
  const ha = p.tor + p.hd;
  const head = { x: neck.x + Math.sin(ha) * 16, y: neck.y - Math.cos(ha) * 16 };
  const bsh = { x: sh.x - ct * 5, y: sh.y - st * 5 }, fsh = { x: sh.x + ct * 3, y: sh.y + st * 3 };
  const ba = ik(bsh.x, bsh.y, bsh.x + p.bh[0], bsh.y + p.bh[1], UARM, FARM, -1);
  const fa = ik(fsh.x, fsh.y, fsh.x + p.fh[0], fsh.y + p.fh[1], UARM, FARM, -1);
  const bhp = { x: hip.x - 4, y: hip.y + 2 }, fhp = { x: hip.x + 4, y: hip.y + 2 };
  const bl = ik(bhp.x, bhp.y, p.bf[0], p.bf[1] - ANK, THIGH, SHIN, 1);
  const fl = ik(fhp.x, fhp.y, p.ff[0], p.ff[1] - ANK, THIGH, SHIN, 1);
  const R = { hip, neck, head, bsh, fsh, bel: ba.j, bha: ba.e, fel: fa.j, fha: fa.e, bhp, fhp, bkn: bl.j, bft: bl.e, fkn: fl.j, fft: fl.e, torA: p.tor, headA: ha };
  if (p.rot) {
    const c = Math.cos(p.rot), s = Math.sin(p.rot), ox = hip.x, oy = hip.y;
    for (const k in R) { const v = R[k]; if (typeof v === 'object' && k !== 'hip') { const x = v.x - ox, y = v.y - oy; v.x = ox + x * c - y * s; v.y = oy + x * s + y * c; } }
    R.torA += p.rot; R.headA += p.rot;
  }
  return R;
}

  jkick:  { air: true, a0: 4, a1: 34, limb: 'fft', dmg: 10, stun: 20, push: 8, pose: P(0, 0, -0.25, 0.1, [-6, 20], [12, 0], [-22, -30], [98, -58]) },
  jpunch: { air: true, a0: 4, a1: 22, limb: 'fha', dmg: 7, stun: 16, push: 6, pose: P(4, 0, 0.35, 0.1, [10, 10], [74, 26], [-20, -44], [22, -36]) },
  special:{ dur: 38, a0: 99, a1: 99, limb: 'fha', dmg: 0,
    kf: [[0, I], [0.28, P(-8, 10, -0.12, 0, [-22, 10], [-14, 4], [-30, 0], [26, 0])], [0.4, P(10, 10, 0.3, 0, [72, -8], [78, -16], [-36, 0], [30, 0])], [0.75, P(10, 10, 0.3, 0, [72, -8], [78, -16], [-36, 0], [30, 0])], [1, I]] },
};
function sample(kf, u) {
  u = clamp(u, 0, 1);
  for (let i = 0; i < kf.length - 1; i++) {
    if (u <= kf[i + 1][0]) {
      let t = (u - kf[i][0]) / (kf[i + 1][0] - kf[i][0] || 1); t = t * t * (3 - 2 * t);
      return lerpPose(kf[i][1], kf[i + 1][1], t);
    }
  }
  return kf[kf.length - 1][1];
}
const ACTIONABLE = new Set(['idle', 'walk', 'walkb', 'crouch', 'block', 'cblock']);

/* ---------------- cloth tails (verlet) ---------------- */
class Tail {
  constructor(o, col) { Object.assign(this, o); this.col = col; this.p = []; }
  reset() { this.p = []; }
  update(ax, ay, dir, t) {
    const P = this.p;
    if (!P.length) for (let i = 0; i < this.n; i++) P.push({ x: ax - dir * i * this.seg, y: ay + i * 3, px: ax - dir * i * this.seg, py: ay + i * 3 });
    P[0].x = P[0].px = ax; P[0].y = P[0].py = ay;
    for (let i = 1; i < this.n; i++) {
      const q = P[i], vx = (q.x - q.px) * 0.9, vy = (q.y - q.py) * 0.9;
      q.px = q.x; q.py = q.y;
      q.x += vx - dir * 0.22 + Math.sin(t * 0.09 + i * 0.8) * 0.18; q.y += vy + 0.32;
    }
    for (let k = 0; k < 3; k++) for (let i = 1; i < this.n; i++) {
      const a = P[i - 1], b = P[i], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, df = (d - this.seg) / d;
      b.x -= dx * df; b.y -= dy * df;
    }
  }
  draw(C) {
    const P = this.p; if (P.length < 2) return;
    ctx.lineCap = 'round';
    for (let i = 1; i < P.length; i++) {
      ctx.strokeStyle = shade(C(this.col), -0.1 - i * 0.05);
      ctx.lineWidth = this.w * (1 - (i / P.length) * 0.65);
      ctx.beginPath(); ctx.moveTo(P[i - 1].x, P[i - 1].y); ctx.lineTo(P[i].x, P[i].y); ctx.stroke();
    }
  }
}

/* ---------------- fighter ---------------- */
let ATK_ID = 0, JUMP_ID = 0;
class Fighter {
  constructor(ch, side, ctrl, base = 1) {
    this.base = base; this.ch = ch; this.side = side; this.ctrl = ctrl; this.wins = 0;
    this.tails = ch.tails.map(t => new Tail(t, t.col === 'hairc' ? ch.hairc : ch[t.col]));
    this.reset();
  }
  reset() {
    this.x = this.side < 0 ? 380 : 900; this.y = FLOOR; this.vx = 0; this.vy = 0;
    this.dir = this.side < 0 ? 1 : -1; this.hp = 100; this.dispHp = 100;
    this.state = 'idle'; this.t = 0; this.stun = 0; this.bstun = 0; this.cool = 0; this.buf = null;
    this.pose = lerpPose(I, I, 0); this.R = rig(this.pose); this.hitDone = false; this.walkPh = 0; this.flip = 0;
    this.koFinal = false; this.hidden = false; this.headless = false; this.skeleton = false; this.tintC = '#000000'; this.tintA = 0;
    this.scale = 1; this.glowC = null; this.glowA = 0; this.jit = 0; this.poison = 0; this.flash = 0; this.combo = 0; this.atkId = 0; this.jumpId = 0; this.scriptPose = null;
    for (const t of this.tails) t.reset();
  }
  setState(s, keep) { if (keep && this.state === s) return; this.state = s; this.t = 0; }
  attack(s) { this.setState(s); this.hitDone = false; this.atkId = ++ATK_ID; sfx('whoosh'); }
  jump(d) { this.setState('jump'); this.vy = -18.5; this.vx = d * 4.6 * this.dir; this.y -= 1; this.flip = d; this.jumpId = ++JUMP_ID; }
  knock(dirX, vx, vy) { this.setState('fall'); this.vx = dirX * vx; this.vy = vy; this.y = Math.min(this.y, FLOOR - 1); this.stun = 0; this.bstun = 0; }
  wp(pt) { const s = this.scale * this.base; return { x: this.x + this.dir * pt.x * s, y: this.y + pt.y * s }; }
  hb() { const R = this.R, s = this.base, cx = this.x + this.dir * R.hip.x * s; return { x0: cx - 27 * s, x1: cx + 27 * s, y0: this.y + (Math.min(R.head.y, R.neck.y) - 18) * s, y1: this.y + 4 }; }
  hittable() { return !['fall', 'down', 'dead', 'getup', 'fatal', 'fatalW'].includes(this.state) && (game.phase === 'fight' || game.phase === 'finish'); }
  colorizer() {
    let c = this.tintC, a = this.tintA;
    if (this.state === 'frozen') { c = '#bfe9ff'; a = 0.6; }
    if (this.flash > 0) { c = '#ffffff'; a = 0.45; }
    return a > 0 ? (h => mixHex(h, c, a)) : (h => h);
  }
  update(opp) {
    const inp = (this.ctrl && controlsOn()) ? this.ctrl.inp : EMPTY;
    for (const a of ['p', 'k', 's']) if (inp.pr[a]) this.buf = { a, t: 9 };
    if (this.buf && --this.buf.t <= 0) this.buf = null;
    this.t++; if (this.cool > 0) this.cool--; if (this.flash > 0) this.flash--;
    if (this.poison > 0) {
      this.poison--; if (this.hp > 1) this.hp = Math.max(1, this.hp - 0.05);
      if (this.poison % 5 === 0) { const p = this.wp(this.R.neck); part({ x: p.x + rand(-14, 14), y: p.y + rand(0, 60), vy: -1, g: -0.02, life: 30, size: rand(2, 4), type: 'glow', col: '#7dff3a' }); }
    }
    // ---- physics
    let landed = false;
    this.x += this.vx;
    if (this.y < FLOOR || this.vy < 0) {
      this.vy += GRAV; this.y += this.vy;
      if (this.y >= FLOOR) { this.y = FLOOR; landed = true; this.vy = 0; }
    } else if (!['fatal', 'fatalW'].includes(this.state)) this.vx *= 0.78;
    const air = this.y < FLOOR;
    const fwd = this.dir > 0 ? inp.h.r : inp.h.l, back = this.dir > 0 ? inp.h.l : inp.h.r;
    const want = this.buf ? this.buf.a : null;
    const eat = () => { this.buf = null; };
    const S = this.state;

    if (ACTIONABLE.has(S) && this.bstun > 0) { this.bstun--; }
    else if (ACTIONABLE.has(S) && !air) {
      this.dir = opp.x > this.x ? 1 : -1;
      if (want === 's' && game.phase === 'finish' && game.rw === this && Math.abs(opp.x - this.x) < 240 && opp.state === 'dizzy') { eat(); startFatality(this, opp); }
      else if (want === 's' && this.cool === 0 && !game.projs.some(p => p.owner === this)) { eat(); this.attack('special'); }
      else if (want === 'p') { eat(); this.attack(inp.h.d ? 'uppercut' : 'punch'); }
      else if (want === 'k') { eat(); this.attack(inp.h.d ? 'sweep' : 'kick'); }
      else if (inp.h.u) this.jump(fwd ? 1 : back ? -1 : 0);
      else if (inp.h.b) this.setState(inp.h.d ? 'cblock' : 'block', true);
      else if (inp.h.d) this.setState('crouch', true);
      else if (fwd) { this.setState('walk', true); this.x += this.dir * 3.9 * this.ch.speed; this.walkPh += 0.21; }
      else if (back) { this.setState('walkb', true); this.x -= this.dir * 3.2 * this.ch.speed; this.walkPh -= 0.18; }
      else this.setState('idle', true);
    } else switch (S) {
      case 'jump':
        if (want === 'k') { eat(); this.attack('jkick'); }
        else if (want === 'p') { eat(); this.attack('jpunch'); }
        if (landed) { this.setState('land'); }
        break;
      case 'jpunch': case 'jkick':

  if (['title', 'select', 'vs'].includes(game.phase)) {
    if (game.phase === 'title') drawTitle(); else if (game.phase === 'select') drawSelect(); else drawVS();
    ctx = fctx; vignette(); ctx = bctx;
    render3D(0, 0); return;
  }
  const { p1, p2 } = game;
  const shx = game.shake > 0.5 ? rand(-game.shake, game.shake) : 0, shy = game.shake > 0.5 ? rand(-game.shake, game.shake) * 0.6 : 0;
  ctx.save(); ctx.translate(shx, shy);
  drawStage();
  if (game.phase === 'fatality' || (game.phase === 'matchEnd' && game.fatalityDone)) { ctx.fillStyle = 'rgba(10,0,0,0.55)'; ctx.fillRect(0, 0, W, H); }
  const order = ATK[p1.state] || p1.state === 'fatalW' ? [p2, p1] : [p1, p2];
  if (!modelsReady) {
    ctx.save(); ctx.beginPath(); ctx.rect(0, FLOOR, W, H - FLOOR); ctx.clip();
    ctx.translate(0, FLOOR * 2); ctx.scale(1, -1); ctx.globalAlpha = 0.16;
    for (const f of order) drawFighter(f);
    ctx.restore(); ctx.globalAlpha = 1;
    for (const f of order) drawShadow(f);
  }
  for (const f of order) showFighter(f);
  ctx.restore();
  ctx = fctx; ctx.save(); ctx.translate(shx, shy);
  for (const f of order) if (modelsReady && f.state === 'dizzy') { const h = f.wp(f.R.head); for (let i = 0; i < 3; i++) { const a = game.frame * 0.08 + i * TAU / 3; star(h.x + Math.cos(a) * 30, h.y - 34 + Math.sin(a) * 8, 6, '#ffe36a'); } }
  for (const p of game.projs) drawProj(p);
  drawParts(); drawBolts();
  ctx.restore();
  vignette();
  if (game.flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${game.flashA})`; ctx.fillRect(0, 0, W, H); }
  drawHUD();
  ctx = bctx;
  render3D(shx, shy);
}

/* ---------------- input ---------------- */
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  initAudio();
  if (e.code === 'KeyM') { game.muted = !game.muted; if (game.muted && window.speechSynthesis) speechSynthesis.cancel(); if (musG) musG.gain.value = game.muted ? 0 : 0.22; return; }
  if (e.code === 'KeyF') { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); return; }
  const ph = game.phase;
  if (ph === 'title') { if (e.code === 'Enter' || e.code === 'Space') { game.phase = 'select'; game.t = 0; sfx('confirm'); } return; }
  if (ph === 'select') {
    if (e.code === 'KeyA' || e.code === 'ArrowLeft') { game.sel = (game.sel + CHARS.length - 1) % CHARS.length; sfx('select'); }
    if (e.code === 'KeyD' || e.code === 'ArrowRight') { game.sel = (game.sel + 1) % CHARS.length; sfx('select'); }
    if (e.code === 'KeyW' || e.code === 'ArrowUp') { game.diff = (game.diff + DIFF.length - 1) % DIFF.length; sfx('select'); }
    if (e.code === 'KeyS' || e.code === 'ArrowDown') { game.diff = (game.diff + 1) % DIFF.length; sfx('select'); }
    if (e.code === 'Escape') game.phase = 'title';
    if (e.code === 'Enter') {
      const others = CHARS.filter((_, i) => i !== game.sel); game.vsOpp = others[Math.random() * others.length | 0];
      game.phase = 'vs'; game.t = 0; sfx('confirm'); say(CHARS[game.sel].name + ' versus ' + game.vsOpp.name);
    }
    return;
  }
  if (ph === 'matchEnd' && game.t > 60 && e.code === 'Enter') { game.phase = 'select'; game.t = 0; game.p1 = null; game.splats = []; game.parts = []; clearHeads3D(); return; }
  if (e.code === 'KeyP' && game.p1) { game.paused = !game.paused; return; }
  if (e.code === 'Escape' && game.paused) { game.paused = false; game.phase = 'title'; game.p1 = null; return; }
  const k = KEYMAP[e.code]; if (!k) return;
  if (!e.repeat) pressedQ.add(k);
  held[k] = true;
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) held[k] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; });
addEventListener('pointerdown', () => initAudio());

/* ---------------- loop ---------------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const step = 1000 / 60;
  while (acc >= step) { tick(); acc -= step; }
  render();
  requestAnimationFrame(loop);
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { });
requestAnimationFrame(loop);
</script>
</body>
</html>

<title>Neon Asteroids</title>
<!--
  NEON ASTEROIDS — PvP duel edition (portrait, tuned for Pixel 7 Pro)
  Canvas 2D + vanilla JS. No frameworks, no external assets.

  Rules: best of 3 rounds, 30 s each. A ship takes 3 hits and explodes.
  A round goes to the last ship flying, or, at the buzzer, to whoever
  scored more by blasting rocks and UFOs. Round 1 is a light field,
  round 2 a heavier one, round 3 the heaviest plus UFOs that shoot back.

  Script sections:
    1.  Config, tiers & palette
    2.  Canvas setup
    3.  Math helpers
    4.  Particle system
    5.  Neon vector drawing (ships with damage states, UFOs)
    6.  World entities: ship, bullets, asteroids, UFOs
    7.  Controls: floating joystick + FIRE button
    8.  Networking: RoomAdapter (live), NullAdapter
    9.  Opponents: RemotePlayer (online), BotShip (local AI)
    10. Match flow: rounds, scoring, hits, wins
    11. Fixed-timestep update + render
    12. Menu wiring
-->
<style>
  /* One deliberate look: a dark neon arcade screen in every theme. */
  :root { color-scheme: dark; --bg: #05010f; --ink: #ffffff; --muted: #8b80c4; --line: #5a4aa8; --cyan: #00f0ff; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    font-family: "Courier New", ui-monospace, monospace;
  }
  canvas#game { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; image-rendering: pixelated; }
  canvas#game.desk { cursor: crosshair; }

  .overlay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px);
    box-sizing: border-box;
    background: radial-gradient(ellipse at center, rgba(20,6,50,.72) 0%, rgba(5,1,15,.92) 75%);
    z-index: 10; text-align: center; overflow-y: auto; touch-action: pan-y;
  }
  .overlay.hidden { display: none; }

  h1 {
    margin: 0; font-size: clamp(32px, 10.5vw, 52px); letter-spacing: 4px; line-height: 1;
    color: var(--ink); text-wrap: balance;
    text-shadow: 0 0 6px #00f0ff, 0 0 18px #00f0ff, 0 0 36px #e100ff;
  }
  h1 small { display: block; font-size: .36em; letter-spacing: 9px; margin-top: 10px; color: #ff3f8e; text-shadow: 0 0 8px #ff3f8e; }
  .label { font-size: 12px; letter-spacing: 3px; color: #9a8fd6; margin-bottom: -6px; }

  /* Color grid: 16 neon hulls, 8 per row (two rows keep the menu short on phones) */
  .dots { display: grid; grid-template-columns: repeat(8, 32px); gap: 14px 10px; }
  .dot {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid transparent; padding: 0; cursor: pointer;
    background: var(--c); box-shadow: 0 0 8px var(--c), 0 0 18px var(--c);
    transition: transform .12s, border-color .12s;
  }
  .dot.sel { border-color: #fff; transform: scale(1.18); box-shadow: 0 0 12px var(--c), 0 0 30px var(--c), inset 0 0 6px #fff; }
  .dot:focus-visible, .btn:focus-visible, #roomCode:focus-visible { outline: 2px dashed #fff; outline-offset: 4px; }
  .dot-name { height: 16px; font-size: 13px; letter-spacing: 3px; color: var(--c, #fff); text-shadow: 0 0 8px var(--c, #fff); }

  .modes { display: flex; gap: 8px; width: 100%; max-width: 360px; }
  .modes .btn { flex: 1; min-width: 0; padding: 12px 4px; font-size: 14px; letter-spacing: 2px; }
  .btn {
    font: inherit; font-weight: bold; letter-spacing: 3px; font-size: 15px;
    color: #fff; background: transparent; cursor: pointer;
    border: 2px solid var(--line); border-radius: 6px; padding: 12px 16px; min-width: 120px;
  }
  .btn.sel { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 10px var(--cyan), inset 0 0 10px rgba(0,240,255,.35); }
  #quickBtn small { display: block; margin-top: 5px; font-size: 10px; letter-spacing: 2px; font-weight: normal; text-transform: uppercase; opacity: .8; text-shadow: none; }
  .btn.go {
    font-size: 22px; padding: 15px 44px; border-color: var(--accent, #00f0ff); color: var(--accent, #00f0ff);
    box-shadow: 0 0 14px var(--accent, #00f0ff), inset 0 0 14px var(--accent, #00f0ff);
    text-shadow: 0 0 8px var(--accent, #00f0ff);
  }
  .btn.small { min-width: 0; font-size: 13px; padding: 10px 12px; }
  .btn:active { transform: scale(.96); }

  .room { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .room.hidden { display: none; }
  .code-row { display: flex; gap: 8px; align-items: stretch; }
  #roomCode {
    width: 7ch; font: inherit; font-weight: bold; font-size: 24px; letter-spacing: 8px; text-align: center;
    text-transform: uppercase; color: var(--cyan); background: rgba(0,240,255,.06);
    border: 2px solid var(--cyan); border-radius: 6px; padding: 6px 4px 6px 12px;
    box-shadow: 0 0 10px rgba(0,240,255,.5);
  }
  .note { font-size: 12px; color: var(--muted); letter-spacing: 1px; line-height: 1.6; max-width: 330px; }
  .note.warn { color: #ff9f1c; }

  .hint { font-size: 12px; color: var(--muted); letter-spacing: 1px; line-height: 1.7; max-width: 340px; }
  .hint b { color: #fff; }
  #finalScore { font-size: 44px; color: #ffe600; text-shadow: 0 0 10px #ffe600, 0 0 30px #ff9f1c; font-variant-numeric: tabular-nums; }

  /* Host code display */
  .code-show {
    min-width: 6ch; font-weight: bold; font-size: 28px; letter-spacing: 8px; text-align: center;
    color: var(--cyan); border: 2px solid var(--cyan); border-radius: 6px; padding: 6px 4px 6px 12px;
    box-shadow: 0 0 10px rgba(0,240,255,.5); text-shadow: 0 0 8px var(--cyan);
    -webkit-user-select: text; user-select: text;
  }
  #roleRow { max-width: 360px; }
  #roleRow .btn { font-size: 12px; letter-spacing: 1px; }
  #modeRow, #practiceRow { max-width: 300px; }
  #practiceRow .btn { font-size: 12px; padding: 9px 4px; }
  #practiceRow.hidden { display: none; }
  #startBtn.hidden, #quickBtn.hidden, #orChoose.hidden { display: none; }
  #randomRole[hidden] { display: none; }
  #roleRow .btn { padding: 10px 4px; }

  /* In-game menu button: top center, above the round clock */
  #pauseBtn {
    position: fixed; z-index: 5; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 6px);
    font: inherit; font-weight: bold; font-size: 11px; letter-spacing: 2px;
    color: #cfc6ff; background: rgba(5,1,15,.6); border: 1px solid var(--line); border-radius: 14px;
    padding: 5px 12px; cursor: pointer;
  }
  #pauseBtn.hidden, #waitShare.hidden, #waitBot.hidden { display: none; }
  /* Waiting in Quick Play: small top-right pill, out of the way of the warm-up field */
  #waitBot {
    position: fixed; z-index: 5; right: 12px; top: calc(env(safe-area-inset-top, 0px) + 6px);
    font: inherit; font-weight: bold; font-size: 11px; letter-spacing: 2px; color: #fff; cursor: pointer;
    background: rgba(5, 2, 15, .6); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px;
  }
  #waitBot:active { transform: scale(.96); }
  /* Glow pulse (in your hull color) when it first appears, then again every 10–20 s */
  #waitBot.pulse { animation: botPulse 1.4s ease-in-out 2; }
  @keyframes botPulse {
    0%, 100% { box-shadow: 0 0 0 transparent; border-color: var(--line); color: #fff; }
    50% { box-shadow: 0 0 10px var(--c, #1DE9FF), 0 0 24px var(--c, #1DE9FF), inset 0 0 8px var(--c, #1DE9FF);
          border-color: var(--c, #1DE9FF); color: var(--c, #1DE9FF); text-shadow: 0 0 8px var(--c, #1DE9FF); }
  }
  @media (prefers-reduced-motion: reduce) { #waitBot.pulse { animation-iteration-count: 1; } }
  #waitShare { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: 30%; white-space: nowrap; }
  #pauseMenu { background: rgba(5,1,15,.86); }
  #updateBtn {
    position: fixed; z-index: 20; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 8px); white-space: nowrap;
    font: inherit; font-weight: bold; font-size: 12px; letter-spacing: 2px;
    color: #05010f; background: #ffe600; border: 0; border-radius: 16px; padding: 9px 16px;
    box-shadow: 0 0 16px #ffe600; cursor: pointer;
  }
  #updateBtn.hidden { display: none; }
  .small-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

  /* Network test */
  #netTest { z-index: 30; justify-content: flex-start; background: rgba(5,1,15,.95); gap: 14px; }
  .nt-title { font-size: clamp(26px, 8vw, 40px); }
  .nt-rows { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .nt-row { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: rgba(20,6,50,.5); }
  .nt-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .nt-label { font-weight: bold; font-size: 13px; letter-spacing: 2px; color: #fff; }
  .nt-detail { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.4; overflow-wrap: anywhere; }
  .nt-pill { font-weight: bold; font-size: 11px; letter-spacing: 2px; padding: 3px 8px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .nt-pill.run { color: #9a8fd6; }
  .nt-pill.ok { color: #05010f; background: #39ff14; border-color: #39ff14; }
  .nt-pill.warn { color: #05010f; background: #ffe600; border-color: #ffe600; }
  .nt-pill.fail { color: #fff; background: #ff2d4b; border-color: #ff2d4b; }
  .nt-verdict { width: 100%; max-width: 380px; box-sizing: border-box; font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--line); color: #fff; }
  .nt-verdict.good { border-color: #39ff14; box-shadow: 0 0 12px rgba(57,255,20,.4); }
  .nt-verdict.ok { border-color: #ffe600; box-shadow: 0 0 12px rgba(255,230,0,.35); }
  .nt-verdict.bad { border-color: #ff2d4b; box-shadow: 0 0 12px rgba(255,45,75,.4); }
  #buildTag { font-size: 10px; opacity: .6; }

  #rmStatus.hidden, #rmRow.hidden, #rmHelp.hidden { display: none; }
  .rm-status { max-width: 320px; font-size: 13px; letter-spacing: 1px; line-height: 1.5; color: #fff; text-align: center;
    padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: rgba(5,2,15,.6); }
  .rm-status.ask { border-color: #FFAA2B; color: #FFE9B0; box-shadow: 0 0 14px rgba(255,170,43,.45); }
  .rm-status.bad { border-color: #ff2d4b; color: #ffd0d6; }
  #againBtn.pulse { animation: botPulse 1.2s ease-in-out infinite; }
  #againBtn.waiting { opacity: .65; }
  #rmHelp { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    width: min(360px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 12px; background: rgba(5,2,15,.92);
    border: 1.5px solid #FFAA2B; box-shadow: 0 0 20px rgba(255,170,43,.35); color: #fff; font: 12px/1.6 "Courier New", monospace; letter-spacing: .5px; }
  .rm-help-title { font-weight: bold; letter-spacing: 2px; color: #FFAA2B; margin-bottom: 6px; text-align: center; }
  #rmHelpText { margin-bottom: 10px; }
  #fsBtn.hidden, #fsBtn2.hidden, #installBtn.hidden, #installNote.hidden, #padToast.hidden { display: none; }
  /* Controller: highlight the focused button */
  .pad-focus { outline: 2px solid #fff !important; outline-offset: 4px; box-shadow: 0 0 16px rgba(255,255,255,.55) !important; }
  #padToast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 10px; background: rgba(5,2,15,.88); border: 1.5px solid var(--line);
    color: #fff; font: bold 11px/1.6 "Courier New", monospace; letter-spacing: 1.5px; text-align: center; box-shadow: 0 0 18px rgba(0,0,0,.6); }
  #rotate { display: none; }
  @media (orientation: landscape) and (max-height: 520px) {
    #rotate { display: flex; z-index: 50; font-size: 20px; letter-spacing: 3px; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
  }
  @media (prefers-reduced-motion: reduce) { .dot, .btn { transition: none; } }
  #safeProbe { position: fixed; top: 0; left: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; pointer-events: none; }
</style>
</head>
<body>


<canvas id="game"></canvas>
<div id="safeProbe"></div>

<!-- ================= START MENU ================= -->
<div id="menu" class="overlay">
  <h1>NEON<br>ASTEROIDS<small>DUEL·DRIFT</small></h1>

  <div class="label">SELECT HULL</div>
  <div class="dots" id="dots"></div>
  <div class="dot-name" id="dotName">NEON PINK</div>

  <!-- QUICK PLAY: one tap into an online match with whoever else is searching -->
  <button class="btn go" id="quickBtn" style="--accent:#00f0ff">QUICK PLAY<small id="quickSub">instant 1v1 vs. anyone online</small></button>

  <div class="label" id="orChoose">OR CHOOSE</div>
  <div class="modes" id="modeRow">
    <button class="btn" data-mode="online">ONLINE</button>
    <button class="btn" data-mode="practice">PRACTICE</button>
  </div>

  <!-- Practice: with or without the bot rival (starts right away) -->
  <div class="modes hidden" id="practiceRow">
    <button class="btn" data-practice="bot">WITH BOT</button>
    <button class="btn" data-practice="solo">SOLO</button>
  </div>

  <div class="room hidden" id="roomBox">
    <div class="modes" id="roleRow">
      <button class="btn sel" data-role="host">HOST</button>
      <button class="btn"     data-role="join">JOIN</button>
      <button class="btn"     data-role="random" id="randomRole">QUICK PLAY</button>
    </div>
    <!-- Host: you get a code to share -->
    <div class="room" id="hostPanel">
      <div class="label">YOUR ROOM CODE</div>
      <div class="code-row">
        <div id="hostCode" class="code-show">XKP2</div>
        <button class="btn small" id="newCode">NEW CODE</button>
      </div>
      <button class="btn small" id="shareBtn" hidden>SHARE INVITE LINK</button>
    </div>
    <!-- Join: type your friend's code -->
    <div class="room hidden" id="joinPanel">
      <div class="label">ENTER YOUR FRIEND'S CODE</div>
      <input id="roomCode" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code" placeholder="····">
    </div>
    <div class="note" id="roomNote"></div>
    <div class="note" id="liveNote">LIVE LINK: CHECKING…</div>
  </div>

  <button class="btn go hidden" id="startBtn">HOST GAME</button>
  <div class="small-row">
    <button class="btn small" id="soundBtn">SOUND: ON</button>
    <button class="btn small" id="ntBtn">NETWORK TEST</button>
    <button class="btn small hidden" id="fsBtn">FULLSCREEN</button>
    <button class="btn small hidden" id="installBtn">INSTALL APP</button>
  </div>
  <div class="note hidden" id="installNote"></div>
  <div class="note" id="buildTag"></div>
</div>

<button id="updateBtn" class="hidden">NEW VERSION READY · TAP TO UPDATE</button>

<!-- ================= IN-GAME MENU ================= -->
<button id="pauseBtn" class="hidden" aria-label="Game menu">☰ MENU</button>
<button id="waitShare" class="btn small hidden">SHARE INVITE LINK</button>
<button id="waitBot" class="hidden" aria-label="Play a bot while you wait">+ ADD BOT</button>
<div id="pauseMenu" class="overlay hidden">
  <h1 id="pauseTitle">PAUSED</h1>
  <div class="hint" id="pauseInfo"></div>
  <button class="btn go" id="resumeBtn">KEEP PLAYING</button>
  <button class="btn" id="surrenderBtn">SURRENDER</button>
  <button class="btn" id="quitBtn">QUIT TO MENU</button>
  <button class="btn small" id="ntBtn2">NETWORK TEST</button>
  <button class="btn small" id="soundBtn2">SOUND: ON</button>
  <button class="btn small hidden" id="fsBtn2">FULLSCREEN</button>
</div>
<div id="padToast" class="hidden" role="status"></div>

<!-- ================= MATCH OVER ================= -->
<div id="over" class="overlay hidden">
  <h1 id="overTitle">VICTORY</h1>
  <div id="finalScore">2 – 1</div>
  <div class="hint" id="overInfo"></div>
  <div class="rm-status hidden" id="rmStatus" role="status"></div>
  <button class="btn go" id="againBtn">REMATCH</button>
  <div class="small-row hidden" id="rmRow">
    <button class="btn small" id="rmCancel">CANCEL REMATCH</button>
    <button class="btn small" id="rmQuick">QUICK PLAY INSTEAD</button>
  </div>
  <button class="btn" id="menuBtn">MENU</button>
</div>

<!-- Rematch accepted but the game hasn't started after 30 s: what's going on + choices -->
<div id="rmHelp" class="hidden" role="dialog" aria-label="Rematch status">
  <div class="rm-help-title">REMATCH IS TAKING A WHILE</div>
  <div id="rmHelpText"></div>
  <div class="small-row">
    <button class="btn small" id="rmWait">KEEP WAITING</button>
    <button class="btn small" id="rmHelpQuick">QUICK PLAY</button>
    <button class="btn small" id="rmHelpMenu">MENU</button>
  </div>
</div>

<!-- ================= NETWORK TEST ================= -->
<div id="netTest" class="overlay hidden">
  <h1 class="nt-title">NETWORK<br>TEST</h1>
  <div id="ntRows" class="nt-rows"></div>
  <div id="ntVerdict" class="nt-verdict"></div>
  <div class="small-row">
    <button class="btn small" id="ntRun">RUN AGAIN</button>
    <button class="btn small" id="ntCopy">COPY REPORT</button>
  </div>
  <button class="btn" id="ntClose">CLOSE</button>
</div>

<div id="rotate" class="overlay">ROTATE TO PORTRAIT ⟲</div>

<!-- Trystero (Nostr relays): the main matchmaker for direct phone-to-phone links on the open web.
     Loaded as an ES module; a second CDN is tried if the first fails. -->
<script type="module">
  const sources = ['https://cdn.jsdelivr.net/npm/trystero@0.25.4/nostr/+esm', 'https://esm.run/trystero@0.25.4'];
  (async () => {
    for (const url of sources) {
      try { const m = await import(url); if (m && m.joinRoom) { window.Trystero = m; return; } } catch (e) { window.TrysteroError = String(e); }
    }
    window.TrysteroFailed = true;
  })();
</script>
<!-- PeerJS: direct phone-to-phone links (used when the page is hosted on the open web,
     e.g. GitHub Pages). Falls back to a second CDN if the first is blocked. -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"
        onerror="var s=document.createElement('script');s.src='https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js';document.head.appendChild(s);"></script>
<script>
'use strict';

/** Build id. The site build stamps a timestamp here; phones compare it to spot a stale copy. */
const BUILD = '20261002-224602';

/* =====================================================================
   1. CONFIG, TIERS & PALETTE  (physics values are per 60 Hz tick)
   ===================================================================== */
const CFG = {
  TICK_MS: 1000 / 60,
  DRAG: 0.985,               // permanent linear drag
  THRUST: 0.2,
  MAX_SPEED: 7.5,
  TURN_LERP: 0.28,
  KEY_TURN: 0.085,           // radians per tick when turning with keys
  AIM_DEADZONE: 0.12,
  THRUST_START: 0.4,         // below: aim only; above: aim + thrust

  FIRE_COOLDOWN_MS: 140,     // fastest tapping rate
  FIRE_REPEAT_MS: 260,       // steady rate while FIRE is held
  BULLET_SPEED: 10.5,
  BULLET_LIFE: 58,
  BULLET_INHERIT: 0.5,
  MAX_BULLETS: 140,

  HULL: 3,                   // hits a ship can take
  HIT_INVULN: 36,            // ticks of protection after a hit
  SPAWN_SHIELD: 100,         // ~1.7 s shield when a round goes live, to get your bearings
  SPAWN_CLEAR: 190,          // rocks spawn at least this far from either ship
  ROCK_INVULN: 80,           // after bouncing off a rock
  SHIP_R: 12,
  SHIP_HIT_R: 13,

  ROUND_MS: 60000,           // 1-minute rounds
  INTRO_MS: 3000,
  RESULT_MS: 3400,
  WINS_NEEDED: 2,

  UFO_SCORE: 150,
  UFO_BULLET_SPEED: 4.6,
  UFO_BULLET_LIFE: 120,
  UFO_SHOTS: 4,

  JOY_RADIUS: 64,

const SHIP_COLORS = [          // 16 hues spread evenly round the wheel, so no two hulls look alike

  ['orange',  '#FF6536', 'LAVA ORANGE'],  ['amber',   '#FFAA2B', 'ELECTRIC AMBER'],

  ['teal',    '#00BDAF', 'TEAL'],         ['cyan',    '#1DE9FF', 'ELECTRIC CYAN'],
  ['sky',     '#4AA9FF', 'SKY BLUE'],     ['cobalt',  '#4776FF', 'COBALT'],
  ['indigo',  '#725BFF', 'INDIGO'],       ['violet',  '#AA5CFF', 'ULTRAVIOLET'],

const AST_COLORS = [null, '#b388ff', '#ff9f1c', '#39ff14'];

/* UFOs cycle through the rainbow so they never blend in with any hull color.

const UFO_HUES = Array.from({ length: 48 }, (_, i) => `hsl(${i * 7.5}, 100%, 62%)`);
const ufoOff = u => ((u.id | 0) * 17) % 48;   // same on every screen (ids are synced)

/* =====================================================================
   2. CANVAS SETUP (DPR capped at 2 to keep glow cheap on a 3.5x screen)
   ===================================================================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d', { alpha: false });
const bg = document.createElement('canvas');
let W = 0, H = 0, DPR = 1, SAFE_TOP = 0, SAFE_BOTTOM = 0;
/* PLAYFIELD UNITS. Everything moves in a shared field that is REF_W x REF_H units on
   every device (a phone-shaped reference). SX/SY map field units to this screen's pixels
   along each axis. Speeds, headings and network data all live in field units, so every
   device plays the same game: a ship at full speed crosses the field's width (or height)
   in exactly the same time on a phone, a tablet or a full-screen monitor. Shapes are
   still drawn in plain pixels, so nothing looks stretched. */
const REF_W = 412, REF_H = 860;
let SX = 1, SY = 1;
/** Heading in field units → direction on this screen (for drawing and spawn offsets). */
const toScreenAngle = a => Math.atan2(Math.sin(a) * SY, Math.cos(a) * SX);
/** Direction on this screen (stick, mouse) → heading in field units. */
const toFieldAngle = sa => Math.atan2(Math.sin(sa) / SY, Math.cos(sa) / SX);
/** Pixel offset on this screen → heading in field units. */
const fieldAngleTo = (dx, dy) => Math.atan2(dy / SY, dx / SX);

/** Screen size changed (fullscreen, rotation, window resize): keep every object at the
 *  same spot in the playfield instead of leaving it at its old pixel position. */
function rescaleWorld(kx, ky) {
  const sc = o => { if (!o) return; if (o.x !== undefined) o.x *= kx; if (o.y !== undefined) o.y *= ky;
    if (o.tx !== undefined) o.tx *= kx; if (o.ty !== undefined) o.ty *= ky; if (o.base !== undefined) o.base *= ky; };
  try {
    for (const list of [world.asteroids, world.ufos, world.bullets, world.rings]) list.forEach(sc);
    for (let i = 0; i < Particles.count; i++) sc(Particles.pool[i]);
    sc(ship); if (opp) sc(opp);
  } catch (_) {}
}
function resize() {
  // Crisp but affordable: cap the canvas at ~3.5 million pixels so full-screen desktops keep 60 fps
  DPR = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(3.5e6 / Math.max(1, window.innerWidth * window.innerHeight)));
  // Full window on every device. Online positions travel as fractions of the screen,
  // so a phone and a wide monitor still share one playfield.
  const ow = W, oh = H;
  W = window.innerWidth; H = window.innerHeight;
  SX = W / REF_W; SY = H / REF_H;
  if (ow && oh && (ow !== W || oh !== H) && typeof rescaleWorld === 'function') rescaleWorld(W / ow, H / oh);
  canvas.classList.toggle('desk', DESKTOP);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const cs = getComputedStyle(document.getElementById('safeProbe'));
  SAFE_TOP = parseFloat(cs.paddingTop) || 0;
  SAFE_BOTTOM = parseFloat(cs.paddingBottom) || 0;
  buildBackground();
}
function buildBackground() {
  bg.width = canvas.width; bg.height = canvas.height;
  const g = bg.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.imageSmoothingEnabled = false;
  g.fillStyle = '#05010f'; g.fillRect(0, 0, W, H);
  const step = 32;
  for (let i = 0, x = 0; x <= W; x += step, i++) { g.fillStyle = i % 4 === 0 ? 'rgba(110,60,255,0.22)' : 'rgba(80,40,190,0.10)'; g.fillRect(Math.round(x), 0, 1, H); }
  for (let i = 0, y = 0; y <= H; y += step, i++) { g.fillStyle = i % 4 === 0 ? 'rgba(110,60,255,0.22)' : 'rgba(80,40,190,0.10)'; g.fillRect(0, Math.round(y), W, 1); }
  for (let i = 0; i < 90; i++) {
    g.fillStyle = `rgba(255,255,255,${(0.2 + Math.random() * 0.6).toFixed(2)})`;
    const s = Math.random() < 0.15 ? 2 : 1;
    g.fillRect(Math.floor(Math.random() * W), Math.floor(Math.random() * H), s, s);
  }
  const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.65)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
}

/* =====================================================================
   3. MATH HELPERS
   ===================================================================== */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const snap = v => Math.round(v) + 0.5;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function wrapDelta(d, size) { if (d > size / 2) d -= size; else if (d < -size / 2) d += size; return d; }
function wrap(o) { if (o.x < 0) o.x += W; else if (o.x >= W) o.x -= W; if (o.y < 0) o.y += H; else if (o.y >= H) o.y -= H; }
function wrapDist2(a, b) { const dx = wrapDelta(a.x - b.x, W), dy = wrapDelta(a.y - b.y, H); return dx * dx + dy * dy; }
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const buzz = ms => {
  try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {}
  try { if (typeof padRumble === 'function') padRumble(ms); } catch (_) {}
};

/* =====================================================================
   4. PARTICLE SYSTEM — pooled, adapts to frame rate
   ===================================================================== */
const Particles = {
  pool: [], count: 0, quality: 1,
  init() { for (let i = 0; i < CFG.MAX_PARTICLES; i++) this.pool.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, color: '#fff', size: 2, drag: 0.96 }); },
  emit(x, y, vx, vy, life, color, size, drag = 0.96) {
    if (this.count >= CFG.MAX_PARTICLES) return;
    const p = this.pool[this.count++];
    p.x = x; p.y = y; p.vx = vx; p.vy = vy; p.life = p.max = life; p.color = color; p.size = size; p.drag = drag;
  },
  burst(x, y, color, amount, speed, lifeBase = 40) {
    const n = Math.max(4, Math.round(amount * this.quality));
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = rand(0.3, 1) * speed;
      this.emit(x, y, Math.cos(a) * s, Math.sin(a) * s, Math.round(rand(0.5, 1) * lifeBase),
        Math.random() < 0.18 ? '#ffffff' : color, Math.random() < 0.3 ? 3 : 2, 0.955);
    }
  },
  update() {
    const pool = this.pool;
    for (let i = 0; i < this.count;) {
      const p = pool[i];
      p.x += p.vx; p.y += p.vy; p.vx *= p.drag; p.vy *= p.drag; wrap(p);
      if (--p.life <= 0) { this.count--; pool[i] = pool[this.count]; pool[this.count] = p; } else i++;
    }
  },
  draw() {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < this.count; i++) {
      const p = this.pool[i], t = p.life / p.max;
      ctx.globalAlpha = t; ctx.fillStyle = p.color;
      const s = Math.max(1, Math.round(p.size * (0.4 + t * 0.6)));
      ctx.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  },
  clear() { this.count = 0; }
};

/* =====================================================================
   5. NEON VECTOR DRAWING
   ===================================================================== */
function neonPoly(pts, color, width = 2, glow = 16, closed = true) {
  ctx.beginPath();
  ctx.moveTo(snap(pts[0][0]), snap(pts[0][1]));
  for (let i = 1; i < pts.length; i++) ctx.lineTo(snap(pts[i][0]), snap(pts[i][1]));
  if (closed) ctx.closePath();
  ctx.lineJoin = 'miter';
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.shadowColor = color; ctx.shadowBlur = glow;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = Math.max(1, width * 0.4);
  ctx.stroke();
}
function drawWrapped(x, y, r, fn) {
  fn(x, y);
  const ox = x < r ? W : x > W - r ? -W : 0, oy = y < r ? H : y > H - r ? -H : 0;
  if (ox) fn(x + ox, y);
  if (oy) fn(x, y + oy);
  if (ox && oy) fn(x + ox, y + oy);
}

/** Hull outlines by remaining hull. Each hit bends, tears and cracks it further. */
const SHIP_SHAPES = {
  3: [[16, 0], [-10, -10], [-5, 0], [-10, 10]],
  2: [[16, 0], [-10, -10], [-5, 0], [-8, 5], [-10, 10]],            // dented flank
  1: [[14, 1], [-3, -6], [-7, -3], [-5, 0], [-7, 4], [-10, 10]],     // left wing torn off
};
const SHIP_CRACKS = {
  3: [],
  2: [[[4, -3], [-1, 1], [-5, -2]]],
  1: [[[6, 2], [0, -1], [-3, 3]], [[-2, 5], [-6, 7]]],
};
function drawShip(x, y, a, color, thrust, tick, hp = CFG.HULL) {
  hp = clamp(hp, 1, 3);
  const c = Math.cos(a), s = Math.sin(a);
  const T = ([px, py]) => [x + px * c - py * s, y + px * s + py * c];
  // Badly damaged hulls flicker like a failing tube light
  const col = hp === 1 && (tick % 9 < 2) ? '#ffffff' : color;
  if (hp === 1) ctx.globalAlpha = 0.75 + 0.25 * Math.sin(tick * 0.9);
  neonPoly(SHIP_SHAPES[hp].map(T), col, 2.2, hp === 3 ? 18 : 12);
  for (const crack of SHIP_CRACKS[hp]) neonPoly(crack.map(T), '#ffffff', 1, 6, false);
  ctx.globalAlpha = 1;
  if (thrust > 0.05) {
    const len = 8 + thrust * 14 * (0.7 + ((tick * 7) % 5) / 10);
    neonPoly([[-7, -5], [-7 - len, 0], [-7, 5]].map(T), '#ffffff', 1.5, 14, false);
  }
}
/** Sparks and smoke from damaged hulls. */
function damageFx(o) {
  if (!o.alive || o.hp >= 3) return;
  const q = Particles.quality;
  if (Math.random() < (o.hp === 2 ? 0.07 : 0.16) * q)
    Particles.emit(o.x + rand(-6, 6), o.y + rand(-6, 6), rand(-1.6, 1.6), rand(-1.6, 1.6), 12, Math.random() < 0.5 ? '#ffe600' : '#ffffff', 2, 0.9);
  if (o.hp === 1 && Math.random() < 0.4 * q)
    { const sa = toScreenAngle(o.a);
      Particles.emit(o.x - Math.cos(sa) * 6 + rand(-3, 3), o.y - Math.sin(sa) * 6 + rand(-3, 3),
        o.vx * SX * 0.3 + rand(-0.3, 0.3), o.vy * SY * 0.3 + rand(-0.3, 0.3), 34, '#5b5470', 3, 0.97); }
}
function explodeShip(x, y, color) {
  Sound.play('boom');
  Particles.burst(x, y, color, 110, 6.5, 65);
  Particles.burst(x, y, '#ffffff', 40, 3.5, 45);
  Particles.burst(x, y, '#ff9f1c', 30, 2.5, 50);
  addRing(x, y, color, 130); addRing(x, y, '#ffffff', 70);
  world.shake = 16;
}
function drawUfo(u, tick) {
  const P = pts => pts.map(([px, py]) => [u.x + px, u.y + py]);
  const o = ufoOff(u);                                                // each saucer starts on its own hue
  neonPoly(P([[-17, 0], [-8, -6], [8, -6], [17, 0], [8, 6], [-8, 6]]), ufoHue(o), 2, 14);
  neonPoly(P([[-6, -6], [-4, -11], [4, -11], [6, -6]]), ufoHue(o + 12), 1.5, 10, false);   // dome a quarter-turn ahead
  neonPoly(P([[-17, 0], [17, 0]]), ufoHue(o + 24), 1, 6, false);
  [-9, 0, 9].forEach((lx, i) => {                                     // chasing rainbow belly lights
    ctx.fillStyle = (tick >> 3) % 3 === i ? '#ffffff' : ufoHue(o + 16 * i);
    ctx.fillRect(Math.round(u.x + lx - 1), Math.round(u.y + 2), 2, 2);
  });
}

/* =====================================================================
   6. WORLD ENTITIES
   ===================================================================== */
const world = { asteroids: [], bullets: [], ufos: [], rings: [], shake: 0 };

const ship = {
  x: 0, y: 0, vx: 0, vy: 0, a: -Math.PI / 2, thrust: 0,
  hp: CFG.HULL, alive: false, invuln: 0,
  shots: 0,        // total shots fired; peers replay new ones
  dealt: 0,        // hits I landed on my rival this round (online: rival applies them)
  applied: 0,      // rival's hits on me already applied this round
  lastDealt: -999,
  color: '#ff3f8e', colorName: 'NEON PINK',
};

let nextAstId = Math.floor(Math.random() * 1e5);
function makeAsteroid(x, y, size, speedMul = 1, id = nextAstId++ % 1e6) {
  const r = mulberry32(id * 2654435761);                 // same outline on every client
  const n = 7 + Math.floor(r() * 5), pts = [];
  for (let i = 0; i < n; i++) pts.push({ a: (i / n) * TAU + (r() - 0.5) * 0.3, d: 0.7 + r() * 0.35 });
  const dir = Math.random() * TAU, sp = rand(0.5, 1.2) * (1 + (3 - size) * 0.4) * speedMul;
  return { id, x, y, vx: Math.cos(dir) * sp, vy: Math.sin(dir) * sp, r: AST_RADIUS[size], size,
           rot: r() * TAU, spin: (r() - 0.5) * 0.05, pts, color: AST_COLORS[size], tx: undefined, ty: undefined };
}
function drawAsteroid(a) {
  drawWrapped(a.x, a.y, a.r + 4, (x, y) =>
    neonPoly(a.pts.map(p => [x + Math.cos(p.a + a.rot) * a.r * p.d, y + Math.sin(p.a + a.rot) * a.r * p.d]), a.color, 2, 12));
}
function explodeAsteroid(a) {
  Sound.play('rock', a.size);
  Particles.burst(a.x, a.y, a.color, 10 + a.size * 16, 2 + a.size * 1.3, 30 + a.size * 10);
  addRing(a.x, a.y, a.color, a.r * 2.2);
  world.shake = Math.max(world.shake, a.size * 2.5);
}
function explodeUfo(u) {
  Sound.play('boom');
  for (let k = 0; k < 5; k++) Particles.burst(u.x, u.y, UFO_HUES[k * 9 + (ufoOff(u) % 9)], 12, 4.5, 45);   // rainbow confetti
  Particles.burst(u.x, u.y, '#ffffff', 20, 2.5, 30);
  addRing(u.x, u.y, ufoHue(ufoOff(u)), 60); addRing(u.x, u.y, ufoHue(ufoOff(u) + 24), 40);
  world.shake = Math.max(world.shake, 6);
}

  if (world.bullets.length >= CFG.MAX_BULLETS) world.bullets.shift();
  world.bullets.push({ x, y, vx, vy, life, color, owner });
}
function shootFrom(o, color, owner) {
  const c = Math.cos(o.a), s = Math.sin(o.a), sa = toScreenAngle(o.a);
  spawnBullet(o.x + Math.cos(sa) * 16, o.y + Math.sin(sa) * 16, c * CFG.BULLET_SPEED + o.vx * CFG.BULLET_INHERIT,
    s * CFG.BULLET_SPEED + o.vy * CFG.BULLET_INHERIT, color, owner);
}
function fireLocal() { shootFrom(ship, ship.color, 'local'); ship.shots++; Sound.play('shoot'); }

function drawBullets() {
  ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'square';
  for (const b of world.bullets) {
    const px = b.vx * SX, py = b.vy * SY, sp = Math.hypot(px, py) || 1, len = b.owner === 'ufo' ? 4 : 7;
    const tx = b.x - (px / sp) * len, ty = b.y - (py / sp) * len;
    ctx.strokeStyle = b.color; ctx.globalAlpha = 0.45; ctx.lineWidth = b.owner === 'ufo' ? 8 : 6;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 1; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tx, ty); ctx.stroke();

}

const spark = (x, y) => Particles.burst(x, y, '#ffffff', 5, 2, 14);

/* =====================================================================
   7. CONTROLS
   Bottom 60% of the screen is split in two:
     left half  = FLY: a floating stick appears under your thumb. Small
                  push aims, big push aims + thrusts.
     right half = FIRE: tap to shoot, hold for steady fire.
   Labeled FLY / FIRE guides show at the bottom corners until the player
   has flown and fired enough to get it; then they fade away for good
   (remembered on this device). The zones keep working either way.
   Desktop: drag with the mouse on the left, click right or Space to fire.
   ===================================================================== */
/** Control scheme: touch (phones/tablets) or desktop (keyboard + mouse). */
const forcedControls = new URLSearchParams(location.search).get('controls');
let DESKTOP = forcedControls ? forcedControls === 'desktop'
  : !(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

const joy = { active: false, id: null, bx: 0, by: 0, kx: 0, ky: 0, mag: 0, angle: 0 };
const fire = { held: false, id: null, lastShot: -1e9, repeatAcc: 0, pulse: 0, tapX: 0, tapY: 0 };
let now = 0;

/** Tutorial guides: fade out after ~2 s of thrust and 8 shots. */
const learn = { thrustTicks: 0, shots: 0, done: false, alpha: 1 };
const learnKey = () => DESKTOP ? 'neonAsteroids.learnedDesktop' : 'neonAsteroids.learned';
try { learn.done = localStorage.getItem(learnKey()) === '1'; } catch (_) {}
if (learn.done) learn.alpha = 0;
function noteLearning() {
  if (learn.done) return;
  if (learn.thrustTicks >= 120 && learn.shots >= 8) {
    learn.done = true;
    try { localStorage.setItem(learnKey(), '1'); } catch (_) {}
  }
}

const zoneTop = () => H * CFG.CONTROL_TOP;
const flyPad = () => ({ x: 26 + CFG.JOY_RADIUS, y: H - CFG.JOY_RADIUS - 34 - SAFE_BOTTOM });
const fireBtn = () => ({ x: W - CFG.FIRE_R - 26, y: H - CFG.FIRE_R - 44 - SAFE_BOTTOM });
const inFireZone = (x, y) => y >= zoneTop() && x >= W * 0.5;
const inFlyZone = (x, y) => y >= zoneTop() && x < W * 0.5;

function canFly() { return state === 'play' && !menuOpen && ship.alive && (match.ph === 'play' || match.ph === 'wait'); }
function tryFire() {
  if (!canFly()) return;
  if (now - fire.lastShot < CFG.FIRE_COOLDOWN_MS) return;
  fire.lastShot = now; fire.repeatAcc = 0; fire.pulse = 1;
  fireLocal();
  learn.shots++; noteLearning();
}
function firePress(id, x, y) {
  if (state !== 'play' || menuOpen) return;
  fire.held = true; fire.id = id;
  if (x !== undefined) { fire.tapX = x; fire.tapY = y; }
  tryFire();
}
function fireRelease(id) { if (fire.id === id) { fire.held = false; fire.id = null; } }

function joyStart(id, x, y) {
  if (state !== 'play' || menuOpen || joy.active) return;
  joy.active = true; joy.id = id; joy.bx = joy.kx = x; joy.by = joy.ky = y; joy.mag = 0;
}
function joyMove(id, x, y) {
  if (!joy.active || joy.id !== id) return;
  const dx = x - joy.bx, dy = y - joy.by, d = Math.hypot(dx, dy);
  const k = d > CFG.JOY_RADIUS ? CFG.JOY_RADIUS / d : 1;
  joy.kx = joy.bx + dx * k; joy.ky = joy.by + dy * k;
  joy.mag = Math.min(d / CFG.JOY_RADIUS, 1);
  if (d > 2) joy.angle = Math.atan2(dy, dx);
}
function joyEnd(id) { if (joy.id === id) { joy.active = false; joy.id = null; joy.mag = 0; } }

function pointerDown(id, x, y) {
  Sound.unlock();
  if (inFireZone(x, y)) firePress(id, x, y);
  else if (inFlyZone(x, y)) joyStart(id, x, y);
}
function pointerUp(id) { fireRelease(id); joyEnd(id); }

canvas.addEventListener('touchstart', e => { e.preventDefault(); useTouch(); for (const t of e.changedTouches) { const p = toLocal(t.clientX, t.clientY); pointerDown(t.identifier, p.x, p.y); } }, { passive: false });

const touchEnd = e => { e.preventDefault(); for (const t of e.changedTouches) pointerUp(t.identifier); };

/* ---------------------------------------------------------------------
   DESKTOP CONTROLS (auto-detected: no touch-first pointer)
     Keyboard: W/↑ thrust · A D/← → turn · S/↓ brake · Space fire
     Mouse:    ship turns to face the cursor · right-click (hold) thrust ·
               left-click (hold) fire
   Keys and mouse mix freely: turning keys take over aim until the mouse
   moves again. Esc or P opens the menu. `?controls=touch|desktop` forces
   a scheme. A touch on the screen switches to touch controls.
   --------------------------------------------------------------------- */
const keys = { up: false, down: false, left: false, right: false, lastTurn: 0 };
const mouse = { x: 0, y: 0, inside: false, thrust: false, lastMove: -1 };
const KEYMAP = { KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down', KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right' };
function toLocal(cx, cy) { const r = canvas.getBoundingClientRect(); return { x: cx - r.left, y: cy - r.top }; }
const typing = e => e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA');
function clearDesktopInput() { keys.up = keys.down = keys.left = keys.right = false; mouse.thrust = false; fireRelease('key'); fireRelease('mouseL'); }
function useTouch() { if (!DESKTOP) return; DESKTOP = false; clearDesktopInput(); applyControlScheme(); resize(); }

/** Desktop steering, called from update() while the ship can fly. */
function desktopSteer() {
  const turn = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (turn) { ship.a += turn * CFG.KEY_TURN; keys.lastTurn = performance.now(); }
  else if (mouse.inside && mouse.lastMove > keys.lastTurn) {
    const dx = mouse.x - ship.x, dy = mouse.y - ship.y;
    if (dx * dx + dy * dy > 14 * 14) ship.a += angDiff(fieldAngleTo(dx, dy), ship.a) * CFG.TURN_LERP;
  }
  if (keys.up || mouse.thrust) ship.thrust = 1;
  if (keys.down) { ship.vx *= 0.95; ship.vy *= 0.95; }
}

window.addEventListener('keydown', e => {
  if (typing(e)) return;
  if ((e.code === 'Escape' || e.code === 'KeyP') && state === 'play') { e.preventDefault(); menuOpen ? closeMenu() : openMenu(); return; }
  if (state !== 'play' || menuOpen) return;
  const k = KEYMAP[e.code];
  if (k) { e.preventDefault(); keys[k] = true; Sound.unlock(); return; }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) { Sound.unlock(); firePress('key'); } }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code];
  if (k) keys[k] = false;
  if (e.code === 'Space') fireRelease('key');
});
window.addEventListener('blur', clearDesktopInput);
canvas.addEventListener('mousemove', e => {
  if (!DESKTOP) return;
  const p = toLocal(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.lastMove = performance.now();
});
canvas.addEventListener('mouseleave', () => { mouse.inside = false; });
canvas.addEventListener('mousedown', e => {
  if (!DESKTOP || state !== 'play' || menuOpen) return;
  e.preventDefault(); Sound.unlock();
  const p = toLocal(e.clientX, e.clientY);
  mouse.x = p.x; mouse.y = p.y; mouse.inside = true; mouse.lastMove = performance.now();
  if (e.button === 0) firePress('mouseL', p.x, p.y);
  if (e.button === 2) mouse.thrust = true;
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) fireRelease('mouseL');
  if (e.button === 2) mouse.thrust = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

/** Keyboard + mouse guide panels at the bottom; they fade once learned, like the touch guides. */
function drawDesktopGuides(a, col) {
  if (a <= 0.01) return;
  const gap = 10, pw = Math.min(280, (W - 28 - gap) / 2), ph = 92, y0 = H - ph - 16 - SAFE_BOTTOM;
  const pad = (W - (pw * 2 + gap)) / 2;                 // centered pair, capped width on wide screens
  const panel = (x, title, rows) => {
    ctx.globalAlpha = a * 0.85; ctx.fillStyle = 'rgba(5,1,15,0.7)'; ctx.fillRect(x, y0, pw, ph);
    ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.shadowColor = col; ctx.shadowBlur = 10;
    ctx.strokeRect(Math.round(x) + 0.5, Math.round(y0) + 0.5, Math.round(pw), ph); ctx.shadowBlur = 0;
    ctx.globalAlpha = a; ctx.textAlign = 'left'; ctx.fillStyle = col; ctx.font = 'bold 11px "Courier New", monospace';
    ctx.fillText(title, x + 10, y0 + 17);
    rows.forEach(([key, what, on], i) => {
      const yy = y0 + 36 + i * 17;
      ctx.globalAlpha = a * (on ? 1 : 0.8);
      ctx.fillStyle = on ? col : '#ffffff'; ctx.font = 'bold 11px "Courier New", monospace'; ctx.fillText(key, x + 10, yy);
      ctx.fillStyle = on ? col : '#9a8fd6'; ctx.font = '11px "Courier New", monospace'; ctx.textAlign = 'right'; ctx.fillText(what, x + pw - 10, yy); ctx.textAlign = 'left';
    });
    ctx.globalAlpha = 1;
  };
  panel(pad, 'KEYBOARD', [
    ['W / ↑', 'THRUST', keys.up], ['A D / ← →', 'TURN', keys.left || keys.right], ['S / ↓', 'BRAKE', keys.down], ['SPACE', 'FIRE', fire.id === 'key' && fire.held],
  ]);
  panel(pad + pw + gap, 'MOUSE', [
    ['MOVE', 'AIM', mouse.inside && mouse.lastMove > keys.lastTurn], ['RIGHT CLICK', 'THRUST', mouse.thrust], ['LEFT CLICK', 'FIRE', fire.id === 'mouseL' && fire.held], ['ESC', 'MENU', false],
  ]);
}

/** Menu help text for the active control scheme. */
function applyControlScheme() {
  const how = document.getElementById('howTo');
  if (!how) return;
  how.innerHTML = DESKTOP
    ? '<b>KEYBOARD:</b> W/↑ thrust · A D/← → turn · S/↓ brake · SPACE fire<br><b>MOUSE:</b> aim with the cursor · RIGHT CLICK thrust · LEFT CLICK fire<br>ESC opens the menu.<br>Best of 3 · 1-minute rounds · 3 hits and you\'re scrap.'
    : '<b>FLY</b> (left thumb): drag to steer. Push far to thrust.<br><b>FIRE</b> (right thumb): tap to shoot. Hold for steady fire.<br>Best of 3 · 1-minute rounds · 3 hits and you\'re scrap.<br>Last ship flying or most points wins the round.';
}


/** A labeled round control guide (FLY / FIRE). */
function drawGuide(x, y, r, label, sub, col, alpha, pressed) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = alpha * (pressed ? 0.95 : 0.6);
  ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.shadowColor = col; ctx.shadowBlur = 16 + (pressed ? 14 : 0);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke();
  if (pressed) { ctx.globalAlpha = alpha * 0.22; ctx.fillStyle = col; ctx.fill(); }
  ctx.shadowBlur = 0; ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 16px "Courier New", monospace'; ctx.fillText(label, x, y - 4);
  ctx.font = 'bold 9px "Courier New", monospace'; ctx.fillStyle = col; ctx.fillText(sub, x, y + 12);
  ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1;
}

function drawControls() {
  const col = ship.color;
  learn.alpha = learn.done ? Math.max(0, learn.alpha - 0.02) : Math.min(1, learn.alpha + 0.05);
  const a = learn.alpha;

  if (DESKTOP) { drawDesktopGuides(a, col); return; }
  // Tutorial guides at the bottom corners
  const fp = flyPad(), fb = fireBtn();
  if (a > 0) {
    // soft divider between the two halves
    ctx.globalAlpha = 0.18 * a; ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.setLineDash([5, 9]);
    ctx.beginPath(); ctx.moveTo(Math.round(W / 2) + 0.5, zoneTop()); ctx.lineTo(Math.round(W / 2) + 0.5, H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, Math.round(zoneTop()) + 0.5); ctx.lineTo(W, Math.round(zoneTop()) + 0.5); ctx.stroke();
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    if (!joy.active) drawGuide(fp.x, fp.y, CFG.JOY_RADIUS, 'FLY', 'DRAG TO STEER', col, a, false);
    drawGuide(fb.x, fb.y, CFG.FIRE_R, 'FIRE', 'TAP · HOLD', col, a, fire.held);
  }
  // After the guides are gone, a quick ripple where FIRE was tapped
  if (fire.pulse > 0.05 && a < 0.5 && fire.id !== 'key') {
    ctx.globalAlpha = fire.pulse * 0.6; ctx.strokeStyle = col; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(fire.tapX, fire.tapY, 18 + (1 - fire.pulse) * 26, 0, TAU); ctx.stroke(); ctx.globalAlpha = 1;
  }
  if (!joy.active) return;
  // Floating stick under the thumb
  ctx.globalAlpha = 0.5;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.arc(joy.bx, joy.by, CFG.JOY_RADIUS, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 0.2; ctx.setLineDash([4, 6]);
  ctx.beginPath(); ctx.arc(joy.bx, joy.by, CFG.JOY_RADIUS * CFG.THRUST_START, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
  ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.moveTo(joy.bx, joy.by); ctx.lineTo(joy.kx, joy.ky); ctx.stroke();
  ctx.globalAlpha = 0.9; ctx.fillStyle = col; ctx.shadowBlur = 20;
  ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 20, 0, TAU); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(joy.kx, joy.ky, 7, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
}

/* ---------------------------------------------------------------------
   8-BIT SOUND — tiny WebAudio synth: square/triangle blips and filtered
   noise bursts. No audio files. Starts on the first tap (browsers
   require a gesture). Mute choice is remembered on this device.
   --------------------------------------------------------------------- */
const Sound = {
  ctx: null, master: null, noiseBuf: null, on: true, last: {},
  unlock() {
    if (!this.on) return;
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;

        this.master = this.ctx.createGain(); this.master.gain.value = 0.32; this.master.connect(this.ctx.destination);
        const len = this.ctx.sampleRate * 1, buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

  ok(name, gapMs) {                       // rate-limit busy sounds so they don't pile up
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return false;

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);

  noise(dur, f0, f1, vol = 0.25, delay = 0) {

    f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);

  seq(notes, step, type = 'square', vol = 0.16) { notes.forEach((n, i) => this.tone(n, n, step * 0.95, type, vol, i * step)); },

      case 'rival':    if (this.ok(name, 60))  this.tone(880, 330, 0.07, 'square', 0.05); break;
      case 'rock':     if (this.ok(name, 45))  { const s = arg || 2; this.noise(0.1 + s * 0.08, 2600 - s * 500, 180, 0.22 + s * 0.05); } break;
      case 'hit':      if (this.ok(name, 80))  { this.tone(220, 55, 0.22, 'square', 0.22); this.noise(0.14, 1800, 200, 0.2); } break;
      case 'thud':     if (this.ok(name, 80))  this.tone(160, 60, 0.15, 'triangle', 0.18); break;
      case 'boom':     if (this.ok(name, 120)) { this.noise(0.8, 1600, 60, 0.45); this.tone(130, 30, 0.6, 'triangle', 0.3); } break;
      case 'ufo':      if (this.ok(name, 400)) this.seq([660, 990, 660, 990, 660, 990], 0.07, 'square', 0.06); break;
      case 'ufoShot':  if (this.ok(name, 60))  this.tone(260, 900, 0.12, 'sawtooth', 0.07); break;
      case 'tick':     if (this.ok(name, 200)) this.tone(440, 440, 0.09, 'square', 0.12); break;
      case 'go':       if (this.ok(name, 500)) this.seq([523, 659, 784, 1047], 0.07, 'square', 0.13); break;
      case 'roundWin': if (this.ok(name, 800)) this.seq([659, 784, 1047, 1319], 0.09, 'square', 0.13); break;
      case 'roundLose':if (this.ok(name, 800)) this.seq([392, 330, 262, 196], 0.11, 'triangle', 0.18); break;
      case 'draw':     if (this.ok(name, 800)) this.seq([523, 523, 392], 0.1, 'square', 0.1); break;
      case 'win':      if (this.ok(name, 1500)) this.seq([523, 659, 784, 1047, 784, 1047, 1319, 1568], 0.1, 'square', 0.13); break;
      case 'lose':     if (this.ok(name, 1500)) this.seq([440, 415, 392, 370, 349, 262], 0.14, 'triangle', 0.18); break;
      case 'click':    if (this.ok(name, 60))  this.tone(990, 990, 0.035, 'square', 0.07); break;
      case 'thrust':   if (this.ok(name, 90))  this.noise(0.08, 500, 200, 0.05 + 0.06 * (arg || 0)); break;

function setSound(on) {
  Sound.on = on;
  try { if (Ads.push) Ads.push({ sound: on ? 'on' : 'off' }); } catch (_) {}   // (Ads is defined later in the file)
  try { localStorage.setItem('neonAsteroids.sound', on ? 'on' : 'off'); } catch (_) {}
  for (const id of ['soundBtn', 'soundBtn2']) { const b = document.getElementById(id); if (b) b.textContent = on ? 'SOUND: ON' : 'SOUND: OFF'; }

/** Try a WebSocket; resolve true on open within ms. */
function wsProbe(url, ms = 5000) {
  return new Promise(res => {
    let ws, done = false;
    const end = ok => { if (done) return; done = true; try { ws && ws.close(); } catch (_) {} res(ok); };
    try { ws = new WebSocket(url); } catch (_) { end(false); return; }
    ws.onopen = () => end(true); ws.onerror = () => end(false);
    setTimeout(() => end(false), ms);
  });
}
/** Gather ICE candidates; returns { types:Set, srflx:[{base,port}] } or null. */
async function iceGather(servers, policy, ms = 6000) {
  let pc;
  try {
    pc = new RTCPeerConnection({ iceServers: servers, iceTransportPolicy: policy });
    pc.createDataChannel('probe');
    const types = new Set(), srflx = [], hosts = new Set();
    pc.onicecandidate = e => {
      const c = e.candidate && e.candidate.candidate; if (!c) return;
      const t = / typ (\w+)/.exec(c); if (t) types.add(t[1]);
      const p = c.split(' '), udp = String(p[2]).toLowerCase() === 'udp';
      if (!udp || !t) return;
      if (t[1] === 'host') hosts.add(p[4] + ':' + p[5]);
      if (t[1] === 'srflx') {
        const ri = p.indexOf('raddr'), rp = p.indexOf('rport');
        srflx.push({ ip: p[4], port: p[5], raddr: ri > 0 ? p[ri + 1] + ':' + (rp > 0 ? p[rp + 1] : '') : '' });
      }
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise(res => { const tm = setTimeout(res, ms); pc.onicegatheringstatechange = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(tm); res(); } }; });
    return { types, srflx, hosts: hosts.size };
  } catch (_) { return null; }
  finally { try { pc && pc.close(); } catch (_) {} }
}

/** Two relay-only connections inside this page send a message to each other — the
 *  same path a real game takes on a strict network, end to end. */
async function relayLoopback(servers, ms) {
  const t0 = performance.now();
  let a, b, timer;
  try {
    const cfg = { iceServers: servers, iceTransportPolicy: 'relay' };
    a = new RTCPeerConnection(cfg); b = new RTCPeerConnection(cfg);
    a.onicecandidate = e => { if (e.candidate) b.addIceCandidate(e.candidate).catch(() => {}); };
    b.onicecandidate = e => { if (e.candidate) a.addIceCandidate(e.candidate).catch(() => {}); };
    const ch = a.createDataChannel('nt');
    const got = new Promise((res, rej) => {
      b.ondatachannel = e => { e.channel.onmessage = m => res(m.data); };
      timer = setTimeout(() => rej(new Error(`no reply in ${ms / 1000}s · ${a.iceConnectionState}`)), ms);
    });
    ch.onopen = () => ch.send('ping');
    await a.setLocalDescription(await a.createOffer());
    await b.setRemoteDescription(a.localDescription);
    await b.setLocalDescription(await b.createAnswer());
    await a.setRemoteDescription(b.localDescription);
    await got;
    return { ok: true, ms: Math.round(performance.now() - t0) };
  } catch (e) { return { ok: false, why: String(e && e.message || e).slice(0, 60) }; }
  finally { clearTimeout(timer); try { a && a.close(); b && b.close(); } catch (_) {} }
}

async function runNetworkTest() {
  if (ntRunning) return;
  ntRunning = true; ntBuildRows(); ntVerdict.className = 'nt-verdict'; ntVerdict.textContent = 'Running the test… this takes about 15 seconds.';
  for (const [k] of NT_STEPS) ntSet(k, 'run');

  // 1 Browser
  const hasRTC = typeof RTCPeerConnection !== 'undefined', secure = window.isSecureContext;
  ntSet('browser', hasRTC && secure ? 'ok' : 'fail', `${deviceSummary()}${hasRTC ? '' : ' · no WebRTC'}${secure ? '' : ' · page not secure (needs https)'}`);

  if (inClaude()) {
    // Inside Claude the game uses Claude's live channel instead of WebRTC
    const api = await roomApiPromise;
    ntSet('code', api ? 'ok' : 'fail', api ? 'Claude live channel available' : 'Not available in this viewer');
    for (const k of ['internet', 'relays', 'direct', 'turn', 'rlink', 'nat']) ntSet(k, 'skip', 'Not used inside Claude');
    return ntFinish();
  }

  // 2 Online code
  for (let i = 0; i < 40 && !trysteroLib() && !window.TrysteroFailed; i++) await new Promise(r => setTimeout(r, 200));
  ntSet('code', trysteroLib() ? 'ok' : 'fail', trysteroLib() ? 'Matchmaking library loaded' : 'Could not load the matchmaking library in this browser');

  // 3–6 in parallel
  const internet = (async () => {
    const t0 = performance.now();
    try { const r = await fetch(location.pathname + '?nettest=' + Date.now(), { cache: 'no-store' }); const ms = Math.round(performance.now() - t0);
      ntSet('internet', r.ok ? (ms > 1500 ? 'warn' : 'ok') : 'fail', r.ok ? `Page server answered in ${ms} ms${ms > 1500 ? ' (slow connection)' : ''}` : `Server answered ${r.status}`);
    } catch (_) { ntSet('internet', 'fail', 'No internet connection'); }
  })();
  const relays = (async () => {
    const res = await Promise.all(NT_RELAYS.map(u => wsProbe(u)));
    const n = res.filter(Boolean).length;
    ntSet('relays', n >= 2 ? 'ok' : n === 1 ? 'warn' : 'fail', `${n} of ${NT_RELAYS.length} public relays reachable${n ? '' : ' (network may block them)'}`);
  })();
  const ice = hasRTC ? await iceServers() : [];
  const stun = ice.filter(x => !isTurn(x)), turn = ice.filter(x => isTurn(x));
  const direct = (async () => {
    if (!hasRTC) { ntSet('direct', 'fail', 'Browser has no WebRTC'); ntSet('nat', 'skip', ''); return; }
    const g = await iceGather(stun, 'all');
    if (!g) { ntSet('direct', 'fail', 'Could not start a connection test'); ntSet('nat', 'skip', ''); return; }
    const ok = g.types.has('srflx');
    ntSet('direct', ok ? 'ok' : 'warn', ok ? 'Found a public address (direct links possible)' : 'No public address found (direct links likely blocked)');
    // Symmetric NAT: the same local socket shows up with different public ports for different STUN servers
    const v = natVerdict(g), seen = `${new Set(g.srflx.map(c => c.ip + ':' + c.port)).size} public port(s), ${g.hosts} local socket(s)`;
    strictNet = v;
    if (!g.srflx.length) ntSet('nat', 'warn', 'Unknown (no public address seen)');
    else if (v === true) ntSet('nat', 'warn', `Strict network (symmetric NAT) — games will use the backup relay · ${seen}`);
    else if (v === false) ntSet('nat', 'ok', 'Normal network');
    else ntSet('nat', 'ok', `Probably normal (this browser hides some details) — games try a direct link first · ${seen}`);
  })();
  const turnT = (async () => {
    if (!hasRTC) { ntSet('turn', 'fail', 'Browser has no WebRTC'); return; }
    if (!turn.length) { ntSet('turn', 'warn', 'No backup relay configured'); return; }
    const g = await iceGather(turn, 'relay', 8000);
    const ok = g && g.types.has('relay');
    ntSet('turn', ok ? 'ok' : 'fail', ok ? 'Backup relay reachable' : 'Backup relay unreachable (blocked or busy)');
    if (!ok) { ntSet('rlink', 'skip', 'Skipped (relay not reachable)'); return; }
    const r = await relayLoopback(turn, 15000);
    ntSet('rlink', r.ok ? 'ok' : 'fail', r.ok ? `Test message went through the relay in ${r.ms} ms` : `Relay answered but game data didn't get through (${r.why})`);
  })();
  await Promise.all([internet, relays, direct, turnT]);
  ntFinish();
}

function ntFinish() {
  const st = k => (ntState[k] || {}).status;
  let verdict, cls;
  if (st('browser') === 'fail' || st('code') === 'fail') {
    verdict = 'This browser can\'t play online. Open the link in Safari (iPhone) or Chrome (Android/computer) — not inside another app — and update the phone if it\'s old.'; cls = 'bad';
  } else if (inClaude()) {
    verdict = 'Inside Claude, online play uses Claude\'s live channel. For Quick Play and the most reliable connections, use the game\'s web address.'; cls = st('code') === 'ok' ? 'good' : 'bad';
  } else if (st('internet') === 'fail') {
    verdict = 'No internet connection. Check Wi-Fi or cellular data and run the test again.'; cls = 'bad';
  } else if (st('relays') === 'fail') {
    verdict = 'This network blocks the matchmaking relays, so phones can\'t find each other. Switch between Wi-Fi and cellular, or turn off any VPN, ad blocker, Screen Time or school/work filter.'; cls = 'bad';
  } else if (st('direct') === 'ok' && st('nat') === 'ok') {
    verdict = 'GOOD TO CONNECT. Everything online play needs is working on this network.'; cls = 'good';
  } else if (st('turn') === 'ok' && st('rlink') === 'fail') {
    verdict = 'MAY NOT CONNECT. The backup relay answers but this network stops game data going through it. Use cellular data on this network, or try another Wi-Fi.'; cls = 'bad';
  } else if (st('turn') === 'ok') {
    verdict = 'SHOULD CONNECT. This network limits direct links, so games will use the backup relay (it may take a little longer to join).'; cls = 'ok';
  } else {
    verdict = 'MAY NOT CONNECT. This network blocks direct links and the backup relay. Try the other network (Wi-Fi ↔ cellular), or turn off iCloud Private Relay / VPN, then run the test again.'; cls = 'bad';
  }
  ntVerdict.textContent = verdict; ntVerdict.className = 'nt-verdict ' + cls;
  track('net_test', { verdict: cls, nat: (ntState.nat || {}).status || '-', relay: (ntState.turn || {}).status || '-',
    rlink: (ntState.rlink || {}).status || '-', relays: (ntState.relays || {}).status || '-' });
  ntReport = [`Neon Asteroids network test · build ${BUILD} · ${new Date().toLocaleString()}`,
    ...NT_STEPS.map(([k, label]) => `${label}: ${(ntState[k] || {}).status || '-'} — ${(ntState[k] || {}).detail || ''}`),
    `Verdict: ${verdict}`].join('\n');
  ntRunning = false;
}

/* ---------------------------------------------------------------------
   ADS — Google AdSense H5 Games Ads (Ad Placement API).
   Off until ADSENSE_CLIENT holds your publisher ID ("ca-pub-…"). Never runs inside Claude.
   Placement follows Google's games policy: full-screen ads only at natural breaks —
   here, after a finished match when you leave the result screen. Never during play, never

   Google also rate-limits ads itself (see data-ad-frequency-hint).
   Test mode: add ?adtest=1 to the address to see Google's test ads (no earnings).
   --------------------------------------------------------------------- */
const ADSENSE_CLIENT = '';                 // e.g. 'ca-pub-1234567890123456'
const Ads = {
  ready: false,
  init() {
    if (!ADSENSE_CLIENT || inClaude()) return;
    const sc = document.createElement('script');
    sc.async = true; sc.crossOrigin = 'anonymous';
    sc.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' + ADSENSE_CLIENT;

/* ---------------------------------------------------------------------
   REMATCH HANDSHAKE (online). Tapping REMATCH asks the rival; the new game
   only starts when BOTH have asked. The request rides on the result-screen
   heartbeat ({on:0, rm:1}) twice a second, so it survives a dropped message.
   Once both agree: at 15 s without the rival loading in we check the link and
   reconnect if it's down; at 30 s we explain what's happening and offer
   KEEP WAITING / QUICK PLAY / MENU.
   --------------------------------------------------------------------- */
const RM = { mine: false, theirs: false, at: 0, expired: false, cancelled: false };
let rematchWait = null;            // { at, checked, helpAt } while a mutually-accepted rematch is connecting
const rmStatus = document.getElementById('rmStatus'), rmRow = document.getElementById('rmRow');
const rematchLive = () => !!(net && net.keepAlive && !net.closed && net.linked && net.linked());
function requestRematch() {
  if (RM.mine) return;
  RM.mine = true; RM.at = performance.now(); RM.cancelled = false;
  net.publish({ v: 1, on: 0, rm: 1 }); netAcc = 0;
  track('rematch', { step: RM.theirs ? 'accepted' : 'requested' });
  if (RM.theirs) startRematch('both');
}
function rivalRematch(wants) {
  if (wants && !RM.theirs) { RM.theirs = true; RM.cancelled = false; if (!RM.mine) Sound.play('go'); }
  else if (!wants && RM.theirs) { RM.theirs = false; RM.cancelled = true; }
  if (RM.mine && RM.theirs) startRematch('both');
}
function startRematch(why) {
  if (state !== 'over') return;
  // tell the rival once more, then load in (they start the moment they see it)
  net.publish({ v: 1, on: 0, rm: 1 });
  net.rejoin = true;
  rematchWait = { at: performance.now(), checked: false, helpAt: performance.now() + 30000 };
  overEl.classList.add('hidden'); rmRow.classList.add('hidden');
  startGame();
}
/** While a rematch both players accepted is connecting (game shows the warm-up field). */
function rematchTick() {
  if (state !== 'play' || match.ph !== 'wait') {
    if (rematchWait) track('rematch', { step: 'started', secs: Math.round((performance.now() - rematchWait.at) / 1000) });
    rematchWait = null; net.rejoin = false; document.getElementById('rmHelp').classList.add('hidden'); return;
  }
  const t = performance.now() - rematchWait.at;
  if (t > 15000 && !rematchWait.checked) {
    rematchWait.checked = true;
    const quiet = performance.now() - (net.lastHeard || 0);
    if (!net.linked() || quiet > 4000) { if (net.partner) net._lost(); else if (net._fresh) net._fresh(); }   // link looks dead: re-meet on the same code
  }
  if (performance.now() >= rematchWait.helpAt) showRematchHelp();
}
function rematchDiag() {
  const linked = net.linked && net.linked(), quiet = Math.round((performance.now() - (net.lastHeard || 0)) / 1000);
  const relay = net.diag && net.diag.relay, attempt = net.joinAttempt || 1, reconnecting = /RECONNECT/.test(net.status || '');
  let verdict;
  if (linked && quiet <= 3) verdict = '✅ Still connected to your rival — the rematch is processing. Their game is probably still loading (slow phone or a menu open).';
  else if (reconnecting || !linked) verdict = `🔄 The connection dropped and the game is reconnecting you (attempt ${attempt}${relay ? ', via backup relay' : ''}). This can take up to a minute on strict Wi-Fi.`;
  else verdict = `⚠️ No word from your rival for ${quiet}s — the rematch has probably failed (they may have closed the game or lost signal).`;
  return `${verdict}<br><span style="opacity:.7">Link: ${linked ? 'up' : 'down'} · last heard ${quiet}s ago · ${relay ? 'relay' : 'direct'} · attempt ${attempt}</span>`;
}

  const box = document.getElementById('rmHelp');
  document.getElementById('rmHelpText').innerHTML = rematchDiag();

}

function syncRematchUI() {
  const again = document.getElementById('againBtn');
  if (state !== 'over' || mode !== 'online') {
    rmStatus.classList.add('hidden'); rmRow.classList.add('hidden'); again.classList.remove('pulse', 'waiting');

  }

        : 'Your rival has left. Tap below to find a new match.';
    cls = 'bad';
    again.textContent = net.fromRandom ? 'QUICK PLAY' : 'PLAY AGAIN';
  } else if (RM.mine && !RM.theirs) {

    if (secs >= 15) msg += '<br><span style="opacity:.75">Still connected; they haven\'t tapped REMATCH yet.</span>';

  again.classList.toggle('pulse', live && RM.theirs && !RM.mine);
  again.classList.toggle('waiting', live && RM.mine && !RM.theirs);
  rmRow.classList.toggle('hidden', !(live && RM.mine && !RM.theirs));
}

/* ---------------------------------------------------------------------
   QUICK PLAY → BOT WHILE YOU WAIT
   After BOT_OFFER_MS alone in the Quick Play pool, offer a bot match. The pool
   search keeps running in the background (bgNet); the moment it pairs us with a
   real pilot, the bot game is dropped and the online match takes over.
   --------------------------------------------------------------------- */
const BOT_OFFER_MS = 20000;
let bgNet = null;                                     // Quick Play search running under a bot game
const waitBot = document.getElementById('waitBot');
let botPulseAt = 0;
function pulseWaitBot() {
  waitBot.style.setProperty('--c', ship.color);
  waitBot.classList.remove('pulse'); void waitBot.offsetWidth; waitBot.classList.add('pulse');   // restart the animation
}
waitBot.addEventListener('click', () => {
  if (!net.searching) return;
  Sound.unlock(); Sound.play('click');
  track('bot_while_waiting', { secs: Math.round((performance.now() - (net.startedAt || performance.now())) / 1000) });
  bgNet = net; net = new NullAdapter();               // keep searching; startGame won't close it
  mode = 'bot';
  startGame();
});
function adoptQuickMatch() {
  const found = bgNet; bgNet = null;
  if (!found || found.closed) return;
  closeMenu(true); overEl.classList.add('hidden');
  opp = null; remotes.clear();
  mode = 'online'; onlineRole = 'random';
  startGame(found);
}

/* =====================================================================
   FULLSCREEN · INSTALLABLE APP · CONTROLLERS
   ===================================================================== */

/* ---- Fullscreen. Phones go fullscreen automatically when a game starts (a tap is
   required by browsers, so it happens on the button press). The FULLSCREEN button
   toggles it and the choice is remembered. iPhone Safari has no fullscreen API —
   there, installing to the Home Screen gives the full-screen app instead. ---- */
const FS = {
  key: 'neonAsteroids.fullscreen',
  supported: !!(document.fullscreenEnabled || document.webkitFullscreenEnabled),
  isOn: () => !!(document.fullscreenElement || document.webkitFullscreenElement),
  installed: () => {
    try { return matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
    catch (_) { return false; }
  },
  wanted() { let v = null; try { v = localStorage.getItem(this.key); } catch (_) {} return v ? v === 'on' : !DESKTOP; },
  remember(on) { try { localStorage.setItem(this.key, on ? 'on' : 'off'); } catch (_) {} },
  enter() {
    if (!this.supported || this.isOn() || inClaude()) return;
    const el = document.documentElement;
    try {
      const r = el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen && el.webkitRequestFullscreen();
      Promise.resolve(r).then(() => {
        try { if (!DESKTOP && screen.orientation && screen.orientation.lock) screen.orientation.lock('portrait').catch(() => {}); } catch (_) {}
      }).catch(() => {});
    } catch (_) {}
  },
  exit() { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (_) {} },
  auto() { if (this.wanted() && !this.installed()) this.enter(); },
  toggle() { if (this.isOn()) { this.remember(false); this.exit(); } else { this.remember(true); this.enter(); } },
  label() {
    const show = this.supported && !this.installed() && !inClaude();
    for (const id of ['fsBtn', 'fsBtn2']) {
      const b = document.getElementById(id); if (!b) continue;
      b.classList.toggle('hidden', !show); b.textContent = this.isOn() ? 'EXIT FULLSCREEN' : 'FULLSCREEN';
    }
  },
};
for (const id of ['fsBtn', 'fsBtn2']) document.getElementById(id).addEventListener('click', () => { Sound.unlock(); Sound.play('click'); FS.toggle(); });
document.addEventListener('fullscreenchange', () => { FS.label(); setTimeout(resize, 60); });
document.addEventListener('webkitfullscreenchange', () => { FS.label(); setTimeout(resize, 60); });
FS.label();

/* ---- Installable app (PWA): manifest + service worker make Chrome offer
   "Install app"; our INSTALL APP button triggers it directly. iPhone/iPad use
   Share → Add to Home Screen (we show how). Installed, it runs full screen. ---- */
let installPrompt = null;
const installBtn = document.getElementById('installBtn'), installNote = document.getElementById('installNote');
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function refreshInstall() {
  const canShow = !inClaude() && !FS.installed() && (installPrompt || isIOS);
  installBtn.classList.toggle('hidden', !canShow);
  installBtn.textContent = isIOS && !installPrompt ? 'ADD TO HOME SCREEN' : 'INSTALL APP';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; refreshInstall(); });
window.addEventListener('appinstalled', () => { installPrompt = null; refreshInstall(); installNote.classList.add('hidden'); track('app_installed'); });
installBtn.addEventListener('click', async () => {
  Sound.unlock(); Sound.play('click');
  if (installPrompt) {
    installPrompt.prompt();
    try { const r = await installPrompt.userChoice; track('install_prompt', { outcome: r && r.outcome }); } catch (_) {}
    installPrompt = null; refreshInstall();
  } else if (isIOS) {
    installNote.textContent = 'In Safari: tap the Share button (square with ↑), then "Add to Home Screen".';
    installNote.classList.toggle('hidden');
  }
});
refreshInstall();
if ('serviceWorker' in navigator && !inClaude() && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

/* ---- Controllers (Xbox, PlayStation, Switch Pro, most Bluetooth/USB pads via the
   browser Gamepad API, "standard" mapping):
     In game:  LEFT STICK steer (push far = thrust) · D-PAD ←/→ turn, ↑ thrust, ↓ brake
               A / RB / RT fire (hold for steady fire) · B / LT brake
               Y = ADD BOT while waiting · START / VIEW = menu
     Menus:    STICK or D-PAD move · A select · B back
   Browsers only reveal a controller after its first button press. ---- */
const Pad = { on: false, prev: [], focus: null, navAt: 0, navDir: '', toastT: null, steer: null, used: false, lastG: null };
const PAD_DEAD = 0.18;
function padGet() {
  if (!navigator.getGamepads) return null;
  let gps; try { gps = navigator.getGamepads(); } catch (_) { return null; }
  for (const g of gps || []) if (g && g.connected && g.buttons && g.buttons.length) return g;
  return null;
}
const padBtn = (g, i) => { const b = g.buttons[i]; return !!(b && (b.pressed || b.value > 0.45)); };
function padToast(msg, ms = 6000) {
  const t = document.getElementById('padToast');
  t.innerHTML = msg; t.classList.remove('hidden');
  clearTimeout(Pad.toastT); Pad.toastT = setTimeout(() => t.classList.add('hidden'), ms);
}
window.addEventListener('gamepadconnected', e => {
  Pad.on = true;
  padToast('🎮 CONTROLLER CONNECTED<br>STICK steer · push far to thrust · A / RT fire<br>B / LT brake · START menu');
  track('controller', { id: String(e.gamepad && e.gamepad.id || '').slice(0, 60) });
});
window.addEventListener('gamepaddisconnected', () => { Pad.on = !!padGet(); if (fire.id === 'pad') fireRelease('pad'); padToast('🎮 CONTROLLER DISCONNECTED', 2500); });
function padRumble(ms) {
  const g = Pad.lastG, a = g && g.vibrationActuator;
  if (!a || !a.playEffect) return;
  try { a.playEffect('dual-rumble', { duration: Math.min(ms * 1.5, 400), strongMagnitude: ms > 100 ? 1 : 0.6, weakMagnitude: 0.5 }).catch(() => {}); } catch (_) {}
}

/** Called every frame: reads the controller, handles firing and menu navigation. */
function padPoll() {
  const g = padGet(); Pad.lastG = g;
  if (!g) { Pad.steer = null; if (fire.id === 'pad') fireRelease('pad'); return; }
  const pressed = i => padBtn(g, i), tap = i => pressed(i) && !Pad.prev[i];
  const ax = g.axes[0] || 0, ay = g.axes[1] || 0, mag = Math.hypot(ax, ay);
  const inGame = state === 'play' && !menuOpen;

  if (inGame) {
    // steering (applied in update via padSteer)
    const stick = mag > PAD_DEAD ? { angle: Math.atan2(ay, ax), mag: Math.min(1, (mag - PAD_DEAD) / (1 - PAD_DEAD)) } : null;
    const turn = (pressed(15) ? 1 : 0) - (pressed(14) ? 1 : 0);
    Pad.steer = { stick, turn, up: pressed(12), brake: pressed(13) || pressed(1) || pressed(6) };
    if (stick || turn || Pad.steer.up) Pad.used = true;
    // fire: A, RB or RT
    const fireNow = pressed(0) || pressed(5) || pressed(7);
    if (fireNow && !(fire.held && fire.id === 'pad')) { Sound.unlock(); firePress('pad'); }
    else if (!fireNow && fire.id === 'pad') fireRelease('pad');
    // Y: ADD BOT while waiting · START / VIEW: menu
    if (tap(3) && !waitBot.classList.contains('hidden')) waitBot.click();
    if (tap(9) || tap(8)) { Sound.play('click'); openMenu(); }
    padFocus(null);
  } else {
    Pad.steer = null;
    if (fire.id === 'pad') fireRelease('pad');
    padNavigate(g, pressed, tap, ax, ay);
  }
  Pad.prev = g.buttons.map((b, i) => pressed(i));
}

/** Apply controller steering to the ship. Returns true if the controller moved it. */
function padSteer() {
  const s = Pad.steer; if (!s) return false;
  let used = false;
  if (s.stick) {
    ship.a += angDiff(toFieldAngle(s.stick.angle), ship.a) * CFG.TURN_LERP;
    ship.thrust = clamp((s.stick.mag - CFG.THRUST_START) / (1 - CFG.THRUST_START), 0, 1);
    used = true;
  }
  if (s.turn) { ship.a += s.turn * CFG.KEY_TURN; used = true; }
  if (s.up) { ship.thrust = 1; used = true; }
  if (s.brake) { ship.vx *= 0.95; ship.vy *= 0.95; used = true; }
  return used;
}

/* ---- Menu navigation with the controller ---- */
function padScreen() {
  for (const id of ['netTest', 'pauseMenu', 'over', 'menu']) {
    const el = document.getElementById(id);
    if (el && !el.classList.contains('hidden')) return el;
  }
  return null;
}
function padTargets(root) {
  return [...root.querySelectorAll('button, input, .dot')].filter(el =>
    !el.hidden && !el.disabled && el.offsetParent !== null && !el.classList.contains('hidden'));
}
function padFocus(el) {
  if (Pad.focus && Pad.focus !== el) Pad.focus.classList.remove('pad-focus');
  Pad.focus = el;
  if (el) { el.classList.add('pad-focus'); try { el.focus({ preventScroll: false }); } catch (_) {} el.scrollIntoView({ block: 'nearest' }); }
}
function padNavigate(g, pressed, tap, ax, ay) {
  const root = padScreen(); if (!root) { padFocus(null); return; }
  // B = back, START/VIEW closes the in-game menu — these work even before anything is highlighted
  if (tap(1)) {
    if (root.id === 'pauseMenu') { Sound.play('click'); closeMenu(); return; }
    if (root.id === 'netTest') { document.getElementById('ntClose').click(); return; }
  }
  if ((tap(9) || tap(8)) && root.id === 'pauseMenu') { Sound.play('click'); closeMenu(); return; }
  const list = padTargets(root); if (!list.length) return;
  if (!Pad.focus || !list.includes(Pad.focus)) {
    if (!(tap(0) || tap(12) || tap(13) || tap(14) || tap(15) || Math.hypot(ax, ay) > 0.6)) return;   // wake on first input
    Pad.navDir = pressed(12) ? 'up' : pressed(13) ? 'down' : pressed(14) ? 'left' : pressed(15) ? 'right' : 'stick';
    Pad.navAt = performance.now() + 400;                            // the waking press only shows the focus
    padFocus(root.querySelector('.btn.go:not(.hidden)') && list.includes(root.querySelector('.btn.go:not(.hidden)'))
      ? root.querySelector('.btn.go:not(.hidden)') : list[0]);
    return;
  }
  // direction from d-pad or stick (with key-repeat style timing)
  let dir = pressed(12) ? 'up' : pressed(13) ? 'down' : pressed(14) ? 'left' : pressed(15) ? 'right' : '';
  if (!dir && Math.hypot(ax, ay) > 0.6) dir = Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? 'right' : 'left') : (ay > 0 ? 'down' : 'up');
  const t = performance.now();
  if (dir && Pad.navDir === 'stick' && Math.hypot(ax, ay) > 0.6) dir = '';   // stick still held from the wake
  if (dir && (dir !== Pad.navDir || t >= Pad.navAt)) {
    Pad.navAt = t + (dir !== Pad.navDir ? 320 : 150); Pad.navDir = dir;
    const next = padNeighbor(Pad.focus, list, dir);
    if (next) { padFocus(next); Sound.play('click'); }
  } else if (!dir) Pad.navDir = '';
  if (tap(0)) { Sound.unlock(); Pad.focus.click(); }
}
function padNeighbor(from, list, dir) {
  // Edge-based: a target must lie beyond the current button's edge in that direction;
  // closest gap wins, staying in the same row/column is preferred.
  const r = from.getBoundingClientRect();
  let best = null, bestScore = Infinity;
  for (const el of list) {
    if (el === from) continue;
    const q = el.getBoundingClientRect();
    const gap = dir === 'right' ? q.left - r.right : dir === 'left' ? r.left - q.right
              : dir === 'down' ? q.top - r.bottom : r.top - q.bottom;
    if (gap < -10) continue;
    const horiz = dir === 'left' || dir === 'right';
    const side = horiz ? Math.max(0, q.top - r.bottom, r.top - q.bottom) : Math.max(0, q.left - r.right, r.left - q.right);
    const centre = horiz ? Math.abs((q.top + q.bottom) - (r.top + r.bottom)) / 2 : Math.abs((q.left + q.right) - (r.left + r.right)) / 2;
    const score = Math.max(0, gap) + side * 2 + centre * 0.15;
    if (score < bestScore) { bestScore = score; best = el; }
  }
  return best;
}

/** HUD buttons live in the page, not the canvas: show them only when they apply. */
function syncHudButtons() {
  syncRematchUI();
  pauseBtn.classList.toggle('hidden', state !== 'play' || menuOpen);
  const waiting = state === 'play' && !menuOpen && mode === 'online' && net.searching && match.ph === 'wait';
  const showBot = waiting && performance.now() - (net.startedAt || performance.now()) > BOT_OFFER_MS;
  if (showBot && waitBot.classList.contains('hidden')) { pulseWaitBot(); botPulseAt = performance.now() + rand(10000, 20000); }
  else if (showBot && performance.now() >= botPulseAt) { pulseWaitBot(); botPulseAt = performance.now() + rand(10000, 20000); }
  waitBot.classList.toggle('hidden', !showBot);
  const showShare = state === 'play' && !menuOpen && mode === 'online' && !inClaude() && net.role === 'host' && !net.fromRandom && match.ph === 'wait' && !net.linked?.();
  waitShare.classList.toggle('hidden', !showShare);
  if (showShare) waitShare.style.top = Math.round(H * 0.17 + 104) + 'px';
  else if (waitShare.textContent !== 'SHARE INVITE LINK') waitShare.textContent = 'SHARE INVITE LINK';
}

refreshMenu();
applyControlScheme();

// Tell the rival we're gone as soon as the page closes
window.addEventListener('pagehide', () => { try { net.close(); } catch (_) {} });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();
Particles.init();
selectColor(SHIP_COLORS[Math.floor(Math.random() * SHIP_COLORS.length)][0]);   // random hull each visit; tap to change
seedAmbient();
requestAnimationFrame(frame);
</script>

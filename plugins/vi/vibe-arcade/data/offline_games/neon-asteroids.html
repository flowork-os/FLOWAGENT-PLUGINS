/* =====================================================================
   8. NETWORKING
   ---------------------------------------------------------------------
   Every player shares one presence object (~15x/s):
     { v, on, col, x, y, vx, vy, a, t, al, hp, sh, dmg, dr, hs,
       [host only] ast, ufo, m }
   - sh:  shot counter. Peers replay new shots from that ship's nose.
   - dmg: hits this player landed on their rival in round `dr`. The
          SHOOTER decides hits (what you see is what you hit); the victim
          applies new ones to their own hull.
   - hp/al: the victim owns their hull and reports it.
   - ast/ufo/m: the host owns rocks, UFOs, the clock, scores and wins.
   Coordinates travel as 0..10000 of the screen so different phones
   share one playfield.
   ===================================================================== */
class NetAdapter {
  constructor() { this.handlers = {}; this.connected = false; this.isHost = true; this.myId = 'me'; this.status = ''; this.lastShots = new Map(); }
  on(type, fn) { (this.handlers[type] ||= []).push(fn); return this; }
  emit(type, msg) { (this.handlers[type] || []).forEach(fn => fn(msg)); }
  connect() {} publish() {} close() { this.connected = false; }

  /** Turn one rival presence object into game events. Input is untrusted: shape-check everything. */
  _ingest(peerId, s) {
    // Rival is on the result screen ("on: 0" heartbeat, maybe with a rematch request): still here, not leaving.
    if (s && typeof s === 'object' && s.v === 1 && !s.on && !s.bye) { this.emit('idle', { id: peerId, rm: +s.rm ? 1 : 0 }); return false; }
    if (!s || typeof s !== 'object' || s.v !== 1 || !s.on) { this.lastShots.delete(peerId); this.emit('leave', { id: peerId, bye: !!(s && s.bye) }); return false; }
    const m = {
      id: peerId, col: typeof s.col === 'string' && /^#[0-9a-f]{6}$/i.test(s.col) ? s.col : '#ffffff',
      x: dx_(+s.x || 0), y: dy_(+s.y || 0), vx: dvx(+s.vx || 0), vy: dvy(+s.vy || 0),
      a: (+s.a || 0) / 1000, thr: clamp((+s.t || 0) / 100, 0, 1), alive: !!s.al,
      hp: clamp(+s.hp || 0, 0, CFG.HULL), dmg: Math.max(0, +s.dmg || 0), dr: +s.dr || 0,
    };
    this.emit('state', m);
    const sh = +s.sh || 0, prev = this.lastShots.get(peerId);
    if (prev !== undefined && sh > prev && m.alive) {
      const c = Math.cos(m.a), sn = Math.sin(m.a), sa = toScreenAngle(m.a);
      for (let i = 0; i < Math.min(3, sh - prev); i++) this.emit('fire', {
        id: peerId, x: m.x + Math.cos(sa) * 16, y: m.y + Math.sin(sa) * 16,
        vx: c * CFG.BULLET_SPEED + m.vx * CFG.BULLET_INHERIT, vy: sn * CFG.BULLET_SPEED + m.vy * CFG.BULLET_INHERIT,
      });
    }
    this.lastShots.set(peerId, sh);
    return true;
  }
  /** Guests: pass the host's rocks, UFOs and match state to the game. */
  _hostSnapshot(s) {
    this.emit('snapshot', { ast: Array.isArray(s.ast) ? s.ast : [], ufo: Array.isArray(s.ufo) ? s.ufo : [], m: s.m && typeof s.m === 'object' ? s.m : null });
  }
}
class NullAdapter extends NetAdapter {}

const nx = x => Math.round(x / W * 1e4), ny = y => Math.round(y / H * 1e4);
const nvx = v => Math.round(v / REF_W * 1e5), nvy = v => Math.round(v / REF_H * 1e5);   // field units → wire
const dx_ = x => x / 1e4 * W, dy_ = y => y / 1e4 * H;
const dvx = v => v / 1e5 * REF_W, dvy = v => v / 1e5 * REF_H;                             // wire → field units

/** The page's live room channel; null when not opened inside Claude. */
const roomApiPromise = (window.claude && typeof window.claude.use === 'function')
  ? window.claude.use('room').catch(() => null) : Promise.resolve(null);

/**
 * Shared-channel fallback: when a private per-code room can't be opened,
 * everyone meets in the page's shared channel and only pilots whose
 * presence carries the same room code (`rc`) count.
 */
function lobbyRoom(api, code) {
  const mine = p => p.sameTab || (p.presence && p.presence.rc === code);
  // Anyone who drops the code (or switches codes) counts as having left
  const filt = ch => ({ peers: ch.peers.filter(mine), joined: ch.joined.filter(mine), updated: ch.updated.filter(mine),
                        left: ch.left.concat(ch.updated.filter(p => !mine(p))) });
  return {
    shared: true,
    onPeers: (h, err) => api.onPeers(ch => h(filt(ch)), err),
    onConnection: (h, err) => api.onConnection(h, err),
    connected: () => api.connected(),
    peers: () => api.peers().filter(mine),
    presence: obj => api.presence({ ...obj, rc: code }),
    leave: () => api.presence({ v: 1, on: 0, bye: 1, rc: null }),
  };
}

class RoomAdapter extends NetAdapter {
  async connect(code, role = 'host') {
    this.role = role;
    this.closed = false; this.status = 'CONNECTING…';
    this.lastShots = new Map(); this.lastHostPresence = null; this.hostId = null;
    this.settled = false; this.claiming = false;
    this.diag = { link: 'waiting', room: '-', err: '' };
    const api = await roomApiPromise;
    if (this.closed) return;
    if (!api) {
      this.diag.link = 'none';
      this.status = 'NO LIVE LINK IN THIS VIEWER · OPEN THE LINK IN CHROME OR SAFARI, SIGNED IN TO CLAUDE.AI';
      return;
    }
    this.diag.link = 'yes';
    // Everyone meets in the page's one shared channel; the room code filters who counts.
    // (Private per-code rooms left some devices unable to see each other.)
    this.api = api; this.code = code;
    this.room = lobbyRoom(api, code); this.diag.room = 'shared';
    if (this.closed) { this.room.leave().catch(() => {}); return; }
    this.status = ''; this.connected = this.room.connected();
    const onErr = e => {
      this.diag.err = 'peers:' + ((e && e.code) || 'error'); this.connected = false;
      this.status = e && (e.code === 'not_granted' || e.code === 'revoked')
        ? 'THIS VIEW CAN\'T GO ONLINE · SIGN IN TO CLAUDE AND OPEN THE PAGE THERE' : 'CONNECTION LOST';
    };
    this.unsubs = [
      this.room.onPeers(ch => this._onPeers(ch), onErr),
      this.room.onConnection(c => { this.connected = c; }, onErr),
    ];
    setTimeout(() => {
      if (this.closed || !this.room) return;
      const others = this.room.peers().filter(p => !p.sameTab && p.presence && p.presence.v === 1 && p.presence.on);
      if (others.length >= 2) { this.emit('full', {}); return; }         // duels are 1v1
      this.settled = true; this._elect(this.room.peers());
    }, 1500);
  }
  _onPeers(ch) {
    for (const p of ch.left) { this.lastShots.delete(p.peer); this.emit('leave', { id: p.peer }); }
    for (const p of [...ch.joined, ...ch.updated]) {
      if (p.sameTab) { this.myId = p.peer; continue; }
      this._ingest(p.peer, p.presence);
    }
    this._elect(ch.peers);
  }
  /** Host election, identical everywhere: a player already hosting keeps it;
   *  otherwise the lowest peer id. Newcomers can't claim for 1.5 s. */
  _elect(peers) {
    const inGame = p => p.sameTab || (p.presence && p.presence.v === 1 && p.presence.on);
    const claims = p => p.sameTab ? this.claiming : !!p.presence.hs;
    const players = peers.filter(inGame);
    const pool = players.some(claims) ? players.filter(claims) : players;
    let host = null;
    for (const p of pool) if (!host || p.peer < host.peer) host = p;
    this.hostId = host ? host.peer : null;
    this.isHost = !host || host.sameTab;
    this.claiming = this.isHost && this.settled;
    if (!this.isHost && host.presence !== this.lastHostPresence) {
      this.lastHostPresence = host.presence;
      this._hostSnapshot(host.presence);
    }
  }
  publish(obj) {
    if (!this.room || this.closed) return;
    this.room.presence(obj).then(() => { if (this.diag.err.startsWith('send:')) this.diag.err = ''; })
      .catch(e => { this.diag.err = 'send:' + ((e && e.code) || 'error'); });
  }
  /** One-line connection report shown while waiting, so problems are visible. */
  report() {
    const d = this.diag || {};
    if (!this.api || !this.room) return `LINK ${d.link}` + (d.err ? ` · ${d.err}` : '');
    const all = this.api.peers();
    const onCode = this.room.peers().length;
    const others = [...new Set(all.filter(p => !p.sameTab && p.presence && p.presence.on && typeof p.presence.rc === 'string' && p.presence.rc !== this.code).map(p => p.presence.rc.slice(0, 4)))];
    return `LINK yes · ${this.connected ? 'CONNECTED' : 'NOT CONNECTED'} · SCREENS ON PAGE ${all.length} · ON YOUR CODE ${onCode}`
      + (others.length ? ` · OTHER CODES IN USE: ${others.join(' ')}` : '') + (d.err ? ` · ${d.err}` : '');
  }
  close() {
    super.close(); this.closed = true;
    (this.unsubs || []).forEach(u => u());
    if (this.room) this.room.leave().catch(() => {});
    this.room = null;
  }
}

/* ---------------------------------------------------------------------
   PeerAdapter — direct phone-to-phone play over WebRTC via PeerJS.
   Used when the page runs on the open web (GitHub Pages). No accounts.

   Room code → a well-known host id ("neon-asteroids-duel-v1-abcd").
   The first phone to claim that id on the free PeerJS matchmaking server
   hosts; the next phone finds it taken and connects to it instead.
   After that the two phones talk directly (the server only introduces
   them). Each side sends the same presence object the Claude version
   uses, ~15x/s, so all game logic is shared.
   --------------------------------------------------------------------- */
const PEER_PREFIX = 'neon-asteroids-duel-v1-';
const PeerCtor = () => window.Peer || (window.peerjs && window.peerjs.Peer) || null;
/** Matchmaking options. `?peerhost=host:port` points at a self-hosted PeerJS server. */
function peerOptions() {
  const opts = { debug: 0, config: { iceServers: iceCache || STUN_SERVERS } };
  const custom = new URLSearchParams(location.search).get('peerhost');
  if (custom) {
    const [h, p] = custom.split(':');
    Object.assign(opts, { host: h, port: +p || 9000, path: '/', secure: location.protocol === 'https:' && h !== 'localhost' });
  }
  return opts;
}

class PeerAdapter extends NetAdapter {
  constructor() {
    super();
    this.keepAlive = true;      // the phone-to-phone link survives between matches, so rematches skip matchmaking
  }
  /** role 'host': claim this room code. role 'join': connect to whoever holds it. */
  connect(code, role = 'host') {
    this.closed = false; this.role = role; this._setCode(code);
    this.conn = null; this.remoteId = null; this.lastHeard = 0; this.attempt = 0; this.fails = 0;
    this.status = role === 'host' ? 'OPENING ROOM…' : 'CONNECTING…';
    this.diag = { role: role === 'host' ? 'opening room' : 'joining', err: '' };
    this.isHost = role === 'host';
    this._whenLib(() => role === 'host' ? this._tryHost() : this._tryJoin());
  }
  _setCode(code) { this.code = code; this.hostId = PEER_PREFIX + code.toLowerCase(); }
  _whenLib(fn) {
    if (this.closed) return;
    if (PeerCtor()) { fn(); return; }
    if (++this.attempt > 20) { this.status = 'COULD NOT LOAD THE MULTIPLAYER LIBRARY · CHECK YOUR CONNECTION'; return; }
    setTimeout(() => this._whenLib(fn), 500);
  }
  /** True while the direct link to the rival is up. Matchmaking trouble doesn't matter then. */
  linked() { return !!(this.conn && this.conn.open); }

  _newPeer(id) {
    const P = PeerCtor();
    const peer = new P(id, peerOptions()); this.peer = peer;
    // Losing the matchmaking server is harmless once linked: quietly reconnect in the background.
    peer.on('disconnected', () => {
      if (this.closed || peer !== this.peer) return;
      setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (_) {} }, this.linked() ? 5000 : 1500);
    });
    return peer;
  }

  // ---- HOST ----
  _tryHost() {
    if (this.closed) return;
    const peer = this._newPeer(this.hostId);
    peer.on('open', () => {
      if (this.closed || peer !== this.peer) { peer.destroy(); return; }
      this.isHost = true; this.myId = peer.id; this.connected = true; this.fails = 0;
      this.status = ''; this.diag.role = 'host'; this.diag.err = '';
    });
    peer.on('connection', c => this._onIncoming(c));
    peer.on('error', e => {
      if (this.closed || peer !== this.peer) return;
      if (e.type === 'unavailable-id') {                 // code already in use: pick a fresh one
        peer.destroy();
        this._setCode(generateRoomCode());
        this.emit('code', { code: this.code });
        setTimeout(() => this._tryHost(), 300);
      } else if (e.type !== 'peer-unavailable') this._fail(e);
    });
  }

  // ---- JOIN ----
  _tryJoin() {
    if (this.closed) return;
    this.isHost = false; this.diag.role = 'joining';
    const peer = this._newPeer(undefined);
    peer.on('open', id => {
      if (this.closed || peer !== this.peer) { peer.destroy(); return; }
      this.myId = id; this.fails = 0; this._dial();
    });
    peer.on('error', e => {
      if (this.closed || peer !== this.peer) return;
      if (e.type === 'peer-unavailable') {               // nobody is hosting this code (yet)
        this.status = `STILL SEARCHING FOR ROOM ${this.code} · MAKE SURE THE CODE MATCHES AND THE HOST IS WAITING`;
        this._redial(3000);
      } else this._fail(e);
    });
  }
  _dial() {
    const peer = this.peer;
    if (this.closed || this.linked()) return;
    if (!peer || peer.destroyed) { this._tryJoin(); return; }
    if (peer.disconnected) { try { peer.reconnect(); } catch (_) {} this._redial(2000); return; }
    const c = peer.connect(this.hostId, { reliable: false, serialization: 'json' });
    const timer = setTimeout(() => { if (!this.linked() && !this.closed && peer === this.peer) { this.diag.err = 'host not answering'; this._dial(); } }, 8000);
    c.on('open', () => {
      clearTimeout(timer); if (this.closed) return;
      this._attach(c); this.connected = true; this.status = ''; this.diag.role = 'guest'; this.diag.err = '';
    });
  }
  _redial(ms) { clearTimeout(this.redialT); this.redialT = setTimeout(() => this._dial(), ms); }

  /** Wait a little longer after each failure so a busy matchmaking server isn't hammered. */
  _backoff() { return Math.min(15000, 1500 * Math.pow(2, this.fails)) + Math.random() * 800; }
  _fail(e) {
    this.diag.err = e.type || 'error';
    if (e.type === 'browser-incompatible') { this.status = 'THIS BROWSER CAN\'T DO DIRECT LINKS · TRY CHROME OR SAFARI'; return; }
    if (this.linked()) return;                            // game link still up: ignore matchmaking trouble
    this.connected = false; this.fails++;
    const wait = this._backoff();
    this.status = ['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)
      ? `MATCHMAKING SERVER BUSY · RETRYING IN ${Math.ceil(wait / 1000)}s` : `CONNECTION PROBLEM (${e.type || 'error'}) · RETRYING`;
    setTimeout(() => {
      if (this.closed || this.linked()) return;
      try { this.peer && this.peer.destroy(); } catch (_) {}
      this.role === 'host' ? this._tryHost() : this._tryJoin();
    }, wait);
  }
  _onIncoming(c) {
    if (this.linked()) {                                  // duels are 1v1
      c.on('open', () => { try { c.send({ full: 1 }); } catch (_) {} setTimeout(() => c.close(), 400); });
      return;
    }
    c.on('open', () => this._attach(c));
  }
  _attach(c) {
    this.conn = c; this.remoteId = c.peer; this.lastHeard = performance.now(); this.status = '';
    c.on('data', d => {
      if (c !== this.conn) return;
      this.lastHeard = performance.now();
      if (d && d.full) { this.emit('full', {}); return; }
      if (this._ingest(this.remoteId, d) && !this.isHost) this._hostSnapshot(d);
    });
    c.on('close', () => this._lost(c));
    c.on('error', () => this._lost(c));
  }
  _lost(c) {
    if (c !== this.conn) return;
    const id = this.remoteId; this.conn = null;
    this.lastShots.delete(id); this.emit('leave', { id, bye: true });
    if (this.role === 'join' && !this.closed) { this.status = 'HOST LEFT · WAITING FOR THEM TO COME BACK…'; this._redial(3000); }
  }
  publish(obj) {
    const c = this.conn;
    if (!c || !c.open || this.closed) return;
    if (performance.now() - this.lastHeard > 6000) { try { c.close(); } catch (_) {} this._lost(c); return; }  // rival went silent
    try { c.send(obj); } catch (_) {}
  }
  report() {
    const d = this.diag || {};
    const sig = this.peer && this.peer.disconnected && this.linked() ? ' · MATCHMAKING OFFLINE (GAME UNAFFECTED)' : '';
    return `DIRECT LINK · ${d.role.toUpperCase()} · ${this.linked() ? 'RIVAL LINKED' : 'NO RIVAL YET'}` + sig + (d.err && !this.linked() ? ` · ${d.err}` : '');
  }
  close() {
    super.close(); this.closed = true; clearTimeout(this.redialT);
    if (this.conn) { try { this.conn.send({ v: 1, on: 0, bye: 1 }); } catch (_) {} }
    const p = this.peer, c = this.conn;
    this.conn = null;
    setTimeout(() => { try { c && c.close(); } catch (_) {} try { p && p.destroy(); } catch (_) {} }, 150);
  }
}

/* ---------------------------------------------------------------------
   TrysteroAdapter — direct phone-to-phone play over WebRTC, introduced
   through Trystero's Nostr strategy: several public relays are used at
   once, so one slow or dead relay doesn't stop a match. No accounts,
   no server of our own. (PeerJS stays as a fallback below.)

   Room code → Trystero room "room-<code>". Everyone in the room says
   hello with their role. The host accepts the first joiner and turns
   away anyone else; the joiner links once the host says ok. After that
   both sides stream the same presence object as every other transport.
   --------------------------------------------------------------------- */
const TRYSTERO_APP = 'neon-asteroids-duel-v1';
const trysteroLib = () => (window.Trystero && typeof window.Trystero.joinRoom === 'function') ? window.Trystero : null;

class TrysteroAdapter extends NetAdapter {
  constructor() { super(); this.keepAlive = true; }
  connect(code, role = 'host') {
    this.closed = false; this.role = role; this.code = code; this.startedAt = performance.now();
    this.partner = null; this.hostPid = null; this.lastHeard = 0; this.attempt = 0;
    this.isHost = role === 'host';
    this.status = role === 'host' ? 'OPENING ROOM…' : 'CONNECTING…';
    this.diag = { role: role === 'host' ? 'opening room' : 'joining', err: '' };
    this._whenLib(() => this._join());
  }
  _whenLib(fn) {
    if (this.closed) return;
    if (trysteroLib()) { fn(); return; }
    if (++this.attempt > 30) { this.status = 'COULD NOT LOAD THE MULTIPLAYER LIBRARY · CHECK YOUR CONNECTION'; return; }
    setTimeout(() => this._whenLib(fn), 500);
  }
  linked() { return !!this.partner; }
  async _join() {
    if (this.closed) return;
    const T = trysteroLib();
    const attempt = (this.joinAttempt || 0) + 1;
    const rtc = await rtcFor(attempt);
    if (this.closed) return;
    this.joinAttempt = attempt;
    this.diag.turn = rtc.turn; this.diag.relay = rtc.relay;
    let room;
    try {
      room = T.joinRoom(
        { appId: TRYSTERO_APP, rtcConfig: rtc.rtcConfig },
        'room-' + this.code.toLowerCase(),
        { onJoinError: e => { this.diag.err = String((e && (e.error || e.message)) || 'join error').slice(0, 60); } },
      );
    } catch (e) { this.status = 'CONNECTION PROBLEM · ' + String(e && e.message || e).slice(0, 60); return; }
    this.room = room; this.myId = T.selfId || 'me';
    if (this.role === 'host') { this.connected = true; this.status = ''; this.diag.role = 'host'; }

    this.aHi = room.makeAction('hi');
    this.aOk = room.makeAction('ok');
    this.aFull = room.makeAction('full');
    this.aP = room.makeAction('p');
    const send = (a, data, pid) => { try { a.send(data, { target: pid }).catch(() => {}); } catch (_) {} };
    this._send = send;

    this.aHi.onMessage = (d, ctx) => this._onHi(d, ctx && ctx.peerId);
    this.aOk.onMessage = (d, ctx) => { if (this.role === 'join' && !this.partner && ctx && ctx.peerId === this.hostPid) this._link(ctx.peerId); };
    this.aFull.onMessage = (d, ctx) => { if (this.role === 'join' && !this.partner) this.emit('full', {}); };
    this.aP.onMessage = (d, ctx) => {
      if (!ctx || ctx.peerId !== this.partner) return;
      this.lastHeard = performance.now();
      if (this._ingest(this.partner, d) && !this.isHost) this._hostSnapshot(d);
    };
    room.onPeerJoin = pid => send(this.aHi, { v: 1, role: this.role }, pid);
    room.onPeerLeave = pid => {
      if (pid === this.partner) this._lost();
      else if (pid === this.hostPid) this.hostPid = null;
    };
    clearTimeout(this.noHostT);
    if (this.role === 'join' && this.joinAttempt >= 3) {
      this.status = `STILL SEARCHING FOR ROOM ${this.code} · MAKE SURE THE CODE MATCHES AND THE HOST IS WAITING`;
    }
    this._armWatchdog();
  }
  /** Not linked in time? Throw the attempt away and start completely fresh. */
  _armWatchdog() {
    clearTimeout(this.watchT);
    // Relay links take longer to set up (up to ~15 s just gathering routes on slow Wi-Fi)
    const ms = this.role === 'join' ? (this.diag.relay ? 50000 : 35000) : 60000;
    this.watchT = setTimeout(() => { if (!this.closed && !this.partner) this._fresh(); }, ms);
  }
  /** Leave the current room entirely (relays + half-open links) and join again from scratch. */
  _fresh() {
    if (!this.partner && this.role === 'join') track('connect_retry', { mode: this.fromRandom ? 'quick' : 'join',
      attempt: this.joinAttempt || 1, relay: this.diag && this.diag.relay ? 1 : 0, strict: strictNet === true ? 1 : 0 });
    clearTimeout(this.watchT); clearTimeout(this.noHostT);
    const old = this.room; this.room = null; this.hostPid = null; this.aP = null;
    try { old && old.leave(); } catch (_) {}
    if (this.closed) return;
    setTimeout(() => this._join(), 1200);
  }
  _onHi(d, pid) {
    if (!pid || !d || typeof d !== 'object') return;
    if (this.role === 'host') {
      if (d.role === 'join') {
        if (!this.partner || this.partner === pid) { this._send(this.aOk, { v: 1 }, pid); if (!this.partner) this._link(pid); }
        else this._send(this.aFull, { v: 1 }, pid);        // duels are 1v1
      } else if (d.role === 'host' && !this.partner && this.myId > pid) {
        this._rehost();                                      // two hosts on one code: the other keeps it
      }
    } else if (d.role === 'host') {
      this.hostPid = pid;
      this._send(this.aHi, { v: 1, role: 'join' }, pid);     // make sure the host has our hello
    }
  }
  _link(pid) {
    track('match_found', { mode: this.fromRandom ? 'quick' : this.role, relay: this.diag && this.diag.relay ? 1 : 0,
      strict: strictNet === true ? 1 : 0, attempts: this.joinAttempt || 1,
      secs: Math.round((performance.now() - (this.startedAt || performance.now())) / 1000) });
    this.partner = pid; this.lastHeard = performance.now();
    this.connected = true; this.status = ''; this.diag.role = this.isHost ? 'host' : 'guest'; this.diag.err = '';
    clearTimeout(this.noHostT); clearTimeout(this.watchT); this.joinAttempt = 0;
  }
  /** Rival gone (left, quit, surrendered or went silent): reset so the next match starts clean. */
  _lost() {
    const id = this.partner; this.partner = null;
    this.lastShots.delete(id); this.emit('leave', { id, bye: true });
    if (this.closed) return;
    if (this.role === 'host') this._fresh();          // host: reopen a clean room, ready for the next player
    else if (this.rejoin) { this.status = 'RECONNECTING…'; this._fresh(); }   // rematch in progress: find the host again
    else { this.status = 'HOST LEFT'; this.close(); } // joiner: done; Rematch will join from scratch
  }
  _rehost() {
    try { this.room && this.room.leave(); } catch (_) {}
    this.code = generateRoomCode();
    this.emit('code', { code: this.code });
    setTimeout(() => this._join(), 300);
  }
  publish(obj) {
    if (!this.partner || this.closed || !this.aP) return;
    if (performance.now() - this.lastHeard > 6000) { this._lost(); return; }   // rival went silent
    this._send(this.aP, obj, this.partner);
  }
  report() {
    const d = this.diag || {};
    return `DIRECT LINK · ${d.role.toUpperCase()} · ${this.partner ? 'RIVAL LINKED' : 'NO RIVAL YET'}` + (d.relay ? ' · RELAY MODE' : d.turn ? ' · RELAY READY' : '')
      + (!this.partner && this.joinAttempt > 1 ? ` · ATTEMPT ${this.joinAttempt}` : '') + (d.err && !this.partner ? ` · ${d.err}` : '');
  }
  close() {
    super.close(); this.closed = true; clearTimeout(this.noHostT); clearTimeout(this.watchT);
    if (this.partner && this.aP) this._send(this.aP, { v: 1, on: 0, bye: 1 }, this.partner);
    const room = this.room; this.partner = null;
    setTimeout(() => { try { room && room.leave(); } catch (_) {} }, 200);
  }
}

/* ---------------------------------------------------------------------
   QuickMatchAdapter — "RANDOM": join a shared waiting pool and get paired
   with the next pilot who is also searching.
   Pool = a Trystero room everyone searching joins. Each pilot announces
   when they started waiting. To avoid two pilots grabbing each other at
   once, only the pilot with the LOWER id proposes, to the longest-waiting
   higher-id pilot, with a fresh room code. The other accepts if still free.
   The proposer becomes host of that code, the accepter joins it, both
   leave the pool, and the normal host/join flow takes over.
   --------------------------------------------------------------------- */
const QUICK_POOL = 'quick-match-pool-v1';

class QuickMatchAdapter extends TrysteroAdapter {
  connect() {
    this.closed = false; this.fromRandom = true; this.searching = true; this.matched = false;
    this.role = 'random'; this.code = ''; this.isHost = true; this.partner = null; this.attempt = 0;
    this.startedAt = performance.now(); this.status = ''; this.diag = { role: 'matchmaking', err: '' };
    this.seekers = new Map(); this.pending = null; this.cool = new Map();
    this._whenLib(() => this._enterPool());
  }
  poolSize() { return this.seekers.size + 1; }
  async _enterPool() {
    if (this.closed || this.matched || this.entering) return;
    this.entering = true;
    try { await this._enterPoolOnce(); }
    catch (e) {                                   // never leave a waiting pilot stranded: try again shortly
      this.diag.err = String(e && e.message || e).slice(0, 60);
      this._leavePool(); setTimeout(() => this._enterPool(), 3000);
    } finally { this.entering = false; }
  }
  async _enterPoolOnce() {
    const T = trysteroLib();
    this.poolAttempt = (this.poolAttempt || 0) + 1;
    const rtc = await rtcFor(1);                  // the pool never forces relay-only (only strict networks use it)
    if (this.closed || this.matched) return;
    this.myId = T.selfId || String(Math.random());
    if (!this.poolT0) this.poolT0 = Date.now();
    this.seekers = new Map(); this.pending = null; this.cool = new Map(); this.seenSince = new Map();
    this.enteredAt = Date.now();
    const lobby = T.joinRoom({ appId: TRYSTERO_APP, rtcConfig: rtc.rtcConfig }, QUICK_POOL);
    this.lobby = lobby;
    const aSeek = lobby.makeAction('seek'), aProp = lobby.makeAction('prop'), aAcc = lobby.makeAction('acc'), aRej = lobby.makeAction('rej');
    const send = (a, d, pid) => { try { a.send(d, pid ? { target: pid } : undefined).catch(() => {}); } catch (_) {} };
    this.aSeek = aSeek; this.aProp = aProp; this._psend = send;

    lobby.onPeerJoin = pid => send(aSeek, { v: 1, t: this.poolT0 }, pid);
    lobby.onPeerLeave = pid => {
      this.seekers.delete(pid);
      if (this.pending && this.pending.pid === pid) { clearTimeout(this.pending.timer); this.pending = null; this._propose(); }
    };
    aSeek.onMessage = (d, ctx) => {
      if (!d || d.v !== 1 || !ctx || this.matched) return;
      if (d.done) { this.seekers.delete(ctx.peerId); return; }
      this.seekers.set(ctx.peerId, +d.t || 0);
      if (!this.seenSince.has(ctx.peerId)) this.seenSince.set(ctx.peerId, Date.now());
      this._propose();
    };
    aProp.onMessage = (d, ctx) => {
      if (!ctx) return;
      const pid = ctx.peerId, code = sanitizeCode(d && d.code);
      // Both proposed to each other at once: the lower id's proposal wins
      if (this.pending && this.pending.pid === pid && this.myId > pid) { clearTimeout(this.pending.timer); this.pending = null; }
      if (this.matched || this.pending || code.length !== 4) { send(aRej, { v: 1 }, pid); return; }
      send(aAcc, { v: 1, code }, pid);
      this._matched('join', code);
    };
    aAcc.onMessage = (d, ctx) => {
      if (!ctx || !this.pending || ctx.peerId !== this.pending.pid || !d || d.code !== this.pending.code) return;
      clearTimeout(this.pending.timer);
      this._matched('host', this.pending.code);
    };
    aRej.onMessage = (d, ctx) => {
      if (!ctx || !this.pending || ctx.peerId !== this.pending.pid) return;
      clearTimeout(this.pending.timer); this.cool.set(ctx.peerId, Date.now()); this.pending = null;
      setTimeout(() => this._propose(), 600 + Math.random() * 900);
    };
    // Keep the pool fresh: re-announce every 5 s. A lobby that has sat for a while can go
    // deaf (relay sockets dropped, a half-open link), which is why backing out and pressing
    // LAUNCH again used to fix it. Do that automatically:
    //  · alone for 20 s              → leave and re-enter the pool from scratch
    //  · someone seen but no match in 15 s → same (the pairing got stuck)
    clearInterval(this.poolTick);
    this.poolTick = setInterval(() => {
      if (this.matched || this.closed) return;
      send(aSeek, { v: 1, t: this.poolT0 }); this._propose();
      const now = Date.now(), inPool = now - this.enteredAt;
      const stuck = [...this.seenSince.values()].some(t => now - t > 15000);
      if ((!this.seekers.size && inPool > 20000) || stuck) this._restartPool();
    }, 5000);
  }
  /** Exactly what "quit + LAUNCH" did by hand: leave the pool, forget stale state, re-enter. */
  _restartPool() {
    if (this.closed || this.matched || this.restarting) return;
    this.restarting = true; this.poolRestarts = (this.poolRestarts || 0) + 1;
    const l = this._leavePool();
    Promise.race([Promise.resolve(l), new Promise(r => setTimeout(r, 1500))])
      .then(() => new Promise(r => setTimeout(r, 700 + Math.random() * 800)))
      .then(() => { this.restarting = false; this._enterPool(); });
  }
  _propose() {
    if (this.matched || this.pending || this.closed || !this.aProp) return;
    const now = Date.now();
    // Normally only the lower id proposes (so two pilots don't grab each other at once). If the
    // lower one has stayed silent for 8 s it may not see us — then the higher one proposes too.
    const cands = [...this.seekers]
      .filter(([pid]) => (pid > this.myId || now - (this.seenSince.get(pid) || now) > 8000)
        && !((this.cool.get(pid) || 0) > now - 4000))
      .sort((a, b) => a[1] - b[1]);
    if (!cands.length) return;
    const pid = cands[0][0], code = generateRoomCode();
    this.pending = { pid, code, timer: setTimeout(() => {
      if (this.pending && this.pending.pid === pid) { this.cool.set(pid, Date.now()); this.pending = null; this._propose(); }
    }, 5000) };
    this._psend(this.aProp, { v: 1, code }, pid);
  }
  _matched(role, code) {
    if (this.matched) return;
    this.matched = true; this.searching = false; this.pending = null;
    this._psend(this.aSeek, { v: 1, done: 1 });
    setTimeout(() => this._leavePool(), 400);
    this.role = role; this.isHost = role === 'host'; this.code = code; this.startedAt = performance.now();
    this.diag.role = role === 'host' ? 'opening room' : 'joining';
    this.status = role === 'host' ? '' : 'CONNECTING…';
    Sound.play('go');
    this.emit('code', { code });
    setTimeout(() => this._join(), role === 'host' ? 0 : 1500);   // give the host a head start
  }
  _leavePool() {
    clearInterval(this.poolTick); clearTimeout(this.poolRefresh);
    if (this.pending) { clearTimeout(this.pending.timer); this.pending = null; }
    const l = this.lobby; this.lobby = null; this.aProp = null;
    try { return l && l.leave(); } catch (_) { return null; }
  }
  /** A random rival left: nothing to reopen. Close; the next Quick Match searches fresh. */
  _lost() {
    const id = this.partner; this.partner = null;
    this.lastShots.delete(id); this.emit('leave', { id, bye: true });
    if (this.closed) return;
    if (this.rejoin) {                                 // rematch in progress: both sides re-meet on the same code
      this.status = 'RECONNECTING…';
      this._fresh();
      return;
    }
    this.close();
  }
  report() {
    if (this.searching) { const n = this.poolSize(); return `QUICK MATCH · ${n} PILOT${n === 1 ? '' : 'S'} SEARCHING` + (this.poolRestarts ? ` · REFRESHED ×${this.poolRestarts}` : ''); }
    return super.report();
  }
  close() { this._leavePool(); super.close(); }
}

/* ---------------------------------------------------------------------
   ICE servers (how two phones find a path to each other).
   - STUN lets phones discover their public address; enough on many networks.
   - TURN relays the game traffic when a direct link is blocked (common on
     mobile data and some routers). Without it, some pairs never connect.
   Default TURN: the Open Relay Project's public "static auth" service —
   short-lived logins are made here from its published shared secret
   (TURN REST API: username = expiry time, password = HMAC-SHA1).
   Optional: paste your own free Metered credentials URL into TURN_API_URL
   (https://<app>.metered.live/api/v1/turn/credentials?apiKey=...) for a
   dedicated 20 GB/month relay.
   --------------------------------------------------------------------- */
const TURN_API_URL = '';
const STUN_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.relay.metered.ca:80' },   // two is enough; more slows setup
];
/** The game's own backup relay (Metered, dead-baron's free account). Tried first when a
 *  direct link is blocked. UDP 80, TCP 80, UDP 443 and TLS 443 cover strict networks. */
const METERED_TURN = {
  urls: [
    'turn:global.relay.metered.ca:80',
    'turn:global.relay.metered.ca:80?transport=tcp',
    'turn:global.relay.metered.ca:443',
    'turns:global.relay.metered.ca:443?transport=tcp',
  ],
  username: 'c9c0aac7648fe5536290ed7c',
  credential: 'ycotpF9yAbeN2DrD',
};
/** True for a TURN entry (turn: or turns:). */
const isTurn = s => [].concat(s.urls).some(u => /^turns?:/.test(String(u)));
let iceCache = null, iceCacheAt = 0;
async function openRelayTurn() {
  const username = `${Math.floor(Date.now() / 1000) + 12 * 3600}:neonasteroids`;
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode('openrelayprojectsecret'), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, enc.encode(username)));
  let bin = ''; for (const b of sig) bin += String.fromCharCode(b);
  return {
    urls: [
      'turn:staticauth.openrelay.metered.ca:80', 'turn:staticauth.openrelay.metered.ca:80?transport=tcp',
      'turn:staticauth.openrelay.metered.ca:443', 'turn:staticauth.openrelay.metered.ca:443?transport=tcp',
    ],
    username, credential: btoa(bin),
  };
}
/** STUN + TURN, cached for an hour. Never takes more than ~3 s; falls back to STUN only. */
async function iceServers() {
  if (iceCache && Date.now() - iceCacheAt < 3600e3) return iceCache;
  const turn = (async () => {
    if (TURN_API_URL) {
      try { const r = await fetch(TURN_API_URL); const list = await r.json(); if (Array.isArray(list) && list.length) return list; } catch (_) {}
    }
    return [METERED_TURN];
  })();
  const timeout = new Promise(res => setTimeout(() => res([]), 3000));
  const extra = await Promise.race([turn, timeout]);
  iceCache = [...STUN_SERVERS, ...extra]; iceCacheAt = Date.now();
  return iceCache;
}
if (!inClaude()) iceServers();   // warm the cache at load

/** Symmetric NAT = the SAME local socket shows up with different public ports for different
 *  STUN servers. Safari/iOS hides which local socket an answer came from (raddr 0.0.0.0), so
 *  there we can only decide when the device has a single socket; otherwise "can't tell"
 *  (null) — never a false "strict", which would force slow relay-only links. */
function natVerdict(g) {
  if (!g || !g.srflx.length) return null;
  const known = g.srflx.filter(c => c.raddr && !/^0\.0\.0\.0:|^:|^[^:]*:0?$/.test(c.raddr));
  if (known.length === g.srflx.length) {
    const bySock = new Map();
    for (const c of known) { if (!bySock.has(c.raddr)) bySock.set(c.raddr, new Set()); bySock.get(c.raddr).add(c.port); }
    return [...bySock.values()].some(ports => ports.size > 1);
  }
  const ports = new Set(g.srflx.map(c => c.ip + ':' + c.port));
  if (ports.size <= 1) return false;
  return g.hosts === 1 ? true : null;
}

/* Strict networks (symmetric NAT: many phones on office/school/some home Wi-Fi) can never
   link directly — only through the relay. Trying direct routes first wastes the whole
   attempt, so we check the network at load and go relay-only straight away when it's strict. */
let strictNet = null;            // null = unknown, true = strict, false = normal
const strictReady = (async () => {
  if (inClaude() || typeof RTCPeerConnection === 'undefined') return;
  await new Promise(r => setTimeout(r, 0));   // let iceGather (defined further down) exist
  const g = await iceGather(STUN_SERVERS, 'all', 3500);
  strictNet = natVerdict(g);
})();
/** WebRTC settings for one connection attempt. Relay-only on strict networks, and on every
 *  second retry anywhere (covers networks the check can't spot). */
async function rtcFor(attempt) {
  await Promise.race([strictReady, new Promise(r => setTimeout(r, 4000))]);
  const ice = await iceServers(), turn = ice.filter(isTurn);
  const relay = turn.length > 0 && (strictNet === true || attempt % 2 === 0);
  return { relay, turn: turn.length > 0,
    rtcConfig: relay ? { iceServers: turn, iceTransportPolicy: 'relay' } : { iceServers: ice } };
}


function generateRoomCode() {
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)];
  return s;
}

/** Online rival: snapshot interpolation of their presence. */
class RemotePlayer {
  constructor(id, color) {
    this.id = id; this.color = color; this.snaps = [];
    this.x = W / 2; this.y = H / 2; this.vx = 0; this.vy = 0; this.a = 0; this.thr = 0;
    this.hp = CFG.HULL; this.alive = true; this.visible = false; this.label = 'RIVAL'; this.owner = 'r:' + id;
  }
  push(m) {
    this.snaps.push({ t: performance.now(), x: m.x, y: m.y, vx: m.vx, vy: m.vy, a: m.a, thr: m.thr });
    if (this.snaps.length > 32) this.snaps.shift();
    this.color = m.col;
    if (this.visible && m.hp < this.hp && m.hp > 0) { Sound.play('thud'); Particles.burst(this.x, this.y, this.color, 18, 3, 25); world.shake = Math.max(world.shake, 5); }
    if (this.visible && this.alive && !m.alive) explodeShip(this.x, this.y, this.color);
    this.hp = m.hp; this.alive = m.alive; this.visible = true;
  }
  sample(t) {
    const n = this.snaps.length; if (!n) return;
    const rt = t - CFG.INTERP_DELAY_MS;
    for (let i = n - 1; i > 0; i--) {
      const a = this.snaps[i - 1], b = this.snaps[i];
      if (a.t <= rt && rt <= b.t) {
        const k = (rt - a.t) / (b.t - a.t || 1);
        this.x = a.x + wrapDelta(b.x - a.x, W) * k; this.y = a.y + wrapDelta(b.y - a.y, H) * k;
        this.a = a.a + angDiff(b.a, a.a) * k; this.vx = b.vx; this.vy = b.vy; this.thr = b.thr;
        wrap(this); return;
      }
    }
    const last = this.snaps[n - 1], ticks = clamp(rt - last.t, 0, 250) / CFG.TICK_MS;
    this.x = last.x + last.vx * SX * ticks; this.y = last.y + last.vy * SY * ticks;
    this.a = last.a; this.vx = last.vx; this.vy = last.vy; this.thr = last.thr; wrap(this);
  }
  update() {
    if (!this.visible || !this.alive) return;
    this.sample(performance.now());
    emitExhaust(this.x, this.y, this.vx * SX, this.vy * SY, toScreenAngle(this.a), this.thr, this.color);
    damageFx(this);
  }
  draw(tick) {
    if (!this.visible || !this.alive || this.goneAt) return;
    this.sample(performance.now());
    drawWrapped(this.x, this.y, 20, (x, y) => drawShip(x, y, toScreenAngle(this.a), this.color, this.thr, tick, this.hp));
    if (match.ph === 'play' && rivalShielded()) drawShield(this.x, this.y, this.color, CFG.SPAWN_SHIELD - (tickCount - playStartTick));
  }
}

/** Local AI rival: hunts you, farms rocks, dodges, and misses a little. */
class BotShip {
  constructor(color) { this.isBot = true; this.color = color; this.label = 'BOT'; this.owner = 'bot'; this.reset(); }
  reset() {
    this.x = W / 2; this.y = H * 0.2; this.vx = this.vy = 0; this.a = Math.PI / 2; this.thr = 0;
    this.hp = CFG.HULL; this.alive = true; this.invuln = 0; this.shield = 0; this.cd = 600; this.retarget = 0; this.aimErr = 0; this.hunt = true;
  }
  damage() {
    if (!this.alive || this.invuln > 0 || match.ph !== 'play') return;
    this.hp--; this.invuln = CFG.HIT_INVULN; this.shield = 0;
    Sound.play('thud');
    Particles.burst(this.x, this.y, this.color, 18, 3, 25); world.shake = Math.max(world.shake, 5);
    if (this.hp <= 0) { this.alive = false; explodeShip(this.x, this.y, this.color); }
  }
  update() {
    if (!this.alive || match.ph === 'intro') return;
    if (this.invuln > 0) this.invuln--;
    if (this.shield > 0) this.shield--;
    const live = match.ph === 'play';
    if (--this.retarget <= 0) { this.retarget = rand(80, 150); this.hunt = ship.alive && Math.random() < 0.55; }
    let tx, ty;
    if (this.hunt && ship.alive) { tx = ship.x + ship.vx * SX * 12; ty = ship.y + ship.vy * SY * 12; }
    else {
      let bd = Infinity;
      for (const t of [...world.asteroids, ...world.ufos]) { const d = wrapDist2(t, this); if (d < bd) { bd = d; tx = t.x; ty = t.y; } }
    }
    let avoid = null;
    for (const a of world.asteroids) if (Math.sqrt(wrapDist2(a, this)) - a.r < 42) { avoid = a; break; }
    let want;
    if (avoid) { want = fieldAngleTo(wrapDelta(this.x - avoid.x, W), wrapDelta(this.y - avoid.y, H)); this.thr = 0.9; }
    else if (tx !== undefined) {
      const ddx = wrapDelta(tx - this.x, W), ddy = wrapDelta(ty - this.y, H), dist = Math.hypot(ddx, ddy);
      want = fieldAngleTo(ddx, ddy); this.thr = dist > 240 ? 0.6 : dist < 110 ? 0 : 0.12;
    } else this.thr = 0;
    if (!live) this.thr = 0;
    if (want !== undefined) this.a += angDiff(want + (avoid ? 0 : this.aimErr), this.a) * 0.1;
    this.vx += Math.cos(this.a) * CFG.THRUST * this.thr; this.vy += Math.sin(this.a) * CFG.THRUST * this.thr;
    this.vx *= CFG.DRAG; this.vy *= CFG.DRAG;
    const sp = Math.hypot(this.vx, this.vy);
    if (sp > CFG.MAX_SPEED) { this.vx *= CFG.MAX_SPEED / sp; this.vy *= CFG.MAX_SPEED / sp; }
    this.x += this.vx * SX; this.y += this.vy * SY; wrap(this);
    this.cd -= CFG.TICK_MS;
    if (live && !avoid && want !== undefined && Math.abs(angDiff(want, this.a)) < 0.22 && this.cd <= 0) {
      shootFrom(this, this.color, 'bot'); Sound.play('rival');
      this.cd = rand(320, 560); this.aimErr = rand(-0.13, 0.13);
    }
    emitExhaust(this.x, this.y, this.vx * SX, this.vy * SY, toScreenAngle(this.a), this.thr, this.color);
    damageFx(this);
  }
  draw(tick) {
    if (!this.alive || (this.invuln > 0 && !this.shield && (tick >> 3) % 2 === 0)) return;
    drawWrapped(this.x, this.y, 20, (x, y) => drawShip(x, y, toScreenAngle(this.a), this.color, this.thr, tick, this.hp));
    if (this.shield > 0) drawShield(this.x, this.y, this.color, this.shield);
  }
}

function emitExhaust(x, y, vx, vy, angle, thrust, color) {
  if (thrust <= 0.05) return;
  const c = Math.cos(angle), s = Math.sin(angle), n = Math.ceil(thrust * 4 * Particles.quality);
  for (let i = 0; i < n; i++) {
    const spread = rand(-0.35, 0.35), sp = 1.5 + Math.random() * 3.5 * thrust;
    Particles.emit(x - c * 8 + rand(-2, 2), y - s * 8 + rand(-2, 2),
      vx * 0.6 + Math.cos(angle + Math.PI + spread) * sp, vy * 0.6 + Math.sin(angle + Math.PI + spread) * sp,
      Math.round(rand(14, 26) * (0.5 + thrust * 0.5)), Math.random() < 0.3 ? '#ffffff' : color, Math.random() < 0.5 ? 2 : 3, 0.93);
  }
}

   match.ph: 'wait' (online, no rival yet) → 'intro' (3-2-1) → 'play'

let state = 'menu';                // 'menu' | 'play' | 'over'

function spawnPoint() {

function spawnTier(tier) {
  const place = size => {
    let x, y, tries = 0;
    const R = CFG.SPAWN_CLEAR * CFG.SPAWN_CLEAR;
    do { x = Math.random() * W; y = Math.random() * H; tries++; }
    while (tries < 60 && (wrapDist2({ x, y }, { x: W / 2, y: H * 0.56 }) < R || wrapDist2({ x, y }, { x: W / 2, y: H * 0.2 }) < R));
    world.asteroids.push(makeAsteroid(x, y, size, 1 + (match.rn - 1) * 0.12));

let nextUfoId = 1;
function spawnUfo(quiet = false) {

                    age: 0, fireT: 70, shots: CFG.UFO_SHOTS, sh: 0, aim: 0 });

function ufoFire(u, ang) {
  u.sh++; u.aim = ang; Sound.play('ufoShot');
  const c = Math.cos(ang), s = Math.sin(ang), sa = toScreenAngle(ang);
  spawnBullet(u.x + Math.cos(sa) * 16, u.y + Math.sin(sa) * 16, c * CFG.UFO_BULLET_SPEED, s * CFG.UFO_BULLET_SPEED, ufoHue(ufoOff(u)), 'ufo', CFG.UFO_BULLET_LIFE);

/** Host: UFOs cruise across, bob, and take a few aimed-ish shots at pilots. */
function updateUfosAuthority() {
  for (let i = world.ufos.length - 1; i >= 0; i--) {
    const u = world.ufos[i];
    u.age++; u.x += u.vx * SX;
    u.y = u.base + Math.sin(u.age * 0.04) * 30 * SY; u.vy = Math.cos(u.age * 0.04) * 1.2;
    if (u.shots > 0 && --u.fireT <= 0 && match.ph === 'play') {
      const targets = [ship, opp].filter(o => o && o.alive);

function startGame(adopt = null) {
  FS.auto();
  // Rematch on a live direct link: keep it (no trip back through matchmaking)
  const code = currentCode();
  const reuse = !adopt && mode === 'online' && net.keepAlive && !net.closed && (
    (onlineRole === 'random' ? (net.fromRandom && net.linked && net.linked()) : (net.code === code && net.role === onlineRole)));
  if (!reuse) net.close();
  track('game_start', { mode: modeLabel(), rematch: reuse ? 1 : 0, from_bot: adopt ? 1 : 0 });
  world.asteroids.length = world.bullets.length = world.rings.length = world.ufos.length = 0;
  Particles.clear(); remotes.clear(); opp = null;
  Object.assign(match, { rn: 0, ph: 'wait', t: 0, wins: [0, 0], sc: [0, 0], res: '', why: '', elapsed: 0, ufoIdx: 0, refill: 0, forfeit: false, surrendered: false, ufoT: undefined });
  tickCount = 0; leaveTimer = 0; overTicks = 0; practiceTotal = 0; lastBeat = -1; lastPh = '';
  joy.active = false; fire.held = false; ship.shots = 0;
  roomCode = '';
  if (mode === 'online') {
    roomCode = onlineRole === 'random' ? (reuse ? net.code : '') : (code || generateRoomCode());
    if (onlineRole !== 'random') showCode(roomCode);
    if (reuse) {
      wasHost = net.isHost; awaitingFirstSnap = !net.isHost;
      resetShipForRound();
      spawnTier(TIERS[1]);
    } else if (adopt) {                              // a Quick Play match found while fighting the bot
      net = adopt; roomCode = adopt.code || '';
      awaitingFirstSnap = true; wasHost = true;
      resetShipForRound();
      spawnTier(TIERS[1]);
    } else {
      net = inClaude() ? new RoomAdapter() : onlineRole === 'random' ? new QuickMatchAdapter() : webAdapter(); wireNetHandlers(net);
      awaitingFirstSnap = true; wasHost = true;
      resetShipForRound();
      spawnTier(TIERS[1]);                          // warm-up field while waiting
      net.connect(roomCode, onlineRole);
    }
  } else {
    net = new NullAdapter();
    if (mode === 'bot') {
      const others = SHIP_COLORS.filter(c => c[1] !== ship.color);
      opp = new BotShip(others[Math.floor(Math.random() * others.length)][1]);
    }
    startRound(1);
  }
  state = 'play';
}

function startRound(n) {
  Object.assign(match, { rn: n, ph: 'intro', t: CFG.INTRO_MS, sc: [0, 0], res: '', why: '', elapsed: 0, ufoIdx: 0, refill: 0 });
  world.asteroids.length = world.ufos.length = world.bullets.length = 0;
  resetShipForRound();
  if (opp && opp.isBot) opp.reset();
  spawnTier(tierFor(n));
}

function endRound(res, why) {
  match.ph = 'result'; match.t = CFG.RESULT_MS; match.res = res; match.why = why;
  if (res === 'me') match.wins[0]++;
  if (res === 'opp') match.wins[1]++;
  if (mode === 'practice') practiceTotal += match.sc[0];
}

/* Warm-up while waiting for a rival: an endless field. When the rocks are all
   gone a fresh batch drifts in (never on top of you), and every 15–30 s a UFO
   cruises through as target practice. Nothing counts and nothing can hurt you. */
const WARMUP = { large: 4, medium: 1 };
function warmupTick() {
  if (world.asteroids.length === 0) {
    if (++match.refill > 60) {
      match.refill = 0;
      const R = 190 * 190;
      const place = size => {
        let x, y, tries = 0;
        do { x = Math.random() * W; y = Math.random() * H; tries++; } while (tries < 60 && wrapDist2({ x, y }, ship) < R);
        world.asteroids.push(makeAsteroid(x, y, size, 0.9));
      };
      for (let i = 0; i < WARMUP.large; i++) place(3);
      for (let i = 0; i < WARMUP.medium; i++) place(2);
    }
  } else match.refill = 0;
  if (match.ufoT === undefined) match.ufoT = rand(8000, 14000);
  match.ufoT -= CFG.TICK_MS;
  if (match.ufoT <= 0) { if (!world.ufos.length) spawnUfo(true); match.ufoT = rand(15000, 30000); }
}

/** Host / local: advance the round clock and decide rounds. */
function matchTick() {
  const dt = CFG.TICK_MS;
  if (match.ph === 'wait') { if (opp) startRound(1); else if (mode === 'online') warmupTick(); return; }
  if (match.ph === 'intro') { match.t -= dt; if (match.t <= 0) { match.ph = 'play'; match.t = CFG.ROUND_MS; flashTimer = 45; } return; }
  if (match.ph === 'play') {
    match.t -= dt; match.elapsed += dt;
    const tier = tierFor(match.rn);
    while (match.ufoIdx < tier.ufos.length && match.elapsed >= tier.ufos[match.ufoIdx]) { spawnUfo(); match.ufoIdx++; }
    if (world.asteroids.length === 0) { if (++match.refill > 60) { match.refill = 0; spawnTier(tier); } }   // keep the field stocked
    const meDead = !ship.alive, oppDead = !!opp && !opp.alive;
    if (mode === 'practice') {
      if (meDead) endRound('', 'k'); else if (match.t <= 0) endRound('', 't');
      return;
    }
    if (meDead || oppDead || match.t <= 0) {
      if (meDead !== oppDead) endRound(oppDead ? 'me' : 'opp', 'k');
      else if (match.sc[0] !== match.sc[1]) endRound(match.sc[0] > match.sc[1] ? 'me' : 'opp', 'p');
      else endRound('draw', 'd');
    }
    return;
  }
  if (match.ph === 'result') {
    match.t -= dt;
    if (match.t <= 0) {
      const done = mode === 'practice' ? match.rn >= 3 : (match.wins[0] >= CFG.WINS_NEEDED || match.wins[1] >= CFG.WINS_NEEDED);
      if (done) { match.ph = 'final'; showFinal(); } else startRound(match.rn + 1);
    }
  }
}

function credit(owner, pts) {
  if (match.ph !== 'play') return;
  if (owner === 'local') match.sc[0] += pts;
  else if (owner === 'bot' || owner.startsWith('r:')) match.sc[1] += pts;
}

/** Host: split a rock and credit the shooter. */
function splitAsteroid(idx, owner) {
  const a = world.asteroids[idx];
  world.asteroids.splice(idx, 1);
  explodeAsteroid(a);
  credit(owner, AST_SCORE[a.size]);
  if (a.size > 1) for (let k = 0; k < 2; k++) {
    const c = makeAsteroid(a.x, a.y, a.size - 1, 1 + (match.rn - 1) * 0.12);
    c.vx += a.vx * 0.5; c.vy += a.vy * 0.5; world.asteroids.push(c);
  }
}

/** My hull takes a hit. `force` = a rival's confirmed hit (online). */
function takeHit(force = false) {
  if (!ship.alive) return false;
  if (!force && (ship.invuln > 0 || match.ph !== 'play')) return false;
  ship.hp--; ship.invuln = CFG.HIT_INVULN; ship.shield = 0;
  Sound.play('hit');
  Particles.burst(ship.x, ship.y, ship.color, 18, 3, 25);
  world.shake = Math.max(world.shake, 8); buzz(60);
  if (ship.hp <= 0) { ship.alive = false; explodeShip(ship.x, ship.y, ship.color); buzz(220); }
  return true;
}

function bounceOff(o, a) {
  let ddx = wrapDelta(o.x - a.x, W), ddy = wrapDelta(o.y - a.y, H);
  const d = Math.hypot(ddx, ddy) || 1; ddx /= d; ddy /= d;
  o.vx = ddx * 3 + a.vx; o.vy = ddy * 3 + a.vy;
  o.x = a.x + ddx * (a.r + CFG.SHIP_R + 1); o.y = a.y + ddy * (a.r + CFG.SHIP_R + 1); wrap(o);
}

function wireNetHandlers(n) {
  n.on('state', m => {
    if (state === 'over') { if (RM.mine && m.dr === 0) startRematch('rival-started'); return; }   // rival loaded the rematch first
    let r = remotes.get(m.id);
    if (!r) { r = new RemotePlayer(m.id, m.col); remotes.set(m.id, r); }
    r.goneAt = 0;                                     // heard from them: not gone
    r.push(m);
    if (!opp && state === 'play') opp = r;            // first other pilot is the rival
    // Apply the rival's confirmed hits on me for this round
    if (opp === r && match.rn > 0 && m.dr === match.rn)
      while (ship.applied < m.dmg && ship.alive) { ship.applied++; takeHit(true); }
  });
  n.on('fire', m => { const r = remotes.get(m.id); if (r && r.alive) { spawnBullet(m.x, m.y, m.vx, m.vy, r.color, 'r:' + m.id); Sound.play('rival'); } });
  // A rival only counts as gone after 3 s of silence, so a reconnect or restart
  // (whose "left" can arrive just after its "back") never hands out a false forfeit.
  n.on('leave', m => {
    const r = remotes.get(m.id);
    if (!r) return;
    if (r === opp) { if (m.bye) r.goneAt = performance.now() - 3000; else if (!r.goneAt) r.goneAt = performance.now(); }
    else remotes.delete(m.id);
  });
  n.on('snapshot', applySnapshot);
  n.on('idle', m => { if (state === 'over') rivalRematch(!!m.rm); });
  n.on('code', m => {                                 // code picked (taken code / quick match)
    if (n === bgNet) { adoptQuickMatch(); return; }   // found a pilot while fighting the bot
    roomCode = m.code; if (onlineRole !== 'random') showCode(m.code);
  });
  n.on('full', () => {
    net.close(); state = 'menu'; opp = null;
    menuEl.classList.remove('hidden'); seedAmbient();
    setNote(`Room ${roomCode} already has two pilots. Ask your friend for their code, or HOST your own.`, true);
  });
}

/** Guests: mirror the host's match state, rocks and UFOs. */
function applySnapshot(s) {
  if (state !== 'play' || isAuthority()) return;
  const m = s.m;
  if (m && Number.isFinite(+m.rn)) {
    const rn = +m.rn;
    if (rn !== match.rn && rn > 0) {                  // new round: reset my hull and spawn
      match.rn = rn; resetShipForRound(); world.bullets.length = 0; awaitingFirstSnap = true;
    }
    const prevPh = match.ph;
    const w = Array.isArray(m.w) ? m.w : [0, 0], sc = Array.isArray(m.sc) ? m.sc : [0, 0];
    match.ph = ['wait', 'intro', 'play', 'result', 'final'].includes(m.ph) ? m.ph : match.ph;
    match.t = +m.t || 0;
    match.wins = [+w[1] || 0, +w[0] || 0];            // host's view → mine
    match.sc = [+sc[1] || 0, +sc[0] || 0];
    match.res = m.res === 'h' ? 'opp' : m.res === 'g' ? 'me' : m.res === 'draw' ? 'draw' : '';
    match.why = typeof m.why === 'string' ? m.why.slice(0, 2) : '';
    if (prevPh === 'intro' && match.ph === 'play') flashTimer = 45;
    if (match.ph === 'final' && prevPh !== 'final') { showFinal(); return; }
  }
  // Rocks
  const byId = new Map(world.asteroids.map(a => [a.id, a])), seen = new Set();
  for (const e of s.ast) {
    if (!Array.isArray(e) || e.length < 6) continue;
    const [id, x, y, vx, vy, size] = e.map(Number);
    if (!(size >= 1 && size <= 3)) continue;
    seen.add(id);
    let a = byId.get(id);
    if (!a) { a = makeAsteroid(dx_(x), dy_(y), size, 1, id); world.asteroids.push(a); }
    a.tx = dx_(x); a.ty = dy_(y); a.vx = dvx(vx); a.vy = dvy(vy);
  }
  for (let i = world.asteroids.length - 1; i >= 0; i--) {
    const a = world.asteroids[i];
    if (seen.has(a.id)) continue;
    world.asteroids.splice(i, 1);
    if (!awaitingFirstSnap) explodeAsteroid(a);
  }
  // UFOs (+ replay their shots, which can hit me)
  const ufoById = new Map(world.ufos.map(u => [u.id, u])), seenU = new Set();
  for (const e of s.ufo) {
    if (!Array.isArray(e) || e.length < 7) continue;
    const [id, x, y, vx, vy, sh, aim] = e.map(Number);
    seenU.add(id);
    let u = ufoById.get(id);
    if (!u) { u = { id, x: dx_(x), y: dy_(y), vx: 0, vy: 0, sh }; world.ufos.push(u); if (!awaitingFirstSnap) Sound.play('ufo'); }
    u.tx = dx_(x); u.ty = dy_(y); u.vx = dvx(vx); u.vy = dvy(vy);
    if (sh > u.sh) { for (let k = 0; k < Math.min(2, sh - u.sh); k++) ufoFire(u, aim / 1000); u.sh = sh; }
  }
  for (let i = world.ufos.length - 1; i >= 0; i--) {
    const u = world.ufos[i];
    if (seenU.has(u.id)) continue;
    world.ufos.splice(i, 1);
    if (!awaitingFirstSnap && u.x > 0 && u.x < W) explodeUfo(u);   // off-screen = flew away
  }
  awaitingFirstSnap = false;
}

function buildPresence() {
  const p = {
    v: 1, on: 1, col: ship.color,
    x: nx(ship.x), y: ny(ship.y), vx: nvx(ship.vx), vy: nvy(ship.vy),
    a: Math.round(ship.a * 1000), t: Math.round(ship.thrust * 100),
    al: ship.alive ? 1 : 0, hp: ship.hp, sh: ship.shots, dmg: ship.dealt, dr: match.rn, hs: net.claiming ? 1 : 0,
  };
  if (isAuthority()) {
    p.ast = world.asteroids.slice(0, CFG.MAX_SYNC_ASTEROIDS).map(a => [a.id, nx(a.x), ny(a.y), nvx(a.vx), nvy(a.vy), a.size]);
    p.ufo = world.ufos.map(u => [u.id, nx(u.x), ny(u.y), nvx(u.vx), nvy(u.vy), u.sh, Math.round(u.aim * 1000)]);
    p.m = { rn: match.rn, ph: match.ph, t: Math.round(match.t), w: match.wins, sc: match.sc,
            res: match.res === 'me' ? 'h' : match.res === 'opp' ? 'g' : match.res, why: match.why };
  }
  return p;
}

function showFinal() {
  state = 'over'; joy.active = false; fire.held = false;
  if (mode === 'online') leaveTimer = 90;            // keep broadcasting briefly so the rival sees the result
  RM.mine = false; RM.theirs = false; RM.expired = false; RM.at = 0; RM.cancelled = false;
  rematchWait = null; if (net) net.rejoin = false;
  const title = document.getElementById('overTitle'), big = document.getElementById('finalScore'), info = document.getElementById('overInfo');
  const oppName = mode === 'bot' ? 'THE BOT' : 'YOUR RIVAL';
  closeMenu(true);
  track('match_end', { mode: modeLabel(), rounds: match.rn,
    result: match.surrendered ? 'surrender' : match.forfeit ? 'rival_left' : mode === 'practice' ? 'score'
      : match.wins[0] > match.wins[1] ? 'win' : 'loss',
    score: mode === 'practice' ? practiceTotal : match.wins[0] });
  if (match.surrendered) {
    title.textContent = 'SURRENDERED';
    big.textContent = `${match.wins[0]} – ${match.wins[1]}`;
    info.textContent = `You waved the white flag. ${oppName[0] + oppName.slice(1).toLowerCase()} takes the match.`;
    Sound.play('lose');
    overEl.classList.remove('hidden');
    return;
  }
  const won = match.forfeit || match.wins[0] > match.wins[1];
  Sound.play(mode === 'practice' || won ? 'win' : 'lose');
  if (mode === 'practice') {
    title.textContent = 'RUN COMPLETE';
    big.textContent = practiceTotal.toLocaleString();
    info.textContent = 'Total points across 3 rounds.';
  } else if (match.forfeit) {
    title.textContent = 'VICTORY';
    big.textContent = `${match.wins[0]} – ${match.wins[1]}`;
    info.textContent = `${oppName[0] + oppName.slice(1).toLowerCase()} left the match. The win is yours.`;
  } else {
    title.textContent = won ? 'VICTORY' : 'DEFEAT';
    big.textContent = `${match.wins[0]} – ${match.wins[1]}`;
    info.textContent = won ? `You beat ${oppName.toLowerCase()} in the best of 3.` : `${oppName[0] + oppName.slice(1).toLowerCase()} takes the best of 3.`;
  }
  overEl.classList.remove('hidden');
}

function seedAmbient() {
  world.asteroids.length = world.ufos.length = world.bullets.length = 0;
  for (let i = 0; i < 6; i++) world.asteroids.push(makeAsteroid(Math.random() * W, Math.random() * H, 1 + (i % 3), 0.6));
}

/* =====================================================================
   11. UPDATE + RENDER (fixed 60 Hz simulation)
   ===================================================================== */
/* Round-phase feedback: countdown beeps, GO, round results, and the spawn shield. */
let lastBeat = -1, lastPh = '', playStartTick = -1e9;
function phaseFx() {
  if (match.ph === 'intro') {
    const n = Math.ceil(match.t / 1000);
    if (n !== lastBeat && n > 0 && n <= 3) { lastBeat = n; Sound.play('tick'); }
  }
  if (match.ph === lastPh) return;
  if (match.ph === 'play' && lastPh === 'intro') { Sound.play('go'); giveSpawnShield(); }
  if (match.ph === 'result') track('round_end', { mode: modeLabel(), round: match.rn,
    result: mode === 'practice' ? 'score' : match.res === 'me' ? 'win' : match.res === 'opp' ? 'loss' : 'draw',
    how: match.why === 'k' ? 'kill' : 'time', score: match.sc[0] });
  if (match.ph === 'result') Sound.play(mode === 'practice' ? 'draw' : match.res === 'me' ? 'roundWin' : match.res === 'opp' ? 'roundLose' : 'draw');
  if (match.ph === 'intro') lastBeat = -1;
  lastPh = match.ph;
}
/** Everyone gets a short shield when the round goes live, and rocks near a ship are steered away. */
function giveSpawnShield() {
  playStartTick = tickCount;
  ship.shield = CFG.SPAWN_SHIELD; ship.invuln = Math.max(ship.invuln, CFG.SPAWN_SHIELD);
  if (opp && opp.isBot) { opp.shield = CFG.SPAWN_SHIELD; opp.invuln = Math.max(opp.invuln, CFG.SPAWN_SHIELD); }
  if (!isAuthority()) return;
  for (const o of [ship, opp]) {
    if (!o || !o.alive) continue;
    for (const a of world.asteroids) {
      const ddx = wrapDelta(a.x - o.x, W), ddy = wrapDelta(a.y - o.y, H), d = Math.hypot(ddx, ddy) || 1;
      if (d < a.r + 110) { const sp = Math.max(1, Math.hypot(a.vx, a.vy)); a.vx = ddx / d * sp; a.vy = ddy / d * sp; }
    }
  }
}
/** Is the rival still inside their spawn shield? (Online: shooter-side check.) */
const rivalShielded = () => tickCount - playStartTick < CFG.SPAWN_SHIELD;
function drawShield(x, y, color, ticksLeft) {
  const k = clamp(ticksLeft / CFG.SPAWN_SHIELD, 0, 1);
  ctx.globalAlpha = 0.25 + 0.35 * k * (0.7 + 0.3 * Math.sin(tickCount * 0.3));
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.shadowColor = color; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.arc(x, y, 22, 0, TAU); ctx.stroke();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

/** Resolve one bullet against the world. Returns true if it's used up. */
function bulletStep(b, auth) {
  const playerShot = b.owner !== 'ufo';
  for (let j = world.asteroids.length - 1; j >= 0; j--) {
    const a = world.asteroids[j];
    if (wrapDist2(a, b) < a.r * a.r) { spark(b.x, b.y); if (auth && playerShot) splitAsteroid(j, b.owner); return true; }
  }
  if (playerShot) for (let j = world.ufos.length - 1; j >= 0; j--) {
    const u = world.ufos[j];
    if (wrapDist2(u, b) < 18 * 18) {
      spark(b.x, b.y);
      if (auth) { world.ufos.splice(j, 1); explodeUfo(u); credit(b.owner, CFG.UFO_SCORE); }
      return true;
    }
  }
  const R2 = CFG.SHIP_HIT_R * CFG.SHIP_HIT_R;
  // My ship: bot and UFO shots are decided here; an online rival's shots are decided by the rival
  if (ship.alive && b.owner !== 'local' && wrapDist2(ship, b) < R2) {
    if (b.owner === 'bot' || b.owner === 'ufo') takeHit();
    spark(b.x, b.y); return true;
  }
  if (opp && opp.alive && b.owner !== opp.owner && wrapDist2(opp, b) < R2) {
    if (opp.isBot) { if (b.owner === 'local' || b.owner === 'ufo') opp.damage(); }
    else if (b.owner === 'local' && match.ph === 'play' && !rivalShielded() && tickCount - ship.lastDealt >= CFG.HIT_INVULN) {
      ship.dealt++; ship.lastDealt = tickCount;       // my hit on the rival; they apply it
    }
    spark(b.x, b.y); return true;
  }
  return false;
}

function update() {
  tickCount++; now += CFG.TICK_MS;
  const playing = state === 'play';
  const auth = isAuthority();

  if (playing && mode === 'online' && net.isHost !== wasHost) {           // host hand-over
    wasHost = net.isHost;
    if (wasHost) { for (const a of world.asteroids) a.tx = a.ty = undefined; for (const u of world.ufos) u.tx = undefined; }
    else awaitingFirstSnap = true;
  }

  if (playing && auth) matchTick();
  else if (playing && match.ph !== 'wait' && match.ph !== 'final') match.t = Math.max(0, match.t - CFG.TICK_MS);
  if (playing) phaseFx();

  // ---- My ship ----
  if (playing && ship.alive) {
    const live = canFly();
    ship.thrust = 0;
    if (live && padSteer()) { /* controller steered this tick */ }
    else if (live && !DESKTOP && joy.active && joy.mag > CFG.AIM_DEADZONE) {
      ship.a += angDiff(toFieldAngle(joy.angle), ship.a) * CFG.TURN_LERP;  // facing ≠ travel direction
      ship.thrust = clamp((joy.mag - CFG.THRUST_START) / (1 - CFG.THRUST_START), 0, 1);
    } else if (live && DESKTOP) desktopSteer();
    if (match.ph !== 'intro') {
      ship.vx += Math.cos(ship.a) * CFG.THRUST * ship.thrust; ship.vy += Math.sin(ship.a) * CFG.THRUST * ship.thrust;
      ship.vx *= CFG.DRAG; ship.vy *= CFG.DRAG;                             // permanent drag
      const sp = Math.hypot(ship.vx, ship.vy);
      if (sp > CFG.MAX_SPEED) { ship.vx *= CFG.MAX_SPEED / sp; ship.vy *= CFG.MAX_SPEED / sp; }
      ship.x += ship.vx * SX; ship.y += ship.vy * SY; wrap(ship);
    }
    if (ship.invuln > 0) ship.invuln--;
    if (ship.shield > 0) ship.shield--;
    if (ship.thrust > 0.3) { learn.thrustTicks++; noteLearning(); }
    if (ship.thrust > 0.1) Sound.play('thrust', ship.thrust);
    emitExhaust(ship.x, ship.y, ship.vx * SX, ship.vy * SY, toScreenAngle(ship.a), ship.thrust, ship.color);
    damageFx(ship);
    if (fire.held) { fire.repeatAcc += CFG.TICK_MS; if (fire.repeatAcc >= CFG.FIRE_REPEAT_MS) tryFire(); }
  }
  fire.pulse *= 0.85;

  // ---- Rival ----
  if (opp && opp.goneAt && performance.now() - opp.goneAt > 3000) {           // rival really left
    remotes.delete(opp.id); opp = null;
    if (playing && match.rn > 0 && match.ph !== 'final') { match.forfeit = true; match.ph = 'final'; showFinal(); }
  }
  if (playing && opp) opp.update();

  // ---- Network ----
  if (mode === 'online' && (playing || leaveTimer > 0)) {
    netAcc += CFG.TICK_MS;
    if (netAcc >= 1000 / CFG.NET_SEND_HZ) { netAcc = 0; net.publish(buildPresence()); }
    if (leaveTimer > 0 && --leaveTimer === 0 && !net.keepAlive) net.close();
    if (rematchWait) rematchTick();
  } else if (mode === 'online' && state === 'over' && net.keepAlive && !net.closed) {
    // On the result screen: a light "still here, not playing" beat keeps the direct link warm for a rematch.
    // After a minute with no rematch, close it so the next game starts from a clean connection.
    netAcc += CFG.TICK_MS;
    if (netAcc >= 500) { netAcc = 0; net.publish({ v: 1, on: 0, rm: RM.mine ? 1 : 0 }); }
    if (++overTicks > (RM.mine || RM.theirs ? 90 : 60) * 60) { net.close(); RM.expired = true; }
  }

  // ---- Rocks (guests glide mirrored rocks toward the host's positions) ----
  for (const a of world.asteroids) {
    if (a.tx !== undefined) {
      a.tx += a.vx * SX; a.ty += a.vy * SY;
      if (a.tx < 0) a.tx += W; else if (a.tx >= W) a.tx -= W;
      if (a.ty < 0) a.ty += H; else if (a.ty >= H) a.ty -= H;
      a.x += a.vx * SX + wrapDelta(a.tx - a.x, W) * 0.15; a.y += a.vy * SY + wrapDelta(a.ty - a.y, H) * 0.15;
    } else { a.x += a.vx * SX; a.y += a.vy * SY; }
    a.rot += a.spin; wrap(a);
  }

  // ---- UFOs ----
  if (auth) updateUfosAuthority();
  else for (const u of world.ufos) {
    u.tx += u.vx * SX; u.ty += u.vy * SY;
    u.x += u.vx * SX + (u.tx - u.x) * 0.15; u.y += u.vy * SY + (u.ty - u.y) * 0.15;
  }

  // ---- Bullets ----
  for (let i = world.bullets.length - 1; i >= 0; i--) {
    const b = world.bullets[i];
    b.x += b.vx * SX; b.y += b.vy * SY; wrap(b);
    if (--b.life <= 0 || bulletStep(b, auth)) world.bullets.splice(i, 1);
  }

  // ---- Ships vs rocks and UFO hulls ----
  if (playing && ship.alive && match.ph !== 'intro') {
    for (const a of world.asteroids) {
      const rr = a.r + CFG.SHIP_R * 0.7;
      if (wrapDist2(a, ship) < rr * rr) {
        if (ship.invuln <= 0) takeHit();
        bounceOff(ship, a); ship.invuln = Math.max(ship.invuln, CFG.ROCK_INVULN);
        break;
      }
    }
    for (const u of world.ufos) if (wrapDist2(u, ship) < 20 * 20) takeHit();
  }
  if (playing && opp && opp.isBot && opp.alive && match.ph !== 'intro') {
    for (const a of world.asteroids) {
      const rr = a.r + CFG.SHIP_R * 0.7;
      if (wrapDist2(a, opp) < rr * rr) { opp.damage(); bounceOff(opp, a); opp.invuln = Math.max(opp.invuln, CFG.ROCK_INVULN); break; }
    }
  }

  // ---- Effects ----
  for (let i = world.rings.length - 1; i >= 0; i--) {
    const r = world.rings[i];
    r.r += (r.max - r.r) * 0.12; r.life -= 0.035;
    if (r.life <= 0) world.rings.splice(i, 1);
  }
  Particles.update();
  world.shake *= 0.86;
  if (flashTimer > 0) flashTimer--;
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(bg, 0, 0, W, H);
  ctx.save();
  if (world.shake > 0.3) ctx.translate(Math.round(rand(-1, 1) * world.shake), Math.round(rand(-1, 1) * world.shake));
  for (const a of world.asteroids) drawAsteroid(a);
  for (const u of world.ufos) drawUfo(u, tickCount);
  drawBullets();
  Particles.draw();
  for (const r of world.rings) {
    ctx.globalAlpha = Math.max(0, r.life);
    ctx.strokeStyle = r.color; ctx.lineWidth = 2; ctx.shadowColor = r.color; ctx.shadowBlur = 14;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  if (state === 'play') {
    if (opp) opp.draw(tickCount);
    if (ship.alive && !(ship.invuln > 0 && !ship.shield && (tickCount >> 3) % 2 === 0))
      drawWrapped(ship.x, ship.y, 20, (x, y) => drawShip(x, y, toScreenAngle(ship.a), ship.color, ship.thrust, tickCount, ship.hp));
    if (ship.alive && ship.shield > 0) drawShield(ship.x, ship.y, ship.color, ship.shield);
  }
  ctx.restore();
  if (state === 'play') { drawHUD(); drawBanners(); drawControls(); }
}

function glowText(txt, x, y, color, size, align = 'left', blur = 10) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  ctx.textAlign = align; ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = blur;
  ctx.fillText(txt, x, y); ctx.shadowBlur = 0;
}
/** Centered text that wraps to fit maxW (for long status messages). */
function wrapText(txt, x, y, maxW, lineH, color, size) {
  ctx.font = `bold ${size}px "Courier New", monospace`;
  const words = txt.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { glowText(line, x, yy, color, size, 'center', 0); line = w; yy += lineH; }
    else line = test;
  }
  if (line) glowText(line, x, yy, color, size, 'center', 0);
}

/** Hull pips then round-win diamonds, laid out from x toward `dir`. */
function drawStatus(x, y, hp, wins, color, dir) {
  for (let i = 0; i < CFG.HULL; i++) {
    const px = dir > 0 ? x + i * 14 : x - 10 - i * 14;
    ctx.globalAlpha = i < hp ? 1 : 0.25; ctx.fillStyle = i < hp ? color : '#5a4aa8';
    ctx.fillRect(Math.round(px), Math.round(y), 10, 6);
  }
  ctx.globalAlpha = 1;
  if (mode === 'practice') return;
  for (let i = 0; i < CFG.WINS_NEEDED; i++) {
    const cx = dir > 0 ? x + 50 + i * 14 : x - 55 - i * 14, cy = y + 3;
    ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 5, cy); ctx.lineTo(cx, cy + 5); ctx.lineTo(cx - 5, cy); ctx.closePath();
    if (i < wins) { ctx.fillStyle = '#ffe600'; ctx.shadowColor = '#ffe600'; ctx.shadowBlur = 8; ctx.fill(); ctx.shadowBlur = 0; }
    else { ctx.strokeStyle = '#5a4aa8'; ctx.lineWidth = 1; ctx.stroke(); }
  }
}

    else { head = 'DRAW · ROUND REPLAYS'; col = '#ffffff'; }

    if (match.why === 'k') why = mode === 'practice' ? 'SHIP DESTROYED' : match.res === 'me' ? `${oppName} DESTROYED` : 'YOU WERE DESTROYED';

/* High-refresh screens (Pixel 7 Pro and others at 120 Hz) call us twice per 60 Hz game tick.
   Drawing every call doubles the glow work for identical pictures and makes ticks land
   unevenly (0,1,0,2,…), which reads as stutter. So we measure the screen's refresh rate and
   draw on every Nth refresh — steady 60 fps on 120 Hz, native on 60/90 Hz — and let the tick
   clock run a few ms early/late so each drawn frame gets exactly one tick. */
let last = performance.now(), acc = 0, fpsAvg = 60, vsync = 1000 / 60, vsyncN = 0, lastDraw = last;
function frame(t) {
  requestAnimationFrame(frame);
  const raw = t - last; last = t;
  if (raw > 0 && raw < 50) vsync = vsync * 0.9 + raw * 0.1;
  const every = Math.max(1, Math.floor(CFG.TICK_MS / vsync + 0.25));
  if (++vsyncN % every) return;                     // skip this refresh: nothing new to show
  let dt = t - lastDraw; lastDraw = t;
  if (dt > 250) dt = 250;
  if (dt > 0) fpsAvg = fpsAvg * 0.95 + (1000 / dt) * 0.05;
  Particles.quality = fpsAvg < 40 ? 0.4 : fpsAvg < 52 ? 0.7 : 1;
  padPoll();
  if (!paused && !(menuOpen && mode !== 'online')) {
    acc += dt; let steps = 0;
    const slack = CFG.TICK_MS * 0.25;               // absorb frame-timing jitter
    while (acc >= CFG.TICK_MS - slack && steps < 8) { update(); acc -= CFG.TICK_MS; steps++; }
    if (steps === 8) acc = 0;
  }
  render();
  syncHudButtons();
}
document.addEventListener('visibilitychange', () => {
  paused = document.hidden && mode !== 'online';     // online keeps running so the duel stays in sync
  if (!document.hidden) { last = lastDraw = performance.now(); acc = 0; }
  else { joy.active = false; fire.held = false; }
});

function deviceSummary() {

  const os = /iPhone|iPad|iPod/.test(ua) ? 'iOS ' + ((ua.match(/OS (\d+)[_.](\d+)/) || []).slice(1).join('.') || '?')
